  # END R10-E channel health + business alerts (paths)
  # ===========================================================================

  # ===========================================================================
  # contacts.yaml — contacts (persons with identities[])
  # ===========================================================================
  # ===========================================================================
  # BEGIN R10-C message templates (paths) — issue #69 (epic #18), ADR-0092.
  # Minimal WhatsApp Business templates for wa_cloud channels: the approved
  # templates are SYNCED from Meta's Graph API (never created or edited here),
  # LISTED per channel, and SENT through sendContactMessage with
  # `type: template` + `template` (SendMessageRequest). Schemas are in the
  # "BEGIN R10-C schemas" block at the end of components.schemas; the error
  # codes in the "R10-C" block at the end of ErrorCode.
  # ===========================================================================
  /channels/{id}/templates:
    get:
      operationId: listChannelTemplates
      x-permission: 'channels:read'
      summary: List a wa_cloud channel's message templates (as of the last sync).
      description: >
        The WhatsApp Business message templates of the channel's WhatsApp
        Business Account as Meta listed them at the last sync — every status,
        so the operator sees why a template is not offered. A template is
        `sendable` when Meta approved it AND every part of it is one we can
        fill (text placeholders of the header and the body); `parameters` are
        the placeholders a send fills, in the order sendContactMessage expects
        them in `template.params`. `sync` says when the list was last
        refreshed and whether the last attempt failed. Not paginated: a
        WhatsApp Business Account holds at most a few thousand templates.
        Only wa_cloud channels have templates (channel.capability_unsupported
        otherwise); a channel outside the caller's scope is channel.not_found.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - channel.not_found
        - channel.capability_unsupported
      responses:
        '200':
          description: The channel's templates and its sync state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /channels/{id}/templates/sync:
    post:
      operationId: syncChannelTemplates
      x-permission: 'channels:manage'
      summary: Re-read the channel's message templates from Meta now.
      description: >
        Lists every template of the channel's WhatsApp Business Account on
        Meta's Graph API (GET /<wabaId>/message_templates, with the channel's
        access token) and replaces the stored list with it: new templates are
        added, changed ones updated, and templates Meta no longer lists are
        removed. The platform also re-syncs every live wa_cloud channel
        periodically; this is "sync now". Needs the channel's `wabaId` setting
        (updateChannelSettings) and access token (setChannelCredentials) —
        template.sync_not_configured otherwise, or when Meta does not accept
        them. A Meta outage or rate limit is provider.unavailable (503, with
        Retry-After when Meta gave one); a failed sync keeps the previous list.
        Synchronous: the answer is the outcome.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
