  # END R10-C message templates (paths)

  # ===========================================================================
  # BEGIN R10-A group conversations (issues #64/#65, epic #17, ADR-0062)
  # ===========================================================================
  # A send addressed to a CONVERSATION rather than a contact: the way to answer a
  # group (a group is no contact, ADR-0062 §1), and equally a direct dialog. The
  # dry run mirrors checkSendPolicy (ADR-0082) for the same body. Participants
  # are the group's member list as the channel last reported it.
  /conversations/{id}/messages:
    post:
      operationId: sendConversationMessage
      x-permission: 'messages:send'
      summary: Send an outbound message into a conversation (direct or group).
      description: >
        Enqueue an outbound message into this conversation, on its own channel
        and chat — for a group (`conversationKind: group`) that is the group
        itself (ADR-0062). The same send path as sendContactMessage: the same
        send policy (a group send is gated by the channel's `groups.enabled`
        instead of a contact's consent, and counted in rate and window buckets
        of its own), the same channel scope, the same `acknowledgedWarnings`
        confirmation and `policyWarnings` answer. `channelId` in the body must
        be absent or equal to the conversation's channel. `Idempotency-Key` is
        REQUIRED (ADR-0002 §5).
      tags:
        - conversations
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - conversation.not_found
        - channel.not_connected
        - message.type_unsupported
        - message.too_large
        - policy.rate_limited
        - policy.quota_exceeded
        - policy.rule_blocked
        - idempotency.key_reused
        - provider.upstream_error
        - provider.unavailable
        - tenancy.suspended
        - policy.confirmation_required
        - policy.consent_missing
        - policy.daily_limit
        - policy.hourly_limit
        - policy.dialog_frozen
        - tenancy.quota_exceeded
        - policy.groups_disabled
      responses:
        '202':
          description: >
            The message was accepted and queued for delivery into the
            conversation. `policyWarnings` lists the send-policy warnings it
            went out with, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

