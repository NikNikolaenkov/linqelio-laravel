        schema:
          type: string
          format: uuid
    get:
      operationId: getChannelHealth
      x-permission: 'channels:read'
      summary: One channel's current health and its explanation.
      description: >
        The channel's latest score, rating, components (each with its weight,
        its own score, the points it costs, a reason key and the numbers
        behind it) and `reasons` — the component keys that cost points,
        costliest first. A channel outside the caller's scope is 404
        channel.not_found, like any other read of it.
      tags:
        - channels
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
