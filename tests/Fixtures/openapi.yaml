  # ===========================================================================
  # BEGIN R11-A groups: visibility while disabled (#129) and group management
  # (#66); ADR-0062 §4 (amended 2026-09-24) and §9, ADR-0096. The schemas are
  # the "BEGIN R11-A schemas" block at the end of components.schemas, the error
