  /embed/conversations/{id}:
    get:
      operationId: getEmbedConversation
      x-permission: none
      x-permission-reason: >
        Authorized by the embed token (embedToken scheme) and its cap[], not by a cabinet principal: ADR-0009 Plane B, scoped to one contact and enforced in the handler.
      summary: Read the embed-scoped conversation feed.
      description: >
        Plane B (ADR-0009 §5): the scoped, append-only message feed (cap
        message:read). The host reads and appends but never edits history.
        Backward cursor pagination via `before`.
      tags:
        - embed
      security:
        - embedToken: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: before
          in: query
          required: false
          description: Backward cursor — return messages older than this opaque cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum messages to return (the server clamps to a page cap).
          schema:
            type: integer
            format: int32
      x-error-codes:
        - auth.invalid_key
        - embed.token_expired
        - embed.scope_violation
        # issue #115: a missing conversation answers its own code (it was
        # contact.not_found).
        - conversation.not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: The scoped conversation feed.
