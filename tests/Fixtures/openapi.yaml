  # ===========================================================================
  # BEGIN R11-C AI guard + contact questionnaire (issue #59, epic #14, ADR-0068)
  # ===========================================================================
  # OWNED BY R11-C. The guard itself has no path of its own: it is the last
  # checker of the send policy (ADR-0058), so its findings (`ai.guard_risk`,
  # `ai.guard_unavailable`) arrive through the existing send answers and the
  # dry run (checkSendPolicy). Its configuration is the `ai_guard` settings
  # section, the questionnaire's the `ai_profile` section (/settings/*). The
  # schemas are in the "BEGIN R11-C schemas" block at the end of
  # components.schemas, the error codes in the "R11-C" block of ErrorCode.
  /ai/guard-test:
    post:
      operationId: testAiGuard
      x-permission: 'settings:manage'
      summary: Try the AI guard on a sample text.
      description: >
        Runs the guard (task `guard.check`, ADR-0068) on a text an admin types,
        through the cabinet's configured provider, and answers the model's
        assessment together with the verdict the CURRENT `ai_guard` settings
        would give it — interactive and campaign. Journaled like any guard run
        (ai_runs) and counted in ai.tokens.month; nothing is cached and nothing
        is sent. Needs `ai.enabled` (the guard sends customer text in real
        use); `ai_guard.enabled` is NOT required, so the guard can be tried
        before it is switched on. A provider failure is the ANSWER: 200 with
        `ok: false` and the journal's `errorCode` (the send path would have
        failed open).
      tags:
        - ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGuardTestRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - tenancy.quota_exceeded
        - tenancy.suspended
        - ai.not_configured
        - ai.provider_unsupported
        - ai.disabled
      responses:
        '200':
          description: The assessment (or, with ok false, why there is none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGuardTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /contacts/{id}/ai-profile:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      operationId: getContactAiProfile
      x-permission: 'channels:read'
      summary: The contact's AI questionnaire and AI summary.
      description: >
        What the AI questionnaire (ADR-0068 §5) knows about a contact: whether
        it is switched on for the cabinet, the configured questionnaire fields
        with whether each is filled and by whom (`human`, `host`, `platform`,
        `ai`), the short AI summary (a typed field with provenance `ai` — a
        person may overwrite it, and the AI then never replaces it), and the
        latest questionnaire run. Values themselves are read with
        getContactFields.
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.not_found
      responses:
        '200':
          description: The contact's questionnaire state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactAiProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contacts/{id}/ai-profile/fill:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      operationId: fillContactAiProfile
      x-permission: 'contacts:write'
      summary: Fill the contact's AI questionnaire now.
      description: >
        Queues a questionnaire run (task `profile.extract`) over the contact's
        most recent conversation with text, without waiting for the quiet
        period or the message counter. Idempotent per conversation and its
        newest message: asking again before anything new was said answers the
        same run (`created: false`) and spends nothing. Values a person, the
        host or the platform wrote are never overwritten (ADR-0061). 409
        `ai.disabled` when the cabinet has not consented to AI processing
        (`ai.enabled`), 409 `ai.profile_no_conversation` when the contact has
        no conversation with text to read.
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - tenancy.suspended
        - contact.not_found
        - ai.disabled
        - ai.profile_no_conversation
      responses:
        '202':
          description: The run is queued (or was already).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProfileFillResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ===========================================================================
  # END R11-C AI guard + contact questionnaire (paths)
  # ===========================================================================
  # ===========================================================================
  # BEGIN R11-D compliance: dialogue scans, findings, actions (issue #58,
  # epic #14, ADR-0067). One self-contained block placed BEFORE /contacts; its
  # schemas are the "BEGIN R11-D schemas" block at the end of
  # components.schemas and its error codes the R11-D block at the end of
  # ErrorCode. The rules a scan checks are the `compliance` settings section
  # (/settings/compliance, ComplianceSettings) — not repeated here.
  # Permissions (ADR-0050/0072): reading is compliance:read (supervisors and
  # admins), acting is compliance:manage (admins). A channel-scoped person sees
  # the findings of their channels only.
  # ===========================================================================
  /compliance/scans:
    get:
      operationId: listComplianceScans
      x-permission: 'compliance:read'
      summary: List the cabinet's compliance scans, newest first.
      description: >
        Every scan with its scope, period, state and progress (conversations
        and messages read, findings). A failed scan says why (`errorCode`) and
        is NEVER reported as clean: what it did not read it did not judge. A
        channel-scoped caller sees the scans of its channels and the
        cabinet-wide ones (counts only — their findings stay channel-scoped).
      tags:
        - compliance
      parameters:
        - name: status
          in: query
          required: false
          description: Only scans in this state.
          schema:
            $ref: '#/components/schemas/ComplianceScanStatus'
        - name: before
          in: query
          required: false
          description: >
            Only scans created strictly before this instant — pass the
            `createdAt` of the last item to read the next page.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 50 and is capped at 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: A page of scans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceScanList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: startComplianceScan
      x-permission: 'compliance:manage'
      summary: Start a compliance scan of a conversation, a channel or the cabinet over a period.
      description: >
        Queues a scan (202). The scan worker reads the text messages of the
        scope created in [from, to) in windows of at most 40, sends each window
        — minimized: phone numbers and e-mails replaced unless the `ai`
        settings allow them, cards and IBANs always — to the cabinet's AI
        provider as the task `compliance.scan` (journaled in /ai/runs, counted
        in ai.tokens.month), and records the findings. Messages a previous scan
        already read are skipped (each conversation's "analyzed up to" cursor)
        unless `rescan` is set. The rules are those of the `compliance`
        settings at this moment (a snapshot is kept with the scan). Needs the
        cabinet's AI consent (`ai.enabled`, 409 compliance.ai_disabled) and at
        least one enabled rule (409 compliance.no_rules). One live scan per
        target (409 compliance.scan_active); scans of one cabinet run one at a
        time. Progress is streamed as `compliance.scan_progress`.
      tags:
        - compliance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartComplianceScanRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - tenancy.suspended
        - channel.not_found
        - conversation.not_found
        - compliance.scan_active
        - compliance.ai_disabled
        - compliance.no_rules
      responses:
        '202':
          description: The queued scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /compliance/scans/{scanId}:
    parameters:
      - name: scanId
        in: path
        required: true
        description: Scan id (uuid).
        schema:
          type: string
          format: uuid
    get:
      operationId: getComplianceScan
      x-permission: 'compliance:read'
      summary: Read one compliance scan and its progress.
      tags:
        - compliance
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - compliance.scan_not_found
      responses:
        '200':
          description: The scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /compliance/scans/{scanId}/cancel:
    parameters:
      - name: scanId
        in: path
        required: true
        description: Scan id (uuid).
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelComplianceScan
      x-permission: 'compliance:manage'
      x-suspension: allowed
      x-suspension-reason: >
        Cancelling only stops work (and AI spending); a suspended organization
        must be able to stop a scan.
      summary: Cancel a queued or running compliance scan.
      description: >
        A queued scan is cancelled at once; a running one at its next window
        boundary (the window in flight is committed first, so nothing it found
        is lost). Findings already recorded stay. A finished scan is final
        (409 compliance.scan_finished).
      tags:
        - compliance
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - compliance.scan_not_found
        - compliance.scan_finished
      responses:
        '200':
          description: The scan, cancelled or marked to be cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /compliance/findings:
    get:
      operationId: listComplianceFindings
      x-permission: 'compliance:read'
      summary: List compliance findings, newest first.
      description: >
        The violations scans found: rule, severity, the model's short
        explanation, the conversation and channel, review state, assignee and
        what was done. A finding is NOT a copy of the conversation — its
        evidence is message references with short redacted excerpts, read with
        getComplianceFinding. A channel-scoped caller sees the findings of its
        channels only.
      tags:
        - compliance
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ComplianceFindingStatus'
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ComplianceSeverity'
        - name: rule
          in: query
          required: false
          description: Only findings of this rule key (e.g. `builtin.rudeness`, `custom.refunds`).
          schema:
            type: string
            maxLength: 60
        - name: channelId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: conversationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: scanId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: before
          in: query
          required: false
          description: >
            Only findings created strictly before this instant — pass the
            `createdAt` of the last item to read the next page.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 50 and is capped at 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: A page of findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceFindingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /compliance/findings/{findingId}:
    parameters:
      - name: findingId
        in: path
        required: true
        description: Finding id (uuid).
        schema:
          type: string
          format: uuid
    get:
      operationId: getComplianceFinding
      x-permission: 'compliance:read'
      summary: Read one finding with its evidence and history.
      tags:
        - compliance
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - compliance.finding_not_found
      responses:
        '200':
          description: The finding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceFinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /compliance/findings/{findingId}/actions:
    parameters:
      - name: findingId
        in: path
        required: true
        description: Finding id (uuid).
        schema:
          type: string
          format: uuid
    post:
      operationId: actOnComplianceFinding
      x-permission: 'compliance:manage'
      summary: Act on a finding.
      description: >
        `review` (checked, a real violation) / `false_positive` / `reopen`
        change the review state; `assign` (to `assigneeId`: an active member
        whose role reads compliance) / `unassign`; `raise_alert` raises a
        `compliance.violation` alert (ADR-0065: its subscribers are notified
        by console, e-mail or webhook; one alert per finding); `notify` tells
        the people working on the conversation's channel (the
        `compliance.notice` realtime event); `freeze_dialog` stops every send
        into the conversation (the send policy's frozen-dialog rule, 403
        policy.dialog_frozen) until `unfreeze_dialog`. Every action is
        recorded in the finding's history with who did it and the optional
        `note`.
      tags:
        - compliance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceFindingActionRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - tenancy.suspended
        - compliance.finding_not_found
        - compliance.assignee_invalid
      responses:
        '200':
          description: The finding after the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceFinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  # ===========================================================================
  # END R11-D compliance (paths)
  # ===========================================================================
  # ===========================================================================
  # BEGIN R11-E analytics — reports and exports (paths) — issues #62/#63, epic
  # #16, ADR-0066. The schemas are the "BEGIN R11-E schemas" block at the end
  # of components.schemas, the error codes the "R11-E" block at the end of
  # ErrorCode. Every report reads the hourly aggregates (never the raw
  # messages), needs analytics:read, and is restricted to the caller's channel
  # scope: a channel-scoped caller gets the numbers of their channels only and
  # never the cabinet-wide ones (AI runs).
  # ===========================================================================
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      x-permission: 'analytics:read'
      summary: The key numbers of a period, against the period before it.
      description: >
        Every metric of the catalogue (ADR-0066 §1) for the period `from`–`to`
        (local dates in the cabinet's time zone, both inclusive; default the
        last 7 days) and for the period of the same length right before it,
        with the change. A rate or an average with nothing to measure has no
        `value` (never a zero that looks measured). `freshness` says how
        current the numbers are and how far the backfill of the history has
        got. `channelId` narrows to one channel — within the caller's scope; a
        channel outside it contributes nothing.
      tags:
        - analytics
      parameters:
        - name: from
          in: query
          required: false
          description: The period's first day, a local date in the cabinet's time zone (default 6 days before `to`).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: The period's last day, inclusive (default today in the cabinet's time zone).
          schema:
            type: string
            format: date
        - name: channelId
          in: query
          required: false
          description: Only this channel (within the caller's scope).
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - analytics.range_invalid
      responses:
        '200':
          description: The period's numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /analytics/timeseries:
    get:
      operationId: getAnalyticsTimeseries
      x-permission: 'analytics:read'
      summary: One metric over time, by hour, day or week in the cabinet's time zone.
      description: >
        The metric per bucket of the period: `hour` (at most 31 days), `day`
        or `week` (Monday-based, the first and last clipped to the period).
        Buckets are local to the cabinet's time zone — a day across a DST
        change is 23 or 25 hours — and every bucket of the period is listed,
        empty ones included.
      tags:
        - analytics
      parameters:
        - name: metric
          in: query
          required: true
          description: The metric to chart.
          schema:
            $ref: '#/components/schemas/AnalyticsMetric'
        - name: granularity
          in: query
          required: false
          description: The bucket size (default `day`).
          schema:
            $ref: '#/components/schemas/AnalyticsGranularity'
        - name: from
          in: query
          required: false
          description: The period's first day, a local date in the cabinet's time zone (default 6 days before `to`).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: The period's last day, inclusive (default today in the cabinet's time zone).
          schema:
            type: string
            format: date
        - name: channelId
          in: query
          required: false
          description: Only this channel (within the caller's scope).
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - analytics.range_invalid
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTimeseries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /analytics/breakdown:
    get:
      operationId: getAnalyticsBreakdown
      x-permission: 'analytics:read'
      summary: The period's numbers per channel, agent, origin or policy reason.
      description: >
        One row per channel (every channel in the caller's scope, zeros
        included), per person whose own sends are counted (`agent`: replies,
        responses to a waiting contact and their average time), per origin
        of the messages (contact, api, console, desk, campaign, widget, phone,
        unknown) or per send-policy reason (`policy`: `<verdict>:<code>`),
        busiest first.
      tags:
        - analytics
      parameters:
        - name: by
          in: query
          required: true
          description: The dimension.
          schema:
            $ref: '#/components/schemas/AnalyticsBreakdownBy'
        - name: from
          in: query
          required: false
          description: The period's first day, a local date in the cabinet's time zone (default 6 days before `to`).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: The period's last day, inclusive (default today in the cabinet's time zone).
          schema:
            type: string
            format: date
        - name: channelId
          in: query
          required: false
          description: Only this channel (within the caller's scope).
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - analytics.range_invalid
      responses:
        '200':
          description: The breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsBreakdown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /analytics/heatmap:
    get:
      operationId: getAnalyticsHeatmap
      x-permission: 'analytics:read'
      summary: Messages by weekday and hour of day in the cabinet's time zone.
      description: >
        7 × 24 counts (Monday first; hours 0–23 local) of the period's inbound
        (default) or outbound messages — when contacts write, when the
        business answers.
      tags:
        - analytics
      parameters:
        - name: direction
          in: query
          required: false
          description: inbound (default) or outbound.
          schema:
            type: string
            enum:
              - inbound
              - outbound
            x-enum-varnames:
              - AnalyticsHeatmapInbound
              - AnalyticsHeatmapOutbound
        - name: from
          in: query
          required: false
          description: The period's first day, a local date in the cabinet's time zone (default 6 days before `to`).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: The period's last day, inclusive (default today in the cabinet's time zone).
          schema:
            type: string
            format: date
        - name: channelId
          in: query
          required: false
          description: Only this channel (within the caller's scope).
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - analytics.range_invalid
      responses:
        '200':
          description: The heatmap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsHeatmap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /analytics/campaigns/{campaignId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        description: Campaign id (uuid).
        schema:
          type: string
          format: uuid
    get:
      operationId: getAnalyticsCampaignReport
      x-permission: 'analytics:read'
      summary: A campaign's funnel — recipients, sent, delivered, read, replied.
      description: >
        The recipients by state and, for the messages the campaign sent, how
        many were delivered, read or failed and how many recipients wrote back
        within 72 hours. A campaign reaching channels outside the caller's
        scope is 404 campaign.not_found, like any other read of it.
      tags:
        - analytics
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - campaign.not_found
      responses:
        '200':
          description: The campaign's report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsCampaignReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /analytics/exports:
    post:
      operationId: createAnalyticsExport
      x-permission: 'analytics:read'
      x-suspension: allowed
      x-suspension-reason: >
        An export only reads the cabinet's own numbers; a suspended organization stays read-only, not locked out of its data.
      summary: Export a report to a CSV or XLSX file in the background.
      description: >
        Queues the report (the same parameters as its read) as a file and
        answers 202. The caller's channel scope and the cabinet's time zone are
        frozen on the job, so the file shows exactly what the caller could
        read. Text cells a spreadsheet would execute are neutralised (CSV: a
        `'` prefix; XLSX: always a string, never a formula). The file is kept
        for 24 hours, then deleted (`expired`); only its author sees the job
        and downloads the file. Audited as `analytics.export.create`.
      tags:
        - analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsExportRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - analytics.range_invalid
        - campaign.not_found
      responses:
        '202':
          description: The export, queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listAnalyticsExports
      x-permission: 'analytics:read'
      summary: List the caller's recent report exports.
      description: The caller's own 50 most recent report exports in the cabinet, newest first.
      tags:
        - analytics
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The caller's recent exports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsExportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /analytics/exports/{exportId}:
    parameters:
      - name: exportId
        in: path
