  /contacts/{id}/erase:
    post:
      operationId: eraseContact
      x-permission: 'compliance:manage'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        GDPR erasure (Art. 17) is the controller's legal duty toward the data subject and its deadline keeps running while the customer is suspended; refusing it would make the platform the reason the erasure is late (ADR-0080 §3).
      summary: Erase a person's data from the cabinet.
      description: >
        Remove the contact AND redact every trace of the person from the records
        that survive it. This is deliberately not a `DELETE /contacts/{id}`,
        because deleting the contact row would not do the job: only its
        identities and host refs cascade, conversations merely lose their
        contact link, and messages have no foreign key to a contact at all — so
        after a plain delete the person's number would remain in the message and
        conversation rows, with the correspondence intact. Erasure here means
        redaction, and the name says so.


        Runs as one transaction: either the person is erased or nothing changed.
        The response reports how many rows were touched so the caller can record
        it in its own erasure journal.


        IDEMPOTENT: erasing someone already erased is not an error. It answers
        200 with zero counts, because the requested state — this person's data is
        not here — holds either way.


        Not reversible, and not a substitute for deleting derived copies the
        integrator holds.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: What the erasure touched (all zeros if nothing was left).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # R8-B (issue #44, ADR-0084): contact consent with a source — BEGIN
  # (a self-contained block: paths here, schemas in the matching block under
  # components/schemas, the error code at the end of ErrorCode)
  # ===========================================================================
  /contacts/{id}/consents:
    get:
      operationId: listContactConsents
      x-permission: 'channels:read'
      summary: Read a contact's consent, per channel.
      description: >
        The consent recorded for the contact on each channel of the cabinet
        (ADR-0084): whether it is granted or revoked, where it came from
        (`source`: inbound_message, import, host_api, deep_link, manual), when,
        by whom, and on what evidence. Consent is per CHANNEL, not per channel
        kind — opt-in is given to a sender (a business number, a bot). A channel
        with no entry has nothing recorded: a send there is refused with
        policy.consent_missing while the cabinet enforces consent.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - validation.invalid_request
      responses:
        '200':
          description: The contact's recorded consents (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConsentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contacts/{id}/consents/{channelId}:
    put:
      operationId: grantContactConsent
      x-permission: 'contacts:write'
      summary: Record the contact's consent on one channel.
      description: >
        Record that the contact agreed to be messaged on this channel. The
        source is not chosen by the caller, it is WHO calls: a person in the
        console records `manual`, an API key records `host_api`; the author is
        kept with the consent and in the audit log. `evidence` is a short
        reference to where the consent came from (a form id, a CRM record) —
        never personal data.


        Idempotent: an ACTIVE consent is left as it is (`changed: false`) —
        the first grant stands, because its provenance is the earliest evidence.
        A REVOKED consent is re-granted: a manual or host grant is an explicit
        act and lifts an earlier opt-out (an automatic grant from an inbound
        message never does).
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/ConsentChannelId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantConsentRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - channel.not_found
        - tenancy.suspended
      responses:
        '200':
          description: The consent as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConsentChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contacts/{id}/consents/{channelId}/revoke:
    post:
      operationId: revokeContactConsent
      x-permission: 'contacts:write'
      x-suspension: allowed
      x-suspension-reason: >
        An opt-out is the data subject withdrawing consent; honouring it only stops messages, and refusing it while the organization is suspended would keep the person reachable the moment the organization resumes (ADR-0084).
      summary: Record that the contact withdrew consent on one channel.
      description: >
        Revoke the contact's consent on this channel: from now on a send there
        is refused with policy.consent_missing (while the cabinet enforces
        consent). The revocation is kept with its moment and author, and it
        also holds when nothing had been granted yet — "do not message me" then
        stops a later automatic grant from an inbound message. Only an explicit
        grant (manual, host API, a deep-link opt-in) lifts it.


        Idempotent: revoking a revoked consent changes nothing
        (`changed: false`; the first revocation's moment stands).
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/ConsentChannelId'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - channel.not_found
      responses:
        '200':
          description: The consent as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConsentChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ===========================================================================
  # R8-B (issue #44, ADR-0084): contact consent with a source — END
  # ===========================================================================

  # ===========================================================================
  # messages.yaml — outbound message commands
  # ===========================================================================
  /contacts/{id}/messages:
    get:
      operationId: listContactMessages
      x-permission: 'channels:read'
      summary: Read a contact's message history (all channels).
      description: >
        Backward-paginated history of every message exchanged with the contact
        across all of its conversations — a contact is one person spanning
        channels (ADR-0008). Newest-first pagination, presented oldest→newest;
        `cursor` walks further back. Cabinet-scoped (RLS).
      tags:
        - messages
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - name: before
          in: query
          required: false
          description: Backward cursor — a message id from a previous page's `pageInfo.nextCursor`.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: A page of the contact's message history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: sendContactMessage
      x-permission: 'messages:send'
      summary: Send an outbound message to a contact.
      description: >
        Enqueue an outbound message to the contact (ADR-0012 outbound flow). This
        is an unsafe command, so `Idempotency-Key` is REQUIRED (ADR-0002 §5):
        replaying the same key with the same body returns the original result;
        reusing it with a different body yields idempotency.key_reused (409).
      tags:
        - messages
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        # issue #115: channelId names no channel of this cabinet (it was
        # answered contact.not_found).
        - channel.not_found
        - channel.not_connected
        - channel.capability_unsupported
        - channel.pairing_required
        - message.type_unsupported
        - message.too_large
        - policy.rate_limited
        - policy.quota_exceeded
        - policy.rule_blocked
        - idempotency.key_reused
        - provider.upstream_error
        - provider.unavailable
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
        # R8-D (#42, ADR-0082): a confirmed send met a warning it did not acknowledge.
        - policy.confirmation_required
        # R8-B (#44, ADR-0084): the contact has no consent on the sending channel.
        - policy.consent_missing
        # R8-C (#40, #121): send-rule checkers. 429 + Retry-After for a full
        # window; 403 for a frozen dialog; 403 tenancy.quota_exceeded (with the
        # `quota` member) at the plan's messages.month cap.
        - policy.daily_limit
        - policy.hourly_limit
        - policy.dialog_frozen
        - tenancy.quota_exceeded
        # R10-C (#69, ADR-0092): templates and the 24-hour window (wa_cloud).
        - policy.service_window_closed
        - template.not_found
        - template.not_approved
        - template.unsupported
        - template.params_invalid
      responses:
        # R8-D (#109, ADR-0082): SentMessage = the Envelope + policyWarnings.
        '202':
          description: >
            The message was accepted and queued for delivery. `policyWarnings`
            lists the send-policy warnings it went out with, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # --- R8-D (#42, ADR-0082): send-policy dry run ---------------------------------
  /contacts/{id}/messages/policy-check:
    post:
      operationId: checkSendPolicy
      x-permission: 'messages:send'
      # Side-effect free; a suspended organization gets its answer as a finding.
      x-suspension: allowed
      x-suspension-reason: >
        A dry run that changes nothing (ADR-0082): it answers what a send would get, and for a suspended organization that answer is a deny finding with code tenancy.suspended — refusing the question instead would hide the reason from the composer.
      summary: Dry-run send policy for a prospective message (no side effects).
      description: >
        Answers what send policy would say about sending this message to the
        contact NOW, without sending it and without consuming anything — no
        rate budget, no counters, no decision-journal row (ADR-0082). Returns
        the verdict, every finding (code + params to localize), the current
        limits (`meters`) and, for a defer, when the send may go. Call it while
        the operator composes; send with `acknowledgedWarnings` = the answer's
        `warningKeys` once they confirm. Same body, same permission and same
        channel scope as sendContactMessage; no Idempotency-Key (nothing is
        created).
      tags:
        - messages
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - channel.not_found
        - channel.capability_unsupported
        - message.type_unsupported
        - provider.unavailable
        # R10-C (#69, ADR-0092): a template send is checked like a real one.
        - template.not_found
        - template.not_approved
        - template.unsupported
        - template.params_invalid
      responses:
        '200':
          description: The send-policy answer for this prospective send.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendPolicyCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  # --- end R8-D ------------------------------------------------------------------

  # ===========================================================================
  # embed.yaml — embeddable widget sessions
  # ===========================================================================
  /embed/session:
    post:
      operationId: createEmbedSession
      x-permission: 'messages:send'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        Mints a read session for the embed widget, the host-side window onto conversations the customer may still read; every mutation the token could make (send, patch, start) is itself refused while suspended (ADR-0080 §3).
      summary: Initialize an embed widget session (M0 stub).
      description: >
        Init/token stub for the embeddable conversation widget (ADR-0007 /
        ADR-0009). Validates the embedding origin and issues a short-lived session
        token. Full deep-link/pairing mechanics land in a later slice.
      tags:
        - embed
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
