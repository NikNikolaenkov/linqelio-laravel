      description: >
        Alerts raised by the evaluator (ADR-0065): channel health below the
        threshold, a channel offline, a failure spike, the daily limit reached,
        the monthly quota near. An alert about a channel is visible to whoever
        may read that channel (an agent: only their channels); a cabinet-wide
