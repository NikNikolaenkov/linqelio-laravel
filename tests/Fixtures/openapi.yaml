        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.organization_not_found
      responses:
        '200':
          description: Usage per metric.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUsage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/organizations/{organizationId}/audit:
    parameters:
      - name: organizationId
