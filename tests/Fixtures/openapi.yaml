  # ===========================================================================
  # END R11-E analytics (paths)
  # ===========================================================================
  # ===========================================================================
  # BEGIN R11-B campaign dry run + launch wizard (paths) — issue #68, epic #18,
  # ADR-0063 (addendum of 2026-09-24). One self-contained block placed right
  # before /contacts; its schemas are the "BEGIN R11-B schemas" block at the
  # end of components.schemas, its error code the "R11-B" block of ErrorCode.
  # ===========================================================================
  /campaigns/{campaignId}/dry-run:
    parameters:
      - name: campaignId
        in: path
        required: true
        description: Campaign id (uuid).
        schema:
          type: string
          format: uuid
    post:
      operationId: dryRunCampaign
      x-permission: 'campaigns:manage'
      summary: Dry-run a draft — who would receive it, who is blocked and why, how long it would take.
      description: >
        Resolves the draft's audience exactly as launchCampaign would (the same
        query, the same scope rules) WITHOUT snapshotting it, and answers: how
        many recipients the snapshot would hold (and per channel), how many of
        them would be skipped and why (no address on the campaign's channels,
        no consent — campaigns require consent in every compliance mode —,
        opted out, WhatsApp's 24-hour window closed for a free-form message on
        a wa_cloud channel, a frozen dialog, a template parameter the contact
        cannot fill), an ESTIMATE of how long the send takes under the
        channels' daily/hourly windows, the campaign's pace, the channel
        pacing and the send-policy rate budget (warmup), the campaign window,
        the cabinet's business hours and the monthly messages cap — naming the
        limiting factor —, and what send policy says about one sample send per
        channel. Nothing is enqueued, no send-policy counter is consumed, no
        recipient row is written; the dry run only records WHEN it ran on the
        draft, because launchCampaign requires a dry run newer than the
        draft's last change (409 campaign.dry_run_required). Group chats are
        never recipients (a group is not a contact, ADR-0062). Launch
        problems (a template that does not fit, an empty audience, a start in
        the past) are reported in `problems` rather than refused, so the
        summary can show them.
      tags:
        - campaigns
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - campaign.not_found
        - campaign.state_conflict
        - tenancy.suspended
      responses:
        '200':
          description: The dry run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDryRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /campaigns/audience-preview:
    post:
      operationId: previewCampaignAudience
      x-permission: 'campaigns:manage'
      summary: Count who an audience definition would reach on the given channels (the wizard's live count).
      description: >
        The audience half of dryRunCampaign for a definition that is not saved
        yet: how many contacts it resolves to (the same query launchCampaign
        runs, within the caller's channel scope) and how many of them have an
        address on each channel. Nothing is stored. Every channel must be one
        the caller works (403 otherwise); a channel that is not the cabinet's
        is 404 channel.not_found.
      tags:
        - campaigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignAudiencePreviewRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - channel.not_found
        - campaign.invalid
        - tenancy.suspended
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAudiencePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  # ===========================================================================
  # END R11-B campaign dry run + launch wizard (paths)
  # ===========================================================================
  # ===========================================================================
  # BEGIN R11-F Bitrix24 open-lines connector (paths) — issues #74/#75, epic
  # #20, ADR-0094
  # ===========================================================================
  # OWNED BY R11-F: the connector's console surface on a linked portal — which
  # channel is on which open line, the connector's state, the dispatcher's
  # queue. The traffic itself (client messages into the line, the operator's
  # replies, statuses) never passes through the contract: it is the desk
  # projection (internal/bitrixdesk) and the host's events (/bitrix/events,
  # outside the contract like the other host webhooks). Schemas: the "BEGIN
  # R11-F schemas" block at the end of components.schemas; error codes: the
  # "R11-F" block at the end of ErrorCode.
  /bitrix/portals/{portalId}/connector:
    parameters:
      - $ref: '#/components/parameters/BitrixPortalId'
    get:
      operationId: getBitrixConnector
      x-permission: 'settings:manage'
      summary: The open-lines connector on a portal — bindings and queue health.
      description: >
        The connector's state on the cabinet's live portal (ADR-0094): whether
        it is registered and its events bound (offline events, pulled — Bitrix
        does not retry a pushed event), which channel is on which open line
        with its status (`pending` while the connector is being activated,
        `active`, or taken away by the portal — `line_deleted`,
        `connector_disabled`), the default line new channels go onto, whether
        Bitrix24 is the cabinet's desk (the `desk` settings section), and the
        dispatcher's queue: pending and dead calls, a park (the portal's
        request limit) and methods blocked by the operating-time limit until
        the time the portal gave. Reading it on a linked portal for the first
        time creates the connector's state row; it calls nothing on the portal.
      tags:
        - bitrix
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - bitrix.portal_not_found
        - bitrix.portal_not_live
        - validation.invalid_request
      responses:
        '200':
          description: The connector's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixConnector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      operationId: updateBitrixConnector
      x-permission: 'settings:manage'
      summary: Set the open line new channels go onto.
      description: >
        `defaultLineId` is the open line a channel without an explicit binding
        is put on the first time a message of it is projected — the Bitrix
        counterpart of Chatwoot opening an inbox per channel. `null` means only
        explicit bindings: a channel nobody bound is not projected (its
        messages stay ours; nothing is lost). Changing it moves nobody who is
        already bound. Recorded in the audit trail.
      tags:
        - bitrix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BitrixConnectorUpdate'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.suspended
        - bitrix.portal_not_found
        - bitrix.portal_not_live
      responses:
        '200':
          description: The connector's state after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixConnector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bitrix/portals/{portalId}/open-lines:
    parameters:
      - $ref: '#/components/parameters/BitrixPortalId'
    get:
      operationId: listBitrixOpenLines
      x-permission: 'settings:manage'
      summary: The portal's open lines, as Bitrix24 lists them.
      description: >
        Asks the portal (imopenlines.config.list.get) for its open lines, so a
        channel can be put on one. Read live, never cached: a line deleted on
        the portal is gone here too. How many lines a portal may have depends
        on its tariff — several channels may share one line, at the cost of
        separate routing and per-number statistics (ADR-0054 §3). 503
        provider.unavailable when the portal cannot be reached or is over its
        request limit.
      tags:
        - bitrix
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - bitrix.portal_not_found
        - bitrix.portal_not_live
        - provider.unavailable
        - validation.invalid_request
      responses:
        '200':
          description: The portal's open lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixOpenLineList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /bitrix/portals/{portalId}/channels/{channelId}/line:
    parameters:
      - $ref: '#/components/parameters/BitrixPortalId'
      - name: channelId
        in: path
        required: true
        description: The channel (uuid).
        schema:
          type: string
          format: uuid
    put:
      operationId: bindBitrixChannelLine
      x-permission: 'settings:manage'
      summary: Put a channel on an open line.
      description: >
        Binds the channel to the open line: the connector is registered on the
        portal (once), its events are bound, and it is activated on the line —
        all queued for the portal's dispatcher, so the binding answers
        `pending` at once and turns `active` when the portal accepted it.
        Several channels may be on one line. Moving a channel releases its old
        line (the connector is switched off there when no channel is left on
        it). A binding the portal took away (`line_deleted`,
        `connector_disabled`) is revived only this way. Recorded in the audit
        trail.
      tags:
        - bitrix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BitrixLineBindingRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.suspended
        - bitrix.portal_not_found
        - bitrix.portal_not_live
        - channel.not_found
      responses:
        '200':
          description: The binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixLineBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: unbindBitrixChannelLine
      x-permission: 'settings:manage'
      summary: Take a channel off its open line.
      description: >
        The channel's messages stop being projected into the portal; its queued
        calls are dropped, and the connector is switched off on the line when
        no channel is left on it. Our history is untouched. With a default line
        set, the channel's next message puts it back there — clear the default
        line to keep it off. Idempotent (204 without a binding). Recorded in the
        audit trail.
      tags:
        - bitrix
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.suspended
        - bitrix.portal_not_found
        - bitrix.portal_not_live
        - validation.invalid_request
      responses:
        '204':
          description: The channel is off the line.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bitrix/portals/{portalId}/queue/retry:
    parameters:
      - $ref: '#/components/parameters/BitrixPortalId'
    post:
      operationId: retryBitrixDeadLetters
      x-permission: 'settings:manage'
      summary: Run the portal's dead-lettered calls and events again.
      description: >
        Every call the dispatcher gave up on (dead letters — raised as the
        `bitrix.dispatch_failed` alert) and every host event it could not
        process goes back to the queue, due now. A dead call whose work was
        queued again meanwhile stays dead (the newer one supersedes it).
        Recorded in the audit trail.
      tags:
        - bitrix
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.suspended
        - bitrix.portal_not_found
        - bitrix.portal_not_live
        - validation.invalid_request
      responses:
        '200':
          description: How many went back to the queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixQueueRetry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ===========================================================================
  # END R11-F Bitrix24 open-lines connector (paths)
  # ===========================================================================
  /contacts:
    get:
      operationId: listContacts
      x-permission: 'channels:read'
      summary: List / poll contacts (cursor pagination).
      description: >
        Cursor-paginated pool of contacts (ADR-0008 §3 receive flow). Use `since`
        to walk pages and `status` to scope (e.g. `new` = inbound not yet
        host-linked). Response carries `pageInfo.nextCursor` for the next page.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ContactStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          required: false
          description: >
            Case-insensitive substring search over the contact's display name and
            its identities' phone / username / provider id. Digit-only input also
            matches phones written with separators.
          schema:
            type: string
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: A cursor page of contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # conversations — the operator's dialog list (admin console). Distinct from the
  # /embed/conversations family, which is token-scoped to ONE conversation for the
  # embedded widget (ADR-0009); these are cabinet-scoped and list everything.
  # ===========================================================================
  /media:
    post:
      operationId: uploadMedia
      x-permission: 'messages:send'
      summary: Upload an attachment to send.
      description: >
        Stores a file in the platform's object store and returns the reference to
        put in a send command's `content.media.url`. Providers fetch outbound
        media by URL, so the returned url is an ABSOLUTE, time-limited link the
        provider can read — unlike the inbound read path, which streams through
        the platform.
      tags:
        - messages
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
        - name: filename
          in: query
          required: false
          description: Original file name (kept for documents).
          schema:
            type: string
        - name: mime
          in: query
          required: false
          description: Content type; sniffed from the bytes when omitted.
          schema:
            type: string
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - message.too_large
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '201':
          description: The stored attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedMedia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The file exceeds the platform limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /messages/{id}:
    get:
      operationId: getMessage
      x-permission: 'channels:read'
      summary: Read one message and its current status.
      description: >
        The single-message read path. A send is accepted with 202 and reaches the
        provider afterwards, so "accepted" is not "delivered" — this is how the
        outcome is checked: queued, sent, delivered, read or failed, with the
        timestamp of each step it reached.

        Prefer subscribing to `message.status` for outcomes at scale; this
        endpoint answers for one message, which is what a support desk needs when
        somebody asks what happened to a specific reply.

        A failed send carries the reason under `meta.error`.
      tags:
        - messages
      parameters:
        - name: id
          in: path
          required: true
          description: The platform message id (the `id` a send returned).
          schema:
            type: string
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - message.not_found
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/media:
    get:
      operationId: getMessageMedia
      x-permission: 'channels:read'
      summary: Download a message's media attachment.
      description: >
        Streams the attachment bytes of a media message THROUGH the platform. The
        object store is never published: a stored provider/presigned URL is not
        reachable from a browser and expires, so this endpoint is the only way to
        read an attachment. Authorization is the message's own visibility — the
        row must exist in the caller's cabinet (RLS), which is what keeps one
        tenant's attachments away from another.
      tags:
        - messages
      parameters:
        - name: id
          in: path
          required: true
          description: Message id (our ULID).
          schema:
            type: string
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - message.not_found
      responses:
        '200':
          description: The attachment bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /conversations:
    get:
      operationId: listConversations
      x-permission: 'channels:read'
      summary: List the cabinet's conversations, most recently active first.
      description: >
        The dialog list: one row per conversation with its contact, channel kind,
        and a preview of the latest message. Optional filters by channel and
        status. Cursor-paginated on (last_message_at, id).
      tags:
        - conversations
      parameters:
        - name: channelId
          in: query
          required: false
          description: >
            Only conversations on this channel. It can only NARROW the caller's
            channel scope (ADR-0050): a channel outside it yields an empty page,
            never a wider one. A caller scoped to several channels must name one
            (validation.invalid_request otherwise).
          schema:
            type: string
