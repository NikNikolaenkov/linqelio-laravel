        description: The organization id.
        schema:
          type: string
          format: uuid
    get:
      operationId: listOrganizationAudit
      x-permission: 'platform:admin'
      summary: The organization's trail of manual changes (platform admin).
      description: >
        Append-only, newest first, cursor-paginated: `organization.create`,
        `organization.update` (platform changes of plan, overrides, trial,
        requisites), `organization.requisites.update` (the organization's own
        edit through /organization) and `cabinet.create` (a cabinet added to
        it). Each entry names its author and carries the diff in `detail`.
      tags:
        - platform
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.organization_not_found
      responses:
        '200':
          description: One page of the trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAuditList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/plans:
    get:
      operationId: listPlans
      x-permission: 'platform:admin'
      summary: The plan catalog (platform admin).
      description: >
        Every plan with its full limits declaration. Read-only: plans are
        seeded and changed by migration for now; a plan CRUD is a later issue.
      tags:
        - platform
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: All plans, by id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # The caller's own organization. Reading needs settings:manage (the
  # administrative roles: org_owner, org_admin, cabinet_admin, platform_admin —
  # the people who add channels and people and so run into the limits);
  # changing requisites needs billing:manage (org_owner, platform_admin): legal
  # name, billing email and tax id are the contract's, not a workspace setting.
  /organization:
    get:
      operationId: getMyOrganization
      x-permission: 'settings:manage'
      summary: The organization owning the cabinet the caller acts in.
      description: >
        Requisites, plan, manual overrides, trial and status of the caller's
        organization — derived from the cabinet of the request (the API key's,
        or the session's selected cabinet), never from an id in the request.
      tags:
        - organization
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateMyOrganization
      x-permission: 'billing:manage'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        Billing requisites (legal name, billing email, tax id) are what the customer may have to correct to be invoiced and resumed; plan, limits and status are not theirs to change, so nothing the suspension protects moves (ADR-0080 §3).
      summary: Edit the caller's organization requisites.
      description: >
        Legal name, billing email and tax id; an omitted field is unchanged, an
        empty string clears it. Plan, limits and trial are not the
        organization's to change (updateOrganization, platform). A change is
        written to the organization's trail (`organization.requisites.update`,
        author and before/after) in the same transaction.
      tags:
        - organization
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequisitesRequest'
      responses:
        '200':
          description: The organization after the edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organization/usage:
    get:
      operationId: getMyOrganizationUsage
      x-permission: 'settings:manage'
      summary: The caller's organization consumption against its effective limits.
      description: >
        One entry per metric (`cabinets`, `seats`, `channels.<kind>`,
        `messages.month`, `ai.tokens.month`, `retention.days`): what the
        organization uses across ALL its cabinets, and its effective limit —
        the plan's, with the manual override applied. Counted by the same
        functions quota reservation uses (ADR-0078), so what this shows is what
        the next create is checked against.
      tags:
        - organization
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: Usage per metric.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ===========================================================================
  # END R7-A organizations (paths)
  # ===========================================================================

  # ===========================================================================
  # contact-fields.yaml — typed contact field schema (issue #48, ADR-0061)
  # ===========================================================================
  # BEGIN R8-F contact fields (paths). Kept as one block so parallel contract
  # work does not interleave with it; the schemas live in the matching
  # "BEGIN R8-F schemas" block at the end of components.schemas, the path
  # parameter under "R8-F" in components.parameters.
  #
  # The SCHEMA (field definitions) is cabinet configuration: reading it is open
  # to everyone who reads contacts (the contact card renders from it), writing
  # it needs `settings:manage`. VALUES live on the contact: read like the
  # contact (`channels:read`), written with `contacts:write`. Value provenance
  # is derived from the CALLER, never from the body: a person's session writes
  # as `human`, an API key as `host` (ADR-0061 §4).
  /contact-fields:
    get:
      operationId: listContactFields
      x-permission: 'channels:read'
      summary: List the cabinet's typed contact field definitions.
      description: >
        Every field definition of the cabinet, in display order (`position`,
        then `key`). The schema belongs to the cabinet (ADR-0061 §1): there are
        no platform-wide or industry fields — a "car dealer" set is a sample a
        cabinet creates, not something the platform ships.
      tags:
        - contacts
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The cabinet's field definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactFieldList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contact-fields/{key}:
    parameters:
      - $ref: '#/components/parameters/ContactFieldKey'
    put:
      operationId: putContactField
      x-permission: 'settings:manage'
      summary: Create or update one contact field definition.
      description: >
        Creates the field, or updates it in place. Everything is editable EXCEPT
        the `type` (ADR-0061 §8): values stored under the key were validated
        against it, so a different type is a new field. A type change writes
        nothing and answers 422 contact.field_invalid with the entry
        `{field: <key>, reason: "type_immutable"}`; an invalid definition (an
        enum without options, options on a non-enum, ...) answers the same code
        with its own reason.


        Removing an enum option does not touch contacts that already hold it;
        new writes of that value are refused. Every successful write is audited
        (`contact.field.put`).
      tags:
        - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutContactFieldRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.field_invalid
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The definition as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactFieldDef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The definition is invalid, or would change the field's type (contact.field_invalid).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteContactField
      x-permission: 'settings:manage'
      summary: Delete one contact field definition (values are kept).
      description: >
        Removes the DEFINITION only (ADR-0061 §8). Values stored under the key
        stay on the contacts as orphans: they are no longer shown, projected
        into the desk or offered to the AI, and re-creating the key with the
        same type brings them back. Erasing a person's data is
        `POST /contacts/{id}/erase`, not this.


        Idempotent: deleting a key the cabinet does not have answers 204 too.
        Audited (`contact.field.delete`, with whether a definition was found).
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '204':
          description: The definition is gone (or never existed).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{id}/fields:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      operationId: getContactFields
      x-permission: 'channels:read'
      summary: Read a contact's typed field values with their provenance.
      description: >
        The values of the fields the cabinet currently DEFINES, each with its
        read-only provenance — what kind of writer set it (`human`, `host`,
        `platform`, `ai`), when, and which actor. Values under a deleted
        definition are not returned (ADR-0061 §8).
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.not_found
      responses:
        '200':
          description: The contact's typed values and their provenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactFieldValues'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: setContactFields
      x-permission: 'contacts:write'
      summary: Set (or clear) typed field values on a contact.
      description: >
        Writes values under the cabinet's schema (ADR-0061). `null` clears a
        field. The write is ALL-OR-NOTHING on validity: every value is checked
        first, and if any fails nothing is written and the answer is 422
        contact.field_invalid with one `errors[]` entry per offending field
        (`reason`: `type_mismatch` — e.g. text sent to a `number` field —,
        `not_in_enum`, `bad_date`, `bad_phone`, `bad_email`, `bad_url`,
        `too_long`, `unknown_field`). A write into a field the caller may not
        write at all is 403 embed.field_ownership_denied.


        Provenance comes from the caller: a person's session writes as `human`,
        an API key as `host`. A value set by a more authoritative writer
        (`human > host > platform > ai`) is NOT overwritten and NOT an error: it
        is reported in `kept[]` with reason `lower_authority` (ADR-0061 §4).
        Fields flagged `syncToDesk` are projected into the cabinet's desk after
        the write (best effort, ADR-0053). Audited (`contact.fields.set`, keys
        only — never values).
      tags:
        - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetContactFieldsRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - contact.field_invalid
        - embed.field_ownership_denied
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The values after the write, with what was applied, cleared and kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetContactFieldsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: One or more values failed validation (contact.field_invalid); nothing was written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  # ===========================================================================
  # END R8-F contact fields (paths)
  # ===========================================================================

components:
  # ===========================================================================
  # Security
  # ===========================================================================
  securitySchemes:
    clientApiKey:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Client API key presented as a Bearer token. Stored server-side as an
        argon2id hash and shown once (DEVELOPMENT_RULES §8; scopes per §5).
    embedToken:
      type: http
      scheme: bearer
      bearerFormat: jwt
      description: >
        Short-lived embed session token (ADR-0009 Plane B). Issued by
        POST /embed/session; carries the cabinet, the scoped contact/conversation
        and a capability set (cap[]). The widget is its ONLY holder — the host page
        never sees it. Distinct from clientApiKey: it authorizes ONLY the /embed/*
        Plane-B surface, scoped to a single contact.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-linqelio_session
      description: >
        A person's server-side session (ADR-0049), set by POST /auth/login:
        httpOnly, Secure, SameSite=Strict, Path=/, expiring with the session
        (12 h). Only its sha256 is stored; blocking the account or revoking the
        session takes effect within the 30 s session cache.


        Precedence: an `Authorization` header always wins. A request that carries
        one is authenticated by it alone — an invalid key is a 401, never a fall
        back to the cookie.


        Cabinet: a session belongs to a PERSON, who may be a member of several
        cabinets, so a cabinet operation names the cabinet in the
        `X-Linqelio-Cabinet` request header (a cabinet id). It is checked against
        the person's memberships on every request; a cabinet they are not a
        member of is 403 tenancy.cross_cabinet_denied. The header may be omitted
        only when the person belongs to exactly one cabinet. The person's rights
        there are their role(s) — and, for an agent, only their assigned
        channels.


        Platform operators (ADR-0075): a `platform:admin` operation needs no
        cabinet header for a person who holds an active platform-operator grant
        and passed the second factor in this session. Such a person may also
        name ANY existing cabinet in the header without being a member of it and
        acts there as platform_admin; every such access is written to the
        security log. The grant is re-checked on every request.


        Cross-site requests: an unsafe request (anything but GET/HEAD/OPTIONS)
        WITHOUT an Authorization header must come from the console's own origin —
        a browser's `Sec-Fetch-Site`/`Origin` naming another site is refused with
        403 auth.origin_rejected. SameSite=Strict already keeps the cookie off
        cross-site requests; this closes the same-SITE gap (a sibling subdomain
        is same-site) and login CSRF, where no cookie is involved at all.

  # ===========================================================================
  # params.yaml — reusable parameters (path/query/header)
  # ===========================================================================
  parameters:
    # R8-F (#48, ADR-0061): a contact field's machine key, the shape the
    # store's CHECK constraint enforces — a malformed key is a 400 up front.
    ContactFieldKey:
      name: key
      in: path
      required: true
      description: The field's machine key (lower case letters, digits, underscores; starts with a letter).
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,62}$'

    ContactId:
      name: id
      in: path
      required: true
      description: Contact identifier (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    # R8-B (issue #44, ADR-0084): the channel a contact's consent is recorded for.
    ConsentChannelId:
      name: channelId
      in: path
      required: true
      description: The channel the consent is for (uuid).
      schema:
        type: string
        format: uuid

    ChannelId:
      name: id
      in: path
      required: true
      description: Channel identifier (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    ConversationId:
      name: id
      in: path
      required: true
      description: Conversation identifier (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    CabinetPathId:
      name: id
      in: path
      required: true
      description: Cabinet identifier (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    SessionId:
      name: sessionId
      in: path
      required: true
      description: A session id as listMySessions reports it (the sha256 hex of the cookie).
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'

    KeyKid:
      name: kid
      in: path
      required: true
      description: API key identifier (kid) within the cabinet.
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated key that makes an unsafe command idempotent (ADR-0002 §5,
        DEVELOPMENT_RULES §5). Replaying the same key with the same body returns the
        original result; reusing it with a DIFFERENT body yields
        idempotency.key_reused (409).
      schema:
        type: string
        minLength: 1
        maxLength: 255

    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        The same key with the same three outcomes as the required form, but
        optional on this operation: it was added after clients already existed,
        and a suddenly-required header would break every one of them.

        Omitting it means the command is NOT idempotent — a retry after a lost
        response provisions a second resource, and the first one is
        indistinguishable from it afterwards. Send a key on any call you would
        retry.
      schema:
        type: string
        minLength: 1
        maxLength: 255

    TeamAccountId:
      name: accountId
      in: path
      required: true
      description: The member's account id (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call
    TeamInviteId:
      name: inviteId
      in: path
      required: true
      description: The invite id (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    Cursor:
      name: since
      in: query
      required: false
      description: Opaque forward cursor from a previous page's `pageInfo.nextCursor` (ADR-0008 §3).
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items per page. The server clamps to its own ceiling.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    ContactStatusFilter:
      name: status
      in: query
      required: false
      description: Filter contacts by lifecycle status (ADR-0008 §3, e.g. `new` = not yet host-linked).
      schema:
        $ref: '#/components/schemas/ContactStatus'

  # ===========================================================================
  # errors.yaml — RFC 9457 problem+json response objects (ADR-0013)
  # ===========================================================================
  # Each references Problem. Per-operation code lists live on the operation via
  # the `x-error-codes` extension (ADR-0013 §4: every endpoint declares its codes).
  responses:
    BadRequest:
      description: Request body or parameters failed schema validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, or expired client API key or session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not permitted (scope, tenancy, or policy rule).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The scoped resource does not exist or is not visible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with current state (idempotency, merge, identity).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The message or file exceeds the allowed size.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Well-formed but semantically unsupported by the target channel/type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: >
        The account is temporarily locked after repeated failed attempts
        (auth.account_locked, ADR-0049 §3: 5 failures -> 15 minutes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: A rate limit or quota was exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: An upstream provider returned an error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A provider or channel is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # =========================================================================
    # errors.yaml — RFC 9457 envelope + ADR-0013 machine `code` registry
    # =========================================================================
    # The envelope shape and the `code` enum are FROZEN v1 (ADR-0013). Codes are
    # additive-only: never reassigned, never removed. The frontend `errors.<code>`
    # i18n namespace binds to ErrorCode below — this is that bridge, so the enum
    # lists the ADR-0013 starter registry VERBATIM.
    ErrorCode:
      type: string
      description: >
        Stable machine-readable error code in `domain.reason` form (ADR-0013).
        Additive-only registry: codes are never reassigned or removed. Clients switch
        on this value; the frontend `errors.<code>` i18n namespace is keyed by it.
      enum:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - tenancy.cabinet_not_found
        - tenancy.cross_cabinet_denied
        - keyring.rotation_overlap_required
        - channel.not_connected
        - channel.not_found
        - channel.capability_unsupported
        - channel.pairing_required
        - policy.rate_limited
        - policy.quota_exceeded
        - policy.rule_blocked
        - accesspool.no_next
        - message.type_unsupported
        - message.too_large
        - message.not_found
        - idempotency.key_reused
        - contact.not_found
        - contact.merge_conflict
        - contact.identity_conflict
        - contact.version_conflict
        - embed.token_expired
        - embed.scope_violation
        - embed.field_ownership_denied
        - provider.upstream_error
        - provider.unavailable
        # --- additive (ADR-0013 §4): appended, never reordered -----------------
        # team.*: membership integrity (ADR-0050 §6, 409). Emitted by
        # internal/authz.CheckMembershipChange through the team API (/team/*).
        - team.last_org_owner
        - team.last_cabinet_admin
        - team.self_demotion_denied
        # A typed contact field (ADR-0061) rejected a value: 422 with one
        # errors[] entry per offending field.
        - contact.field_invalid
        # A settings write carried a stale version (If-Match) — 412, emitted by
        # putSettingsSection (issue #89, ADR-0057 §5).
        - settings.version_conflict
        # auth.*: human identity and sessions (ADR-0049). Login never says which
        # half of the credentials was wrong, nor whether the account exists.
        - auth.invalid_credentials
        - auth.second_factor_invalid
        - auth.second_factor_conflict
        - auth.account_locked
        - auth.session_invalid
        - auth.token_invalid
        - auth.origin_rejected
        - auth.second_factor_required
        # platform.*: human platform operators (ADR-0075). last_operator (409)
        # refuses revoking the only active operator; the two not_found codes
        # (404) name which half of a grant/revoke was missing.
        - platform.last_operator
        - platform.account_not_found
        - platform.operator_not_found
        # team.* (issue #31, the team API): the role-grant ceiling (403), a stale
        # member version (409), an email that already has an account (409), and
        # the two not-found answers of the team surface (404).
        - team.role_ceiling_exceeded
        - team.version_conflict
        - team.account_exists
        - team.member_not_found
        - team.invite_not_found
        # --- issue #115: per-resource not-found ---------------------------------
        # A conversation id that names nothing in the cabinet (or one outside the
        # caller's channel scope — the same answer, never an oracle). Previously
        # answered as channel.not_found / contact.not_found.
        - conversation.not_found
        # R5-C (issue #118, ADR-0076): membership-only invites for existing
        # accounts. invite_wrong_account (403): the link was presented by a
        # session of another account; already_member (409): the account already
        # holds a membership reaching the cabinet.
        - team.invite_wrong_account
        - team.already_member
        # --- issue #119: the remaining per-resource not-found (404) ------------
        # A webhook subscription / access-pool entry id that names nothing in the
        # cabinet — another cabinet's id answers exactly the same, never an
        # oracle. Previously answered as tenancy.cross_cabinet_denied.
        - webhook.not_found
        - accesspool.not_found
        # No dead-lettered (failed) delivery with that id: unknown, or not in the
        # failed state. Previously answered as provider.unavailable.
        - deadletter.not_found
        # --- R6-C (issues #32/#33, ADR-0051 §3): plan quotas ---------------------
        # A create would take the organization past a limit of its plan (with the
        # manual override applied): 403, with the metric, the limit and the
        # current use in the problem's `quota` member. Not policy.quota_exceeded:
        # that one is a 429 of the send path, where waiting helps; a plan limit
        # does not lift by waiting, and a client that retries a 429 would retry
        # this one forever.
        - tenancy.quota_exceeded
        # --- R7-B (issue #36, ADR-0080): organization suspension ----------------
        # suspended (403): the organization is suspended, so every cabinet of it
        # is read-only — the mutation (a send included) is refused; reads keep
        # working. Not 402 (suspension is not only for non-payment, and 402 is
        # reserved) and not 423 (WebDAV's lock of one resource, which clients
        # handle as a transient conflict). Retrying does not help until a
        # platform operator resumes the organization.
        - tenancy.suspended
        # --- R7-A (issue #34, ADR-0079): organizations ---------------------------
        # An organization id (path, or createCabinet's organizationId) that
        # names no organization: 404.
        - tenancy.organization_not_found
        # --- R8-D (issues #42/#109, ADR-0082): confirmed sends -------------------
        # confirmation_required (409): the send carried acknowledgedWarnings, and
        # send policy now raises a warning that is not among them (it appeared
        # after the caller's checkSendPolicy). Nothing was sent. The new warnings
        # are in the problem's `policyFindings`; re-run checkSendPolicy, show
        # them, and send again with them acknowledged.
        - policy.confirmation_required
        # --- end R8-D -------------------------------------------------------------
        # --- R8-B (issue #44, ADR-0084): contact consent -------------------------
        # consent_missing (403): the recipient has no active consent on the
        # sending channel — never recorded, or revoked. Its own code, not
        # policy.rule_blocked: the remedy is specific (record consent, e.g. a
        # deep-link opt-in), and waiting does not help, so it is never a 429.
        - policy.consent_missing
        # =====================================================================
        # BEGIN R8-C send-policy checkers (issue #40, #121; ADR-0058 §9)
        # =====================================================================
        # Finding codes of the send-rule pipeline. A deferred send answers 429
        # with Retry-After and the blocking finding's code; a denied one the
        # status below. The monthly messages cap reuses tenancy.quota_exceeded
        # (403 + `quota` member) — a plan limit does not lift by retrying.
        #   daily_limit / hourly_limit: the channel's send window (cabinet time
        #     zone) is full — 429 until it resets.
        #   contact_frequency: too many messages to this contact in the period —
        #     429 (campaigns are rescheduled; interactive sends only warned).
        #   duplicate_content: the same normalized content was sent recently —
        #     409 when a campaign would repeat it to one contact; a warning
        #     otherwise.
        #   outside_business_hours: inside the cabinet's quiet hours — 429 for a
        #     campaign; a warning for an interactive send.
        #   dialog_frozen: the conversation is frozen — 403.
        #   monthly_quota_near: a WARNING only (80 % of messages.month used);
        #     never an HTTP error status — listed so warnings share the i18n keys.
        - policy.daily_limit
        - policy.hourly_limit
        - policy.contact_frequency
        - policy.duplicate_content
        - policy.outside_business_hours
        - policy.dialog_frozen
        - policy.monthly_quota_near
        # END R8-C send-policy checkers

    # --- R6-C (#33, ADR-0051 §3): the quota refusal's problem extension --------
    QuotaExceeded:
      type: object
      description: >
        Which limit refused the request (RFC 9457 extension member `quota`,
        present only with tenancy.quota_exceeded). The refusal explains itself:
        the client can tell the customer what to free or which plan to ask for
        without contacting support.
      properties:
        metric:
          type: string
          description: >
            The limited metric, in the form plans use: `cabinets`, `seats`, or
            `channels.<kind>` (e.g. `channels.wa_web`).
          example: channels.wa_web
        limit:
          type: integer
          format: int64
          description: The organization's effective limit (plan, with its manual override applied).
          example: 3
        used:
          type: integer
          format: int64
          description: How much of it the organization uses now, across all its cabinets.
          example: 3
      required:
        - metric
        - limit
        - used
    # --- end R6-C ---------------------------------------------------------------

    # --- R7-B (#36, ADR-0080): organization suspension ---------------------------
    SuspendOrganizationRequest:
      type: object
      description: Why the organization is suspended.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            Why the organization is suspended (non-payment, an abuse
            investigation, a customer request, ...). Required: a suspension
            nobody can explain later is a support ticket waiting to happen. It
            is kept on the organization and in the audit trail; it is not shown
            in the refusal a cabinet caller gets.
          example: Invoice 2026-09 unpaid
      required:
        - reason

    OrganizationSuspension:
      type: object
      description: >
        An organization's suspension state, as a suspend or resume left it.
      properties:
        organizationId:
          type: string
          format: uuid
        status:
          type: string
          # Not an `enum`: the pinned generator renames the constants of the
          # other active/... enums (UpdateWebhookRequestStatus) when a third one
          # shares a value. The values are `active` and `suspended`.
          description: '`active` or `suspended`.'
          example: suspended
        suspendedReason:
          type: string
          description: Why it is suspended. Present only while suspended.
        suspendedAt:
          type: string
          format: date-time
          description: Since when it is suspended. Present only while suspended.
        suspendedBy:
          type: string
          description: >
            Who suspended it, as `<actor type>:<actor id>` — `account:<uuid>` for
            a platform operator, `api_key:<kid>` for a platform key. Present
            only while suspended.
        changed:
          type: boolean
          description: >
            Whether this call changed the state. false = the organization
            already was in the requested state (an idempotent repeat); nothing
            was written or audited.
      required:
        - organizationId
        - status
        - changed
    # --- end R7-B ---------------------------------------------------------------

    ValidationError:
      type: object
      description: One field-level validation failure (RFC 9457 `errors[]` extension).
      properties:
        field:
          type: string
          description: JSON Pointer / dotted path to the offending field.
        reason:
          type: string
          description: Human-readable reason this field failed.
      required:
        - field
        - reason

    Problem:
      type: object
      description: >
        RFC 9457 problem+json error envelope (ADR-0013). Cabinet-safe: `detail` never
        leaks another cabinet's data or internal details.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI to the versioned doc page for this `code`.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code, duplicated in the body per RFC 9457.
        detail:
          type: string
          description: Human-readable explanation of this occurrence (cabinet-safe).
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this specific occurrence.
        code:
          $ref: '#/components/schemas/ErrorCode'
        trace_id:
          type: string
          description: Correlation id for logs/traces (ADR-0013 §1).
        errors:
          type: array
          description: >
            Field-level failures; present for validation.invalid_request and
            contact.field_invalid (one entry per offending field; `reason` is the
            stable machine reason, e.g. `type_mismatch`, `not_in_enum`).
          items:
            $ref: '#/components/schemas/ValidationError'
        # R6-C (#33, ADR-0051 §3): present only with tenancy.quota_exceeded.
        quota:
          $ref: '#/components/schemas/QuotaExceeded'
        # R8-D (#42/#109, ADR-0082): why send policy held a send.
        policyFindings:
          type: array
          description: >
            Send-policy findings behind this refusal (ADR-0082), present on a
            send refused by policy: with policy.confirmation_required the
            UNACKNOWLEDGED warnings; with policy.rate_limited / quota_exceeded /
            rule_blocked every finding of the run that held it. Render each by
            its `code` (and `params`); fall back to `detail` for a code the
            client does not know.
          items:
            $ref: '#/components/schemas/PolicyFinding'
      required:
        - type
        - title
        - status
        - code

    # =========================================================================
    # envelope.yaml — message Envelope (mirrors internal/messaging/envelope.go)
    # =========================================================================
    # FROZEN v1 (ADR-0012): core fields stable; Meta and enum members additive.
    # ChannelKind lives with the messaging schemas (its canonical Go home).
    ChannelKind:
      type: string
      description: Channel family a message or session belongs to (ADR-0012). Extends additively.
      enum:
        - wa_web
        - wa_cloud
        - tg_client
        - tg_bot
        - viber_bot

    Direction:
      type: string
      description: Direction of a message relative to the platform (ADR-0012).
      enum:
        - inbound
        - outbound

    MsgType:
      type: string
      description: Payload type carried by `content` (ADR-0012). Members extend additively.
      enum:
        - text
        - image
        - audio
        - video
        - document
        - location
        - template
        - interactive
        - system

    MsgStatus:
      type: string
      description: Delivery-lifecycle state of a message (ADR-0012).
      enum:
        - queued
        - sent
        - delivered
        - read
        - failed

    Timestamps:
      type: object
      description: >
        Delivery-lifecycle moments. `created` is always set; `sent`/`delivered`/`read`
        are populated as the message advances.
      properties:
        created:
          type: string
          format: date-time
        sent:
          type: string
          format: date-time
        delivered:
          type: string
          format: date-time
        read:
          type: string
          format: date-time
      required:
        - created

    Envelope:
      type: object
      description: >
        Unified message contract between the core and every adapter (ADR-0012).
        Mirrors internal/messaging/envelope.go core fields. `meta` MUST NOT carry
        routing-significant data — routing uses core fields only.
      properties:
        id:
          type: string
          description: Our ULID.
        cabinetId:
          type: string
        channelId:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        direction:
          $ref: '#/components/schemas/Direction'
        chatId:
          type: string
          description: Unified conversation id.
        contactRef:
          type: string
          description: Points to Contact.identities[].providerId (ADR-0008).
        type:
          $ref: '#/components/schemas/MsgType'
        content:
          type: object
          additionalProperties: true
          description: Type-dependent payload (JSON). Shape depends on `type`.
        replyTo:
          type: string
          description: Optional provider message id this message replies to.
        providerMsgId:
          type: string
          description: Provider-side id; bus idempotency key (ADR-0012 §3).
        idempotencyKey:
          type: string
          description: Outbound-send idempotency key (API §5).
        status:
          $ref: '#/components/schemas/MsgStatus'
        timestamps:
          $ref: '#/components/schemas/Timestamps'
        meta:
          type: object
          additionalProperties: true
          description: Provider-specific metadata. NEVER used for routing.
      required:
        - id
        - cabinetId
        - channelId
        - kind
        - direction
        - chatId
        - contactRef
        - type
        - content
        - status
        - timestamps

    ConversationSummary:
      type: object
      description: One row of the operator dialog list.
      properties:
        id:
          type: string
        contactId:
          type: string
        contactName:
          type: string
        channelId:
          type: string
        channelType:
          $ref: '#/components/schemas/ChannelKind'
        chatId:
          type: string
          description: The provider-side chat address (JID / chat id).
        status:
          type: string
        lastMessageAt:
          type: string
          format: date-time
        lastMessageText:
          type: string
          description: Preview of the newest message ("" for non-text payloads).
        lastMessageDirection:
          $ref: '#/components/schemas/Direction'
      required:
        - id
        - channelId
        - chatId

    ConversationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items

    CreateInviteRequest:
      type: object
      properties:
        channelId:
          type: string
          description: The bot channel the contact should be invited into.
      required:
        - channelId

    ContactInvite:
      type: object
      description: A single-use deep link that opts a contact into a bot channel.
      properties:
        contactId:
          type: string
        channelId:
          type: string
        inviteLink:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - contactId
        - channelId
        - inviteLink
        - expiresAt

    CreateContactRequest:
      type: object
      description: >
        A new person expressed as ONE channel identity. Identities are how the
        platform addresses people (ADR-0008); more can be linked later.
      properties:
        channelType:
          $ref: '#/components/schemas/ChannelKind'
        phone:
          type: string
          description: E.164-ish number (separators tolerated). Required unless providerId/username is set.
        username:
          type: string
          description: Channel username (Telegram @handle without the @).
        providerId:
          type: string
          description: Native provider id (e.g. a WhatsApp JID). Defaults to `phone`.
        name:
          type: string
          description: Display name for the new contact. Ignored when a contact already matched.
      required:
        - channelType

    SendMessageRequest:
      type: object
      description: >
        Outbound message command body. The platform fills the remaining Envelope
        fields (id, direction=outbound, timestamps, status=queued). `content` is
        type-dependent (e.g. {"text":"hi"} for type=text).
      properties:
        type:
          $ref: '#/components/schemas/MsgType'
        content:
          type: object
          additionalProperties: true
          description: Type-dependent payload matching `type`.
        replyTo:
          type: string
          description: Optional provider message id to reply to.
        channelId:
          type: string
          description: >
            Optional channel override. By default the platform replies on the
            channel of the contact's most recent conversation, falling back to a
            channel matching one of the contact's identities. Set this to force a
            specific channel; the contact must be addressable there (it needs an
            identity of that channel's kind, or a conversation on it) — otherwise
            the send fails with channel.capability_unsupported.
        # R8-D (#42, ADR-0082): a confirmed send.
        acknowledgedWarnings:
          type: array
          description: >
            Makes this a CONFIRMED send (ADR-0082): the `key`s of the policy
            warnings the caller was shown by checkSendPolicy and confirmed
            (`warningKeys` of that answer). The send goes through only if every
            warning send policy raises now is listed; otherwise it is refused
            with 409 policy.confirmation_required and the new warnings in
            `policyFindings` — nothing is sent. An empty array confirms "no
            warnings". Omitted: an unconfirmed send, where warnings never block
            and are only reported back in `policyWarnings` (the behaviour before
            ADR-0082). Ignored by checkSendPolicy.
          items:
            type: string
      required:
        - type
        - content

    # --- R8-D (#42/#109, ADR-0082): send-policy dry run and warnings ---------------
    PolicyVerdict:
      type: string
      description: >
        A send-policy stance (ADR-0058 §2). `allow`: nothing to say. `warn`:
        sendable, but the operator must be told. `defer`: not now — retry from
        `retryAt`. `deny`: not this send. Clients must treat an unknown value as
        `deny`.
      enum:
        - allow
        - warn
        - defer
        - deny

    PolicyFinding:
      type: object
      description: >
        One send-policy checker's answer about a send (ADR-0058/0082). The set
        of checkers grows (rate, consent, frequency, duplicates, business hours,
        ...), so clients render a finding GENERICALLY: localize by `code` with
        `params` interpolated, and fall back to `detail` (then to the raw
        `code`) for a code they do not know.
      properties:
        check:
          type: string
          description: The checker that produced it (stable machine id, e.g. `rate`).
          example: rate
        verdict:
          $ref: '#/components/schemas/PolicyVerdict'
        key:
          type: string
          description: >
            What acknowledges this finding when it is a warning: send it in
            `acknowledgedWarnings`. The `code`, or the `check` when there is none.
          example: policy.rate_limited
        code:
          type: string
          description: >
            Machine code, the i18n message key (`errors.<code>`). Usually an
            ErrorCode, but a newer checker may send one this client's contract
            copy does not list yet — hence not the enum. Absent when the checker
            has nothing to report beyond its verdict.
          example: policy.rate_limited
        params:
          type: object
          additionalProperties:
            type: string
          description: Values to interpolate into the localized message.
        until:
          type: string
          format: date-time
          description: For `defer` — the moment the send may be retried.
        detail:
          type: string
          description: Operator-facing English context; the fallback text.
      required:
        - check
        - verdict
        - key

    PolicyMeter:
      type: object
      description: >
        One CURRENT limit as a checker sees it (ADR-0082): how much is used and
        when it is whole again — the bars of the pre-send panel. A snapshot, not
        a reservation.
      properties:
        check:
          type: string
          description: The checker that reports it.
          example: rate
        name:
          type: string
          description: >
            Stable machine id of the limit (e.g. `rate.burst`, the channel's
            burst budget; media sends draw more of it). Localize it, fall back
            to the raw name.
          example: rate.burst
        used:
          type: integer
          format: int64
          example: 3
        limit:
          type: integer
          format: int64
          example: 20
        resetAt:
          type: string
          format: date-time
          description: When it is fully available again. Absent = whole now or unknown.
      required:
        - check
        - name
        - used
        - limit

    SendPolicyCheck:
      type: object
      description: >
        What send policy would say about this send NOW (ADR-0082, #42) —
        everything a pre-send panel needs, in one answer. Computed by a dry run
        that consumes nothing: no rate budget, no counters, no journal row.
      properties:
        verdict:
          $ref: '#/components/schemas/PolicyVerdict'
        sendable:
          type: boolean
          description: '`verdict` is `allow` or `warn`: the send would go through now.'
        warningKeys:
          type: array
          description: >
            The `key`s of the `warn` findings — exactly what to send back in
            `acknowledgedWarnings` once the operator confirms them. Empty = no
            confirmation needed.
          items:
            type: string
        findings:
          type: array
          description: Every finding of the run, in evaluation order (allow included).
          items:
            $ref: '#/components/schemas/PolicyFinding'
        meters:
          type: array
          description: The current limits, across all checkers that report one.
          items:
            $ref: '#/components/schemas/PolicyMeter'
        channelId:
          type: string
          description: The channel the send would leave through (resolved like sendContactMessage does).
        cost:
          type: integer
          description: The rate budget this send would draw (media costs more than text).
          example: 1
        retryAt:
          type: string
          format: date-time
          description: For `defer` — when the send may go (every blocker cleared).
        retryAfterSeconds:
          type: integer
          description: For `defer` — `retryAt` as seconds from `evaluatedAt`, rounded up.
        evaluatedAt:
          type: string
          format: date-time
      required:
        - verdict
        - sendable
        - warningKeys
        - findings
        - meters
        - channelId
        - cost
        - evaluatedAt

    SentMessage:
      description: >
        The accepted outbound message (the Envelope), plus the send-policy
        warnings it went out with (#109, ADR-0082).
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            policyWarnings:
              type: array
              description: >
                The `warn` findings send policy raised for this send (e.g. a
                limit nearly used up). The message WAS accepted; show them to
                the operator. Absent when there were none.
              items:
                $ref: '#/components/schemas/PolicyFinding'
    # --- end R8-D ---------------------------------------------------------------

    # =========================================================================
    # contact.yaml — Contact (mirrors internal/contacts/contact.go)
    # =========================================================================
    # FROZEN v1 (ADR-0008): a Contact is a *person* with identities[]. Field
    # ownership is fixed (messenger read-only, `custom` host-owned, profile/content
    # platform-owned — ADR-0007 §3).
    ContactStatus:
      type: string
      description: >
        Lifecycle filter for the receive pool (ADR-0008 §3). Not a stored Contact
        field — a server-derived view (e.g. `new` = inbound not yet host-linked).
      enum:
        - new
        - active
        - archived

    Identity:
      type: object
      description: >
        One channel presence of a Contact. Auto-link is only ever done on an EXACT
        within-channel key (providerId primary, phone secondary) — never a fuzzy
        match on name/avatar (ADR-0008 §2).
      properties:
        channelType:
          $ref: '#/components/schemas/ChannelKind'
        providerId:
          type: string
        phone:
          type: string
        username:
          type: string
        pushName:
          type: string
        avatarUrl:
          type: string
      required:
        - channelType
        - providerId

    Profile:
      type: object
      description: Platform-owned presentation of a Contact.
      properties:
        displayName:
          type: string
        avatarUrl:
          type: string
        locale:
          type: string

    HostRef:
      type: object
      description: >
        Links a Contact to the host's own record. The host owns the decision "this
        is the same customer as in my CRM" (ADR-0008 §2); the platform never infers
        cross-system identity itself.
      properties:
        system:
          type: string
        externalId:
          type: string
      required:
        - system
        - externalId

    ContactMeta:
      type: object
      description: >
        Ownership + versioning metadata (`_meta`). Ownership maps a field group
        ("identities"/"profile"/"custom") to its owner (ADR-0008 §1, ADR-0007 §3).
      properties:
        ownership:
          type: object
          additionalProperties:
            type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
        - version
        - updatedAt

    Contact:
      type: object
      description: A person, addressable across one or more channel identities (ADR-0008).
      properties:
        id:
          type: string
        cabinetId:
          type: string
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        profile:
          $ref: '#/components/schemas/Profile'
        custom:
          type: object
          additionalProperties: true
          description: Host-owned free-form fields.
        hostRefs:
          type: array
          items:
            $ref: '#/components/schemas/HostRef'
        _meta:
          $ref: '#/components/schemas/ContactMeta'
      required:
        - id
        - cabinetId
        - identities
        - profile
        - _meta

    ContactPatch:
      type: object
      description: >
        Partial update of host-owned fields (ADR-0008 §3 lifecycle: host mirrors the
        contact then returns the link). Only `hostRefs` and `custom` are writable
        here — identities and platform profile are not host-owned.
      properties:
        hostRefs:
          type: array
          items:
            $ref: '#/components/schemas/HostRef'
        custom:
          type: object
          additionalProperties: true
        _meta:
          type: object
          description: >
            Optimistic concurrency. Pass the `version` you last read and the write
            applies only if nothing changed underneath — otherwise
            contact.version_conflict (409), and you refetch and retry.

            Optional: omit it and the update is last-writer-wins, which is the
            behaviour every caller had before this existed. Only `custom` is
            guarded; `hostRefs` are links rather than values and adding one twice
            is not a conflict.
          properties:
            version:
              type: integer
              description: The `_meta.version` of the contact you based this edit on.
          required:
            - version

    ContactList:
      type: object
      description: A cursor page of contacts (ADR-0002 §5, cursor-based).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo

    # =========================================================================
    # R8-B (issue #44, ADR-0084): contact consent with a source — BEGIN
    # =========================================================================
    ConsentSource:
      type: string
      description: >
        Where a consent came from. inbound_message: the person wrote to the
        cabinet on this channel; import: a bulk import with an explicit consent
        column; host_api: the host asserted it with an API key; deep_link: the
        person opted in through a deep-link invite; manual: a person in the
        console recorded it.
      enum: [inbound_message, import, host_api, deep_link, manual]

    ConsentStatus:
      type: string
      description: >
        granted — an active consent is on record; revoked — the person opted
        out on this channel; missing — nothing is recorded.
      enum: [granted, revoked, missing]

    ConsentActor:
      type: object
      description: Who granted or revoked (the audit vocabulary, ADR-0028).
      properties:
        type:
          type: string
          # Deliberately not an enum: `system` would collide with MsgType's
          # `system` and rename every generated MsgType constant.
          description: account | api_key | system.
        id:
          type: string
          description: The account id or key id; empty for the system.
      required:
        - type

    ContactConsent:
      type: object
      description: >
        The consent of one contact on one channel (ADR-0084). `source`,
        `grantedAt` and `grantedBy` describe the grant in force — or the last
        one, when revoked — and are absent for an opt-out recorded before any
        grant.
      properties:
        channelId:
          type: string
          format: uuid
        channelKind:
          $ref: '#/components/schemas/ChannelKind'
        status:
          $ref: '#/components/schemas/ConsentStatus'
        source:
          $ref: '#/components/schemas/ConsentSource'
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          $ref: '#/components/schemas/ConsentActor'
        evidence:
          type: string
          maxLength: 500
          description: A short reference to where the consent came from; never personal data.
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          $ref: '#/components/schemas/ConsentActor'
        updatedAt:
          type: string
          format: date-time
      required:
        - channelId
        - channelKind
        - status
        - updatedAt

    ContactConsentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactConsent'
      required:
        - items

    ContactConsentChange:
      type: object
      description: The result of a grant or a revocation.
      properties:
        changed:
          type: boolean
          description: False when the call changed nothing (already in that state, or an opt-out the source may not lift).
        consent:
          $ref: '#/components/schemas/ContactConsent'
      required:
        - changed
        - consent

    GrantConsentRequest:
      type: object
      additionalProperties: false
      properties:
        evidence:
          type: string
          maxLength: 500
          description: >
            Where the consent came from — a signed form's id, the host's CRM
            record. Kept with the consent. Never personal data.
    # =========================================================================
    # R8-B (issue #44, ADR-0084): contact consent with a source — END
    # =========================================================================

    # =========================================================================
    # channel.yaml — channel read view (Capabilities mirrors channels.Capabilities)
    # =========================================================================
    Capabilities:
      type: object
      description: A channel's honest self-declaration of what it can do (ADR-0012).
      properties:
        text:
          type: boolean
        media:
          type: boolean
        templates:
          type: boolean
        buttons:
          type: boolean
        groups:
          type: boolean
        presence:
          type: boolean
        deepLinkInvite:
          type: boolean
          description: Click-to-chat deep-link support opt-in (ADR-0009).
        delivery:
          type: string
          description: How the provider delivers inbound updates.
          enum:
            - stream
            - webhook
            - poll
      required:
        - text
        - media
        - templates
        - buttons
        - groups
        - presence
        - deepLinkInvite
        - delivery

    ChannelSettings:
      type: object
      description: >
        Non-secret, per-channel provider configuration: identifiers taken from
        the provider's own dashboard. Deliberately separate from credentials —
        these are readable back, while anything set through
        setChannelCredentials never is (ADR-0011). Keys are per-kind; one that
        does not apply to the channel's kind is rejected.
      properties:
        phoneNumberId:
          type: string
          description: >
            wa_cloud only. The Meta phone number id this channel sends from
            (Graph POST /<phoneNumberId>/messages). It identifies the sending
            number, so a cabinet with two wa_cloud channels needs one per
            channel — a single shared value would send every message from the
            first channel's number.
          minLength: 1
      additionalProperties: false

    Channel:
      type: object
      description: A channel configured in the cabinet (M0 read view).
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        state:
          type: string
          description: >
            LAST OBSERVED connection/pairing state (active, pairing,
            disconnected), read from the stored row rather than the provider.

            For kinds whose liveness is only known to the provider — wa_web —
            the row converges when the channel's status is checked
            (GET /channels/{id}/status), which writes back what it observes. So
            a channel paired but never status-checked can still read
            disconnected here.

            Use GET /channels/{id}/status when you need the state as of now;
            this list is a cheap inventory, not a live probe.
        capabilities:
          $ref: '#/components/schemas/Capabilities'
          description: >
            What this channel's provider declares it can do (ADR-0012), read from
            the provider itself rather than from a table kept alongside it.

            A property of the KIND, not of this particular channel: it says what
            the integration supports, not what the account is currently permitted
            or connected to do. Absent for a kind this build holds no declaration
            for — an unknown capability set is not an empty one.
        settings:
          $ref: '#/components/schemas/ChannelSettings'
        suspended:
          type: boolean
          description: >
            R7-B (#36, ADR-0080): true while the channel is held because its
            organization is suspended — its live provider link is closed and
            nothing is sent through it; its credentials are kept. `state` is the
            state it had, and is what resuming the organization restores.
            Absent when the channel is not held.
      required:
        - id
        - kind
        - state

    ChannelList:
      type: object
      description: The channels configured in the cabinet.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
      required:
        - items

    ChannelDeletion:
      type: object
      description: >
        What deleting a channel removed. Reported for the same reason
        ErasureResult is: "we asked and it said nothing was there" and "it removed
        a channel and 412 messages with it" are different facts, and after the
        fact the only place either one is recorded is the caller's own log and
        ours.
      properties:
        deleted:
          type: boolean
          description: >
            true when a channel row was actually removed; false when the id named
            nothing in this cabinet. Both are successful outcomes — the requested
            state holds either way — so this is how a caller tells a deletion from
            a replay of one.
        conversations:
          type: integer
          description: Conversations removed with the channel.
        messages:
          type: integer
          description: >
            Messages removed. Found both by the channel and through its
            conversations, because a message may carry either link and losing
            one is not losing the other.
        outbox:
          type: integer
          description: >
            Queued outbound rows removed. Each holds its own full copy of the
            envelope, and one still pending is an outbound message that will now
            never be sent — which is the intended answer for a channel that is
            being deleted.
        media:
          type: integer
          description: >
            Attachments queued for removal from the object store. Queued rather
            than deleted inline: the object store is not in the deletion's
            transaction, so the keys are committed with it and a background sweep
            removes the bytes immediately afterwards.
        deskInboxRemoved:
          type: boolean
          description: >
            true when the channel's inbox on the operator desk was deleted, taking
            the desk-side conversations and their message history with it. false
            when the channel never had one, or no desk is configured — never when
            a desk was configured and refused, which fails the whole operation
            with provider.unavailable instead.
      required:
        - deleted
        - conversations
        - messages
        - outbox
        - media
        - deskInboxRemoved

    CreateChannelRequest:
      type: object
      description: >
        Provision a new channel of the given kind. The channel starts
        disconnected; the connect command begins pairing (ADR-0012 outbound
        readiness). `label` is an optional operator-facing name.
      properties:
        kind:
          $ref: '#/components/schemas/ChannelKind'
        label:
          type: string
          description: Optional human-friendly label shown in the admin channel list.
      required:
        - kind

    Cabinet:
      type: object
      description: A client cabinet — the tenant/isolation boundary (RLS).
      properties:
        id:
          type: string
        orgId:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - orgId
        - name
        - slug

    CabinetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cabinet'
      required:
        - items

    CreateCabinetRequest:
      type: object
      properties:
        name:
          type: string
          description: Client-facing cabinet name; the slug derives from it.
          minLength: 1
        # R7-A (issue #34, ADR-0079 §2): the organization the cabinet joins.
        organizationId:
          type: string
          format: uuid
          description: >
            The organization (createOrganization) the cabinet is added to; it
            reserves one `cabinets` of that organization's plan. DEPRECATED
            when omitted: without it a new organization is created for the
            cabinet on the default plan (the pre-#34 one-to-one pair), which
            keeps existing callers working — new callers should create the
            organization first and name it here.
      required:
        - name

    ApiKey:
      type: object
      description: API key metadata — the secret/hash is NEVER returned (ADR-0005).
      properties:
        kid:
          type: string
        status:
          type: string
          description: active | next | retiring | revoked
        scopes:
          type: array
          items:
            type: string
        label:
          type: string
          description: >
            Who holds this key. Empty for keys issued before labels existed —
            those are the ones an operator cannot rotate confidently, because
            nothing records what would break.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry; absent when the key does not expire.
        graceUntil:
          type: string
          format: date-time
          description: >
            For a `retiring` key: when it stops working. Present only during a
            rotation's overlap window.
      required:
        - kid
        - status

    ApiKeyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
      required:
        - items

    IssueApiKeyRequest:
      type: object
      description: >
        What the key should be. Every field is optional and the defaults preserve
        the previous behaviour — a cabinet-wide, never-expiring key — but each one
        was previously impossible to express, so no caller could ask for less.
      properties:
        scopes:
          type: array
          items:
            type: string
          description: >
            What this key may do. Defaults to ["*"], the whole cabinet.

            ENFORCED ON EVERY OPERATION. Each operation declares an
            `x-permission`, and the key's scopes are resolved into exactly that
            vocabulary before the handler runs (ADR-0050 §4), so a narrow list is
            now a real boundary rather than a label.

            A scope is one of: `*` (everything inside this cabinet — the
            cabinet_admin permission set, which does NOT include
            `platform:admin` or `billing:manage`), `platform:admin` (the
            cross-tenant operator surface: /cabinets, the keyring, dead
            letters), `secrets:read` (disclosure of the access pool's
            credentialsRef), or the exact name of a permission —
            `channels:read`, `channels:manage`, `messages:send`,
            `contacts:write`, `contacts:export`, `campaigns:manage`,
            `policy:manage`, `team:manage`, `ai:manage`, `compliance:read`,
            `compliance:manage`, `analytics:read`, `audit:read`,
            `settings:manage`, `billing:manage`.

            ANYTHING ELSE IS REFUSED with `validation.invalid_request`. An
            unrecognised scope grants nothing, so a key carrying one would
            authenticate, look correctly narrow in the key list and be unable to
            call a single operation; the refusal names the scopes it did not
            understand. Keys issued before this check are untouched — they keep
            granting whatever their recognised scopes grant.

            Cabinet isolation does not depend on any of this: it is enforced by
            the key's cabinet binding and Postgres RLS (ADR-0042), whatever the
            scopes say.
        label:
          type: string
          description: >
            Who holds this key ("zapier", "billing sync"). Not a secret and not an
            identity — the kid is the identity. Without it a cabinet's key list is
            a column of opaque ids, and rotating one safely means knowing which
            integration would break.
        expiresAt:
          type: string
          format: date-time
          description: >
            Absolute expiry, enforced at verification. Omitted, the key never
            expires — which is right for a long-lived integration and wrong for
            the two-week migration that is still valid two years later.
      required: []

    RotateApiKeyRequest:
      type: object
      description: >
        Replace a key without an outage. The old key keeps working until
        `graceUntil`, so the holder swaps at its own pace.
      properties:
        graceUntil:
          type: string
          format: date-time
          description: >
            When the outgoing key stops working. Defaults to 24 hours from now.
            Both keys are valid until then — which is the entire point: issuing a
            replacement and revoking the old one breaks every holder in the
            instant between the two calls.
        scopes:
          type: array
          items:
            type: string
          description: >
            Scopes for the replacement. Defaults to the outgoing key's. Same
            vocabulary and the same refusal as `IssueApiKeyRequest.scopes`: a
            rotation mints a key, so it is the same door.
        label:
          type: string
          description: Label for the replacement. Defaults to the outgoing key's.
        expiresAt:
          type: string
          format: date-time
          description: Expiry for the replacement. Omitted, it does not expire.
      required: []

    IssuedApiKey:
      type: object
      description: >
        A freshly minted client key. `bearerToken` is shown ONLY here, once —
        the platform stores just its argon2id hash.
      properties:
        kid:
          type: string
        cabinetId:
          type: string
        bearerToken:
          type: string
          description: 'Full bearer credential: "<cabinetId>.<kid>.<secret>". Shown once.'
      required:
        - kid
        - cabinetId
        - bearerToken

    SyncChannelRequest:
      type: object
      description: Options for a source-side import.
      properties:
        history:
          type: boolean
          description: Also ask the source to replay older messages (default false).
        historyCount:
          type: integer
          description: How many older messages to request (default 100, max 500).
          minimum: 1
          maximum: 500

    SyncResult:
      type: object
      description: Outcome of a source-side import.
      properties:
        channelId:
          type: string
        contactsImported:
          type: integer
          description: Contacts newly created in the cabinet.
        contactsMatched:
          type: integer
          description: Contacts that already existed (matched on identity).
        historyRequested:
          type: boolean
          description: True when a history replay was requested from the source.
      required:
        - channelId
        - contactsImported
        - contactsMatched

    SetChannelCredentialsRequest:
      type: object
      description: >
        Write-only provider credentials for an API-token channel. Every value
        goes straight into the secret store; only `secret://` references are kept
        on the channel (ADR-0011), and none is ever echoed back by any operation.


        Per-kind, the mirror image of ChannelSettings: settings are per-kind and
        readable, credentials are per-kind and never readable. A field that does
        not apply to the channel's kind is rejected rather than stored.
      properties:
        token:
          type: string
          description: >
            The provider credential (bot token / auth token / wa_cloud Graph
            access token) — or, for a tg_client login waiting on 2FA, the cloud
            password. Write-only.
          minLength: 1
        appSecret:
          type: string
          description: >
            wa_cloud only. The Meta app secret that signs inbound webhooks
            (X-Hub-Signature-256). Per-channel, so a tenant can bring its own
            Meta app instead of sharing ours.
          minLength: 1
        verifyToken:
          type: string
          description: >
            wa_cloud only. The token Meta echoes back on the webhook verification
            handshake. You choose the value; it is still a shared secret, and it
            is per-channel for the same reason appSecret is.
          minLength: 1
      required:
        - token
      additionalProperties: false

    ChannelState:
      type: string
      description: >
        Coarse connection state of a channel (ADR-0012). `pairing` means a QR /
        pairing code is pending; `connected` means the channel can send/receive.
      enum:
        - disconnected
        - pairing
        - connected

    ChannelStatus:
      type: object
      description: >
        Live connection/pairing status of a channel. While `state=pairing` a QR
        channel (wa_web, tg_client) carries the `qr` payload (and optionally a
        `pairingCode`) to render in the admin connect screen (ADR-0013
        channel.pairing_required). For tg_client, `passwordRequired=true` means
        the QR was scanned but the account's 2FA cloud password must be submitted
        via setChannelCredentials to finish the login.
      properties:
        channelId:
          type: string
        state:
          $ref: '#/components/schemas/ChannelState'
        qr:
          type: string
          description: >
            QR payload to render while pairing (opaque string; the admin encodes it
            as a QR image). Absent unless state=pairing for a QR channel.
        pairingCode:
          type: string
          description: Alternative short pairing code (phone-number pairing). Optional.
        expiresAt:
          type: string
          format: date-time
          description: When the current QR / pairing code expires and must be refreshed.
        passwordRequired:
          type: boolean
          description: >
            tg_client only: the QR was scanned but the account's 2FA cloud
            password is required — submit it via setChannelCredentials (write-only).
        detail:
          type: string
          description: >
            Human-readable note about a channel that is usable but not fully
            healthy — e.g. a viber_bot whose callback URL could not be registered,
            which can send but will never receive. Present only when there is
            something the operator has to act on; `state` alone cannot express
            "works one way", and reporting such a channel as plainly connected
            hides the reason nothing arrives.
      required:
        - channelId
        - state

    # =========================================================================
    # embed.yaml — embeddable widget session (ADR-0007/0009 stub)
    # =========================================================================
    EmbedSessionRequest:
      type: object
      description: Initialize an embed widget session (ADR-0009).
      properties:
        contactId:
          type: string
          description: >
            The contact this session is scoped to. Required: a token that names
            nobody would reach everybody.
        conversationId:
          type: string
          description: >
            Optional: confine the token to a single conversation. Omitted, it
            reaches every conversation that contact has.
        cap:
          type: array
          items:
            type: string
          description: >
            Capabilities the token should carry, as an UPPER BOUND — the issued
            set is never wider than this. Omitted, the platform's default set is
            issued. A capability the platform does not issue is rejected with
            validation.invalid_request rather than dropped, so a caller is never
            left believing its token is narrower than it is.
        origin:
          type: string
          format: uri
          description: >
            Origin (scheme+host) of the embedding site. NOT YET ENFORCED —
            allowed-origin validation is planned (ADR-0009) and this value is
            currently ignored. Optional for that reason: a required field that
            nothing reads is a contract that lies to the integrator.
      required:
        - contactId

    EmbedSession:
      type: object
      description: An issued embed session token (ADR-0009 stub).
      properties:
        token:
          type: string
          description: Short-lived, opaque embed session token.
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry of the token.
      required:
        - token
        - expiresAt

    EmbedContactPatch:
      type: object
      description: >
        Optimistic-concurrency patch of host-owned custom fields from the widget
        (ADR-0009 §4). Only `custom` is writable — profile/identities are not
        host-owned (ADR-0007 §3).
      properties:
        custom:
          type: object
          additionalProperties: true
          description: Host-owned free-form fields to merge into the contact.
        baseVersion:
          type: integer
          description: The `_meta.version` the widget last saw; a drift yields contact.version_conflict.
        idempotencyKey:
          type: string
          description: Dedups a retried patch (ADR-0002 §5).
      required:
        - custom
        - baseVersion

    EmbedSendRequest:
      type: object
      description: Send a text message from the widget into the scoped conversation (ADR-0009 §5).
      properties:
        text:
          type: string
        idempotencyKey:
          type: string
      required:
        - text

    StartBotConversationRequest:
      type: object
      description: Raise a bot conversation via deep-link / click-to-chat (ADR-0009 §6).
      properties:
        channelId:
          type: string
          description: The bot channel to raise the session on (e.g. a tg_bot channel).
        mode:
          type: string
          description: Session mode; `bot` raises a click-to-chat deep-link.
          enum:
            - bot
        idempotencyKey:
          type: string
      required:
        - channelId
        - mode

    BotSession:
      type: object
      description: A pending deep-link bot session (ADR-0009 §6).
      properties:
        conversationId:
          type: string
          description: The (pending) conversation id.
        state:
          type: string
          description: Session state; `pending_optin` until the contact taps the link.
          enum:
            - pending_optin
            - open
        inviteLink:
          type: string
          format: uri
          description: The click-to-chat deep-link the contact taps to opt in.
        expiresAt:
          type: string
          format: date-time
          description: When the invite link / pending session expires.
      required:
        - conversationId
        - state
        - inviteLink
        - expiresAt

    FeedMessage:
      type: object
      description: One message in the embed conversation feed (ADR-0009 §5).
      properties:
        id:
          type: string
        providerMsgId:
          type: string
        direction:
          $ref: '#/components/schemas/Direction'
        type:
          $ref: '#/components/schemas/MsgType'
        text:
          type: string
        author:
          type: string
        ts:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/MsgStatus'
        media:
          $ref: '#/components/schemas/MediaInfo'
      required:
        - id
        - direction
        - type
        - ts

    UploadedMedia:
      type: object
      description: A stored outbound attachment, ready to reference in a send.
      properties:
        url:
          type: string
          description: Absolute, time-limited URL the provider fetches.
        mime:
          type: string
        filename:
          type: string
        size:
          type: integer
      required:
        - url

    MediaInfo:
      type: object
      description: >
        Attachment descriptor for a media message. `url` is a PLATFORM url
        (`/v1/messages/{id}/media`) — the object store is private and provider
        links expire, so bytes are always read back through the platform.
      properties:
        url:
          type: string
        mime:
          type: string
        filename:
          type: string
        caption:
          type: string
        note:
          type: boolean
          description: >
            Marks a message RECORDED in the client — a voice message or a video
            note ("кружечок") — as opposed to an audio/video FILE that happens to
            be attached. A presentation hint, not a payload type: it rides beside
            `type` instead of becoming a MsgType member so that an adapter which
            does not know it sends an ordinary audio/video rather than answering
            `ErrPermanent`, which would drop the message entirely. Honoured on
            tg_client for both forms and on tg_bot for voice only — the Bot API
            refuses a URL for sendVideoNote, so a round frame degrades to a
            plain video there.
      required:
        - url

    MessageHistory:
      type: object
      description: A page of a contact's message history across all channels.
      properties:
        contactId:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/FeedMessage'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - contactId
        - messages

    ConversationFeed:
      type: object
      description: The scoped, append-only conversation feed (ADR-0009 §5).
      properties:
        conversationId:
          type: string
        channelType:
          $ref: '#/components/schemas/ChannelKind'
        contactId:
          type: string
        status:
          type: string
          description: Conversation status (e.g. open, closed).
        messages:
          type: array
          items:
            $ref: '#/components/schemas/FeedMessage'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - conversationId
        - contactId
        - messages

    # =========================================================================
    # pagination.yaml — cursor pagination (ADR-0002 §5)
    # =========================================================================
    PageInfo:
      type: object
      description: >
        Cursor pagination envelope metadata. `nextCursor` is an opaque forward
        cursor; it is absent/empty on the last page. Pass it back as the `since`
        query parameter to fetch the next page (ADR-0008 §3).
      properties:
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more pages.

    # =========================================================================
    # webhooks + access pool — admin management (ADR-0002, M6 S4)
    # =========================================================================
    WebhookSubscription:
      type: object
      description: An outbound webhook subscription (ADR-0031). The signing secret is never returned.
      properties:
        id:
          type: string
        url:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        status:
          type: string
      required:
        - id
        - url
        - status
    ErasureResult:
      type: object
      description: >
        How many rows an erasure touched. Reported so the caller can enter it in
        its own erasure journal — "we asked and it said 0/0/0/0" is a materially
        different record from "it removed a contact and redacted 412 messages".
      properties:
        contacts:
          type: integer
          description: 1 when the contact row still existed, 0 when already gone.
        identities:
          type: integer
          description: Channel identities (phone / username / provider id) removed.
        conversations:
          type: integer
          description: Conversations whose chat id was replaced with a tombstone.
        messages:
          type: integer
          description: >
            Messages redacted — body, metadata, contact reference, chat id and
            provider message id.
        outbox:
          type: integer
          description: >
            Outbox rows removed. The outbox holds its own full copy of the
            envelope — body, chat id, contact reference — so redacting the
            message row does not reach it. A row still pending is dropped, which
            cancels an outbound message to someone who asked to be erased.
        media:
          type: integer
          description: >
            Attachments queued for removal from the object store. Queued rather
            than deleted inline: the object store is not in the erasure's
            transaction, so the keys are committed with the redaction and a
            background sweep removes the bytes immediately afterwards.
        waLidPairs:
          type: integer
          description: >
            WhatsApp lid↔phone pairs forgotten. WhatsApp discloses that a LID and
            a phone number are the same person, and we remember it so the two
            halves of a contact converge (ADR-0060 §5). That memory IS the phone
            number, in its own table, reachable from the LID — so an erasure that
            redacted every message and left it behind would have left the number
            behind.
      required:
        - contacts
        - identities
        - conversations
        - messages
        - outbox
        - media
        - waLidPairs

    UpdateWebhookRequest:
      type: object
      description: >
        Change a subscription's delivery state. Only the state is mutable here:
        editing the url would silently redirect a tenant's events to a different
        destination under the same id, which is a re-registration, not an edit.
      properties:
        status:
          type: string
          description: >
            `active` delivers; `disabled` stops delivery and keeps everything
            else, so the subscription can be resumed without re-sharing a key.
          enum:
            - active
            - disabled
      required:
        - status
      additionalProperties: false

    WebhookList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
      required:
        - items
    RegisterWebhookRequest:
      type: object
      description: >
        A new subscription. `secret` and `secretRef` are two ways of giving it a
        signing key and are mutually exclusive; omitting both asks the platform
        to mint one (ADR-0046).
      properties:
        url:
          type: string
        secret:
          type: string
          writeOnly: true
          description: >
            The HMAC signing key itself. Handed straight to the secret store —
            our database keeps only the reference, and no operation reads it
            back. Write-only, exactly like the credentials on
            setChannelCredentials (ADR-0011). Use this when the receiving
            endpoint already has a key it expects us to sign with.
        secretRef:
          type: string
          description: >
            Secret-store reference (secret://...) to a key ALREADY placed in the
            store, for a caller who manages the vault directly. Never the key
            itself — that is `secret`.
        eventTypes:
          type: array
          items:
            type: string
      required:
        - url
    RegisterWebhookResult:
      type: object
      description: >
        A newly registered subscription. Identical to WebhookSubscription except
        for `secret`, which carries a key the platform minted. A separate schema
        so the listing keeps its guarantee intact: WebhookSubscription carries no
        key, in any response, ever.
      properties:
        id:
          type: string
        url:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        status:
          type: string
        secret:
          type: string
          readOnly: true
          description: >
            The minted HMAC signing key — shown once and unrecoverable. Nothing
            else returns it: the platform holds only what the secret store holds,
            and listWebhooks does not read even the reference. Configure the
            receiver with it now; if it is lost, the way back is to delete this
            subscription and register another.
      required:
        - id
        - url
        - status
    SetAccessPoolHealthRequest:
      type: object
      properties:
        health:
          type: string
          enum: [healthy, degraded, banned]
          description: >
            `healthy` returns the entry to rotation. `degraded` and `banned` take
            it out — the platform sets those itself when a send fails with a
            permanent auth or ban error.
      required:
        - health

    DeadLetter:
      type: object
      description: >
        One webhook delivery the platform stopped retrying, with enough context to
        judge it: which cabinet and endpoint it was for, what it carried, and what
        the last attempt got back.
      properties:
        id:
          type: string
          description: The delivery id — pass it to the replay operation.
        cabinetId:
          type: string
        webhookId:
          type: string
        url:
          type: string
          description: The endpoint that would not accept it.
        eventId:
          type: string
        eventType:
          type: string
        attemptNo:
          type: integer
          description: How many attempts were made before giving up.
        responseCode:
          type: integer
          description: HTTP status of the last attempt; 0 when it never got a response.
        error:
          type: string
          description: Transport or status error recorded on the last attempt.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - cabinetId
        - webhookId
        - url
        - eventId
        - eventType
        - attemptNo
        - createdAt

    DeadLetterList:
      type: object
      description: Dead-lettered deliveries, newest first.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeadLetter'
      required:
        - items

    # =========================================================================
    # platform operators (ADR-0075)
    # =========================================================================
    PlatformOperator:
      type: object
      description: One grant of platform power to a person (platform_operators).
      properties:
        accountId:
          type: string
        email:
          type: string
        displayName:
          type: string
        grantedBy:
          type: string
          nullable: true
          description: >
            The account id of the operator who granted it; null when no person
            granted it — the bootstrap command on the server, or a
            platform:admin API key (the security log names which).
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the grant is active.
        active:
          type: boolean
        reason:
          type: string
      required:
        - accountId
        - email
        - displayName
        - grantedBy
        - grantedAt
        - revokedAt
        - active
        - reason

    PlatformOperatorList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformOperator'
      required:
        - items

    GrantPlatformOperatorRequest:
      type: object
      description: Exactly one of accountId and email.
      properties:
        accountId:
          type: string
        email:
          type: string
        reason:
          type: string
          maxLength: 500
          description: Why the grant is made; kept with the grant and in the security log.
    # =========================================================================
    # end of platform operators (ADR-0075)
    # =========================================================================

    AccessPoolEntry:
      type: object
      description: One auth-out credential in the pool (ADR-0029). credentialsRef is a pointer, never the secret.
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        status:
          type: string
        health:
          type: string
        weight:
          type: integer
        credentialsRef:
          type: string
          description: >
            Pointer into the secret store — never the secret itself. ABSENT
            unless the calling key carries the `secrets:read` scope, which the
            cabinet-wide `*` does not imply: a key issued to send messages has no
            need to learn where the provider credentials are kept. Each
            disclosure is recorded in the audit trail as accesspool.secrets.read.
      required:
        - id
        - kind
        - status
        - health
    AccessPoolList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessPoolEntry'
      required:
        - items
    AddAccessPoolEntryRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ChannelKind'
        credentialsRef:
          type: string
          description: Secret-store reference (secret://...); never the credential itself.
        status:
          type: string
          description: Initial status — "active" or "next" (default next).
        weight:
          type: integer
      required:
        - kind
        - credentialsRef
    RotateAccessPoolRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ChannelKind'
      required:
        - kind
    RotateAccessPoolResult:
      type: object
      properties:
        promoted:
          type: string
        retired:
          type: array
          items:
            type: string
      required:
        - promoted
    AuditEntry:
      type: object
      description: One append-only audit record (ADR-0028). detail carries only non-sensitive metadata.
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actorType:
          type: string
        actorId:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        result:
          type: string
        detail:
          type: object
          additionalProperties: true
          description: >
            Non-sensitive metadata recorded with the action — the counts an
            erasure touched, the scope a denied request asked for, the status a
            webhook was moved to. Never secrets, tokens or message bodies
            (ADR-0028 §3).

            It is the part that makes an entry answerable rather than merely
            present: "key.issue on cabinet X" says less than the scopes that key
            was given. Recorded from the start and never returned until now.
      required:
        - id
        - action
        - result
    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
      required:
        - items

    # =========================================================================
    # auth.yaml — human identity and sessions (ADR-0049)
    # =========================================================================
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
        totpCode:
          type: string
          description: The current TOTP code. Omit on the first post; send it after a 202.
          maxLength: 16
        recoveryCode:
          type: string
          description: >
            A single-use recovery code, INSTEAD of totpCode when the authenticator
            is lost. Ignored when totpCode is also present (no code is burned).
          maxLength: 64
      required:
        - email
        - password
    SecondFactorChallenge:
      type: object
      description: The password was right; post again with a second-factor code.
      properties:
        secondFactorRequired:
          type: boolean
        methods:
          type: array
          description: The codes the next post may carry.
          items:
            type: string
            enum:
              - totp
              - recovery_code
      required:
        - secondFactorRequired
        - methods
    AccountSummary:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        locale:
          type: string
          description: uk | en | ru
        secondFactorEnabled:
          type: boolean
      required:
        - id
        - email
        - displayName
        - locale
        - secondFactorEnabled
    CurrentSession:
      type: object
      properties:
        id:
          type: string
          description: sha256 hex of the cookie — the id listMySessions and revokeMySession use.
        expiresAt:
          type: string
          format: date-time
        secondFactorPassed:
          type: boolean
      required:
        - id
        - expiresAt
        - secondFactorPassed
    LoginResult:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountSummary'
        session:
          $ref: '#/components/schemas/CurrentSession'
      required:
        - account
        - session
    MembershipLevel:
      type: string
      description: Where a membership lives (ADR-0050 §1). `platform` is a property of the account, not a row.
      enum:
        - platform
        - organization
        - cabinet
    Role:
      type: string
      description: One of the seven ADR-0050 roles.
      enum:
        - platform_admin
        - org_owner
        - org_admin
        - cabinet_admin
        - supervisor
        - agent
        - viewer
    AccountMembership:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/MembershipLevel'
        organizationId:
          type: string
          description: Set for an organization-level membership.
        cabinetId:
          type: string
          description: Set for a cabinet-level membership.
        role:
          $ref: '#/components/schemas/Role'
      required:
        - level
        - role
    CabinetAccess:
      type: object
      description: >
        The effective rights in one cabinet — the same Principal the
        authorization middleware builds for a request to that cabinet.
      properties:
        cabinetId:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: The union of the roles' permissions (internal/authz), sorted.
          items:
            type: string
        allChannels:
          type: boolean
          description: >
            True when the rights reach every channel of the cabinet. False for an
            agent, who reaches exactly `channelIds` — which may be EMPTY (no
            assignment means no channel, never every channel).
        channelIds:
          type: array
          description: The assigned channels when allChannels is false; empty otherwise.
          items:
            type: string
      required:
        - cabinetId
        - roles
        - permissions
        - allChannels
        - channelIds
    Me:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountSummary'
        session:
          $ref: '#/components/schemas/CurrentSession'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/AccountMembership'
        currentCabinet:
          $ref: '#/components/schemas/CabinetAccess'
        platformOperator:
          type: boolean
          description: >
            True when the account holds an active platform-operator grant
            (ADR-0075). Platform power additionally requires the second factor
            in the session (session.secondFactorPassed); without it platform
            operations answer 403 auth.second_factor_required.
        cabinets:
          type: array
          description: >
            Every cabinet the caller can select with X-Linqelio-Cabinet through
            their memberships: cabinet-level memberships plus every cabinet of
            an organization where they hold an org-level role — exactly the
            cabinets in which the authorization middleware finds a role. A
            platform operator's reach to ALL cabinets is not listed here (use
            listCabinets).
          items:
            $ref: '#/components/schemas/ReachableCabinet'
      required:
        - account
        - session
        - memberships
        - platformOperator
        - cabinets
    ReachableCabinet:
      type: object
      description: A cabinet the caller reaches through a membership.
      properties:
        id:
          type: string
        name:
          type: string
        organizationId:
          type: string
        via:
          type: string
          enum:
            - cabinet
            - organization
          description: >
            `cabinet` when the caller holds a cabinet-level membership there
            (whether or not an org-level role also reaches it), otherwise
            `organization`.
      required:
        - id
        - name
        - organizationId
        - via
    AuthSessionSummary:
      type: object
      properties:
        id:
          type: string
        current:
          type: boolean
          description: True for the session this request was made with.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Refreshed at most once per 30 s cache window.
        expiresAt:
          type: string
          format: date-time
        ip:
          type: string
        userAgent:
          type: string
        secondFactorPassed:
          type: boolean
      required:
        - id
        - current
        - createdAt
        - lastSeenAt
        - expiresAt
        - userAgent
        - secondFactorPassed
    AuthSessionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthSessionSummary'
      required:
        - items
    TokenPasswordRequest:
      type: object
      description: A single-use invite or reset token from the email, and the password the person chose.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          description: At least 12 characters (NIST SP 800-63B favours length over composition rules).
          minLength: 1
          maxLength: 1024
      required:
        - token
        - password
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
      required:
        - email
    TotpEnrollment:
      type: object
      properties:
        enrollmentId:
          type: string
          description: Names this pending seed in enableTotp. Bound to the caller's account server-side.
        secret:
          type: string
          description: The base32 seed. Shown once; render the QR code from otpauthUri locally.
        otpauthUri:
          type: string
          description: otpauth://totp/... (SHA1, 6 digits, 30 s) for authenticator apps.
      required:
        - enrollmentId
        - secret
        - otpauthUri
    EnableTotpRequest:
      type: object
      properties:
        enrollmentId:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          minLength: 1
          maxLength: 16
      required:
        - enrollmentId
        - code
    SecondFactorCode:
      type: object
      properties:
        code:
          type: string
          description: The CURRENT TOTP code (a recovery code is not accepted).
          minLength: 1
          maxLength: 16
      required:
        - code
    RecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          description: Single-use codes, shown once. Store them offline.
          items:
            type: string
      required:
        - recoveryCodes

    # =========================================================================
    # team.yaml — team management (issue #31, ADR-0075 §5). BEGIN R4-T schemas.
    # =========================================================================
    MemberStatus:
      type: string
      description: >
        A person's standing in the cabinet: `active`; `invited` while they have
        not yet set a password; `blocked` when the account or every membership
        is blocked.
      enum:
        - active
        - invited
        - blocked
      # Explicit constant names: without them the generator resolves the clash
      # with other enums holding "active" by renaming THEIR constants too.
      x-enum-varnames:
        - MemberStatusActive
        - MemberStatusInvited
        - MemberStatusBlocked
    TeamMembership:
      type: object
      description: One membership row that reaches the cabinet.
      properties:
        level:
          $ref: '#/components/schemas/MembershipLevel'
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MemberStatus'
      required:
        - level
        - role
        - status
    TeamMember:
      type: object
      description: A person with a membership reaching the cabinet.
      properties:
        accountId:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/MembershipLevel'
        memberships:
          type: array
          description: >
            Every row behind `role` — a person may hold an organization-level
            and a cabinet-level role at once; `role` is the most privileged.
          items:
            $ref: '#/components/schemas/TeamMembership'
        status:
          $ref: '#/components/schemas/MemberStatus'
        channelIds:
          type: array
          description: >
            The channels assigned in THIS cabinet. They bound an agent; for a
            cabinet-wide role they are informational.
          items:
            type: string
        defaultChannelId:
          type: string
          description: The channel a reply leaves through when none is named; absent when none.
        joinedAt:
          type: string
          format: date-time
        version:
          type: string
          description: Opaque optimistic-concurrency token; send it back with updateMember.
      required:
        - accountId
        - email
        - displayName
        - role
        - level
        - memberships
        - status
        - channelIds
        - joinedAt
        - version
    TeamActor:
      type: object
      description: Who performed an action — a person, an API key, or the platform itself.
      properties:
        type:
          type: string
          description: "`account`, `api_key` or `system` (the audit actor types, ADR-0028)."
        id:
          type: string
          description: The account id or the key id; empty for `system`.
        email:
          type: string
          description: Present for an account that still exists.
      required:
        - type
        - id
    TeamInvite:
      type: object
      description: A pending invite into the cabinet. The link itself is never part of it.
      properties:
        id:
          type: string
        email:
          type: string
        # R5-C (ADR-0076): which of the two invite kinds this is.
        kind:
          $ref: '#/components/schemas/TeamInviteKind'
        role:
          $ref: '#/components/schemas/Role'
        channelIds:
          type: array
          items:
            type: string
        defaultChannelId:
          type: string
        invitedBy:
          $ref: '#/components/schemas/TeamActor'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - kind
        - role
        - channelIds
        - invitedBy
        - createdAt
        - expiresAt
    TeamMemberList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        invites:
          type: array
          description: Every pending invite; present on the first page only.
          items:
            $ref: '#/components/schemas/TeamInvite'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo
    InviteMemberRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
        role:
          $ref: '#/components/schemas/Role'
        displayName:
          type: string
          maxLength: 200
        locale:
          type: string
          description: The invitee's interface language; the account default when omitted.
          enum:
            - uk
            - en
            - ru
        channelIds:
          type: array
          description: Channels of this cabinet to assign on acceptance.
          maxItems: 200
          items:
            type: string
        defaultChannelId:
          type: string
          description: Must be one of `channelIds`.
      required:
        - email
        - role
    InviteMemberResult:
      type: object
      properties:
        invite:
          $ref: '#/components/schemas/TeamInvite'
        inviteUrl:
          type: string
          description: >
            The invite link — a secret for as long as it lives (single use,
            72 h). Returned here once and never again; the token travels in the
            URL fragment so it reaches no access log or Referer header.
        expiresAt:
          type: string
          format: date-time
      required:
        - invite
        - inviteUrl
        - expiresAt
    UpdateMemberRequest:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          description: The member's `version` as last read.
        role:
          $ref: '#/components/schemas/Role'
        channelIds:
          type: array
          description: Replaces the assignments in this cabinet; an empty list removes them all.
          maxItems: 200
          items:
            type: string
        defaultChannelId:
          type: string
          description: Must be among the assignments after the change.
      required:
        - version
    # END R4-T schemas

    # -------------------------------------------------------------------------
    # BEGIN R5-C schemas: membership-only invites (issue #118, ADR-0076)
    # -------------------------------------------------------------------------
    TeamInviteKind:
      type: string
      description: >
        `new_account` — the link sets the password of an account that has none
        yet, and binds the membership (acceptInvite). `existing_account` — a
        membership-only invite for an account that already has a password: the
        link sets nothing on the account and is accepted by that account's own
        session (acceptMembershipInvite).
      enum:
        - new_account
        - existing_account
    MembershipInviteTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: The token from the invite link's fragment.
      required:
        - token
    MembershipInvite:
      type: object
      description: >
        A membership-only invite as the invited person sees it. Never carries
        the link or its token.
      properties:
        inviteId:
          type: string
        cabinetId:
          type: string
        cabinetName:
          type: string
        email:
          type: string
          description: The invited account's email (the caller's own).
        role:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/MembershipLevel'
        channelCount:
          type: integer
          description: How many channels the invite assigns (their ids are the cabinet's business until the person joins).
        invitedBy:
          $ref: '#/components/schemas/TeamActor'
        expiresAt:
          type: string
          format: date-time
      required:
        - inviteId
        - cabinetId
        - cabinetName
        - email
        - role
        - level
        - channelCount
        - invitedBy
        - expiresAt
    # END R5-C schemas

    # =========================================================================
    # settings.yaml — cabinet settings (issue #89, ADR-0057). BEGIN R6-A schemas.
    # =========================================================================
    # One schema per section validates the `value` of putSettingsSection; the
    # control plane validates against THESE definitions (read from the embedded
    # contract), so the contract is the only place a section's shape is stated.
    # Conventions shared by every section:
    #   - closed (additionalProperties: false) and every key optional: a section
    #     is replaced whole, and a key left out is simply not configured;
    #   - a SECRET key is `writeOnly` (+ nullable): the client sends the value,
    #     the platform stores it in the secret store and keeps a reference; reads
    #     report it only in `secrets.<key>`. Omitted = keep, null = clear. The
    #     write-only keys of each schema are exactly the secret keys the store
    #     declares (internal/store/cabinetsettings.go) — a test holds them equal;
    #   - no string anywhere may be a `secret://…` reference.
    SettingsSection:
      type: string
      description: A section of cabinet settings (ADR-0057 §2). Closed vocabulary.
      enum:
        - ai
        - ai_guard
        - ai_profile
        - compliance
        - notifications
        - exports
        - calls
        - messaging_defaults
        - desk

    CabinetSettingsSection:
      type: object
      description: >
        One section as a client sees it: the non-secret values, a set / not-set
        flag per secret key, and the version to send back in If-Match.
      properties:
        section:
          $ref: '#/components/schemas/SettingsSection'
        value:
          type: object
          additionalProperties: true
          description: >
            The section's non-secret keys, shaped by the section's schema
            (AiSettings, NotificationsSettings, ...) minus its write-only keys.
            `{}` for a section never written.
        secrets:
          type: object
          additionalProperties:
            type: boolean
          description: >
            Every secret key of the section -> whether it is configured. The value
            and its secret-store reference are never returned.
        version:
          type: integer
          minimum: 0
          description: 0 for a section never written; +1 on every write. Also the ETag.
        updatedAt:
          type: string
          format: date-time
          description: When the section was last written. Absent at version 0.
        updatedBy:
          type: string
          description: >
            The account id of the person who last wrote the section. Absent at
            version 0 and for a write made with an API key (the audit trail names
            the key).
      required:
        - section
        - value
        - secrets
        - version

    PutSettingsSectionRequest:
      type: object
      description: The whole new value of one section.
      properties:
        value:
          type: object
          additionalProperties: true
          description: >
            Validated against the section's schema: ai -> AiSettings, ai_guard ->
            AiGuardSettings, ai_profile -> AiProfileSettings, compliance ->
            ComplianceSettings, notifications -> NotificationsSettings, exports ->
            ExportsSettings, calls -> CallsSettings, messaging_defaults ->
            MessagingDefaultsSettings, desk -> DeskSettings. A failure is 400
            validation.invalid_request with one errors[] entry per offending key.
      required:
        - value

    AiSettings:
      type: object
      additionalProperties: false
      description: The model provider binding.
      properties:
        provider:
          type: string
          enum: [openai, anthropic, azure_openai, google, openai_compatible]
        model:
          type: string
          minLength: 1
          maxLength: 200
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
          description: Only for a self-hosted or compatible endpoint.
        api_key:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
          description: Write-only. Omit to keep, null to clear.

    AiGuardSettings:
      type: object
      additionalProperties: false
      description: What the assistant is not allowed to do, and when it hands over.
      properties:
        blocked_topics:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 200
        escalation_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence below which a conversation is handed to a person.
        moderation_provider:
          type: string
          minLength: 1
          maxLength: 100
        api_key:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
          description: The moderation provider's key. Write-only.

    AiProfileSettings:
      type: object
      additionalProperties: false
      description: Who the assistant is.
      properties:
        persona:
          type: string
          maxLength: 4000
        tone:
          type: string
          enum: [neutral, friendly, formal, concise]
        languages:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
          description: BCP 47 language tags, e.g. uk, en, pt-BR.

    ComplianceSettings:
      type: object
      additionalProperties: false
      description: Retention and consent wording.
      properties:
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: How long conversation history is kept.
        consent_text:
          type: string
          maxLength: 4000
        # R8-B (issue #44, ADR-0084).
        consent_enforcement:
          type: string
          enum: [enforce, observe]
          description: >
            How the send policy applies contact consent. observe (the default,
            also when unset): a send to a contact without consent on that channel
            goes out, and the missing consent is journaled and reported as a
            warning (policy.consent_missing). enforce: such a send is refused
            with policy.consent_missing — the cabinet's own switch, once it
            collects consent.

    NotificationsSettings:
      type: object
      additionalProperties: false
      description: Where operational notices go — mail, a webhook, a Telegram chat.
      properties:
        email_to:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 320
            pattern: '^[^@\s]+@[^@\s]+$'
        from_email:
          type: string
          maxLength: 320
          pattern: '^[^@\s]+@[^@\s]+$'
        smtp_host:
          type: string
          minLength: 1
          maxLength: 253
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
        smtp_username:
          type: string
          maxLength: 320
        smtp_password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        webhook_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
        webhook_secret:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        telegram_chat_id:
          type: string
          minLength: 1
          maxLength: 64
        telegram_bot_token:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096

    ExportsSettings:
      type: object
      additionalProperties: false
      description: The destination and format of data exports.
      properties:
        destination:
          type: string
          enum: [s3, sftp]
        format:
          type: string
          enum: [csv, jsonl]
        s3_endpoint:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
        s3_bucket:
          type: string
          minLength: 1
          maxLength: 255
        s3_region:
          type: string
          maxLength: 64
        s3_access_key_id:
          type: string
          maxLength: 256
        s3_secret_key:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        sftp_host:
          type: string
          minLength: 1
          maxLength: 253
        sftp_port:
          type: integer
          minimum: 1
          maximum: 65535
        sftp_username:
          type: string
          maxLength: 320
        sftp_password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        sftp_path:
          type: string
          maxLength: 1024

    CallsSettings:
      type: object
      additionalProperties: false
      description: Telephony — the provider binding and recording.
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 100
        sip_uri:
          type: string
          maxLength: 2048
          pattern: '^sips?:'
        sip_username:
          type: string
          maxLength: 320
        sip_password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        provider_token:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        recording_enabled:
          type: boolean

    MessagingDefaultsSettings:
      type: object
      additionalProperties: false
      description: What a send inherits when it says nothing — signature, locale, quiet hours.
      properties:
        signature:
          type: string
          maxLength: 1000
        locale:
          type: string
          pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
        quiet_hours_start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM, local to `timezone`.
        quiet_hours_end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        timezone:
          type: string
          maxLength: 64
          description: >
            IANA time zone name, e.g. Europe/Kyiv. The send windows and quiet
            hours are counted in it; unset (or a name the server does not know)
            means UTC — never the server's own zone.
        # --- BEGIN R8-C send-policy limits (issue #40, ADR-0058 §9) -----------
        # Read by the send-rule checkers. Quiet hours above are the business
        # hours rule: a campaign send inside them is rescheduled to their end,
        # an interactive one is warned.
        daily_limit:
          type: integer
          minimum: 0
          maximum: 1000000
          description: >
            Messages per channel per calendar day (in `timezone`). 0 disables the
            daily window. Unset: the platform default for the channel kind
            (1000 for wa_web and tg_client, none for official APIs). Media counts
            like text. At the limit sends are deferred to the next day.
        hourly_limit:
          type: integer
          minimum: 0
          maximum: 100000
          description: >
            Messages per channel per clock hour (in `timezone`). 0 disables the
            hourly window. Unset: the platform default for the channel kind
            (200 for wa_web and tg_client, none for official APIs).
        contact_limit:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            Messages to ONE contact within `contact_limit_hours` (a sliding
            window). 0 or unset: no per-contact limit. At the limit a campaign
            send is deferred; an interactive one is sent with a warning.
        contact_limit_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: The per-contact period in hours. Unset means 24.
        duplicate_window_hours:
          type: integer
          minimum: 0
          maximum: 168
          description: >
            How long a sent text counts as recent for the duplicate rule. 0
            disables it; unset means 24. Texts are compared after normalization
            (case, whitespace, punctuation, URLs and numbers masked).
        # --- END R8-C send-policy limits ----------------------------------------

    DeskSettings:
      type: object
      additionalProperties: false
      description: The operator desk binding (ADR-0053).
      properties:
        provider:
          type: string
          enum: [chatwoot]
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
        account_id:
          type: integer
          minimum: 1
        api_token:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
    # END R6-A schemas

    # =========================================================================
    # BEGIN R7-A organizations (schemas) — issue #34, ADR-0051 / ADR-0079
    # =========================================================================
    QuotaLimits:
      type: object
      description: >
        Metric -> limit (ADR-0051 §2): `cabinets`, `seats`, `messages.month`,
        `ai.tokens.month`, `retention.days`, `channels.<kind>`. A limit is a
        non-negative integer, or -1 for unlimited. Validated by the platform's
        quota rules: an unknown metric or a value below -1 is refused.
      additionalProperties:
        type: integer
        format: int64
        minimum: -1
      example:
        channels.wa_web: 5
        seats: -1

    Plan:
      type: object
      description: A tariff — a full declaration of limits (every metric stated).
      properties:
        id:
          type: string
        name:
          type: string
        limits:
          $ref: '#/components/schemas/QuotaLimits'
      required:
        - id
        - name
        - limits

    PlanList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
      required:
        - items

    Organization:
      type: object
      description: >
        A customer (ADR-0051 §1): requisites, plan, manual limit overrides,
        trial and status. `status` and `suspendedReason` are read-only here
        (suspension is issue #36).
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          readOnly: true
          description: Lifecycle status, e.g. `active` or `suspended`.
        suspendedReason:
          type: string
          readOnly: true
          description: Why the organization is suspended; empty when it is not.
        planId:
          type: string
        planName:
          type: string
        limitsOverride:
          $ref: '#/components/schemas/QuotaLimits'
        limitsOverrideError:
          type: string
          readOnly: true
          description: >
            Present only when the STORED override is not a valid limits document
            (written around this API). `limitsOverride` then reads as empty, every
            quota reservation of the organization fails closed, and
            updateOrganization with a new `limitsOverride` repairs it.
        legalName:
          type: string
        billingEmail:
          type: string
        taxId:
          type: string
        trialUntil:
          type: string
          format: date-time
          description: End of the trial; absent when the organization has none.
        cabinetCount:
          type: integer
          format: int64
          description: How many cabinets the organization owns.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - suspendedReason
        - planId
        - planName
        - limitsOverride
        - legalName
        - billingEmail
        - taxId
        - cabinetCount
        - createdAt
        - updatedAt

    OrganizationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The organization's display name; the slug derives from it.
        planId:
          type: string
          description: The plan (default `base`).
        limitsOverride:
          $ref: '#/components/schemas/QuotaLimits'
        legalName:
          type: string
          maxLength: 300
        billingEmail:
          type: string
          maxLength: 254
        taxId:
          type: string
          maxLength: 64
        trialUntil:
          type: string
          format: date-time
      required:
        - name

    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      description: Merge patch; omitted fields are unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        planId:
          type: string
        limitsOverride:
          $ref: '#/components/schemas/QuotaLimits'
        legalName:
          type: string
          maxLength: 300
        billingEmail:
          type: string
          maxLength: 254
        taxId:
          type: string
          maxLength: 64
        trialUntil:
          type: string
          format: date-time
        clearTrialUntil:
          type: boolean
          description: Remove the trial end. Not together with trialUntil.

    UpdateOrganizationRequisitesRequest:
      type: object
      additionalProperties: false
      description: Omitted fields are unchanged; an empty string clears a field.
      properties:
        legalName:
          type: string
          maxLength: 300
        billingEmail:
          type: string
          maxLength: 254
        taxId:
          type: string
          maxLength: 64

    UsageMetric:
      type: object
      description: >
        One metric of an organization: what it uses and what it may. `limit` is
        absent exactly when `unlimited` is true. `used` is absent for a
        `setting` (retention.days is a term, not a consumption).
      properties:
        metric:
          type: string
          example: channels.wa_web
        kind:
          type: string
          enum: [resource, monthly, setting]
          description: >
            `resource` is counted from the resources now; `monthly` is the
            current calendar month (UTC); `setting` has no consumption.
        used:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        unlimited:
          type: boolean
        overridden:
          type: boolean
          description: The limit comes from the organization's manual override, not the plan.
      required:
        - metric
        - kind
        - unlimited
        - overridden

    OrganizationUsage:
      type: object
      properties:
        organizationId:
          type: string
        planId:
          type: string
        period:
          type: string
          format: date
          description: The first day (UTC) of the month the monthly metrics count.
        asOf:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/UsageMetric'
      required:
        - organizationId
        - planId
        - period
        - asOf
        - metrics

    OrganizationAuditEntry:
      type: object
      description: One entry of an organization's append-only trail.
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actorType:
          type: string
          description: The author's kind, `api_key` or `account`.
        actorId:
          type: string
          description: The key id or the account id of the author.
        action:
          type: string
        detail:
          type: object
          additionalProperties: true
          description: >
            For a change, `changes.<field>.before` and `.after` for every field
            that changed. For a creation, `after` (the initial terms).
      required:
        - id
        - occurredAt
        - actorType
        - actorId
        - action
        - detail

    OrganizationAuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationAuditEntry'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo
    # END R7-A organizations (schemas)

    # =========================================================================
    # BEGIN R8-F schemas: typed contact field schema (issue #48, ADR-0061).
    # Mirrors internal/contacts/fields.go; the paths are the "BEGIN R8-F
    # contact fields (paths)" block.
    # =========================================================================
    ContactFieldType:
      type: string
      description: >
        The value type of a contact field — a CLOSED set (ADR-0061 §2). Values
        travel in one JSON shape per type: `text`/`enum`/`phone`/`email`/`url`
        a string, `date` a `YYYY-MM-DD` string, `number` a JSON number (a
        numeric-looking string is refused), `bool` a boolean, `multi_enum` an
        array of option values.
      enum:
        - text
        - number
        - date
        - bool
        - enum
        - multi_enum
        - phone
        - email
        - url
      # Explicit Go names: a bare `Text` would collide with MsgType's and make
      # the generator rename every MsgType constant under its callers.
      x-enum-varnames:
        - ContactFieldTypeText
        - ContactFieldTypeNumber
        - ContactFieldTypeDate
        - ContactFieldTypeBool
        - ContactFieldTypeEnum
        - ContactFieldTypeMultiEnum
        - ContactFieldTypePhone
        - ContactFieldTypeEmail
        - ContactFieldTypeUrl

    ContactFieldOwner:
      type: string
      description: >
        Who may write the field's value at all (ADR-0061 §3): a person may
        correct any field; the host (API key) writes `host` fields only; the AI
        writes `ai` fields and those flagged `aiExtract`.
      enum:
        - platform
        - host
        - ai

    ContactFieldValueSource:
      type: string
      description: >
        What kind of writer put a value there (ADR-0061 §4). Settles conflicts
        on the ladder `human > host > platform > ai`: a lower writer never
        overwrites a higher one's value.
      enum:
        - human
        - host
        - platform
        - ai

    ContactFieldLabel:
      type: object
      description: Localized label, locale -> text (`uk`, `en`, `ru`; ADR-0016).
      additionalProperties:
        type: string

    ContactFieldOption:
      type: object
      description: One choice of an `enum` / `multi_enum` field.
      properties:
        value:
          type: string
          minLength: 1
          description: The stable machine value — what is stored on the contact.
        label:
          $ref: '#/components/schemas/ContactFieldLabel'
      required:
        - value

    ContactFieldDef:
      type: object
      description: One typed field of the cabinet's contact schema (ADR-0061 §1).
      properties:
        key:
          type: string
          description: Machine key; stable for the field's life (a rename is a label change).
        label:
          $ref: '#/components/schemas/ContactFieldLabel'
        type:
          $ref: '#/components/schemas/ContactFieldType'
        options:
          type: array
          description: Choices of an `enum` / `multi_enum` field; empty for every other type.
          items:
            $ref: '#/components/schemas/ContactFieldOption'
        owner:
          $ref: '#/components/schemas/ContactFieldOwner'
        aiExtract:
          type: boolean
          description: The AI may fill this field from conversations.
        aiHint:
          type: string
          description: What the AI should look for, in the cabinet's own words.
        syncToDesk:
          type: boolean
          description: Project this field into the cabinet's desk (ADR-0053) — e.g. a Chatwoot contact attribute.
        position:
          type: integer
          minimum: 0
          description: Display order in the contact card and the schema editor.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - key
        - label
        - type
        - options
        - owner
        - aiExtract
        - aiHint
        - syncToDesk
        - position

    PutContactFieldRequest:
      type: object
      description: >
        The whole definition of one field (PUT replaces it). The key is the
        path; the `type` must equal the stored one when the field exists.
      properties:
        label:
          $ref: '#/components/schemas/ContactFieldLabel'
        type:
          $ref: '#/components/schemas/ContactFieldType'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldOption'
        owner:
          # Defaults to `host` when omitted (the store's default).
          $ref: '#/components/schemas/ContactFieldOwner'
        aiExtract:
          type: boolean
        aiHint:
          type: string
          maxLength: 1000
        syncToDesk:
          type: boolean
        position:
          type: integer
          minimum: 0
      required:
        - type

    ContactFieldList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldDef'
      required:
        - items

    ContactFieldValueOrigin:
      type: object
      description: >
        Read-only provenance of ONE stored value: what kind of writer set it,
        when, and which actor (an account id, an API key id, an AI job id).
      properties:
        source:
          $ref: '#/components/schemas/ContactFieldValueSource'
        at:
          type: string
          format: date-time
        by:
          type: string
      required:
        - source
        - at

    ContactFieldValues:
      type: object
      description: >
        A contact's typed values (key -> value, one JSON shape per type) and,
        per key, the value's provenance. Only fields the cabinet currently
        defines appear.
      properties:
        fields:
          type: object
          additionalProperties: true
        provenance:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContactFieldValueOrigin'
      required:
        - fields
        - provenance

    SetContactFieldsRequest:
      type: object
      description: >
        key -> new value; `null` clears the field. Provenance is not part of the
        body: it is the caller's (a session writes as `human`, an API key as
        `host`).
      properties:
        fields:
          type: object
          additionalProperties: true
      required:
        - fields

    ContactFieldKept:
      type: object
      description: >
        A field the write did NOT change and why — not an error. `lower_authority`:
        the stored value came from a more authoritative writer (ADR-0061 §4).
      properties:
        field:
          type: string
        reason:
          type: string
        held:
          $ref: '#/components/schemas/ContactFieldValueSource'
        offered:
          $ref: '#/components/schemas/ContactFieldValueSource'
      required:
        - field
        - reason
        - held
        - offered

    SetContactFieldsResult:
      type: object
      description: The contact's values after the write, and what the write did.
      properties:
        fields:
          type: object
          additionalProperties: true
        provenance:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContactFieldValueOrigin'
        applied:
          type: array
          items:
            type: string
        cleared:
          type: array
          items:
            type: string
        kept:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldKept'
      required:
        - fields
        - provenance
        - applied
        - cleared
        - kept
    # END R8-F schemas
