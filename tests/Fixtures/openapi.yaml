  /campaigns/{campaignId}/launch:
    parameters:
      - name: campaignId
        in: path
        required: true
        description: Campaign id (uuid).
        schema:
          type: string
          format: uuid
    post:
      operationId: launchCampaign
      x-permission: 'campaigns:manage'
      summary: Resolve the audience and schedule (or start) the campaign.
      description: >
        Checks the draft (422 campaign.invalid, one `errors[]` entry per
        reason: no channels, a message that is not sendable, a template that
        is not an approved, fillable template of every channel (or a template
        on a channel that is not wa_cloud), an empty audience, a start in the
        past, a bad time zone or window), then — in one transaction — resolves
        the audience into the
        recipient list (the snapshot: explicit contacts of the cabinet within
        the author's scope, plus filter matches reachable on the campaign's
        channels, each person once) and moves the campaign to `scheduled`
        (a future `startAt`) or `running`. The dispatcher then sends every
        recipient exactly once, through the send policy in its CAMPAIGN mode:
        a limit reschedules a recipient instead of failing it, and a
        recipient without consent on the channel is skipped even where the
        cabinet only observes consent (ADR-0063 §6). A draft without a dry
        run (dryRunCampaign) newer than its last change is refused with 409
        campaign.dry_run_required (R11-B, issue #68).
