      tags:
        - embed
      security:
        - embedToken: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBotConversationRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - embed.token_expired
        - embed.scope_violation
        - contact.not_found
        # issue #115: the requested channelId is not a channel of the cabinet.
        - channel.not_found
        - channel.not_connected
        - idempotency.key_reused
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '201':
          description: A pending bot session with a deep-link to opt in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /embed/conversations/{id}:
    get:
      operationId: getEmbedConversation
      x-permission: none
      x-permission-reason: >
        Authorized by the embed token (embedToken scheme) and its cap[], not by a cabinet principal: ADR-0009 Plane B, scoped to one contact and enforced in the handler.
      summary: Read the embed-scoped conversation feed.
      description: >
        Plane B (ADR-0009 §5): the scoped, append-only message feed (cap
