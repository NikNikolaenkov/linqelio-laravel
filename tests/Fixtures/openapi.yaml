        '404':
          $ref: '#/components/responses/NotFound'

  /embed/conversations/{id}/messages:
    post:
      operationId: sendEmbedMessage
      x-permission: none
      x-permission-reason: >
        Authorized by the embed token (embedToken scheme) and its cap[], not by a cabinet principal: ADR-0009 Plane B, scoped to one contact and enforced in the handler.
      summary: Send an outbound message from the widget.
      description: >
        Plane B (ADR-0009 §5): send a text message into the scoped conversation
        (cap message:send). Routed outbound through OUR API → policy → adapter
        (never directly to Chatwoot). `Idempotency-Key` is REQUIRED (unsafe
        command); dedup is by providerMsgId downstream.
      tags:
        - embed
      security:
        - embedToken: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedSendRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - embed.token_expired
        - embed.scope_violation
        # issue #115: the conversation is gone (or never was), or its channel
        # was deleted while the send was in flight.
        - conversation.not_found
        - channel.not_found
        - channel.not_connected
        - message.too_large
        - policy.rate_limited
        - idempotency.key_reused
        - provider.upstream_error
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
        # R8-B (#44, ADR-0084): the contact has no consent on the sending channel.
        - policy.consent_missing
        # R8-C (#40, #121): send-rule checkers (see sendContactMessage).
        - policy.daily_limit
        - policy.hourly_limit
        - policy.dialog_frozen
        - tenancy.quota_exceeded
        # R10-C (#69, ADR-0092): a wa_cloud conversation outside the 24-hour window.
        - policy.service_window_closed
      responses:
        # R8-D (#109, ADR-0082): SentMessage = the Envelope + policyWarnings.
        '202':
          description: >
            The message was accepted and queued for delivery. `policyWarnings`
            lists the send-policy warnings it went out with, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ===========================================================================
  # auth.yaml — human identity and sessions (ADR-0049)
  # ===========================================================================
  # Two kinds of operation live here, and x-permission says which:
  #   - `none`: BEFORE a session exists (login, logout, invite acceptance,
  #     password reset). No cabinet principal can authorize them — there is no
  #     caller yet — and they accept no credential (security: []).
  #   - `self`: the caller's OWN account (/auth/me, sessions, second factor).
  #     The middleware requires a valid session cookie and nothing else: these act
  #     on the person, not on a cabinet, so no role is consulted — a person with
  #     no membership at all must still be able to see who they are, log out
  #     their other devices and turn on 2FA. An API key is refused: it has no
  #     person behind it to be "self".
  # Every unsafe request that does not carry an Authorization header is subject
  # to the Origin check described on the sessionCookie scheme.
  /auth/login:
    post:
      operationId: login
      x-permission: none
      x-permission-reason: >
        Pre-authentication: this operation is how a person obtains a session in the first place, so no cabinet principal exists to authorize it. The password (and second factor) in the body is the credential, verified by internal/authn with lockout.
      summary: Log in with email and password (and the second factor when enabled).
      description: >
        Verifies the password and, on success, opens a server-side session and
        sets it as an httpOnly, Secure, SameSite=Strict cookie
        (`__Host-linqelio_session`, Path=/, expiring with the session — 12 h).
        The cookie value is never returned in the body and only its sha256 is
        stored (ADR-0049 §2).


        Second factor: when the account has TOTP enabled and the body carries no
        code, the answer is 202 with `secondFactorRequired` and NO session. The
        client re-posts the same body with `totpCode` (or, when the authenticator
        is lost, `recoveryCode`). There is deliberately no half-authenticated
        server state between the two posts: every code attempt re-proves the
        password, and a wrong code counts toward the lockout exactly like a wrong
        password.


        Lockout: 5 failed attempts lock the account for 15 minutes (423). An
        unknown email, a wrong password, an account without a password and a
        blocked account all answer the same 401 auth.invalid_credentials.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_credentials
        - auth.second_factor_invalid
        - auth.account_locked
        - auth.origin_rejected
      responses:
        '200':
          description: Logged in. The session cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie (`__Host-linqelio_session=...; Path=/; Secure; HttpOnly; SameSite=Strict`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '202':
          description: Password accepted; the second factor is required. No session was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondFactorChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'

  /auth/logout:
    post:
      operationId: logout
      x-permission: none
      x-permission-reason: >
        Logout must succeed whatever state the cookie is in (valid, expired, revoked or garbage) and always clears it; requiring a valid session would make logout an oracle for cookie validity and strand a dead cookie in the browser. It revokes only the session the cookie itself names.
      summary: Log out — revoke the current session and clear the cookie.
      description: >
        Revokes the session named by the request's cookie (if any) and answers
        with an expired cookie. Always 204: an unknown or already-dead cookie is
        not an error.
      tags:
        - auth
      security: []
      x-error-codes:
        - auth.origin_rejected
      responses:
        '204':
          description: Logged out; the cookie is cleared.
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      operationId: getMe
      x-permission: self
      x-permission-reason: >
        Describes the caller's own account, which every person with a live session may read regardless of role — including a person with no membership at all, who must be able to see that they have none. A cabinet permission would lock exactly that person out.
      summary: Who am I — account, memberships and effective rights.
      description: >
        Returns the account behind the session, every membership it holds, and —
        when a cabinet is selected (the `X-Linqelio-Cabinet` header, or the only
        cabinet the person belongs to) — the effective roles, permissions and
        channel scope in that cabinet, computed exactly as the authorization
        middleware computes them. A selected cabinet the person is not a member
        of is refused (403 tenancy.cross_cabinet_denied) rather than silently
        ignored — unless the person is an active platform operator (ADR-0075),
        who may select any existing cabinet and is reported there as
        platform_admin (the access is written to the security log; without the
        second factor in the session it is refused with 403
        auth.second_factor_required). `platformOperator` says whether the
        account holds an active operator grant; `cabinets` lists the cabinets
        the caller reaches through memberships (cabinet- or org-level), which
        is what a cabinet switcher shows.
      tags:
        - auth
      security:
        - sessionCookie: []
      x-error-codes:
        - auth.session_invalid
        - tenancy.cross_cabinet_denied
        - auth.second_factor_required
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/sessions:
    get:
      operationId: listMySessions
      x-permission: self
      x-permission-reason: >
        Lists only the caller's own sessions (the account is taken from the session, never from the request). Seeing where you are logged in is a right of the person, not of a cabinet role.
      summary: List my live sessions.
      description: >
        Every live (not revoked, not expired) session of the caller's account,
        newest first, with the current one marked. Session ids are sha256
        digests of the cookie — enough to revoke a session, useless for
        replaying one.
      tags:
        - auth
      security:
        - sessionCookie: []
      x-error-codes:
        - auth.session_invalid
      responses:
        '200':
          description: The caller's sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeMySession
      x-permission: self
      x-permission-reason: >
        Revokes one of the caller's own sessions ("log out that other device"). Ownership is checked against the account behind the session; another person's session id answers 404, the same as an unknown one.
      summary: Revoke one of my sessions.
      description: >
        Revokes the named session of the caller's own account. Takes effect on
        this replica at once and on every replica within the 30 s session cache
        (ADR-0049 §2). Revoking the current session is allowed and equals logout
        (the cookie is cleared).
      tags:
        - auth
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      x-error-codes:
        - auth.session_invalid
        - auth.origin_rejected
        - validation.invalid_request
      responses:
        '204':
          description: The session is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/invites/accept:
    post:
      operationId: acceptInvite
      x-permission: none
      x-permission-reason: >
        Pre-authentication: the invited person has no password and no session yet. The single-use invite token from the email is the credential, verified by internal/authn.
      summary: Accept an invite and choose a password.
      description: >
        Redeems a single-use invite token (72 h) and sets the password the person
        chose — a password is never generated for anyone and never mailed
        (ADR-0049 §3). Does not log in: the person logs in next, which is also
        where a mandatory second factor is enrolled. A weak password is refused
        BEFORE the token is spent.


        An invite made through inviteMember also creates exactly the membership
        it offered — the role (at its level) and the channel assignments that
        are still channels of the cabinet — so the person can act in that
        cabinet as soon as they log in. A revoked invite's link is refused like
        any spent one. The link of a membership-only (`existing_account`)
        invite is refused here too (400 auth.token_invalid, the link stays
        unspent): it never sets a password — see acceptMembershipInvite.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPasswordRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.token_invalid
        - auth.origin_rejected
      responses:
        '204':
          description: The account is active with the chosen password.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # BEGIN R5-C: membership-only invites for EXISTING accounts (issue #118,
  # ADR-0076 amending ADR-0075 §5). Local block — keep edits inside it.
  #
  # inviteMember for an email whose account already has a password issues an
  # invite of kind `existing_account`: its link sets NOTHING on the account and
  # is accepted here, by a live session of exactly that account. Both
  # operations are `self` (session required, API key refused, no cabinet): the
  # person may not be a member of any cabinet yet, and the credential is the
  # session PLUS the link — neither alone is enough. The token travels in the
  # body, never in a URL.
  # ---------------------------------------------------------------------------
  /auth/invites/membership/preview:
    post:
      operationId: previewMembershipInvite
      x-permission: self
      x-permission-reason: >
        The invitee reads an invite addressed to their OWN account before accepting it. Only the session of the invited account may read it (another account gets 403 team.invite_wrong_account and learns nothing about the cabinet); no cabinet role can be consulted, because the person is not a member of the cabinet yet.
      summary: Show a membership-only invite to the person it is for.
      description: >
        Resolves the link token of an `existing_account` invite and describes
        it — which cabinet, which role, how many channels — so the console can
        ask "Join cabinet X as role Y?". Nothing is written and the link is not
        spent.


        Refused: a token that is unknown, spent, revoked, expired, or that
        belongs to a password-setting (`new_account`) invite — 400
        auth.token_invalid; a session of any account other than the invited
        one (matched by account, i.e. by case-insensitive email) — 403
        team.invite_wrong_account.
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInviteTokenRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.session_invalid
        - auth.token_invalid
        - auth.origin_rejected
        - team.invite_wrong_account
      responses:
        '200':
          description: The invite, as its invitee may see it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/invites/membership/accept:
    post:
      operationId: acceptMembershipInvite
      x-permission: self
      x-permission-reason: >
        Joining a cabinet one was invited into is an act of the invited PERSON on their own account: it requires that account's live session (an API key has no person) and the single-use link token together. No cabinet role can authorize it — the person is not a member of the cabinet until it succeeds.
      summary: Accept a membership-only invite with the invited account's session.
      description: >
        Adds exactly the membership the invite offered — the role at its level
        (org_owner and org_admin become members of the organization that owns
        the cabinet) and the channels that are still channels of the cabinet —
        to the account of the CURRENT SESSION, and spends the link. Nothing
        else about the account changes: no password, no status, no session.
        The answer names the cabinet, so the console can go straight there.


        Refused, with nothing written: a dead token (unknown, spent, revoked,
        expired, or a password-setting invite's) — 400 auth.token_invalid; a
        session of another account — 403 team.invite_wrong_account (the link
        stays valid for the right person, and the attempt is audited); an
        account that is already a member of the cabinet (a cabinet- or
        organization-level membership reaching it) — 409 team.already_member:
        a role change is updateMember's job.
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInviteTokenRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.session_invalid
        - auth.token_invalid
        - auth.origin_rejected
        - team.invite_wrong_account
        - team.already_member
      responses:
        '200':
          description: The membership was added; the invite is accepted and its link spent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  # END R5-C (membership-only invites)

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      x-permission: none
      x-permission-reason: >
        Pre-authentication: a person who forgot their password has no credential. The answer is identical whether or not the address has an account, so the operation grants nothing and discloses nothing.
      summary: Request a password-reset link.
      description: >
        Always answers 202 with no body, whether or not the address belongs to an
        account — and the answer does not wait for the lookup: the token is issued
        and the mail sent asynchronously, so neither the status nor the response
        time says whether the account exists. The link (1 h, single use) goes
        only to the account's own mailbox.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.origin_rejected
      responses:
        '202':
          description: If the address is registered, a reset link is on its way.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      x-permission: none
      x-permission-reason: >
        Pre-authentication: the single-use reset token from the email is the credential, verified by internal/authn.
      summary: Set a new password with a reset token.
      description: >
        Redeems a reset token and sets the new password. Every session of the
        account is revoked: a reset usually means somebody else may know the old
        password, and their session must not outlive it.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPasswordRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.token_invalid
        - auth.origin_rejected
      responses:
        '204':
          description: The password is changed and every session revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/second-factor/totp/enrollment:
    post:
      operationId: startTotpEnrollment
      x-permission: self
      x-permission-reason: >
        Enrols a second factor on the caller's own account. Any person may protect their own account, and org_owner / platform_admin must be able to do it before holding any cabinet right (ADR-0049 §4 makes 2FA mandatory for them).
      summary: Start TOTP enrolment — get a fresh seed to scan.
      description: >
        Generates a new TOTP seed, stores it in the secret store (never in the
        database, ADR-0049 §4) and returns it once, with an otpauth:// URI for the
        client to render as a QR code LOCALLY — never through a third-party QR
        service. Nothing changes on the account until enableTotp confirms a code
        read from the seed.
      tags:
        - auth
      security:
        - sessionCookie: []
      x-error-codes:
        - auth.session_invalid
        - auth.origin_rejected
        - auth.second_factor_conflict
      responses:
        '201':
          description: A fresh seed, pending confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/second-factor/totp/enable:
    post:
      operationId: enableTotp
      x-permission: self
      x-permission-reason: >
        Turns the second factor on for the caller's own account; the enrolment it confirms is bound to that account server-side.
      summary: Confirm enrolment with a code and turn TOTP on.
      description: >
        Checks the code against the seed of the named enrolment and turns the
        second factor on. Returns the recovery codes — the ONLY time they exist in
        plaintext: show them once. A wrong code is refused but does not count
        toward the lockout (a mis-scan, not a guess). Sessions opened from now on
        must pass the factor; the current one keeps its state.
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableTotpRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.session_invalid
        - auth.origin_rejected
        - auth.second_factor_invalid
        - auth.second_factor_conflict
      responses:
        '200':
          description: TOTP is on. The recovery codes, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/second-factor/totp/disable:
    post:
      operationId: disableTotp
      x-permission: self
      x-permission-reason: >
        Turns the second factor off for the caller's own account, and only with a CURRENT code: a session alone — possibly a stolen cookie — must not be enough to strip the factor (ADR-0049 §4).
      summary: Turn TOTP off (requires a current code).
      description: >
        Requires a current TOTP code; a recovery code is not accepted here (it is
        a way back in, not a way to remove the factor). A wrong code counts
        toward the lockout; once locked, even the right code is refused (423).
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorCode'
      x-error-codes:
        - validation.invalid_request
        - auth.session_invalid
        - auth.origin_rejected
        - auth.second_factor_invalid
        - auth.second_factor_conflict
        - auth.account_locked
      responses:
        '204':
          description: TOTP is off and the recovery codes are deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'

  /auth/second-factor/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      x-permission: self
      x-permission-reason: >
        Replaces the recovery codes of the caller's own account, and only with a current TOTP code, for the same reason disableTotp requires one.
      summary: Replace my recovery codes (requires a current code).
      description: >
        Every old code dies; the new set is returned once. A wrong code counts
        toward the lockout.
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorCode'
      x-error-codes:
        - validation.invalid_request
        - auth.session_invalid
        - auth.origin_rejected
        - auth.second_factor_invalid
        - auth.second_factor_conflict
        - auth.account_locked
      responses:
        '200':
          description: The new recovery codes, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'

  # ===========================================================================
  # team.yaml — people, roles and channels of a cabinet (issue #31, ADR-0075 §5)
  # ===========================================================================
  # BEGIN team management (R4-T). Kept as one block so parallel contract work
  # (the platform-operator operations) does not interleave with it.
  #
  # Every operation is cabinet-scoped (the key's cabinet, or X-Linqelio-Cabinet
  # for a session) and requires `team:manage` — held by org_owner, org_admin,
  # cabinet_admin, platform_admin and keys that carry it ("*" included). Beyond
  # the permission, two server-side rules apply to every change:
  #   - the ROLE CEILING: nobody grants, changes or removes a role above the
  #     most privileged one they hold (403 team.role_ceiling_exceeded). An API
  #     key's ceiling is cabinet_admin; a platform operator's is unlimited;
  #   - the ADR-0050 §6 INVARIANTS: never zero active org owners, never zero
  #     active cabinet admins, never a change to your own membership (409
  #     team.last_org_owner / team.last_cabinet_admin / team.self_demotion_denied).
  # Every mutation is written to the audit trail (team.* actions).
  /team/members:
    get:
      operationId: listMembers
      x-permission: 'team:manage'
      summary: List the people of the cabinet and its pending invites.
      description: >
        Every person with a membership reaching the cabinet — a cabinet-level
        row, a row in the organization that owns it, or both — with their
        role, assigned channels, default channel and status, plus the invites
        that can still be accepted.


        Visibility is decided by permission, not by channel scope: the list
        needs `team:manage`, which no channel-scoped role holds (an agent is the
        only channel-scoped role, and any role that grants team:manage lifts the
        channel scope). Agents, supervisors and viewers are refused with 403 —
        a team roster is administrative data, and filtering it down to "people
        who share a channel with me" would still disclose colleagues' emails.


        Members are cursor-paginated (`since` / `limit`, ordered by when the
        person joined). `invites` carries EVERY pending invite and is present on
        the first page only (no `since`): pending invites are few and short-lived.
      tags:
        - team
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: A page of members (and, on the first page, the pending invites).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /team/members/{accountId}:
    parameters:
      - $ref: '#/components/parameters/TeamAccountId'
    patch:
      operationId: updateMember
      x-permission: 'team:manage'
      summary: Change a member's role and/or channel assignments.
      description: >
        `role`, when given, becomes the person's ONLY role in this cabinet: the
        membership row at that role's level is written and a row at the other
        level is removed (making an org_admin a cabinet_admin removes their
        organization-level role, which reaches every cabinet of the
        organization). `channelIds`, when given, replaces the assignments in
        this cabinet; `defaultChannelId` must be one of the assignments after
        the change — omitted, the current default is kept while it stays
        assigned.


        Optimistic concurrency: `version` is the member's `version` as last
        read; a change made in between is 409 team.version_conflict, and the
        caller refetches and retries.


        Refused: a role above the caller's own, or a member who already holds
        one (403 team.role_ceiling_exceeded); a change that breaks an ADR-0050
        §6 invariant, including any change to your own role (409); a channel
        that is not a channel of this cabinet (404 channel.not_found).
      tags:
        - team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - team.member_not_found
        - team.role_ceiling_exceeded
        - team.version_conflict
        - team.last_org_owner
        - team.last_cabinet_admin
        - team.self_demotion_denied
        - channel.not_found
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The member after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMember
      x-permission: 'team:manage'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        Reduces access: an owner must be able to cut off a person who left, suspended or not — keeping a former employee inside the data is the one outcome worse than a read-only cabinet (ADR-0080 §3).
      summary: Remove a person from the cabinet.
      description: >
        Deletes the person's cabinet-level membership AND their membership in
        the organization that owns the cabinet (an organization-level role
        reaches every cabinet of the organization, so it cannot be removed from
        one cabinet alone), their channel assignments here, and their pending
        invites here.


        The person's sessions lose this cabinet on their next request: a
        session's authority in a cabinet is re-read from the memberships on
        every request, so nothing else needs revoking. Their account, their
        other cabinets and their sessions there are untouched.


        Refused under the same ceiling and invariants as updateMember —
        including removing yourself.
      tags:
        - team
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - team.member_not_found
        - team.role_ceiling_exceeded
        - team.last_org_owner
        - team.last_cabinet_admin
        - team.self_demotion_denied
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The person is no longer a member of the cabinet.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /team/invites:
    post:
      operationId: inviteMember
      x-permission: 'team:manage'
      summary: Invite a person into the cabinet and get the invite link.
      description: >
        Creates (or re-uses) an account in status `invited` for the email and an
        invite into THIS cabinet with the given role and channels. The response
        carries the invite link — `inviteUrl` — exactly ONCE (ADR-0075 §5: there
        is no mail yet; the console shows the link with a Copy button). Only the
        sha256 of the link's token is stored; the link cannot be shown again, so
        a lost link is replaced by inviting the same email again, which revokes
        the previous invite into this cabinet.


        Accepting the link (acceptInvite) sets the person's password and creates
        exactly the membership offered here: the role at its level (org_owner
        and org_admin become members of the organization that owns this
        cabinet) and the channels that are still channels of the cabinet.


        An email whose account ALREADY HAS A PASSWORD (ADR-0076) gets an invite
        of kind `existing_account` instead: its link sets nothing on the
        account — it is accepted with acceptMembershipInvite by a live session
        of exactly that account, and adds only the membership. `invite.kind`
        says which of the two was issued; the link of an `existing_account`
        invite carries `kind=existing_account` in its fragment so the console
        knows to ask the person to log in rather than to choose a password.


        Refused: a role above the caller's own (403 team.role_ceiling_exceeded —
        a cabinet_admin cannot invite an org_owner; a platform operator may
        invite any role); a channel that is not a channel of this cabinet (404
        channel.not_found); an account that is already a member of this cabinet
        or of its organization (409 team.already_member — use updateMember); a
        blocked account, or a password-less account another cabinet has invited
        or made a member (409 team.account_exists — a password-setting link is
        never minted for somebody another cabinet has a claim on; once that
        person has set their password, inviting them again yields an
        `existing_account` invite).


        Accepting a link whose account has meanwhile got a password some other
        way is refused like a spent link, without touching that password.
      tags:
        - team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - team.role_ceiling_exceeded
        - team.account_exists
        # R5-C (ADR-0076): the account is already a member here.
        - team.already_member
        - channel.not_found
        # R6-C (#33, ADR-0051 §3): the person would take a seat the
        # organization's plan does not have (403; `quota` in the problem body).
        # Somebody who already holds a seat of the organization takes none.
        - tenancy.quota_exceeded
        # The link's base (CONSOLE_PUBLIC_URL) is not configured: no link can be
        # built, so no invite is created.
        - provider.unavailable
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '201':
          description: >
            The invite was created. `inviteUrl` is present in this response and
            nowhere else, ever.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteMemberResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /team/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/TeamInviteId'
    delete:
      operationId: revokeInvite
      x-permission: 'team:manage'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        Reduces access: withdrawing a pending invite lets nobody new in; blocking it would keep a link to the data alive for the whole suspension (ADR-0080 §3).
      summary: Revoke a pending invite.
      description: >
        The invite can no longer be accepted and its link is spent. Unknown,
        already accepted, already revoked and expired invites are one answer:
        404 team.invite_not_found. Revoking an invite for a role above your own
        is 403 team.role_ceiling_exceeded.
      tags:
        - team
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - team.invite_not_found
        - team.role_ceiling_exceeded
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The invite is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # END team management (R4-T)

  # ===========================================================================
  # settings.yaml — cabinet settings, one SECTION at a time (issue #89, ADR-0057)
  # ===========================================================================
  # BEGIN R6-A cabinet settings (paths). Kept as one block so parallel contract
  # work does not interleave with it; the schemas live in the matching
  # "BEGIN R6-A schemas" block at the end of components.schemas.
  #
  # Both operations need `settings:manage` (held by org_owner, org_admin,
  # cabinet_admin, platform_admin and keys carrying it, "*" included). READING
  # is gated as tightly as writing on purpose: a section carries integration
  # endpoints and account names (SMTP host and user, bucket, SIP account, desk
  # URL) — the map of where a cabinet's credentials are used — and no role
  # below cabinet_admin has a job that needs it. Widening read later is one
  # additive permission; narrowing it once clients rely on it is not.
  /settings/{section}:
    parameters:
      - name: section
        in: path
        required: true
        description: The settings section (closed vocabulary, ADR-0057 §2).
        schema:
          $ref: '#/components/schemas/SettingsSection'
    get:
      operationId: getSettingsSection
      x-permission: 'settings:manage'
      summary: Read one section of the cabinet's settings.
      description: >
        Returns the section's non-secret values, a presence flag per secret key
        (`secrets`: set / not set — never the value and never its secret-store
        reference, ADR-0057 §4) and the section's `version`, also sent as the
        `ETag` header (`"<version>"`).


        A section that has never been written is not an error: it reads as an
        empty `value` at version 0 — the version the first write then sends in
        `If-Match`. A section name outside the vocabulary is a malformed request
        (400): every listed section exists for every cabinet.
      tags:
        - settings
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The section, masked.
          headers:
            ETag:
              description: The section version as a strong entity tag, e.g. `"3"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CabinetSettingsSection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: putSettingsSection
      x-permission: 'settings:manage'
      summary: Replace one section of the cabinet's settings.
      description: >
        Replaces the section's value, validated against the section's schema
        (see `value` in PutSettingsSectionRequest). The write is guarded by
        `If-Match: "<version>"` — the ETag / `version` of the section as last
        read (`"0"` for a section never written). A stale version writes NOTHING
        and answers 412 settings.version_conflict: re-read the section and
        re-apply the edit.


        Secret keys are WRITE-ONLY (ADR-0057 §4, the model of ADR-0046): a
        string value is placed in the secret store FIRST and only its reference
        is kept; the response carries `secrets.<key>: true`, never the value.
        OMITTING a secret key keeps what is stored (the client never received
        it, so it cannot resend it); an explicit `null` clears it. A
        `secret://…` reference is never accepted as a value — for any key.


        Every successful write is audited (`cabinet.settings`, with a diff in
        which secrets appear only as "set"/"unset") and publishes the
        `settings.updated` event carrying the cabinet, the section and the new
        version — no values.
      tags:
        - settings
      parameters:
        - name: If-Match
          in: header
          required: true
          description: >
            The section version the edit is based on, as the entity tag the read
            returned (`"<version>"`; `"0"` for a section never written).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSettingsSectionRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - settings.version_conflict
        - provider.unavailable
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The section after the write, masked.
          headers:
            ETag:
              description: The new section version as a strong entity tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CabinetSettingsSection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          description: >
            The section changed since it was read (settings.version_conflict).
            Nothing was written; re-read and re-apply.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  # END R6-A cabinet settings (paths)

  # ===========================================================================
  # BEGIN R7-A organizations (paths) — issue #34, ADR-0051 / ADR-0079
  # ===========================================================================
  # The organization is the customer (ADR-0051 §1): requisites, plan, manual
  # limit overrides, trial and — read-only here — status. Two surfaces:
  #
  #   /platform/organizations, /platform/plans   platform:admin. Any
  #       organization, by id. Every change of plan, limitsOverride, trial or
  #       requisites is written to the organization's own append-only trail
  #       (organization_audit) in the same transaction, with the author and a
  #       before/after diff — readable via listOrganizationAudit.
  #   /organization                               the CALLER'S organization:
  #       the one owning the cabinet the request acts in (the key's cabinet, or
  #       the session's X-Linqelio-Cabinet, which is membership-checked). There
  #       is no organization id to name, so there is none to forge.
  #
  # Suspension (status, suspendedReason) is exposed READ-ONLY; changing it is
  # issue #36.
  /platform/organizations:
    get:
      operationId: listOrganizations
      x-permission: 'platform:admin'
      summary: List organizations (platform admin).
      description: >
        Newest first, cursor-paginated. Each item carries its plan, status and
        cabinet count. `status` filters by exact status (`active`,
        `suspended`, ...).
      tags:
        - platform
      parameters:
        - name: status
          in: query
          required: false
