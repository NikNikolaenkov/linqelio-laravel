              - open
              - acknowledged
              - resolved
              - active
            # Named, or the generator renames BotSessionState's `open`.
            x-enum-varnames:
              - ListAlertsOpen
              - ListAlertsAcknowledged
              - ListAlertsResolved
              - ListAlertsActive
        - name: channelId
          in: query
          required: false
          description: Only this channel's alerts.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: The opaque `nextCursor` of the previous page.
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          description: Page size; default 50, at most 200.
