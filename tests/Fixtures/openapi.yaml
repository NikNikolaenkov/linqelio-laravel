  # ===========================================================================
  /channels/{id}/ignored-groups:
    get:
      operationId: listChannelIgnoredGroups
      x-permission: 'channels:manage'
      summary: The groups this number is in while its group chats are off.
      description: >
        While a channel's group chats are off (settings `groups.enabled`,
        ADR-0062 §4) its group messages are not taken in — no text, no author,
        no participant is stored. Only each group's own metadata is kept, so an
        administrator can see what switching groups on would bring in: the
        group's address and subject, when it was last active and how many
        messages it saw in the last 24 hours (hourly granularity). Groups with
        no activity for 30 days are forgotten; switching groups on clears the
        list. For a channel whose groups are on the list is empty and
        `groupsEnabled` is true. A channel outside the caller's scope is
        channel.not_found.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
