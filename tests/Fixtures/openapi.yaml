        message, optionally the audience and the schedule. Nothing is sent and
        nothing is resolved until launchCampaign. Every channel must be one the
        caller works (a channel-scoped caller names only their own channels);
        a channel that is not the cabinet's is 404 channel.not_found. The
        caller's channel scope is frozen on the campaign: its audience never
        reaches a contact the author could not see (ADR-0063 §3).
