  /channel-health:
    get:
      operationId: listChannelHealth
      x-permission: 'channels:read'
      summary: The current health of every channel the caller may see.
      description: >
        One entry per channel of the cabinet inside the caller's channel scope
        (an agent: the channels assigned to them): the latest health score
        (0–100), its rating and the explanation — which components cost points
        and why (ADR-0065). A channel the aggregation has not scored yet is
        listed with `computed: false`. Health is computed in the background
        every minute from message statuses, policy decisions, connection events
        and the access pool; reading it never computes anything.
      tags:
        - channels
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The health of the caller's channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelHealthList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /channel-health/{channelId}:
    parameters:
      - name: channelId
        in: path
