        sendAt:
          type: string
          format: date-time
        nextAttemptAt:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/MsgType'
        content:
          type: object
          additionalProperties: true
        replyTo:
          type: string
        attempts:
          type: integer
        code:
          type: string
          description: Why it was delayed or failed (a catalog code).
        detail:
          type: string
        messageId:
          type: string
          description: The message it became (status sent).
        createdBy:
          $ref: '#/components/schemas/JobActor'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
