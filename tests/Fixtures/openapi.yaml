        - tenancy.cabinet_not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: The cabinet's keys (hashes/secrets are never returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: issueCabinetKey
      x-permission: 'platform:admin'
      summary: Issue a new API key for a cabinet (platform admin).
      description: >
        Mints a client bearer token for the cabinet. The secret is returned in
        this response ONCE and stored only as an argon2id hash (ADR-0005) — it
        cannot be retrieved again; issue a new key instead.
      tags:
        - tenancy
      parameters:
        - $ref: '#/components/parameters/CabinetPathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueApiKeyRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
      responses:
        '201':
          description: The new key; `bearerToken` is shown only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cabinets/{id}/keys/{kid}/rotate:
    post:
      operationId: rotateCabinetKey
      x-permission: 'platform:admin'
      summary: Rotate a cabinet's API key with an overlap window (platform admin).
      description: >
        Mints a replacement and puts the outgoing key into a grace window instead
        of cutting it off. Both work until `graceUntil`, so the holder swaps at
        its own pace and the old key lapses on its own.

        The keyring has always had the states this needs — active, next, retiring
        with a grace window, all honoured by the verifier — and no way to reach
        them through the API. The only available "rotation" was issue-then-revoke,
        which breaks every holder in the instant between the two calls.

        The replacement's secret is shown ONCE, here. A revoked key cannot be
        rotated: it is already off, and reviving it into a grace window would hand
        back access somebody deliberately withdrew.
      tags:
        - tenancy
      parameters:
        - $ref: '#/components/parameters/CabinetPathId'
        - $ref: '#/components/parameters/KeyKid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateApiKeyRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
        - keyring.rotation_overlap_required
      responses:
        '201':
          description: The replacement key; `bearerToken` is shown only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cabinets/{id}/keys/{kid}:
    delete:
      operationId: revokeCabinetKey
      x-permission: 'platform:admin'
      summary: Revoke a cabinet's API key (platform admin).
      tags:
        - tenancy
      parameters:
        - $ref: '#/components/parameters/CabinetPathId'
        - $ref: '#/components/parameters/KeyKid'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The key was revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # webhooks + access pool — admin management via the contract (ADR-0002, M6 S4)
  # ===========================================================================
  /webhooks:
    get:
      operationId: listWebhooks
      x-permission: 'settings:manage'
      summary: List outbound webhook subscriptions in the cabinet.
      tags:
        - webhooks
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: The webhook subscriptions configured in the cabinet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: registerWebhook
      x-permission: 'settings:manage'
      summary: Register an outbound webhook subscription.
      description: >
        Subscribe an HTTPS endpoint to cabinet events (ADR-0031, ADR-0046).


        The subscription's HMAC signing key arrives one of three ways, and
        exactly one may be used: `secret` is the key itself, handed to the secret
        store so only its reference is persisted; `secretRef` points at a key
        already in that store, for a caller who manages the vault directly; and
        when neither is given the platform mints one and returns it in this
        response — the only place any signing key is ever returned.


        A subscription registered here therefore always has a key. Registering
        without one was the previous behaviour by omission, and it produced
        deliveries carrying no signature at all — which any receiver that
        verifies (the only kind worth having) rejects, one dead-letter at a time.
      tags:
        - webhooks
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # The signing key could not be generated or could not be written to the
        # secret store. Nothing is registered in that case: a subscription
        # holding a reference to a key that was never written would look
        # configured and deliver unsigned for the rest of its life.
        - provider.unavailable
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWebhookRequest'
      responses:
        '201':
          description: >
            The webhook subscription was registered. `secret` is present only
            when the platform minted the key, and this response is the one and
            only time it is shown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterWebhookResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The webhook subscription id.
        schema:
          type: string
          format: uuid # issue #119: a malformed id is a 400 before any store/driver call
    patch:
      operationId: updateWebhook
      x-permission: 'settings:manage'
      summary: Enable or disable a webhook subscription.
      description: >
        Suspend delivery without losing the subscription — its url, event types
        and signing secret survive, so re-enabling does not mean re-registering
        and re-sharing a key. Use this to stop a noisy or broken endpoint;
        use deleteWebhook to unsubscribe for good.

        An id that names no subscription of this cabinet — unknown or another
        cabinet's, indistinguishably — answers 404 `webhook.not_found` (before
        issue #119 that 404 carried `tenancy.cross_cabinet_denied`; the status
        is unchanged, so a client keyed on the status keeps working). A
        malformed (non-uuid) id answers 400 `validation.invalid_request`.
      tags:
        - webhooks
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # issue #119: an unknown or another cabinet's webhook id (it was
        # answered tenancy.cross_cabinet_denied).
        - webhook.not_found
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: The subscription after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWebhook
      x-permission: 'settings:manage'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        Reduces egress: removing a subscription stops the cabinet's data from being delivered to a URL the customer no longer trusts; nothing is created (ADR-0080 §3).
      summary: Unsubscribe an endpoint permanently.
      description: >
        Remove the subscription. Without this a tenant cannot stop receiving
        their own data — only an operator with database access could. Idempotent:
        deleting an id that is already gone answers 204, so a retry after a lost
        response is not an error.
      tags:
        - webhooks
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The subscription is gone (whether or not it existed).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-pool:
    get:
      operationId: listAccessPool
      x-permission: 'channels:read'
      summary: List access-pool credentials for a channel kind.
      tags:
        - access-pool
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ChannelKind'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The access-pool entries for the cabinet + kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPoolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addAccessPoolEntry
      x-permission: 'channels:manage'
      summary: Add a provider credential to the access pool.
      description: >
        Register an auth-out credential (ADR-0029). `credentialsRef` is a
        secret-store reference (secret://...) — never the credential itself.
      tags:
        - access-pool
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAccessPoolEntryRequest'
      responses:
        '201':
          description: The credential was added to the pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPoolEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-pool/{id}/health:
    put:
      operationId: setAccessPoolHealth
      x-permission: 'channels:manage'
      summary: Set a pool entry's health, returning it to rotation or pulling it out.
      description: >
        A credential that fails a send with a permanent auth or ban error is
        auto-degraded and drops out of rotation (ADR-0032 §2). Getting it BACK
        was possible only through the operator CLI — so an account that recovered
        stayed out until somebody with shell access noticed, and a tenant could
        not act on their own pool at all.

        Setting `healthy` returns the entry to rotation; `degraded` and `banned`
        take it out. Audited either way: this decides which of a cabinet's
        credentials its messages leave through.

        An id that names no pool entry of this cabinet — unknown or another
        cabinet's, indistinguishably — answers 404 `accesspool.not_found`
        (before issue #119 that 404 carried `tenancy.cross_cabinet_denied`; the
        status is unchanged). A malformed (non-uuid) id answers 400
        `validation.invalid_request`.
      tags:
        - access-pool
      parameters:
        - name: id
          in: path
          required: true
          description: The pool entry id.
          schema:
            type: string
            format: uuid # issue #119: a malformed id is a 400 before any store/driver call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccessPoolHealthRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # issue #119: an unknown or another cabinet's pool entry id (it was
        # answered tenancy.cross_cabinet_denied).
        - accesspool.not_found
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '204':
          description: The entry's health was updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /access-pool/rotate:
    post:
      operationId: rotateAccessPool
      x-permission: 'channels:manage'
      summary: Rotate the access pool for a channel kind (zero-downtime).
      description: >
        Promote the healthy `next` credential to active and retire the current
        active with a grace window (ADR-0029). Fails with 409 when there is no
        `next` to promote.
      tags:
        - access-pool
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateAccessPoolRequest'
      responses:
        '200':
          description: The pool was rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateAccessPoolResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /dead-letters:
    get:
      operationId: listDeadLetters
      x-permission: 'platform:admin'
      summary: List webhook deliveries the platform gave up on.
      description: >
        The dead-letter window (ADR-0031 §5). A delivery that exhausts its
        attempts — six, backing off to about fifteen minutes — is marked failed
        and stops being retried. Until this endpoint those rows existed and
        nothing could see them: a tenant's endpoint broke, the platform tried,
        gave up, and the event was gone with no way to list or resend it.

        Requires the `platform:admin` scope and spans every cabinet: the delivery
        queue is cross-cabinet infrastructure, and replaying one sends traffic to
        a tenant's endpoint. Filter with `cabinetId` to scope a listing.
      tags:
        - webhooks
      parameters:
        - name: cabinetId
          in: query
          required: false
          description: Restrict to one cabinet. Omitted, every cabinet is listed.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Only deliveries created at or after this instant.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 100 and is capped at 500.
          schema:
            type: integer
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: Dead-lettered deliveries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dead-letters/{id}/replay:
    post:
      operationId: replayDeadLetter
      x-permission: 'platform:admin'
      summary: Put a dead-lettered delivery back in the queue.
      description: >
        Requeues the delivery, due immediately, with its attempt counter reset so
        it gets a full retry schedule rather than dying again on the first
        failure. The payload and signature are regenerated by the deliverer, so
        the receiver sees an ordinary delivery.

        Requires `platform:admin`. Idempotent: only a failed delivery moves, so
        replaying twice is harmless and a replay cannot disturb one still being
        retried. Recorded in the audit trail — this sends traffic to somebody
        else's endpoint.

        An id that names no failed delivery — unknown, or a delivery still being
        retried or already delivered — answers 404 `deadletter.not_found`
        (before issue #119 that 404 carried `provider.unavailable`; the status is
        unchanged). A malformed (non-uuid) id answers 400
        `validation.invalid_request` (it used to reach the database).
      tags:
        - webhooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid # issue #119: a malformed id is a 400 before any store/driver call
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
        # issue #119: no failed delivery with that id (it was answered
        # provider.unavailable).
        - deadletter.not_found
      responses:
        '204':
          description: The delivery was requeued.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # platform operators — human platform administrators (ADR-0075, issue #107)
  # ===========================================================================
  # The people who hold platform power. The FIRST one is created by the
  # `controlplane bootstrap-operator` command on the server; every later grant
  # and revocation goes through these operations and is written to the
  # security log. A person's grant is checked on every request, so a revocation
  # takes effect on the next one. A human operator must have passed the second
  # factor in the session (ADR-0049 §4).
  /platform/operators:
    get:
      operationId: listPlatformOperators
      x-permission: 'platform:admin'
      summary: List platform operators (platform admin).
      description: >
        The active operators, and — with `includeRevoked=true` — the revoked
        grants too, which are kept as history rather than deleted.
      tags:
        - platform
      parameters:
        - name: includeRevoked
          in: query
          required: false
          description: Also return revoked grants.
          schema:
            type: boolean
            default: false
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The operators, active first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOperatorList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: grantPlatformOperator
      x-permission: 'platform:admin'
      summary: Make an existing account a platform operator (platform admin).
      description: >
        Names the account by `accountId` or by `email` — exactly one of them.
        The account must already exist (invite the person first); this
        operation never creates one. Granting to an account that is already an
        active operator changes nothing and answers 200 with the existing grant;
        a new grant (or the re-activation of a revoked one) answers 201.
        Recorded in the security log.
      tags:
        - platform
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - platform.account_not_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPlatformOperatorRequest'
      responses:
        '200':
          description: The account already was an active operator; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOperator'
        '201':
          description: The account is now an active operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOperator'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/operators/{accountId}:
    delete:
      operationId: revokePlatformOperator
      x-permission: 'platform:admin'
      summary: Revoke a platform operator (platform admin).
      description: >
        Ends the account's grant. The grant is kept as history (revokedAt), not
        deleted. The last active operator cannot be revoked (409
        platform.last_operator): the platform would be left with no human
        administrator, recoverable only from the server with
        `bootstrap-operator --additional`. An operator may revoke themselves as
        long as another one remains. Recorded in the security log.
      tags:
        - platform
      parameters:
        - name: accountId
          in: path
          required: true
          description: The operator's account id.
          schema:
            type: string
            format: uuid # issue #119: a malformed id is a 400 before any store/driver call
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - platform.operator_not_found
        - platform.last_operator
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The grant was revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ===========================================================================
  # end of platform operators (ADR-0075)
  # ===========================================================================

  # ===========================================================================
  # R7-B — organization suspension (issue #36, ADR-0051 §5, ADR-0080)
  # ===========================================================================
  # OWNED BY R7-B: only these two operations. Reading and listing organizations
  # is the organizations API (#34, ADR-0079, /platform/organizations below);
  # its Organization carries `status` and `suspendedReason`, and these two
  # operations write the organization's trail (organization_audit) like it does.
  #
  # A suspended organization is READ-ONLY in every one of its cabinets: every
  # cabinet mutation — the operations that list tenancy.suspended in
  # x-error-codes, whatever the credential — is refused with 403
  # tenancy.suspended; reads keep working; the operations marked
  # `x-suspension: allowed` keep working too (erasure, cutting access, the embed
  # read session). A worker holds the organization's channels: their live
  # provider links are closed, their credentials kept, so resuming brings them
  # back without re-pairing where the provider allows it.
  /platform/organizations/{organizationId}/suspend:
    parameters:
      - name: organizationId
        in: path
        required: true
        description: The organization id.
        schema:
          type: string
          format: uuid
    post:
      operationId: suspendOrganization
      x-permission: 'platform:admin'
      summary: Suspend an organization — all its cabinets become read-only (platform admin).
      description: >
        Makes every cabinet of the organization read-only (ADR-0080): each
        cabinet mutation is refused with 403 tenancy.suspended — sends included,
        from the API, the embed widget and an operator desk alike — while reads
        keep working, so the customer still sees their data. Messages accepted
        before the suspension that have not left yet are failed with reason
        `tenancy.suspended` instead of being sent. The organization's channels
        are then held by a background worker: the live provider link is closed
        and the credentials are kept.


        Idempotent: suspending an organization that is already suspended changes
        nothing — the original reason, time and author stand — and answers 200
        with `changed: false`. Recorded in the audit trail of every cabinet of
        the organization.
      tags:
        - platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendOrganizationRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.organization_not_found
      responses:
        '200':
          description: The organization is suspended (now, or already was — see `changed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSuspension'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/organizations/{organizationId}/resume:
    parameters:
      - name: organizationId
        in: path
        required: true
        description: The organization id.
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeOrganization
      x-permission: 'platform:admin'
      summary: Lift an organization's suspension (platform admin).
      description: >
        Makes the organization's cabinets writable again at once — the very next
        mutation is served — and has the worker bring its held channels back:
        reconnected where the provider keeps the session (wa_web, tg_client,
        tg_bot), with nothing to do for the webhook kinds (viber_bot, wa_cloud).
        A wa_web channel whose session the provider no longer has is left
        disconnected, to be paired again, and says so in the cabinet's audit
        trail.


        Idempotent: resuming an active organization changes nothing and answers
        200 with `changed: false`. Recorded in the audit trail of every cabinet
        of the organization.
      tags:
        - platform
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.organization_not_found
      responses:
        '200':
          description: The organization is active (now, or already was — see `changed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSuspension'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ===========================================================================
  # end of R7-B organization suspension
  # ===========================================================================

  /audit:
    get:
      operationId: listAudit
      x-permission: 'audit:read'
      summary: List the cabinet's audit log (append-only, newest first).
      description: >
        Query the cabinet's audit trail (ADR-0028). Optional `action` filters by
        event type; `limit` caps the page (default 100).
      tags:
        - audit
      parameters:
        - name: action
          in: query
          required: false
          description: Exact action match, e.g. `contact.erase`.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: >
            Only entries at or after this instant. Without it the only way to
            reach an incident's window was to raise `limit` until it came into
            view — which on a busy cabinet means paging past everything that
            happened after.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 100 and is capped at 500.
          schema:
            type: integer
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: The cabinet's audit entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # contacts.yaml — contacts (persons with identities[])
  # ===========================================================================
  /contacts:
    get:
      operationId: listContacts
      x-permission: 'channels:read'
      summary: List / poll contacts (cursor pagination).
      description: >
        Cursor-paginated pool of contacts (ADR-0008 §3 receive flow). Use `since`
        to walk pages and `status` to scope (e.g. `new` = inbound not yet
        host-linked). Response carries `pageInfo.nextCursor` for the next page.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ContactStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          required: false
          description: >
            Case-insensitive substring search over the contact's display name and
            its identities' phone / username / provider id. Digit-only input also
            matches phones written with separators.
          schema:
            type: string
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: A cursor page of contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # conversations — the operator's dialog list (admin console). Distinct from the
  # /embed/conversations family, which is token-scoped to ONE conversation for the
  # embedded widget (ADR-0009); these are cabinet-scoped and list everything.
  # ===========================================================================
  /media:
    post:
      operationId: uploadMedia
      x-permission: 'messages:send'
      summary: Upload an attachment to send.
      description: >
        Stores a file in the platform's object store and returns the reference to
        put in a send command's `content.media.url`. Providers fetch outbound
        media by URL, so the returned url is an ABSOLUTE, time-limited link the
        provider can read — unlike the inbound read path, which streams through
        the platform.
      tags:
        - messages
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
        - name: filename
          in: query
          required: false
          description: Original file name (kept for documents).
          schema:
            type: string
        - name: mime
          in: query
          required: false
          description: Content type; sniffed from the bytes when omitted.
          schema:
            type: string
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - message.too_large
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '201':
          description: The stored attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedMedia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The file exceeds the platform limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /messages/{id}:
    get:
      operationId: getMessage
      x-permission: 'channels:read'
      summary: Read one message and its current status.
      description: >
        The single-message read path. A send is accepted with 202 and reaches the
        provider afterwards, so "accepted" is not "delivered" — this is how the
        outcome is checked: queued, sent, delivered, read or failed, with the
        timestamp of each step it reached.

        Prefer subscribing to `message.status` for outcomes at scale; this
        endpoint answers for one message, which is what a support desk needs when
        somebody asks what happened to a specific reply.

        A failed send carries the reason under `meta.error`.
      tags:
        - messages
      parameters:
        - name: id
          in: path
          required: true
          description: The platform message id (the `id` a send returned).
          schema:
            type: string
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - message.not_found
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/media:
    get:
      operationId: getMessageMedia
      x-permission: 'channels:read'
      summary: Download a message's media attachment.
      description: >
        Streams the attachment bytes of a media message THROUGH the platform. The
        object store is never published: a stored provider/presigned URL is not
        reachable from a browser and expires, so this endpoint is the only way to
        read an attachment. Authorization is the message's own visibility — the
        row must exist in the caller's cabinet (RLS), which is what keeps one
        tenant's attachments away from another.
      tags:
        - messages
      parameters:
        - name: id
          in: path
          required: true
          description: Message id (our ULID).
          schema:
            type: string
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - message.not_found
      responses:
        '200':
          description: The attachment bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /conversations:
    get:
      operationId: listConversations
      x-permission: 'channels:read'
      summary: List the cabinet's conversations, most recently active first.
      description: >
        The dialog list: one row per conversation with its contact, channel kind,
        and a preview of the latest message. Optional filters by channel and
        status. Cursor-paginated on (last_message_at, id).
      tags:
        - conversations
      parameters:
        - name: channelId
          in: query
          required: false
          description: >
            Only conversations on this channel. It can only NARROW the caller's
            channel scope (ADR-0050): a channel outside it yields an empty page,
            never a wider one. A caller scoped to several channels must name one
            (validation.invalid_request otherwise).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Conversation status filter (e.g. open, closed).
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: A page of conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /conversations/{id}/feed:
    get:
      operationId: listConversationMessages
      x-permission: 'channels:read'
      summary: Read one conversation's messages (admin).
      description: >
        Backward-paginated thread of a single conversation, oldest→newest within
        the page. Cabinet-scoped (RLS); `before` walks further back.
      tags:
        - conversations
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: before
          in: query
          required: false
          description: Backward cursor — a message id from a previous page.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        # issue #115: 404 for an unknown, foreign or out-of-scope conversation.
        - conversation.not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: A page of the conversation's messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFeed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contacts/create:
    post:
      operationId: createContact
      x-permission: 'contacts:write'
      summary: Create a contact from a channel identity (idempotent).
      description: >
        Register a person the cabinet has not messaged yet — e.g. to start a
        conversation with a phone number that is not in the imported address
        book. The identity key (channel kind + provider id) is the SAME key used
        for inbound auto-linking (ADR-0008 §2), so calling this twice returns the
        existing contact instead of creating a duplicate: 201 when a contact was
        created, 200 when an existing one matched. `providerId` defaults to
        `phone` when omitted (WhatsApp/Viber address a person by number).
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
        - contact.identity_conflict
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '200':
          description: An existing contact already carried this identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '201':
          description: The contact was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{id}/invite:
    post:
      operationId: createContactInvite
      x-permission: 'contacts:write'
      summary: Mint a deep-link invite that opts a contact into a bot channel.
      description: >
        Bot channels cannot start a conversation (Telegram requires /start, Viber
        requires a subscription) — the CONTACT must opt in. This mints a one-time
        click-to-chat link carrying a start token bound to (cabinet, contact,
        channel): when the contact taps it and starts the bot, the adapter
        redeems the token and binds the bot identity to THIS contact (ADR-0008
        §5), so the new channel joins the same person instead of creating a
        stranger. Send the link over a channel that already reaches them.
        Only tg_bot and viber_bot support it.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - channel.not_found
        - channel.capability_unsupported
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '201':
          description: The invite link (single use, short-lived).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInvite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The channel kind has no deep-link opt-in.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /contacts/{id}:
    get:
      operationId: getContact
      x-permission: 'channels:read'
      summary: Fetch one contact by id.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateContact
      x-permission: 'contacts:write'
      summary: Update host-owned contact fields.
      description: >
        Partial update of host-owned fields only — `hostRefs` and `custom`
        (ADR-0008 §3: the host mirrors the contact and returns the link). Writing
        a field owned by another party yields embed.field_ownership_denied.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPatch'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - contact.identity_conflict
        - contact.merge_conflict
        - embed.field_ownership_denied
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /contacts/{id}/erase:
    post:
      operationId: eraseContact
      x-permission: 'compliance:manage'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        GDPR erasure (Art. 17) is the controller's legal duty toward the data subject and its deadline keeps running while the customer is suspended; refusing it would make the platform the reason the erasure is late (ADR-0080 §3).
      summary: Erase a person's data from the cabinet.
      description: >
        Remove the contact AND redact every trace of the person from the records
        that survive it. This is deliberately not a `DELETE /contacts/{id}`,
        because deleting the contact row would not do the job: only its
        identities and host refs cascade, conversations merely lose their
        contact link, and messages have no foreign key to a contact at all — so
        after a plain delete the person's number would remain in the message and
        conversation rows, with the correspondence intact. Erasure here means
        redaction, and the name says so.


        Runs as one transaction: either the person is erased or nothing changed.
        The response reports how many rows were touched so the caller can record
        it in its own erasure journal.


        IDEMPOTENT: erasing someone already erased is not an error. It answers
        200 with zero counts, because the requested state — this person's data is
        not here — holds either way.


        Not reversible, and not a substitute for deleting derived copies the
        integrator holds.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: What the erasure touched (all zeros if nothing was left).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # R8-B (issue #44, ADR-0084): contact consent with a source — BEGIN
  # (a self-contained block: paths here, schemas in the matching block under
  # components/schemas, the error code at the end of ErrorCode)
  # ===========================================================================
  /contacts/{id}/consents:
    get:
      operationId: listContactConsents
      x-permission: 'channels:read'
      summary: Read a contact's consent, per channel.
      description: >
        The consent recorded for the contact on each channel of the cabinet
        (ADR-0084): whether it is granted or revoked, where it came from
        (`source`: inbound_message, import, host_api, deep_link, manual), when,
        by whom, and on what evidence. Consent is per CHANNEL, not per channel
        kind — opt-in is given to a sender (a business number, a bot). A channel
        with no entry has nothing recorded: a send there is refused with
        policy.consent_missing while the cabinet enforces consent.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - validation.invalid_request
      responses:
        '200':
          description: The contact's recorded consents (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConsentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contacts/{id}/consents/{channelId}:
    put:
      operationId: grantContactConsent
      x-permission: 'contacts:write'
      summary: Record the contact's consent on one channel.
      description: >
        Record that the contact agreed to be messaged on this channel. The
        source is not chosen by the caller, it is WHO calls: a person in the
        console records `manual`, an API key records `host_api`; the author is
        kept with the consent and in the audit log. `evidence` is a short
        reference to where the consent came from (a form id, a CRM record) —
        never personal data.


        Idempotent: an ACTIVE consent is left as it is (`changed: false`) —
        the first grant stands, because its provenance is the earliest evidence.
        A REVOKED consent is re-granted: a manual or host grant is an explicit
        act and lifts an earlier opt-out (an automatic grant from an inbound
        message never does).
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/ConsentChannelId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantConsentRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - channel.not_found
        - tenancy.suspended
      responses:
        '200':
          description: The consent as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConsentChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contacts/{id}/consents/{channelId}/revoke:
    post:
      operationId: revokeContactConsent
      x-permission: 'contacts:write'
      x-suspension: allowed
      x-suspension-reason: >
        An opt-out is the data subject withdrawing consent; honouring it only stops messages, and refusing it while the organization is suspended would keep the person reachable the moment the organization resumes (ADR-0084).
      summary: Record that the contact withdrew consent on one channel.
      description: >
        Revoke the contact's consent on this channel: from now on a send there
        is refused with policy.consent_missing (while the cabinet enforces
        consent). The revocation is kept with its moment and author, and it
        also holds when nothing had been granted yet — "do not message me" then
        stops a later automatic grant from an inbound message. Only an explicit
        grant (manual, host API, a deep-link opt-in) lifts it.


        Idempotent: revoking a revoked consent changes nothing
        (`changed: false`; the first revocation's moment stands).
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/ConsentChannelId'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - channel.not_found
      responses:
        '200':
          description: The consent as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConsentChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ===========================================================================
  # R8-B (issue #44, ADR-0084): contact consent with a source — END
  # ===========================================================================

  # ===========================================================================
  # messages.yaml — outbound message commands
  # ===========================================================================
  /contacts/{id}/messages:
    get:
      operationId: listContactMessages
      x-permission: 'channels:read'
      summary: Read a contact's message history (all channels).
      description: >
        Backward-paginated history of every message exchanged with the contact
        across all of its conversations — a contact is one person spanning
        channels (ADR-0008). Newest-first pagination, presented oldest→newest;
        `cursor` walks further back. Cabinet-scoped (RLS).
      tags:
        - messages
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - name: before
          in: query
          required: false
          description: Backward cursor — a message id from a previous page's `pageInfo.nextCursor`.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: A page of the contact's message history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: sendContactMessage
      x-permission: 'messages:send'
      summary: Send an outbound message to a contact.
      description: >
        Enqueue an outbound message to the contact (ADR-0012 outbound flow). This
        is an unsafe command, so `Idempotency-Key` is REQUIRED (ADR-0002 §5):
        replaying the same key with the same body returns the original result;
        reusing it with a different body yields idempotency.key_reused (409).
      tags:
        - messages
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        # issue #115: channelId names no channel of this cabinet (it was
        # answered contact.not_found).
        - channel.not_found
        - channel.not_connected
        - channel.capability_unsupported
        - channel.pairing_required
        - message.type_unsupported
        - message.too_large
        - policy.rate_limited
        - policy.quota_exceeded
        - policy.rule_blocked
        - idempotency.key_reused
        - provider.upstream_error
        - provider.unavailable
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
        # R8-D (#42, ADR-0082): a confirmed send met a warning it did not acknowledge.
        - policy.confirmation_required
        # R8-B (#44, ADR-0084): the contact has no consent on the sending channel.
        - policy.consent_missing
        # R8-C (#40, #121): send-rule checkers. 429 + Retry-After for a full
        # window; 403 for a frozen dialog; 403 tenancy.quota_exceeded (with the
        # `quota` member) at the plan's messages.month cap.
        - policy.daily_limit
        - policy.hourly_limit
        - policy.dialog_frozen
        - tenancy.quota_exceeded
      responses:
        # R8-D (#109, ADR-0082): SentMessage = the Envelope + policyWarnings.
        '202':
          description: >
            The message was accepted and queued for delivery. `policyWarnings`
            lists the send-policy warnings it went out with, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # --- R8-D (#42, ADR-0082): send-policy dry run ---------------------------------
  /contacts/{id}/messages/policy-check:
    post:
      operationId: checkSendPolicy
      x-permission: 'messages:send'
      # Side-effect free; a suspended organization gets its answer as a finding.
      x-suspension: allowed
      x-suspension-reason: >
        A dry run that changes nothing (ADR-0082): it answers what a send would get, and for a suspended organization that answer is a deny finding with code tenancy.suspended — refusing the question instead would hide the reason from the composer.
      summary: Dry-run send policy for a prospective message (no side effects).
      description: >
        Answers what send policy would say about sending this message to the
        contact NOW, without sending it and without consuming anything — no
        rate budget, no counters, no decision-journal row (ADR-0082). Returns
        the verdict, every finding (code + params to localize), the current
        limits (`meters`) and, for a defer, when the send may go. Call it while
        the operator composes; send with `acknowledgedWarnings` = the answer's
        `warningKeys` once they confirm. Same body, same permission and same
        channel scope as sendContactMessage; no Idempotency-Key (nothing is
        created).
      tags:
        - messages
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - channel.not_found
        - channel.capability_unsupported
        - message.type_unsupported
        - provider.unavailable
      responses:
        '200':
          description: The send-policy answer for this prospective send.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendPolicyCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  # --- end R8-D ------------------------------------------------------------------

  # ===========================================================================
  # embed.yaml — embeddable widget sessions
  # ===========================================================================
  /embed/session:
    post:
      operationId: createEmbedSession
      x-permission: 'messages:send'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        Mints a read session for the embed widget, the host-side window onto conversations the customer may still read; every mutation the token could make (send, patch, start) is itself refused while suspended (ADR-0080 §3).
      summary: Initialize an embed widget session (M0 stub).
      description: >
        Init/token stub for the embeddable conversation widget (ADR-0007 /
        ADR-0009). Validates the embedding origin and issues a short-lived session
        token. Full deep-link/pairing mechanics land in a later slice.
      tags:
        - embed
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - embed.token_expired
        - embed.scope_violation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedSessionRequest'
      responses:
        '201':
          description: A session token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /embed/contacts/{id}:
    get:
      operationId: getEmbedContact
      x-permission: none
      x-permission-reason: >
        Authorized by the embed token (embedToken scheme) and its cap[], not by a cabinet principal: ADR-0009 Plane B, scoped to one contact and enforced in the handler.
      summary: Read the embed-scoped contact.
      description: >
        Plane B (ADR-0009 §4): the widget hydrates the contact bound to its token
        (cap contact:read). Scope is enforced server-side — the id MUST match the
        token's scope.contactId, else embed.scope_violation.
      tags:
        - embed
      security:
        - embedToken: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      x-error-codes:
        - auth.invalid_key
        - embed.token_expired
        - embed.scope_violation
        - contact.not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: The scoped contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchEmbedContact
      x-permission: none
      x-permission-reason: >
        Authorized by the embed token (embedToken scheme) and its cap[], not by a cabinet principal: ADR-0009 Plane B, scoped to one contact and enforced in the handler.
      summary: Patch host-owned custom fields of the embed-scoped contact.
      description: >
        Plane B (ADR-0009 §4): optimistic-concurrency write of host-owned custom
        fields (cap contact:write:custom). `baseVersion` guards the update
        (contact.version_conflict on drift); the idempotency key dedups a retried
        patch. Writing profile.*/identities.* is rejected — not host-owned
        (embed.field_ownership_denied, ADR-0007 §3).
      tags:
        - embed
      security:
        - embedToken: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedContactPatch'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - embed.token_expired
        - embed.scope_violation
        - embed.field_ownership_denied
        - contact.not_found
        - contact.version_conflict
        - idempotency.key_reused
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /embed/contacts/{id}/conversations:
    post:
      operationId: startEmbedBotConversation
      x-permission: none
      x-permission-reason: >
        Authorized by the embed token (embedToken scheme) and its cap[], not by a cabinet principal: ADR-0009 Plane B, scoped to one contact and enforced in the handler.
      summary: Start a bot conversation via deep-link (click-to-chat).
      description: >
        Plane B (ADR-0009 §6): bots cannot message first, so a bot session is
        raised through a deep link. Returns a pending session with an inviteLink;
        when the contact taps it and sends /start with the link token, the tg_bot
