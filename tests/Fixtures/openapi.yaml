      summary: Start a bot conversation via deep-link (click-to-chat).
      description: >
        Plane B (ADR-0009 §6): bots cannot message first, so a bot session is
        raised through a deep link. Returns a pending session with an inviteLink;
        when the contact taps it and sends /start with the link token, the tg_bot
        identity is bound to THIS contact (ADR-0008 §5). cap conversation:start.
      tags:
        - embed
      security:
        - embedToken: []
