        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.merge_proposal_not_found
        - contact.merge_conflict
        - tenancy.suspended
      responses:
        '200':
          description: The proposal as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMergeProposalChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /contact-merges:
    get:
      operationId: listContactMerges
      x-permission: 'channels:read'
      summary: List contact merges (newest first).
      description: >
        The cabinet's merge history, newest first, cursor-paginated — undone
        merges included (`status: undone`). `contactId` narrows it to the
        merges a contact took part in, on either side: the contact card's
        history, where an undo starts. A channel-scoped caller sees a merge when
        either contact talks on its channels.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: contactId
          in: query
          required: false
          description: Only merges this contact took part in (as survivor or as the merged contact).
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: A cursor page of merges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMergeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: mergeContacts
      x-permission: 'contacts:write'
      summary: Merge one contact into another.
      description: >
        Fold `mergedId` into `survivorId` (ADR-0008 §4, ADR-0090). Everything the
        merged contact has moves to the survivor in one transaction: channel
        identities, host refs, consents (the survivor's own consent for a
        channel stays; the merged contact's for that channel stays with it —
        except that an opt-out wins: if the merged contact revoked consent on
        a channel where the survivor's is active, the survivor is revoked there,
        by the caller, at the merge; a grant never lifts an opt-out),
        and conversations. Typed field values (ADR-0061) are folded key by key:
        a value only the merged contact holds moves WITH its provenance; for a
        key where both hold different values, `fieldChoices` picks the side,
        and without a choice the authority ladder decides (human > host >
        platform > ai; a tie keeps the survivor's). Tags are united, host
        `custom` keys the survivor lacks are added, an empty display name /
        avatar / locale is filled. The merged contact stays as a `merged`
        tombstone with a full snapshot.


        A choice for a key where the two do NOT conflict is refused (422
        contact.field_invalid, `reason: not_conflicting`) and nothing is
        merged: it means the caller reviewed a state that has since changed.
        `proposalId` (optional) names the open proposal this merge resolves;
        it must name exactly this pair. The merge can be undone for 30 days
        (undoContactMerge).


        A channel-scoped caller (an agent) may merge only contacts it sees AND
        whose every conversation is on its channels — a merge moves all of a
        person's dialogs (403 auth.forbidden_scope otherwise). Audited with its
        author (`contact.merge`): ids, counts and field KEYS, never values.
      tags:
        - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMergeRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - contact.merge_proposal_not_found
        - contact.merge_conflict
        - contact.field_invalid
        - tenancy.suspended
      responses:
        '201':
          description: The recorded merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMerge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: A field choice was refused (contact.field_invalid); nothing was merged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /contact-merges/{mergeId}:
    get:
      operationId: getContactMerge
      x-permission: 'channels:read'
      summary: Fetch one contact merge.
      tags:
        - contacts
      parameters:
        - name: mergeId
          in: path
          required: true
          description: Contact merge identifier (uuid).
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.merge_not_found
      responses:
        '200':
          description: The merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMerge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contact-merges/{mergeId}/undo:
    post:
      operationId: undoContactMerge
      x-permission: 'contacts:write'
      summary: Undo a contact merge.
      description: >
        Restore both contacts exactly as the merge snapshot recorded them: the
        merged contact's identities, host refs, consents and conversations go
        back to it (with any dialog its moved identities opened on the survivor
        after the merge), the survivor's typed fields, tags, custom keys and
        profile slots the merge changed are put back, and the merged contact is
        live again. A proposal the merge resolved is open again. Audited with
        its author (`contact.merge.undo`).


        Refused, and nothing changes, when "exactly" is no longer possible —
        409 contact.merge_undo_unsafe with one `errors[]` entry per reason:
        `survivor_merged` (the survivor was itself merged away),
        `later_merge` (another contact was merged into the survivor since —
        undo that one first), `merged_contact_changed` / `merged_contact_missing`,
        `identity_moved`, `host_ref_moved`, `consent_changed`,
        `conversation_moved`, and `field_changed` / `custom_changed` naming the
        key (`fields.<key>`, `custom.<key>`) a value the merge set was edited
        after it. Past 30 days: 409 contact.merge_undo_expired.


        Idempotent: undoing an undone merge changes nothing (`changed: false`).
        A channel-scoped caller needs every conversation of both contacts on
        its channels, as for the merge.
      tags:
        - contacts
      parameters:
        - name: mergeId
          in: path
          required: true
          description: Contact merge identifier (uuid).
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.merge_not_found
        - contact.merge_undo_unsafe
        - contact.merge_undo_expired
        - tenancy.suspended
      responses:
        '200':
          description: The merge as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMergeUndoResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ===========================================================================
  # END R9-B contact merge (paths)
  # ===========================================================================

  # ===========================================================================
  # BEGIN R9-F realtime event stream (paths) — issue #56, epic #13, ADR-0069
  # ===========================================================================
  /events/stream:
    get:
      operationId: streamEvents
      x-permission: 'channels:read'
      summary: Subscribe to the cabinet's live events (Server-Sent Events).
      description: >
        A `text/event-stream` (SSE) of the cabinet's events — new messages,
        delivery statuses, channel status and pairing changes, settings changes —
        filtered by the caller's Principal exactly as the rest of the API is:
        an agent receives only the events of the channels assigned to them, and
        `channel.qr` goes only to callers holding `channels:manage` on that
        channel. The stream is fed from the same event log as the outbound
        webhooks (ADR-0031), and each event carries the same identifiers-only
        payload in `data` (see RealtimeEvent); read anything else through the API.


        Frames: `id:` is an opaque cursor; `event:` is the event type; `data:`
        is one line of JSON. The server's own events are `stream.open` (first
        frame, carries the starting cursor), `stream.reset` (the cursor could
        not be resumed — reload state through the API, then keep reading) and
        `stream.closed` (last frame, `{"reason": ...}`: `shutdown` and `lagging`
        mean reconnect; `unauthorized` means the session, the membership or the
        permission is gone). Comment lines (`: hb`) are keep-alives every 15 s
        and also advance the cursor.


        Resume: a reconnecting EventSource sends `Last-Event-ID` by itself; the
        stream replays what the caller missed (up to 1000 events, up to an hour
        old; otherwise `stream.reset`), then continues live, with no event
        repeated — also when the reconnect lands on another replica. Clients that
        reopen the stream themselves pass the cursor as `lastEventId`.


        Cabinet: an EventSource cannot set request headers, so a session may
        name the cabinet with the `cabinet` query parameter instead of the
        `X-Linqelio-Cabinet` header. It is validated and checked against the
        person's memberships exactly like the header (a cabinet they are not a
        member of is 403 tenancy.cross_cabinet_denied); naming two different
        cabinets in the header and the parameter is refused the same way.
        An API key streams its own cabinet and ignores both.


        The credential is re-checked every 15 s while the stream is open (and at
        once when this replica revokes the session or changes the membership):
        a revoked session, a removed membership or a narrowed channel scope
        takes effect on the open stream, not only on the next request. At most
        10 concurrent streams per caller per replica (429
        realtime.too_many_streams).
      tags:
        - realtime
      parameters:
        - name: cabinet
          in: query
          required: false
          description: >
            The cabinet to stream, for a session that cannot send the
            X-Linqelio-Cabinet header (a browser EventSource). A cabinet id;
            validated like the header.
          schema:
            type: string
        - name: lastEventId
          in: query
          required: false
          description: >
            Resume after this cursor (the `id:` of the last frame received).
            The Last-Event-ID header takes precedence.
          schema:
            type: string
            maxLength: 64
        - name: Last-Event-ID
          in: header
          required: false
          description: The cursor a reconnecting EventSource sends by itself.
          schema:
            type: string
            maxLength: 64
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - realtime.too_many_streams
        - provider.unavailable
      responses:
        '200':
          description: >
            The event stream. `X-Accel-Buffering: no` asks a reverse proxy not
            to buffer it (see the deploy runbook for the nginx settings).
          headers:
            X-Accel-Buffering:
              description: Always `no`.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  SSE frames. The `data:` line of a bus event is a
                  RealtimeEvent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /embed/events/stream:
    get:
      operationId: streamEmbedEvents
      x-permission: none
      x-permission-reason: >
        Authorized by the embed token (embedToken scheme) and its cap[], not by a cabinet principal: ADR-0009 Plane B, scoped to one contact and enforced in the handler.
      summary: Live events of the widget's conversation (Server-Sent Events).
      description: >
        The widget's stream (ADR-0069 §3): new messages and delivery statuses of
        the ONE contact the embed token was minted for — and of its one
        conversation when the token pins one — on the channels the minter could
        reach. Requires cap message:read. The token is sent as a Bearer header
        (read the stream with fetch, not EventSource, so the token never
        appears in a URL). Frames are those of streamEvents with a smaller
        `data` (EmbedRealtimeEvent: the message id, the conversation id and,
        for a status, the status). The stream ends with `stream.closed`
        `expired` when the token does.
      tags:
        - embed
        - realtime
      security:
        - embedToken: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume after this cursor (the `id:` of the last frame received).
          schema:
            type: string
            maxLength: 64
      x-error-codes:
        - auth.invalid_key
        - embed.token_expired
        - embed.scope_violation
        - realtime.too_many_streams
        - provider.unavailable
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  SSE frames. The `data:` line of a bus event is an
                  EmbedRealtimeEvent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  # ===========================================================================
  # END R9-F realtime event stream (paths)
  # ===========================================================================

  # ===========================================================================
  # BEGIN R9-A contact import / export as background jobs (issue #49, ADR-0089)
  # ===========================================================================
  # OWNED BY R9-A: the /contact-imports and /contact-exports families below. Not
  # under /contacts/…: /contacts/{id}/… already owns the segment after
  # /contacts/, and a literal sibling there would overlap it in the router.
  /contact-imports:
    post:
      operationId: uploadContactImport
      x-permission: 'contacts:write'
      summary: Upload a CSV file of contacts to import.
      description: >
        Stores the file as an import job in the `uploaded` state and answers
        its header, row count and first rows — nothing is imported yet. The
        file must be CSV in UTF-8 (a BOM is fine; comma, semicolon or tab
        delimited, sniffed from the header line), at most 10 MiB, 50 000 rows
        and 100 columns, with column names in the first row. An XLSX/XLS, a
        PDF, anything binary or not UTF-8 is refused with 422
        contact.import_invalid and the reason in `errors[]` (`not_csv`,
        `encoding`, `empty`, `no_header`, `too_many_rows`,
        `too_many_columns`, `malformed`); a larger file is 413
        contact.import_too_large.


        Next: previewContactImport (a dry run of a mapping), then
        startContactImport. An upload that is never started is deleted after
        a day.
      tags:
        - contacts
      parameters:
        - name: filename
          in: query
          required: false
          description: The original file name (shown in the job list).
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.import_invalid
        - contact.import_too_large
        - tenancy.suspended
      responses:
        '201':
          description: The uploaded file, ready to be mapped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listContactImports
      x-permission: 'contacts:write'
      summary: List the cabinet's recent contact imports.
      description: The 50 most recent import jobs of the cabinet, newest first, with their progress.
      tags:
        - contacts
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The cabinet's recent imports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contact-imports/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Import job id (uuid).
        schema:
          type: string
          format: uuid
    get:
      operationId: getContactImport
      x-permission: 'contacts:write'
      summary: Read one import job and its progress.
      description: >
        The job's state (`uploaded` → `queued` → `running` → `completed`, or
        `failed` / `cancelled`), how many rows were processed, and what they
        did: created, updated, rejected (each with a report line), merge
        proposals, consents recorded. Poll it while the job runs.
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.job_not_found
      responses:
        '200':
          description: The import job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contact-imports/{jobId}/preview:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Import job id (uuid).
        schema:
          type: string
          format: uuid
    post:
      operationId: previewContactImport
      x-permission: 'contacts:write'
      summary: Dry-run a column mapping over the first rows.
      description: >
        Checks the mapping and runs the first `rows` data rows (default 100,
        at most 500) through exactly what the real run does — normalization,
        typed-field validation, the consent column, dedupe against the
        cabinet's existing contacts — WITHOUT writing anything, and answers the
        counts and the per-row issues.


        The mapping itself is refused with 422 contact.import_invalid, one
        `errors[]` entry per offending column (`field` = `columns[i].member`),
        when a column is out of range or mapped twice, a channel kind or
        target is unknown, a typed field does not exist or is not the host's
        to fill (platform- and AI-owned fields are not importable), a consent
        channel is not one the caller works — and when the mapping has no
        identity/hostRef column (`identity_required`) or NO CONSENT COLUMN
        (`consent_column_required`): an import states consent explicitly, per
        channel (ADR-0084), or it does not run.
      tags:
        - contacts
      parameters:
        - name: rows
          in: query
          required: false
          description: How many data rows to check (1–500, default 100).
          schema:
            type: integer
            minimum: 1
            maximum: 500
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactImportMapping'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.job_not_found
        - contact.job_conflict
        - contact.import_invalid
        - tenancy.suspended
      responses:
        '200':
          description: What the first rows would do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImportPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /contact-imports/{jobId}/start:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Import job id (uuid).
        schema:
          type: string
          format: uuid
    post:
      operationId: startContactImport
      x-permission: 'contacts:write'
      summary: Run the import in the background.
      description: >
        Queues the uploaded file with the mapping (checked exactly as in
        previewContactImport) and answers 202 at once — the run happens in the
        background, chunk by chunk, and never holds the request. It survives
        restarts: a run interrupted on one replica is resumed by another from
        the last committed chunk, and no row is applied twice.


        Per row: a row whose identities / host refs match no contact creates
        one; a row matching exactly one contact updates it (typed fields at
        the `host` rung of ADR-0061 §4 — a value a person entered is kept and
        reported, tags added, the name only filled where there was none);
        a row whose keys point at DIFFERENT contacts is not applied — it is a
        merge proposal in the report, never a silent merge (ADR-0008 §4).
        Consent is recorded only where the row's consent column says yes
        (source `import`), and never lifts an opt-out (ADR-0084 §2).


        One import runs at a time per cabinet: 409 contact.job_conflict while
        another is queued or running, or when this job already started.
        Audited as `contact.import.start` (mapping shape, never values).
      tags:
        - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactImportMapping'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.job_not_found
        - contact.job_conflict
        - contact.import_invalid
        - tenancy.suspended
      responses:
        '202':
          description: The job, queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /contact-imports/{jobId}/cancel:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Import job id (uuid).
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelContactImport
      x-permission: 'contacts:write'
      x-suspension: allowed
      x-suspension-reason: >
        Cancelling only stops an import (and drops its file); refusing it while the organization is suspended would leave the run to continue the moment the organization resumes.
      summary: Stop an import that has not finished.
      description: >
        Stops the job between two chunks and drops the uploaded file. Rows
        already applied stay applied — an import is not undone — and the
        report keeps them. Idempotent (`changed: false` when it already was
        cancelled); a completed or failed job is 409 contact.job_conflict.
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.job_not_found
        - contact.job_conflict
      responses:
        '200':
          description: The job as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImportCancel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /contact-imports/{jobId}/report:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Import job id (uuid).
        schema:
          type: string
          format: uuid
    get:
      operationId: getContactImportReport
      x-permission: 'contacts:write'
      summary: Download the per-row report of an import.
      description: >
        A CSV (UTF-8 with BOM, formula-safe) with one line per issue:
        `row` (as a spreadsheet numbers it — the header is row 1), `severity`
        (`error`: the row was not imported; `warning`: it was, without this
        part), `code`, `column`, `detail` and, for a merge proposal, the
        `contact_ids` the row's keys point at. It never repeats a cell's
        value. Available while the job runs (the lines so far) and after.
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.job_not_found
      responses:
        '200':
          description: The report file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contact-exports:
    post:
      operationId: createContactExport
      x-permission: 'contacts:export'
      x-suspension: allowed
      x-suspension-reason: >
        An export only reads the cabinet's own contacts; a suspended organization stays read-only, not locked out of its data.
      summary: Export contacts to a CSV file in the background.
      description: >
        Queues an export of the contacts matching the filter (all of it:
        carrying every tag, with a conversation on one of the channels, typed
        fields equal to the given values, in the status) and answers 202. The
        caller's CHANNEL SCOPE is frozen on the job: an agent assigned to some
        channels exports only contacts with a conversation on them, and
        `channelIds` can only narrow that. A bulk egress of personal data:
        needs contacts:export and is audited as `contact.export.create` with
        its author and filter.


        The file is CSV (UTF-8 with BOM) with every cell that a spreadsheet
        would execute (starting with `=`, `+`, `-`, `@`, tab or CR) prefixed
        with `'`. It is kept for 24 hours, then deleted (the job becomes
        `expired`). Only its author sees the job and downloads the file.
      tags:
        - contacts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactExportRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
      responses:
        '202':
          description: The export, queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listContactExports
      x-permission: 'contacts:export'
      summary: List the caller's recent exports.
      description: The caller's own 50 most recent exports in the cabinet, newest first.
      tags:
        - contacts
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The caller's recent exports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactExportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contact-exports/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Export job id (uuid).
        schema:
          type: string
          format: uuid
    get:
      operationId: getContactExport
      x-permission: 'contacts:export'
      summary: Read one of the caller's exports.
      description: >
        The export's state (`queued` → `running` → `completed`, or `failed`;
        `expired` once the file is deleted), its row count and, when
        completed, `downloadPath` and `expiresAt`. Another member's export is
        404 contact.job_not_found.
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.job_not_found
      responses:
        '200':
          description: The export job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contact-exports/{jobId}/file:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Export job id (uuid).
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadContactExport
      x-permission: 'contacts:export'
      summary: Download a completed export.
      description: >
        Streams the export file THROUGH the platform, authenticated like every
        other call (ADR-0056 §1: our own surfaces never get a bearer link; the
        object store is not published). Only the export's author may download
        it, only while it is kept: 409 contact.job_conflict before it is
        completed, 410 contact.export_expired after the retention deleted it.
        Every download is audited (`contact.export.download`).
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.job_not_found
        - contact.job_conflict
        - contact.export_expired
      responses:
        '200':
          description: The export file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The file passed its retention and was deleted (contact.export_expired).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  # ===========================================================================
  # END R9-A contact import / export (paths)
  # ===========================================================================

components:
  # ===========================================================================
  # Security
  # ===========================================================================
  securitySchemes:
    clientApiKey:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Client API key presented as a Bearer token. Stored server-side as an
        argon2id hash and shown once (DEVELOPMENT_RULES §8; scopes per §5).
    embedToken:
      type: http
      scheme: bearer
      bearerFormat: jwt
      description: >
        Short-lived embed session token (ADR-0009 Plane B). Issued by
        POST /embed/session; carries the cabinet, the scoped contact/conversation
        and a capability set (cap[]). The widget is its ONLY holder — the host page
        never sees it. Distinct from clientApiKey: it authorizes ONLY the /embed/*
        Plane-B surface, scoped to a single contact.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-linqelio_session
      description: >
        A person's server-side session (ADR-0049), set by POST /auth/login:
        httpOnly, Secure, SameSite=Strict, Path=/, expiring with the session
        (12 h). Only its sha256 is stored; blocking the account or revoking the
        session takes effect within the 30 s session cache.


        Precedence: an `Authorization` header always wins. A request that carries
        one is authenticated by it alone — an invalid key is a 401, never a fall
        back to the cookie.


        Cabinet: a session belongs to a PERSON, who may be a member of several
        cabinets, so a cabinet operation names the cabinet in the
        `X-Linqelio-Cabinet` request header (a cabinet id). It is checked against
        the person's memberships on every request; a cabinet they are not a
        member of is 403 tenancy.cross_cabinet_denied. The header may be omitted
        only when the person belongs to exactly one cabinet. The person's rights
        there are their role(s) — and, for an agent, only their assigned
        channels.


        Platform operators (ADR-0075): a `platform:admin` operation needs no
        cabinet header for a person who holds an active platform-operator grant
        and passed the second factor in this session. Such a person may also
        name ANY existing cabinet in the header without being a member of it and
        acts there as platform_admin; every such access is written to the
        security log. The grant is re-checked on every request.


        Cross-site requests: an unsafe request (anything but GET/HEAD/OPTIONS)
        WITHOUT an Authorization header must come from the console's own origin —
        a browser's `Sec-Fetch-Site`/`Origin` naming another site is refused with
        403 auth.origin_rejected. SameSite=Strict already keeps the cookie off
        cross-site requests; this closes the same-SITE gap (a sibling subdomain
        is same-site) and login CSRF, where no cookie is involved at all.

  # ===========================================================================
  # params.yaml — reusable parameters (path/query/header)
  # ===========================================================================
  parameters:
    # R8-F (#48, ADR-0061): a contact field's machine key, the shape the
    # store's CHECK constraint enforces — a malformed key is a 400 up front.
    ContactFieldKey:
      name: key
      in: path
      required: true
      description: The field's machine key (lower case letters, digits, underscores; starts with a letter).
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,62}$'

    ContactId:
      name: id
      in: path
      required: true
      description: Contact identifier (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    # R8-B (issue #44, ADR-0084): the channel a contact's consent is recorded for.
    ConsentChannelId:
      name: channelId
      in: path
      required: true
      description: The channel the consent is for (uuid).
      schema:
        type: string
        format: uuid

    ChannelId:
      name: id
      in: path
      required: true
      description: Channel identifier (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    ConversationId:
      name: id
      in: path
      required: true
      description: Conversation identifier (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    CabinetPathId:
      name: id
      in: path
      required: true
      description: Cabinet identifier (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call

    SessionId:
      name: sessionId
      in: path
      required: true
      description: A session id as listMySessions reports it (the sha256 hex of the cookie).
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'

    KeyKid:
      name: kid
      in: path
      required: true
      description: API key identifier (kid) within the cabinet.
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated key that makes an unsafe command idempotent (ADR-0002 §5,
        DEVELOPMENT_RULES §5). Replaying the same key with the same body returns the
        original result; reusing it with a DIFFERENT body yields
        idempotency.key_reused (409).
      schema:
        type: string
        minLength: 1
        maxLength: 255

    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        The same key with the same three outcomes as the required form, but
        optional on this operation: it was added after clients already existed,
        and a suddenly-required header would break every one of them.

        Omitting it means the command is NOT idempotent — a retry after a lost
        response provisions a second resource, and the first one is
        indistinguishable from it afterwards. Send a key on any call you would
        retry.
      schema:
        type: string
        minLength: 1
        maxLength: 255

    TeamAccountId:
      name: accountId
      in: path
      required: true
      description: The member's account id (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call
    TeamInviteId:
      name: inviteId
      in: path
      required: true
      description: The invite id (uuid).
      schema:
        type: string
        format: uuid # issue #119: a malformed id is a 400 before any store/driver call
    # R10-F (#73, ADR-0093): a Bitrix24 installation of the cabinet.
    BitrixPortalId:
      name: portalId
      in: path
      required: true
      description: The installation id (uuid).
      schema:
        type: string
        format: uuid

    Cursor:
      name: since
      in: query
      required: false
      description: Opaque forward cursor from a previous page's `pageInfo.nextCursor` (ADR-0008 §3).
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items per page. The server clamps to its own ceiling.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    ContactStatusFilter:
      name: status
      in: query
      required: false
      description: Filter contacts by lifecycle status (ADR-0008 §3, e.g. `new` = not yet host-linked).
      schema:
        $ref: '#/components/schemas/ContactStatus'

  # ===========================================================================
  # errors.yaml — RFC 9457 problem+json response objects (ADR-0013)
  # ===========================================================================
  # Each references Problem. Per-operation code lists live on the operation via
  # the `x-error-codes` extension (ADR-0013 §4: every endpoint declares its codes).
  responses:
    BadRequest:
      description: Request body or parameters failed schema validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, or expired client API key or session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not permitted (scope, tenancy, or policy rule).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The scoped resource does not exist or is not visible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with current state (idempotency, merge, identity).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The message or file exceeds the allowed size.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Well-formed but semantically unsupported by the target channel/type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: >
        The account is temporarily locked after repeated failed attempts
        (auth.account_locked, ADR-0049 §3: 5 failures -> 15 minutes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: A rate limit or quota was exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: An upstream provider returned an error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A provider or channel is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # =========================================================================
    # errors.yaml — RFC 9457 envelope + ADR-0013 machine `code` registry
    # =========================================================================
    # The envelope shape and the `code` enum are FROZEN v1 (ADR-0013). Codes are
    # additive-only: never reassigned, never removed. The frontend `errors.<code>`
    # i18n namespace binds to ErrorCode below — this is that bridge, so the enum
    # lists the ADR-0013 starter registry VERBATIM.
    ErrorCode:
      type: string
      description: >
        Stable machine-readable error code in `domain.reason` form (ADR-0013).
        Additive-only registry: codes are never reassigned or removed. Clients switch
        on this value; the frontend `errors.<code>` i18n namespace is keyed by it.
      enum:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - tenancy.cabinet_not_found
        - tenancy.cross_cabinet_denied
        - keyring.rotation_overlap_required
        - channel.not_connected
        - channel.not_found
        - channel.capability_unsupported
        - channel.pairing_required
        - policy.rate_limited
        - policy.quota_exceeded
        - policy.rule_blocked
        - accesspool.no_next
        - message.type_unsupported
        - message.too_large
        - message.not_found
        - idempotency.key_reused
        - contact.not_found
        - contact.merge_conflict
        - contact.identity_conflict
        - contact.version_conflict
        - embed.token_expired
        - embed.scope_violation
        - embed.field_ownership_denied
        - provider.upstream_error
        - provider.unavailable
        # --- additive (ADR-0013 §4): appended, never reordered -----------------
        # team.*: membership integrity (ADR-0050 §6, 409). Emitted by
        # internal/authz.CheckMembershipChange through the team API (/team/*).
        - team.last_org_owner
        - team.last_cabinet_admin
        - team.self_demotion_denied
        # A typed contact field (ADR-0061) rejected a value: 422 with one
        # errors[] entry per offending field.
        - contact.field_invalid
        # A settings write carried a stale version (If-Match) — 412, emitted by
        # putSettingsSection (issue #89, ADR-0057 §5).
        - settings.version_conflict
        # auth.*: human identity and sessions (ADR-0049). Login never says which
        # half of the credentials was wrong, nor whether the account exists.
        - auth.invalid_credentials
        - auth.second_factor_invalid
        - auth.second_factor_conflict
        - auth.account_locked
        - auth.session_invalid
        - auth.token_invalid
        - auth.origin_rejected
        - auth.second_factor_required
        # platform.*: human platform operators (ADR-0075). last_operator (409)
        # refuses revoking the only active operator; the two not_found codes
        # (404) name which half of a grant/revoke was missing.
        - platform.last_operator
        - platform.account_not_found
        - platform.operator_not_found
        # team.* (issue #31, the team API): the role-grant ceiling (403), a stale
        # member version (409), an email that already has an account (409), and
        # the two not-found answers of the team surface (404).
        - team.role_ceiling_exceeded
        - team.version_conflict
        - team.account_exists
        - team.member_not_found
        - team.invite_not_found
        # --- issue #115: per-resource not-found ---------------------------------
        # A conversation id that names nothing in the cabinet (or one outside the
        # caller's channel scope — the same answer, never an oracle). Previously
        # answered as channel.not_found / contact.not_found.
        - conversation.not_found
        # R5-C (issue #118, ADR-0076): membership-only invites for existing
        # accounts. invite_wrong_account (403): the link was presented by a
        # session of another account; already_member (409): the account already
        # holds a membership reaching the cabinet.
        - team.invite_wrong_account
        - team.already_member
        # --- issue #119: the remaining per-resource not-found (404) ------------
        # A webhook subscription / access-pool entry id that names nothing in the
        # cabinet — another cabinet's id answers exactly the same, never an
        # oracle. Previously answered as tenancy.cross_cabinet_denied.
        - webhook.not_found
        - accesspool.not_found
        # No dead-lettered (failed) delivery with that id: unknown, or not in the
        # failed state. Previously answered as provider.unavailable.
        - deadletter.not_found
        # --- R6-C (issues #32/#33, ADR-0051 §3): plan quotas ---------------------
        # A create would take the organization past a limit of its plan (with the
        # manual override applied): 403, with the metric, the limit and the
        # current use in the problem's `quota` member. Not policy.quota_exceeded:
        # that one is a 429 of the send path, where waiting helps; a plan limit
        # does not lift by waiting, and a client that retries a 429 would retry
        # this one forever.
        - tenancy.quota_exceeded
        # --- R7-B (issue #36, ADR-0080): organization suspension ----------------
        # suspended (403): the organization is suspended, so every cabinet of it
        # is read-only — the mutation (a send included) is refused; reads keep
        # working. Not 402 (suspension is not only for non-payment, and 402 is
        # reserved) and not 423 (WebDAV's lock of one resource, which clients
        # handle as a transient conflict). Retrying does not help until a
        # platform operator resumes the organization.
        - tenancy.suspended
        # --- R7-A (issue #34, ADR-0079): organizations ---------------------------
        # An organization id (path, or createCabinet's organizationId) that
        # names no organization: 404.
        - tenancy.organization_not_found
        # --- R8-D (issues #42/#109, ADR-0082): confirmed sends -------------------
        # confirmation_required (409): the send carried acknowledgedWarnings, and
        # send policy now raises a warning that is not among them (it appeared
        # after the caller's checkSendPolicy). Nothing was sent. The new warnings
        # are in the problem's `policyFindings`; re-run checkSendPolicy, show
        # them, and send again with them acknowledged.
        - policy.confirmation_required
        # --- end R8-D -------------------------------------------------------------
        # --- R8-B (issue #44, ADR-0084): contact consent -------------------------
        # consent_missing (403): the recipient has no active consent on the
        # sending channel — never recorded, or revoked. Its own code, not
        # policy.rule_blocked: the remedy is specific (record consent, e.g. a
        # deep-link opt-in), and waiting does not help, so it is never a 429.
        - policy.consent_missing
        # =====================================================================
        # BEGIN R8-C send-policy checkers (issue #40, #121; ADR-0058 §9)
        # =====================================================================
        # Finding codes of the send-rule pipeline. A deferred send answers 429
        # with Retry-After and the blocking finding's code; a denied one the
        # status below. The monthly messages cap reuses tenancy.quota_exceeded
        # (403 + `quota` member) — a plan limit does not lift by retrying.
        #   daily_limit / hourly_limit: the channel's send window (cabinet time
        #     zone) is full — 429 until it resets.
        #   contact_frequency: too many messages to this contact in the period —
        #     429 (campaigns are rescheduled; interactive sends only warned).
        #   duplicate_content: the same normalized content was sent recently —
        #     409 when a campaign would repeat it to one contact; a warning
        #     otherwise.
        #   outside_business_hours: inside the cabinet's quiet hours — 429 for a
        #     campaign; a warning for an interactive send.
        #   dialog_frozen: the conversation is frozen — 403.
        #   monthly_quota_near: a WARNING only (80 % of messages.month used);
        #     never an HTTP error status — listed so warnings share the i18n keys.
        - policy.daily_limit
        - policy.hourly_limit
        - policy.contact_frequency
        - policy.duplicate_content
        - policy.outside_business_hours
        - policy.dialog_frozen
        - policy.monthly_quota_near
        # END R8-C send-policy checkers
        # --- BEGIN R9-B contact merge (issue #50, ADR-0090) ---------------------
        # merge_proposal_not_found / merge_not_found (404): a proposal / merge id
        # that names nothing in the cabinet (or out of the caller's scope — the
        # same answer). merge_undo_unsafe (409): something since the merge makes
        # an exact restore impossible — one errors[] entry per reason.
        # merge_undo_expired (409): past the 30-day undo window.
        - contact.merge_proposal_not_found
        - contact.merge_not_found
        - contact.merge_undo_unsafe
        - contact.merge_undo_expired
        # --- END R9-B -------------------------------------------------------------
        # --- R9-F (issue #56, ADR-0069): realtime stream ------------------------
        # too_many_streams (429): the caller already holds the maximum number of
        # open event streams on this replica (10 per person / key / widget
        # contact). Close a tab, or share one stream between tabs.
        - realtime.too_many_streams
        # --- end R9-F -------------------------------------------------------------
        # --- BEGIN R9-A (issue #49, ADR-0089): contact import / export jobs ----
        #   import_invalid (422): the uploaded file is not a CSV we can read, or
        #     the column mapping is refused — reasons in errors[].
        #   import_too_large (413): the file is larger than the upload limit.
        #   job_not_found (404): no import / export job with that id in the
        #     cabinet (for an export: none of the caller's).
        #   job_conflict (409): the job is not in a state that allows the call
        #     (started twice, another import already running, cancelling a
        #     finished run, downloading an export that is not ready).
        #   export_expired (410): the export file passed its retention.
        - contact.import_invalid
        - contact.import_too_large
        - contact.job_not_found
        - contact.job_conflict
        - contact.export_expired
        # --- END R9-A -------------------------------------------------------------
        # --- BEGIN R10-F (issue #73, ADR-0093): Bitrix24 application ----------
        #   pairing_invalid (400): no pending pairing with that code — unknown,
        #     expired (30 min), already redeemed or revoked by a newer one.
        #   auth_invalid (401): Bitrix did not confirm the tokens the application
        #     page sent — the OAuth server refused the refresh token for the
        #     pairing's client, or the portal refused the user's AUTH_ID, or the
        #     token belongs to another application. Refresh the auth and retry.
        #   portal_linked_elsewhere (409): the portal is live in another cabinet.
        #   cabinet_has_portal (409): the cabinet already has another live portal.
        #   portal_not_linked (404): no live installation for that member_id —
        #     the application page then asks for a pairing code.
        #   user_not_linked (403): the Bitrix user has no Linqelio account in the
        #     portal's cabinet (or it is blocked): ask an administrator to invite
        #     you. Nobody is created automatically.
        #   portal_not_found (404): no installation with that id in the cabinet.
        #   link_code_invalid (400): the link code is unknown, expired, used, or
        #     was issued for another account.
        - bitrix.pairing_invalid
        - bitrix.auth_invalid
        - bitrix.portal_linked_elsewhere
        - bitrix.cabinet_has_portal
        - bitrix.portal_not_linked
        - bitrix.user_not_linked
        - bitrix.portal_not_found
        - bitrix.link_code_invalid
        # --- END R10-F ------------------------------------------------------------
        # --- BEGIN R10-C (issue #69, ADR-0092): message templates ----------------
        #   policy.service_window_closed (403): a FREE-FORM message (text,
        #     media) to a wa_cloud contact whose last message is older than 24
        #     hours, or who never wrote: outside WhatsApp's customer-service
        #     window only an approved template can be sent. Waiting does not
        #     help; a template does (the finding's params carry hint=template).
        #   template.not_found (422): the send names a template (name +
        #     language) the channel's last sync did not list.
        #   template.not_approved (409): the template exists but Meta has not
        #     approved it (pending, rejected, paused, disabled, ...).
        #   template.unsupported (422): the template has a part we cannot fill
        #     (a media header, a dynamic URL button, a copy-code / OTP button,
        #     a carousel, ...) — minimal scope, ADR-0092.
        #   template.params_invalid (422): the parameters do not fit the
        #     template — wrong count, an empty value, a line break / tab / more
        #     than 4 spaces in a row, or a header / body over Meta's length
        #     limit once filled. One errors[] entry per offending parameter.
        #   template.sync_not_configured (409): the channel cannot be synced —
        #     no wabaId setting or access token, or Meta refused them (unknown
        #     account, missing permission).
        - policy.service_window_closed
        - template.not_found
        - template.not_approved
        - template.unsupported
        - template.params_invalid
        - template.sync_not_configured
        # --- END R10-C ------------------------------------------------------------
        # --- BEGIN R10-A (issues #64/#65, ADR-0062): group conversations ------
        #   groups_disabled (403): a send into a group on a channel whose group
        #     chats are switched off (channel settings groups.enabled). A group
        #     has no consent to record; the channel's switch stands in for it,
        #     and it is refused in every compliance mode.
        - policy.groups_disabled
        # --- END R10-A ------------------------------------------------------------
        # --- BEGIN R10-D (issue #57, ADR-0064): AI subsystem ------------------
        #   not_configured (409): the cabinet's `ai` settings name no usable
        #     provider, model or key (and no platform default applies) — set
        #     them under /settings/ai.
        #   provider_unsupported (422): the settings name a provider this
        #     platform has no client for yet (e.g. `google`).
        - ai.not_configured
        - ai.provider_unsupported
        # --- END R10-D -------------------------------------------------------------
        # --- BEGIN R10-B (issues #67/#70, ADR-0063): campaigns, scheduled sends --
        #   campaign.not_found (404): no campaign with that id in the cabinet
        #     (or one reaching channels outside the caller's scope — the same
        #     answer, never an oracle).
        #   campaign.state_conflict (409): the campaign's state does not allow
        #     the command (editing a launched campaign, pausing a draft,
        #     resuming one whose channels are all gone).
        #   campaign.invalid (422): the draft cannot be saved or launched — one
        #     errors[] entry per reason (no_channels, audience_empty,
        #     template_unsupported, unsupported_type, in_the_past, …).
        #   scheduled_send.not_found (404) / scheduled_send.state_conflict (409):
        #     no such scheduled send / it is already going out, sent, failed or
        #     cancelled.
        - campaign.not_found
        - campaign.state_conflict
        - campaign.invalid
        - scheduled_send.not_found
        - scheduled_send.state_conflict
        # --- END R10-B ------------------------------------------------------------
        # --- BEGIN R10-E (issues #60/#61, ADR-0065): channel health + alerts ----
        #   alert.not_found (404): no alert with that id the caller may see.
        #   alert.subscription_not_found (404): no such subscription of the
        #     caller (or, for settings managers, of the cabinet).
        #   alert.subscription_conflict (409): the target already has a
        #     subscription on that delivery channel.
        #   alert.subscription_invalid (422): the subscription is refused —
        #     reasons in errors[] (a key has no person to mail, a channel
        #     outside the caller's scope, an unknown webhook, a role that does
        #     not exist, a delivery channel that does not fit the target).
        #   alert.rule_not_found (404): no such rule type.
        #   alert.rule_invalid (422): a rule override is refused — every field
        #     in errors[].
        - alert.not_found
        - alert.subscription_not_found
        - alert.subscription_conflict
        - alert.subscription_invalid
        - alert.rule_not_found
        - alert.rule_invalid
        # --- END R10-E ------------------------------------------------------------
        # --- BEGIN R11-A (issues #66/#129, ADR-0062, ADR-0096): group management -
        #   conversation.not_group (422): a group operation on a direct
        #     conversation — only a group has members, a subject and a way out.
        #   group.members_unresolvable (422): none of the contacts asked for can
        #     be addressed on the channel (no such contact, or no phone the
        #     channel can reach); errors[] names each.
        - conversation.not_group
        - group.members_unresolvable
        # --- END R11-A ------------------------------------------------------------
        # --- BEGIN R11-C (issue #59, ADR-0068): AI guard + questionnaire -------
        #   guard_risk: a send-policy FINDING (warn, or deny in enforce mode)
        #     — the AI guard judged the outbound message risky; params carry
        #     score, risk, categories, reasons and a safer rewrite. A refused
        #     send answers 403 policy.rule_blocked with this finding in
        #     policyFindings.
        #   guard_unavailable: a send-policy FINDING with verdict allow — the
        #     guard did not answer in time (fail-open); the send went unchecked.
        #   disabled (409): the cabinet has not consented to AI processing
        #     (`ai.enabled` is off).
        #   profile_no_conversation (409): the contact has no conversation with
        #     text for the questionnaire to read.
        - ai.guard_risk
        - ai.guard_unavailable
        - ai.disabled
        - ai.profile_no_conversation
        # --- END R11-C ------------------------------------------------------------
        # --- BEGIN R11-D (issue #58, ADR-0067): compliance ----------------------
        #   compliance.scan_not_found (404) / compliance.finding_not_found (404):
        #     no such scan / finding the caller may see (another cabinet's, or a
        #     finding on a channel outside the caller's scope — the same answer).
        #   compliance.scan_active (409): a scan of the same target is already
        #     queued or running.
        #   compliance.scan_finished (409): the scan already ended (cancel).
        #   compliance.ai_disabled (409): the cabinet has not consented to send
        #     conversation text to its AI provider (`ai.enabled` is off).
        #   compliance.no_rules (409): every rule of the `compliance` settings
        #     is switched off — a scan would check nothing.
        #   compliance.assignee_invalid (422): the assignee is not an active
        #     member of the cabinet whose role reads compliance.
        - compliance.scan_not_found
        - compliance.finding_not_found
        - compliance.scan_active
        - compliance.scan_finished
        - compliance.ai_disabled
        - compliance.no_rules
        - compliance.assignee_invalid
        # --- END R11-D ------------------------------------------------------------
        # --- BEGIN R11-E (issues #62/#63, ADR-0066): analytics ----------------
        #   range_invalid (422): the report period is refused — `from` after
        #     `to`, longer than 400 days, or an hourly series over 31 days.
        #   export_not_found (404): no report export with that id of the
        #     caller's in the cabinet.
        #   export_not_ready (409): the export is not completed yet (or failed).
        #   export_expired (410): the export file passed its retention.
        - analytics.range_invalid
        - analytics.export_not_found
        - analytics.export_not_ready
        - analytics.export_expired
        # --- END R11-E ------------------------------------------------------------
        # --- BEGIN R11-B (issue #68, ADR-0063 addendum): campaign dry run --------
        #   campaign.dry_run_required (409): launchCampaign on a draft with no
        #     dry run since its last change, or whose last dry run is older
        #     than 24 hours. Run dryRunCampaign, show its summary, and launch
        #     again (issue #68 DoD: a campaign cannot be launched without a
        #     dry run).
        - campaign.dry_run_required
        # --- END R11-B ------------------------------------------------------------
        # --- BEGIN R11-F (issues #74/#75, ADR-0094): Bitrix24 open-lines connector --
        #   portal_not_live (409): the installation is uninstalled or unlinked —
        #     the connector works only on a live portal (pair it again).
        - bitrix.portal_not_live
        # --- END R11-F ------------------------------------------------------------

    # --- R6-C (#33, ADR-0051 §3): the quota refusal's problem extension --------
    QuotaExceeded:
      type: object
      description: >
        Which limit refused the request (RFC 9457 extension member `quota`,
        present only with tenancy.quota_exceeded). The refusal explains itself:
        the client can tell the customer what to free or which plan to ask for
        without contacting support.
      properties:
        metric:
          type: string
          description: >
            The limited metric, in the form plans use: `cabinets`, `seats`, or
            `channels.<kind>` (e.g. `channels.wa_web`).
          example: channels.wa_web
        limit:
          type: integer
          format: int64
          description: The organization's effective limit (plan, with its manual override applied).
          example: 3
        used:
          type: integer
          format: int64
          description: How much of it the organization uses now, across all its cabinets.
          example: 3
      required:
        - metric
        - limit
        - used
    # --- end R6-C ---------------------------------------------------------------

    # --- R7-B (#36, ADR-0080): organization suspension ---------------------------
    SuspendOrganizationRequest:
      type: object
      description: Why the organization is suspended.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            Why the organization is suspended (non-payment, an abuse
            investigation, a customer request, ...). Required: a suspension
            nobody can explain later is a support ticket waiting to happen. It
            is kept on the organization and in the audit trail; it is not shown
            in the refusal a cabinet caller gets.
          example: Invoice 2026-09 unpaid
      required:
        - reason

    OrganizationSuspension:
      type: object
      description: >
        An organization's suspension state, as a suspend or resume left it.
      properties:
        organizationId:
          type: string
          format: uuid
        status:
          type: string
          # Not an `enum`: the pinned generator renames the constants of the
          # other active/... enums (UpdateWebhookRequestStatus) when a third one
          # shares a value. The values are `active` and `suspended`.
          description: '`active` or `suspended`.'
          example: suspended
        suspendedReason:
          type: string
          description: Why it is suspended. Present only while suspended.
        suspendedAt:
          type: string
          format: date-time
          description: Since when it is suspended. Present only while suspended.
        suspendedBy:
          type: string
          description: >
            Who suspended it, as `<actor type>:<actor id>` — `account:<uuid>` for
            a platform operator, `api_key:<kid>` for a platform key. Present
            only while suspended.
        changed:
          type: boolean
          description: >
            Whether this call changed the state. false = the organization
            already was in the requested state (an idempotent repeat); nothing
            was written or audited.
      required:
        - organizationId
        - status
        - changed
    # --- end R7-B ---------------------------------------------------------------

    ValidationError:
      type: object
      description: One field-level validation failure (RFC 9457 `errors[]` extension).
      properties:
        field:
          type: string
          description: JSON Pointer / dotted path to the offending field.
        reason:
          type: string
          description: Human-readable reason this field failed.
      required:
        - field
        - reason

    Problem:
      type: object
      description: >
        RFC 9457 problem+json error envelope (ADR-0013). Cabinet-safe: `detail` never
        leaks another cabinet's data or internal details.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI to the versioned doc page for this `code`.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code, duplicated in the body per RFC 9457.
        detail:
          type: string
          description: Human-readable explanation of this occurrence (cabinet-safe).
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this specific occurrence.
        code:
          $ref: '#/components/schemas/ErrorCode'
        trace_id:
          type: string
          description: Correlation id for logs/traces (ADR-0013 §1).
        errors:
          type: array
          description: >
            Field-level failures; present for validation.invalid_request and
            contact.field_invalid (one entry per offending field; `reason` is the
            stable machine reason, e.g. `type_mismatch`, `not_in_enum`).
          items:
            $ref: '#/components/schemas/ValidationError'
        # R6-C (#33, ADR-0051 §3): present only with tenancy.quota_exceeded.
        quota:
          $ref: '#/components/schemas/QuotaExceeded'
        # R8-D (#42/#109, ADR-0082): why send policy held a send.
        policyFindings:
          type: array
          description: >
            Send-policy findings behind this refusal (ADR-0082), present on a
            send refused by policy: with policy.confirmation_required the
            UNACKNOWLEDGED warnings; with policy.rate_limited / quota_exceeded /
            rule_blocked every finding of the run that held it. Render each by
            its `code` (and `params`); fall back to `detail` for a code the
            client does not know.
          items:
            $ref: '#/components/schemas/PolicyFinding'
      required:
        - type
        - title
        - status
        - code

    # =========================================================================
    # envelope.yaml — message Envelope (mirrors internal/messaging/envelope.go)
    # =========================================================================
    # FROZEN v1 (ADR-0012): core fields stable; Meta and enum members additive.
    # ChannelKind lives with the messaging schemas (its canonical Go home).
    ChannelKind:
      type: string
      description: Channel family a message or session belongs to (ADR-0012). Extends additively.
      enum:
        - wa_web
        - wa_cloud
        - tg_client
        - tg_bot
        - viber_bot

    Direction:
      type: string
      description: Direction of a message relative to the platform (ADR-0012).
      enum:
        - inbound
        - outbound

    MsgType:
      type: string
      description: Payload type carried by `content` (ADR-0012). Members extend additively.
      enum:
        - text
        - image
        - audio
        - video
        - document
        - location
        - template
        - interactive
        - system

    MsgStatus:
      type: string
      description: Delivery-lifecycle state of a message (ADR-0012).
      enum:
        - queued
        - sent
        - delivered
        - read
        - failed

    Timestamps:
      type: object
      description: >
        Delivery-lifecycle moments. `created` is always set; `sent`/`delivered`/`read`
        are populated as the message advances.
      properties:
        created:
          type: string
          format: date-time
        sent:
          type: string
          format: date-time
        delivered:
          type: string
          format: date-time
        read:
          type: string
          format: date-time
      required:
        - created

    Envelope:
      type: object
      description: >
        Unified message contract between the core and every adapter (ADR-0012).
        Mirrors internal/messaging/envelope.go core fields. `meta` MUST NOT carry
        routing-significant data — routing uses core fields only.
      properties:
        id:
          type: string
          description: Our ULID.
        cabinetId:
          type: string
        channelId:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        direction:
          $ref: '#/components/schemas/Direction'
        chatId:
          type: string
          description: Unified conversation id.
        contactRef:
          type: string
          description: Points to Contact.identities[].providerId (ADR-0008).
        type:
          $ref: '#/components/schemas/MsgType'
        content:
          type: object
          additionalProperties: true
          description: Type-dependent payload (JSON). Shape depends on `type`.
        replyTo:
          type: string
          description: Optional provider message id this message replies to.
        providerMsgId:
          type: string
          description: Provider-side id; bus idempotency key (ADR-0012 §3).
        idempotencyKey:
          type: string
          description: Outbound-send idempotency key (API §5).
        status:
          $ref: '#/components/schemas/MsgStatus'
        timestamps:
          $ref: '#/components/schemas/Timestamps'
        meta:
          type: object
          additionalProperties: true
          description: Provider-specific metadata. NEVER used for routing.
      required:
        - id
        - cabinetId
        - channelId
        - kind
        - direction
        - chatId
        - contactRef
        - type
        - content
        - status
        - timestamps

    ConversationSummary:
      type: object
      description: One row of the operator dialog list.
      properties:
        id:
          type: string
        contactId:
          type: string
        contactName:
          type: string
        channelId:
          type: string
        channelType:
          $ref: '#/components/schemas/ChannelKind'
        chatId:
          type: string
          description: The provider-side chat address (JID / chat id).
        status:
          type: string
        lastMessageAt:
          type: string
          format: date-time
        lastMessageText:
          type: string
          description: Preview of the newest message ("" for non-text payloads).
        lastMessageDirection:
          $ref: '#/components/schemas/Direction'
        # R10-A (#64, ADR-0062): group conversations — additive.
        conversationKind:
          $ref: '#/components/schemas/ConversationKind'
        subject:
          type: string
          description: A group's name as the channel last reported it.
        participantCount:
          type: integer
          description: A group's current participants (those who left are not counted).
      required:
        - id
        - channelId
        - chatId

    ConversationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items

    # =========================================================================
    # BEGIN R10-A group conversations (issues #64/#65, ADR-0062)
    # =========================================================================
    # Explicit constant names (x-enum-varnames): bare values like `group` or
    # `member` would otherwise collide with other enums' generated constants.
    ConversationKind:
      type: string
      description: >
        `direct` — a one-to-one conversation with a contact; `group` — a group
        chat (ADR-0062). A group is never a contact: it has no `contactId`, its
        messages name their author (`senderName`), and a send into it goes
        through sendConversationMessage.
      enum:
        - direct
        - group
      x-enum-varnames:
        - ConversationKindDirect
        - ConversationKindGroup

    ParticipantRole:
      type: string
      description: A group participant's role as the channel reports it.
      enum:
        - member
        - admin
        - owner
      x-enum-varnames:
        - ParticipantRoleMember
        - ParticipantRoleAdmin
        - ParticipantRoleOwner

    ConversationParticipant:
      type: object
      description: >
        One participant of a group conversation. `providerId` is their address
        on the channel (a WhatsApp phone JID, or `<lid>@lid` when WhatsApp
        disclosed nothing else). `contactId`/`name` are set when the
        participant is a contact — a member who never wrote usually is not.
      properties:
        providerId:
          type: string
        phone:
          type: string
          description: Bare phone digits, when known.
        lid:
          type: string
          description: Bare WhatsApp LID digits, when known.
        role:
          $ref: '#/components/schemas/ParticipantRole'
        joinedAt:
          type: string
          format: date-time
          description: When the platform first (or, after leaving, again) saw them as a member.
        leftAt:
          type: string
          format: date-time
          description: Set once a member list arrived without them.
        contactId:
          type: string
        name:
          type: string
      required:
        - providerId
        - role
        - joinedAt

    ConversationParticipantList:
      type: object
      properties:
        conversationId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationParticipant'
      required:
        - conversationId
        - items

    ChannelGroupSettings:
      type: object
      description: >
        Group chats on this channel (ADR-0062 §4) — wa_web only. Off unless set:
        with `enabled: false` the channel neither takes group messages in nor
        sends into groups (policy.groups_disabled). Turning it on is the
        explicit, audited decision that stands in for a person's consent in a
        group.
      properties:
        enabled:
          type: boolean
      additionalProperties: false
    # =========================================================================
    # END R10-A group conversations
    # =========================================================================

    CreateInviteRequest:
      type: object
      properties:
        channelId:
          type: string
          description: The bot channel the contact should be invited into.
      required:
        - channelId

    ContactInvite:
      type: object
      description: A single-use deep link that opts a contact into a bot channel.
      properties:
        contactId:
          type: string
        channelId:
          type: string
        inviteLink:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - contactId
        - channelId
        - inviteLink
        - expiresAt

    CreateContactRequest:
      type: object
      description: >
        A new person expressed as ONE channel identity. Identities are how the
        platform addresses people (ADR-0008); more can be linked later.
      properties:
        channelType:
          $ref: '#/components/schemas/ChannelKind'
        phone:
          type: string
          description: E.164-ish number (separators tolerated). Required unless providerId/username is set.
        username:
          type: string
          description: Channel username (Telegram @handle without the @).
        providerId:
          type: string
          description: Native provider id (e.g. a WhatsApp JID). Defaults to `phone`.
        name:
          type: string
          description: Display name for the new contact. Ignored when a contact already matched.
      required:
        - channelType

    SendMessageRequest:
      type: object
      description: >
        Outbound message command body. The platform fills the remaining Envelope
        fields (id, direction=outbound, timestamps, status=queued). `content` is
        type-dependent (e.g. {"text":"hi"} for type=text).


        `type: template` (wa_cloud only, R10-C, ADR-0092) sends an approved
        WhatsApp Business template: name it and fill its placeholders in
        `template`, and send `content: {}` — the platform renders the content
        itself ({"text": <the filled template>, "template": {...}}). `template`
        is refused with any other type. A free-form message to a wa_cloud
        contact outside the 24-hour customer-service window is refused with
        policy.service_window_closed; a template is not.
      properties:
        type:
          $ref: '#/components/schemas/MsgType'
        content:
          type: object
          additionalProperties: true
          description: Type-dependent payload matching `type`.
        replyTo:
          type: string
          description: Optional provider message id to reply to.
        channelId:
          type: string
          description: >
            Optional channel override. By default the platform replies on the
            channel of the contact's most recent conversation, falling back to a
            channel matching one of the contact's identities. Set this to force a
            specific channel; the contact must be addressable there (it needs an
            identity of that channel's kind, or a conversation on it) — otherwise
            the send fails with channel.capability_unsupported.
        # R8-D (#42, ADR-0082): a confirmed send.
        acknowledgedWarnings:
          type: array
          description: >
            Makes this a CONFIRMED send (ADR-0082): the `key`s of the policy
            warnings the caller was shown by checkSendPolicy and confirmed
            (`warningKeys` of that answer). The send goes through only if every
            warning send policy raises now is listed; otherwise it is refused
            with 409 policy.confirmation_required and the new warnings in
            `policyFindings` — nothing is sent. An empty array confirms "no
            warnings". Omitted: an unconfirmed send, where warnings never block
            and are only reported back in `policyWarnings` (the behaviour before
            ADR-0082). Ignored by checkSendPolicy.
          items:
            type: string
        # R10-C (#69, ADR-0092): a template send.
        template:
          $ref: '#/components/schemas/SendTemplate'
      required:
        - type
        - content

    # --- R8-D (#42/#109, ADR-0082): send-policy dry run and warnings ---------------
    PolicyVerdict:
      type: string
      description: >
        A send-policy stance (ADR-0058 §2). `allow`: nothing to say. `warn`:
        sendable, but the operator must be told. `defer`: not now — retry from
        `retryAt`. `deny`: not this send. Clients must treat an unknown value as
        `deny`.
      enum:
        - allow
        - warn
        - defer
        - deny

    PolicyFinding:
      type: object
      description: >
        One send-policy checker's answer about a send (ADR-0058/0082). The set
        of checkers grows (rate, consent, frequency, duplicates, business hours,
        ...), so clients render a finding GENERICALLY: localize by `code` with
        `params` interpolated, and fall back to `detail` (then to the raw
        `code`) for a code they do not know.
      properties:
        check:
          type: string
          description: The checker that produced it (stable machine id, e.g. `rate`).
          example: rate
        verdict:
          $ref: '#/components/schemas/PolicyVerdict'
        key:
          type: string
          description: >
            What acknowledges this finding when it is a warning: send it in
            `acknowledgedWarnings`. The `code`, or the `check` when there is none.
          example: policy.rate_limited
        code:
          type: string
          description: >
            Machine code, the i18n message key (`errors.<code>`). Usually an
            ErrorCode, but a newer checker may send one this client's contract
            copy does not list yet — hence not the enum. Absent when the checker
            has nothing to report beyond its verdict.
          example: policy.rate_limited
        params:
          type: object
          additionalProperties:
            type: string
          description: Values to interpolate into the localized message.
        until:
          type: string
          format: date-time
          description: For `defer` — the moment the send may be retried.
        detail:
          type: string
          description: Operator-facing English context; the fallback text.
      required:
        - check
        - verdict
        - key

    PolicyMeter:
      type: object
      description: >
        One CURRENT limit as a checker sees it (ADR-0082): how much is used and
        when it is whole again — the bars of the pre-send panel. A snapshot, not
        a reservation.
      properties:
        check:
          type: string
          description: The checker that reports it.
          example: rate
        name:
          type: string
          description: >
            Stable machine id of the limit (e.g. `rate.burst`, the channel's
            burst budget; media sends draw more of it). Localize it, fall back
            to the raw name.
          example: rate.burst
        used:
          type: integer
          format: int64
          example: 3
        limit:
          type: integer
          format: int64
          example: 20
        resetAt:
          type: string
          format: date-time
          description: When it is fully available again. Absent = whole now or unknown.
      required:
        - check
        - name
        - used
        - limit

    SendPolicyCheck:
      type: object
      description: >
        What send policy would say about this send NOW (ADR-0082, #42) —
        everything a pre-send panel needs, in one answer. Computed by a dry run
        that consumes nothing: no rate budget, no counters, no journal row.
      properties:
        verdict:
          $ref: '#/components/schemas/PolicyVerdict'
        sendable:
          type: boolean
          description: '`verdict` is `allow` or `warn`: the send would go through now.'
        warningKeys:
          type: array
          description: >
            The `key`s of the `warn` findings — exactly what to send back in
            `acknowledgedWarnings` once the operator confirms them. Empty = no
            confirmation needed.
          items:
            type: string
        findings:
          type: array
          description: Every finding of the run, in evaluation order (allow included).
          items:
            $ref: '#/components/schemas/PolicyFinding'
        meters:
          type: array
          description: The current limits, across all checkers that report one.
          items:
            $ref: '#/components/schemas/PolicyMeter'
        channelId:
          type: string
          description: The channel the send would leave through (resolved like sendContactMessage does).
        cost:
          type: integer
          description: The rate budget this send would draw (media costs more than text).
          example: 1
        retryAt:
          type: string
          format: date-time
          description: For `defer` — when the send may go (every blocker cleared).
        retryAfterSeconds:
          type: integer
          description: For `defer` — `retryAt` as seconds from `evaluatedAt`, rounded up.
        evaluatedAt:
          type: string
          format: date-time
      required:
        - verdict
        - sendable
        - warningKeys
        - findings
        - meters
        - channelId
        - cost
        - evaluatedAt

    SentMessage:
      description: >
        The accepted outbound message (the Envelope), plus the send-policy
        warnings it went out with (#109, ADR-0082).
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            policyWarnings:
              type: array
              description: >
                The `warn` findings send policy raised for this send (e.g. a
                limit nearly used up). The message WAS accepted; show them to
                the operator. Absent when there were none.
              items:
                $ref: '#/components/schemas/PolicyFinding'
    # --- end R8-D ---------------------------------------------------------------

    # =========================================================================
    # contact.yaml — Contact (mirrors internal/contacts/contact.go)
    # =========================================================================
    # FROZEN v1 (ADR-0008): a Contact is a *person* with identities[]. Field
    # ownership is fixed (messenger read-only, `custom` host-owned, profile/content
    # platform-owned — ADR-0007 §3).
    ContactStatus:
      type: string
      description: >
        Lifecycle filter for the receive pool (ADR-0008 §3). Not a stored Contact
        field — a server-derived view (e.g. `new` = inbound not yet host-linked).
      enum:
        - new
        - active
        - archived

    Identity:
      type: object
      description: >
        One channel presence of a Contact. Auto-link is only ever done on an EXACT
        within-channel key (providerId primary, phone secondary) — never a fuzzy
        match on name/avatar (ADR-0008 §2).
      properties:
        channelType:
          $ref: '#/components/schemas/ChannelKind'
        providerId:
          type: string
        phone:
          type: string
        username:
          type: string
        pushName:
          type: string
        avatarUrl:
          type: string
      required:
        - channelType
        - providerId

    Profile:
      type: object
      description: Platform-owned presentation of a Contact.
      properties:
        displayName:
          type: string
        avatarUrl:
          type: string
        locale:
          type: string

    HostRef:
      type: object
      description: >
        Links a Contact to the host's own record. The host owns the decision "this
        is the same customer as in my CRM" (ADR-0008 §2); the platform never infers
        cross-system identity itself.
      properties:
        system:
          type: string
        externalId:
          type: string
      required:
        - system
        - externalId

    ContactMeta:
      type: object
      description: >
        Ownership + versioning metadata (`_meta`). Ownership maps a field group
        ("identities"/"profile"/"custom") to its owner (ADR-0008 §1, ADR-0007 §3).
      properties:
        ownership:
          type: object
          additionalProperties:
            type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
        - version
        - updatedAt

    Contact:
      type: object
      description: A person, addressable across one or more channel identities (ADR-0008).
      properties:
        id:
          type: string
        cabinetId:
          type: string
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        profile:
          $ref: '#/components/schemas/Profile'
        custom:
          type: object
          additionalProperties: true
          description: Host-owned free-form fields.
        hostRefs:
          type: array
          items:
            $ref: '#/components/schemas/HostRef'
        _meta:
          $ref: '#/components/schemas/ContactMeta'
      required:
        - id
        - cabinetId
        - identities
        - profile
        - _meta

    ContactPatch:
      type: object
      description: >
        Partial update of host-owned fields (ADR-0008 §3 lifecycle: host mirrors the
        contact then returns the link). Only `hostRefs` and `custom` are writable
        here — identities and platform profile are not host-owned.
      properties:
        hostRefs:
          type: array
          items:
            $ref: '#/components/schemas/HostRef'
        custom:
          type: object
          additionalProperties: true
        _meta:
          type: object
          description: >
            Optimistic concurrency. Pass the `version` you last read and the write
            applies only if nothing changed underneath — otherwise
            contact.version_conflict (409), and you refetch and retry.

            Optional: omit it and the update is last-writer-wins, which is the
            behaviour every caller had before this existed. Only `custom` is
            guarded; `hostRefs` are links rather than values and adding one twice
            is not a conflict.
          properties:
            version:
              type: integer
              description: The `_meta.version` of the contact you based this edit on.
          required:
            - version

    ContactList:
      type: object
      description: A cursor page of contacts (ADR-0002 §5, cursor-based).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo

    # =========================================================================
    # R8-B (issue #44, ADR-0084): contact consent with a source — BEGIN
    # =========================================================================
    ConsentSource:
      type: string
      description: >
        Where a consent came from. inbound_message: the person wrote to the
        cabinet on this channel; import: a bulk import with an explicit consent
        column; host_api: the host asserted it with an API key; deep_link: the
        person opted in through a deep-link invite; manual: a person in the
        console recorded it.
      enum: [inbound_message, import, host_api, deep_link, manual]

    ConsentStatus:
      type: string
      description: >
        granted — an active consent is on record; revoked — the person opted
        out on this channel; missing — nothing is recorded.
      enum: [granted, revoked, missing]

    ConsentActor:
      type: object
      description: Who granted or revoked (the audit vocabulary, ADR-0028).
      properties:
        type:
          type: string
          # Deliberately not an enum: `system` would collide with MsgType's
          # `system` and rename every generated MsgType constant.
          description: account | api_key | system.
        id:
          type: string
          description: The account id or key id; empty for the system.
      required:
        - type

    ContactConsent:
      type: object
      description: >
        The consent of one contact on one channel (ADR-0084). `source`,
        `grantedAt` and `grantedBy` describe the grant in force — or the last
        one, when revoked — and are absent for an opt-out recorded before any
        grant.
      properties:
        channelId:
          type: string
          format: uuid
        channelKind:
          $ref: '#/components/schemas/ChannelKind'
        status:
          $ref: '#/components/schemas/ConsentStatus'
        source:
          $ref: '#/components/schemas/ConsentSource'
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          $ref: '#/components/schemas/ConsentActor'
        evidence:
          type: string
          maxLength: 500
          description: A short reference to where the consent came from; never personal data.
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          $ref: '#/components/schemas/ConsentActor'
        updatedAt:
          type: string
          format: date-time
      required:
        - channelId
        - channelKind
        - status
        - updatedAt

    ContactConsentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactConsent'
      required:
        - items

    ContactConsentChange:
      type: object
      description: The result of a grant or a revocation.
      properties:
        changed:
          type: boolean
          description: False when the call changed nothing (already in that state, or an opt-out the source may not lift).
        consent:
          $ref: '#/components/schemas/ContactConsent'
      required:
        - changed
        - consent

    GrantConsentRequest:
      type: object
      additionalProperties: false
      properties:
        evidence:
          type: string
          maxLength: 500
          description: >
            Where the consent came from — a signed form's id, the host's CRM
            record. Kept with the consent. Never personal data.
    # =========================================================================
    # R8-B (issue #44, ADR-0084): contact consent with a source — END
    # =========================================================================

    # =========================================================================
    # channel.yaml — channel read view (Capabilities mirrors channels.Capabilities)
    # =========================================================================
    Capabilities:
      type: object
      description: A channel's honest self-declaration of what it can do (ADR-0012).
      properties:
        text:
          type: boolean
        media:
          type: boolean
        templates:
          type: boolean
        buttons:
          type: boolean
        groups:
          type: boolean
        presence:
          type: boolean
        deepLinkInvite:
          type: boolean
          description: Click-to-chat deep-link support opt-in (ADR-0009).
        delivery:
          type: string
          description: How the provider delivers inbound updates.
          enum:
            - stream
            - webhook
            - poll
      required:
        - text
        - media
        - templates
        - buttons
        - groups
        - presence
        - deepLinkInvite
        - delivery

    ChannelSettings:
      type: object
      description: >
        Non-secret, per-channel provider configuration: identifiers taken from
        the provider's own dashboard. Deliberately separate from credentials —
        these are readable back, while anything set through
        setChannelCredentials never is (ADR-0011). Keys are per-kind; one that
        does not apply to the channel's kind is rejected.
      properties:
        phoneNumberId:
          type: string
          description: >
            wa_cloud only. The Meta phone number id this channel sends from
            (Graph POST /<phoneNumberId>/messages). It identifies the sending
            number, so a cabinet with two wa_cloud channels needs one per
            channel — a single shared value would send every message from the
            first channel's number.
          minLength: 1
        # R10-C (#69, ADR-0092): where the channel's templates are read from.
        wabaId:
          type: string
          description: >
            wa_cloud only. The WhatsApp Business Account id the channel's number
            belongs to (Meta Business Manager). The message templates are the
            account's, so syncChannelTemplates lists them from
            GET /<wabaId>/message_templates; without it the channel sends text
            and media but has no templates.
          minLength: 1
        # R10-A (#65, ADR-0062 §4): the channel's group switch (wa_web only).
        groups:
          $ref: '#/components/schemas/ChannelGroupSettings'
      additionalProperties: false

    Channel:
      type: object
      description: A channel configured in the cabinet (M0 read view).
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        state:
          type: string
          description: >
            LAST OBSERVED connection/pairing state (active, pairing,
            disconnected), read from the stored row rather than the provider.

            For kinds whose liveness is only known to the provider — wa_web —
            the row converges when the channel's status is checked
            (GET /channels/{id}/status), which writes back what it observes. So
            a channel paired but never status-checked can still read
            disconnected here.

            Use GET /channels/{id}/status when you need the state as of now;
            this list is a cheap inventory, not a live probe.
        capabilities:
          $ref: '#/components/schemas/Capabilities'
          description: >
            What this channel's provider declares it can do (ADR-0012), read from
            the provider itself rather than from a table kept alongside it.

            A property of the KIND, not of this particular channel: it says what
            the integration supports, not what the account is currently permitted
            or connected to do. Absent for a kind this build holds no declaration
            for — an unknown capability set is not an empty one.
        settings:
          $ref: '#/components/schemas/ChannelSettings'
        suspended:
          type: boolean
          description: >
            R7-B (#36, ADR-0080): true while the channel is held because its
            organization is suspended — its live provider link is closed and
            nothing is sent through it; its credentials are kept. `state` is the
            state it had, and is what resuming the organization restores.
            Absent when the channel is not held.
      required:
        - id
        - kind
        - state

    ChannelList:
      type: object
      description: The channels configured in the cabinet.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
      required:
        - items

    ChannelDeletion:
      type: object
      description: >
        What deleting a channel removed. Reported for the same reason
        ErasureResult is: "we asked and it said nothing was there" and "it removed
        a channel and 412 messages with it" are different facts, and after the
        fact the only place either one is recorded is the caller's own log and
        ours.
      properties:
        deleted:
          type: boolean
          description: >
            true when a channel row was actually removed; false when the id named
            nothing in this cabinet. Both are successful outcomes — the requested
            state holds either way — so this is how a caller tells a deletion from
            a replay of one.
        conversations:
          type: integer
          description: Conversations removed with the channel.
        messages:
          type: integer
          description: >
            Messages removed. Found both by the channel and through its
            conversations, because a message may carry either link and losing
            one is not losing the other.
        outbox:
          type: integer
          description: >
            Queued outbound rows removed. Each holds its own full copy of the
            envelope, and one still pending is an outbound message that will now
            never be sent — which is the intended answer for a channel that is
            being deleted.
        media:
          type: integer
          description: >
            Attachments queued for removal from the object store. Queued rather
            than deleted inline: the object store is not in the deletion's
            transaction, so the keys are committed with it and a background sweep
            removes the bytes immediately afterwards.
        deskInboxRemoved:
          type: boolean
          description: >
            true when the channel's inbox on the operator desk was deleted, taking
            the desk-side conversations and their message history with it. false
            when the channel never had one, or no desk is configured — never when
            a desk was configured and refused, which fails the whole operation
            with provider.unavailable instead.
      required:
        - deleted
        - conversations
        - messages
        - outbox
        - media
        - deskInboxRemoved

    CreateChannelRequest:
      type: object
      description: >
        Provision a new channel of the given kind. The channel starts
        disconnected; the connect command begins pairing (ADR-0012 outbound
        readiness). `label` is an optional operator-facing name.
      properties:
        kind:
          $ref: '#/components/schemas/ChannelKind'
        label:
          type: string
          description: Optional human-friendly label shown in the admin channel list.
      required:
        - kind

    Cabinet:
      type: object
      description: A client cabinet — the tenant/isolation boundary (RLS).
      properties:
        id:
          type: string
        orgId:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - orgId
        - name
        - slug

    CabinetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cabinet'
      required:
        - items

    CreateCabinetRequest:
      type: object
      properties:
        name:
          type: string
          description: Client-facing cabinet name; the slug derives from it.
          minLength: 1
        # R7-A (issue #34, ADR-0079 §2): the organization the cabinet joins.
        organizationId:
          type: string
          format: uuid
          description: >
            The organization (createOrganization) the cabinet is added to; it
            reserves one `cabinets` of that organization's plan. DEPRECATED
            when omitted: without it a new organization is created for the
            cabinet on the default plan (the pre-#34 one-to-one pair), which
            keeps existing callers working — new callers should create the
            organization first and name it here.
      required:
        - name

    ApiKey:
      type: object
      description: API key metadata — the secret/hash is NEVER returned (ADR-0005).
      properties:
        kid:
          type: string
        status:
          type: string
          description: active | next | retiring | revoked
        scopes:
          type: array
          items:
            type: string
        label:
          type: string
          description: >
            Who holds this key. Empty for keys issued before labels existed —
            those are the ones an operator cannot rotate confidently, because
            nothing records what would break.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry; absent when the key does not expire.
        graceUntil:
          type: string
          format: date-time
          description: >
            For a `retiring` key: when it stops working. Present only during a
            rotation's overlap window.
      required:
        - kid
        - status

    ApiKeyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
      required:
        - items

    IssueApiKeyRequest:
      type: object
      description: >
        What the key should be. Every field is optional and the defaults preserve
        the previous behaviour — a cabinet-wide, never-expiring key — but each one
        was previously impossible to express, so no caller could ask for less.
      properties:
        scopes:
          type: array
          items:
            type: string
          description: >
            What this key may do. Defaults to ["*"], the whole cabinet.

            ENFORCED ON EVERY OPERATION. Each operation declares an
            `x-permission`, and the key's scopes are resolved into exactly that
            vocabulary before the handler runs (ADR-0050 §4), so a narrow list is
            now a real boundary rather than a label.

            A scope is one of: `*` (everything inside this cabinet — the
            cabinet_admin permission set, which does NOT include
            `platform:admin` or `billing:manage`), `platform:admin` (the
            cross-tenant operator surface: /cabinets, the keyring, dead
            letters), `secrets:read` (disclosure of the access pool's
            credentialsRef), or the exact name of a permission —
            `channels:read`, `channels:manage`, `messages:send`,
            `contacts:write`, `contacts:export`, `campaigns:manage`,
            `policy:manage`, `team:manage`, `ai:manage`, `compliance:read`,
            `compliance:manage`, `analytics:read`, `audit:read`,
            `settings:manage`, `billing:manage`.

            ANYTHING ELSE IS REFUSED with `validation.invalid_request`. An
            unrecognised scope grants nothing, so a key carrying one would
            authenticate, look correctly narrow in the key list and be unable to
            call a single operation; the refusal names the scopes it did not
            understand. Keys issued before this check are untouched — they keep
            granting whatever their recognised scopes grant.

            Cabinet isolation does not depend on any of this: it is enforced by
            the key's cabinet binding and Postgres RLS (ADR-0042), whatever the
            scopes say.
        label:
          type: string
          description: >
            Who holds this key ("zapier", "billing sync"). Not a secret and not an
            identity — the kid is the identity. Without it a cabinet's key list is
            a column of opaque ids, and rotating one safely means knowing which
            integration would break.
        expiresAt:
          type: string
          format: date-time
          description: >
            Absolute expiry, enforced at verification. Omitted, the key never
            expires — which is right for a long-lived integration and wrong for
            the two-week migration that is still valid two years later.
      required: []

    RotateApiKeyRequest:
      type: object
      description: >
        Replace a key without an outage. The old key keeps working until
        `graceUntil`, so the holder swaps at its own pace.
      properties:
        graceUntil:
          type: string
          format: date-time
          description: >
            When the outgoing key stops working. Defaults to 24 hours from now.
            Both keys are valid until then — which is the entire point: issuing a
            replacement and revoking the old one breaks every holder in the
            instant between the two calls.
        scopes:
          type: array
          items:
            type: string
          description: >
            Scopes for the replacement. Defaults to the outgoing key's. Same
            vocabulary and the same refusal as `IssueApiKeyRequest.scopes`: a
            rotation mints a key, so it is the same door.
        label:
          type: string
          description: Label for the replacement. Defaults to the outgoing key's.
        expiresAt:
          type: string
          format: date-time
          description: Expiry for the replacement. Omitted, it does not expire.
      required: []

    IssuedApiKey:
      type: object
      description: >
        A freshly minted client key. `bearerToken` is shown ONLY here, once —
        the platform stores just its argon2id hash.
      properties:
        kid:
          type: string
        cabinetId:
          type: string
        bearerToken:
          type: string
          description: 'Full bearer credential: "<cabinetId>.<kid>.<secret>". Shown once.'
      required:
        - kid
        - cabinetId
        - bearerToken

    SyncChannelRequest:
      type: object
      description: Options for a source-side import.
      properties:
        history:
          type: boolean
          description: Also ask the source to replay older messages (default false).
        historyCount:
          type: integer
          description: How many older messages to request (default 100, max 500).
          minimum: 1
          maximum: 500

    SyncResult:
      type: object
      description: Outcome of a source-side import.
      properties:
        channelId:
          type: string
        contactsImported:
          type: integer
          description: Contacts newly created in the cabinet.
        contactsMatched:
          type: integer
          description: Contacts that already existed (matched on identity).
        historyRequested:
          type: boolean
          description: True when a history replay was requested from the source.
      required:
        - channelId
        - contactsImported
        - contactsMatched

    SetChannelCredentialsRequest:
      type: object
      description: >
        Write-only provider credentials for an API-token channel. Every value
        goes straight into the secret store; only `secret://` references are kept
        on the channel (ADR-0011), and none is ever echoed back by any operation.


        Per-kind, the mirror image of ChannelSettings: settings are per-kind and
        readable, credentials are per-kind and never readable. A field that does
        not apply to the channel's kind is rejected rather than stored.
      properties:
        token:
          type: string
          description: >
            The provider credential (bot token / auth token / wa_cloud Graph
            access token) — or, for a tg_client login waiting on 2FA, the cloud
            password. Write-only.
          minLength: 1
        appSecret:
          type: string
          description: >
            wa_cloud only. The Meta app secret that signs inbound webhooks
            (X-Hub-Signature-256). Per-channel, so a tenant can bring its own
            Meta app instead of sharing ours.
          minLength: 1
        verifyToken:
          type: string
          description: >
            wa_cloud only. The token Meta echoes back on the webhook verification
            handshake. You choose the value; it is still a shared secret, and it
            is per-channel for the same reason appSecret is.
          minLength: 1
      required:
        - token
      additionalProperties: false

    ChannelState:
      type: string
      description: >
        Coarse connection state of a channel (ADR-0012). `pairing` means a QR /
        pairing code is pending; `connected` means the channel can send/receive.
      enum:
        - disconnected
        - pairing
        - connected

    ChannelStatus:
      type: object
      description: >
        Live connection/pairing status of a channel. While `state=pairing` a QR
        channel (wa_web, tg_client) carries the `qr` payload (and optionally a
        `pairingCode`) to render in the admin connect screen (ADR-0013
        channel.pairing_required). For tg_client, `passwordRequired=true` means
        the QR was scanned but the account's 2FA cloud password must be submitted
        via setChannelCredentials to finish the login.
      properties:
        channelId:
          type: string
        state:
          $ref: '#/components/schemas/ChannelState'
        qr:
          type: string
          description: >
            QR payload to render while pairing (opaque string; the admin encodes it
            as a QR image). Absent unless state=pairing for a QR channel.
        pairingCode:
          type: string
          description: Alternative short pairing code (phone-number pairing). Optional.
        expiresAt:
          type: string
          format: date-time
          description: When the current QR / pairing code expires and must be refreshed.
        passwordRequired:
          type: boolean
          description: >
            tg_client only: the QR was scanned but the account's 2FA cloud
            password is required — submit it via setChannelCredentials (write-only).
        detail:
          type: string
          description: >
            Human-readable note about a channel that is usable but not fully
            healthy — e.g. a viber_bot whose callback URL could not be registered,
            which can send but will never receive. Present only when there is
            something the operator has to act on; `state` alone cannot express
            "works one way", and reporting such a channel as plainly connected
            hides the reason nothing arrives.
      required:
        - channelId
        - state

    # =========================================================================
    # embed.yaml — embeddable widget session (ADR-0007/0009 stub)
    # =========================================================================
    EmbedSessionRequest:
      type: object
      description: Initialize an embed widget session (ADR-0009).
      properties:
        contactId:
          type: string
          description: >
            The contact this session is scoped to. Required: a token that names
            nobody would reach everybody.
        conversationId:
          type: string
          description: >
            Optional: confine the token to a single conversation. Omitted, it
            reaches every conversation that contact has.
        cap:
          type: array
          items:
            type: string
          description: >
            Capabilities the token should carry, as an UPPER BOUND — the issued
            set is never wider than this. Omitted, the platform's default set is
            issued. A capability the platform does not issue is rejected with
            validation.invalid_request rather than dropped, so a caller is never
            left believing its token is narrower than it is.
        origin:
          type: string
          format: uri
          description: >
            Origin (scheme+host) of the embedding site. NOT YET ENFORCED —
            allowed-origin validation is planned (ADR-0009) and this value is
            currently ignored. Optional for that reason: a required field that
            nothing reads is a contract that lies to the integrator.
      required:
        - contactId

    EmbedSession:
      type: object
      description: An issued embed session token (ADR-0009 stub).
      properties:
        token:
          type: string
          description: Short-lived, opaque embed session token.
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry of the token.
      required:
        - token
        - expiresAt

    EmbedContactPatch:
      type: object
      description: >
        Optimistic-concurrency patch of host-owned custom fields from the widget
        (ADR-0009 §4). Only `custom` is writable — profile/identities are not
        host-owned (ADR-0007 §3).
      properties:
        custom:
          type: object
          additionalProperties: true
          description: Host-owned free-form fields to merge into the contact.
        baseVersion:
          type: integer
          description: The `_meta.version` the widget last saw; a drift yields contact.version_conflict.
        idempotencyKey:
          type: string
          description: Dedups a retried patch (ADR-0002 §5).
      required:
        - custom
        - baseVersion

    EmbedSendRequest:
      type: object
      description: Send a text message from the widget into the scoped conversation (ADR-0009 §5).
      properties:
        text:
          type: string
        idempotencyKey:
          type: string
      required:
        - text

    StartBotConversationRequest:
      type: object
      description: Raise a bot conversation via deep-link / click-to-chat (ADR-0009 §6).
      properties:
        channelId:
          type: string
          description: The bot channel to raise the session on (e.g. a tg_bot channel).
        mode:
          type: string
          description: Session mode; `bot` raises a click-to-chat deep-link.
          enum:
            - bot
        idempotencyKey:
          type: string
      required:
        - channelId
        - mode

    BotSession:
      type: object
      description: A pending deep-link bot session (ADR-0009 §6).
      properties:
        conversationId:
          type: string
          description: The (pending) conversation id.
        state:
          type: string
          description: Session state; `pending_optin` until the contact taps the link.
          enum:
            - pending_optin
            - open
        inviteLink:
          type: string
          format: uri
          description: The click-to-chat deep-link the contact taps to opt in.
        expiresAt:
          type: string
          format: date-time
          description: When the invite link / pending session expires.
      required:
        - conversationId
        - state
        - inviteLink
        - expiresAt

    FeedMessage:
      type: object
      description: One message in the embed conversation feed (ADR-0009 §5).
      properties:
        id:
          type: string
        providerMsgId:
          type: string
        direction:
          $ref: '#/components/schemas/Direction'
        type:
          $ref: '#/components/schemas/MsgType'
        text:
          type: string
        author:
          type: string
        ts:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/MsgStatus'
        media:
          $ref: '#/components/schemas/MediaInfo'
        # R10-A (#64, ADR-0062 §3): who wrote an inbound GROUP message.
        senderName:
          type: string
          description: >
            The participant who wrote this group message — their contact name,
            else the name the channel reported, else their number. Absent
            outside groups (a direct conversation's author is its contact).
        senderContactId:
          type: string
          description: The contact of that participant, when they are one.
      required:
        - id
        - direction
        - type
        - ts

    UploadedMedia:
      type: object
      description: A stored outbound attachment, ready to reference in a send.
      properties:
        url:
          type: string
          description: Absolute, time-limited URL the provider fetches.
        mime:
          type: string
        filename:
          type: string
        size:
          type: integer
      required:
        - url

    MediaInfo:
      type: object
      description: >
        Attachment descriptor for a media message. `url` is a PLATFORM url
        (`/v1/messages/{id}/media`) — the object store is private and provider
        links expire, so bytes are always read back through the platform.
      properties:
        url:
          type: string
        mime:
          type: string
        filename:
          type: string
        caption:
          type: string
        note:
          type: boolean
          description: >
            Marks a message RECORDED in the client — a voice message or a video
            note ("кружечок") — as opposed to an audio/video FILE that happens to
            be attached. A presentation hint, not a payload type: it rides beside
            `type` instead of becoming a MsgType member so that an adapter which
            does not know it sends an ordinary audio/video rather than answering
            `ErrPermanent`, which would drop the message entirely. Honoured on
            tg_client for both forms and on tg_bot for voice only — the Bot API
            refuses a URL for sendVideoNote, so a round frame degrades to a
            plain video there.
      required:
        - url

    MessageHistory:
      type: object
      description: A page of a contact's message history across all channels.
      properties:
        contactId:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/FeedMessage'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - contactId
        - messages

    ConversationFeed:
      type: object
      description: The scoped, append-only conversation feed (ADR-0009 §5).
      properties:
        conversationId:
          type: string
        channelType:
          $ref: '#/components/schemas/ChannelKind'
        contactId:
          type: string
        status:
          type: string
          description: Conversation status (e.g. open, closed).
        messages:
          type: array
          items:
            $ref: '#/components/schemas/FeedMessage'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
        # R10-A (#64, ADR-0062): a group has no contact ("" contactId).
        conversationKind:
          $ref: '#/components/schemas/ConversationKind'
        subject:
          type: string
          description: A group's name as the channel last reported it.
      required:
        - conversationId
        - contactId
        - messages

    # =========================================================================
    # pagination.yaml — cursor pagination (ADR-0002 §5)
    # =========================================================================
    PageInfo:
      type: object
      description: >
        Cursor pagination envelope metadata. `nextCursor` is an opaque forward
        cursor; it is absent/empty on the last page. Pass it back as the `since`
        query parameter to fetch the next page (ADR-0008 §3).
      properties:
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more pages.

    # =========================================================================
    # webhooks + access pool — admin management (ADR-0002, M6 S4)
    # =========================================================================
    WebhookSubscription:
      type: object
      description: An outbound webhook subscription (ADR-0031). The signing secret is never returned.
      properties:
        id:
          type: string
        url:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        status:
          type: string
      required:
        - id
        - url
        - status
    ErasureResult:
      type: object
      description: >
        How many rows an erasure touched. Reported so the caller can enter it in
        its own erasure journal — "we asked and it said 0/0/0/0" is a materially
        different record from "it removed a contact and redacted 412 messages".
      properties:
        contacts:
          type: integer
          description: 1 when the contact row still existed, 0 when already gone.
        identities:
          type: integer
          description: Channel identities (phone / username / provider id) removed.
        conversations:
          type: integer
          description: Conversations whose chat id was replaced with a tombstone.
        messages:
          type: integer
          description: >
            Messages redacted — body, metadata, contact reference, chat id and
            provider message id.
        outbox:
          type: integer
          description: >
            Outbox rows removed. The outbox holds its own full copy of the
            envelope — body, chat id, contact reference — so redacting the
            message row does not reach it. A row still pending is dropped, which
            cancels an outbound message to someone who asked to be erased.
        media:
          type: integer
          description: >
            Attachments queued for removal from the object store. Queued rather
            than deleted inline: the object store is not in the erasure's
            transaction, so the keys are committed with the redaction and a
            background sweep removes the bytes immediately afterwards.
        waLidPairs:
          type: integer
          description: >
            WhatsApp lid↔phone pairs forgotten. WhatsApp discloses that a LID and
            a phone number are the same person, and we remember it so the two
            halves of a contact converge (ADR-0060 §5). That memory IS the phone
            number, in its own table, reachable from the LID — so an erasure that
            redacted every message and left it behind would have left the number
            behind.
        # R10-A (#64, ADR-0062 §6): the person's group memberships.
        groupParticipants:
          type: integer
          description: >
            Group memberships removed: the person leaves every group's
            participant list. The groups themselves are nobody's personal data
            and stay; the person's own messages in them are counted in
            `messages`.
        # R11-D (#58, ADR-0067 §4): compliance evidence of the person.
        complianceEvidence:
          type: integer
          description: >
            Compliance evidence excerpts of the person's messages blanked. The
            findings stay (rule, severity, review state); their explanations and
            notes in the person's conversations are blanked too.
      required:
        - contacts
        - identities
        - conversations
        - messages
        - outbox
        - media
        - waLidPairs
        - groupParticipants
        - complianceEvidence

    UpdateWebhookRequest:
      type: object
      description: >
        Change a subscription's delivery state. Only the state is mutable here:
        editing the url would silently redirect a tenant's events to a different
        destination under the same id, which is a re-registration, not an edit.
      properties:
        status:
          type: string
          description: >
            `active` delivers; `disabled` stops delivery and keeps everything
            else, so the subscription can be resumed without re-sharing a key.
          enum:
            - active
            - disabled
      required:
        - status
      additionalProperties: false

    WebhookList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
      required:
        - items
    RegisterWebhookRequest:
      type: object
      description: >
        A new subscription. `secret` and `secretRef` are two ways of giving it a
        signing key and are mutually exclusive; omitting both asks the platform
        to mint one (ADR-0046).
      properties:
        url:
          type: string
        secret:
          type: string
          writeOnly: true
          description: >
            The HMAC signing key itself. Handed straight to the secret store —
            our database keeps only the reference, and no operation reads it
            back. Write-only, exactly like the credentials on
            setChannelCredentials (ADR-0011). Use this when the receiving
            endpoint already has a key it expects us to sign with.
        secretRef:
          type: string
          description: >
            Secret-store reference (secret://...) to a key ALREADY placed in the
            store, for a caller who manages the vault directly. Never the key
            itself — that is `secret`.
        eventTypes:
          type: array
          items:
            type: string
      required:
        - url
    RegisterWebhookResult:
      type: object
      description: >
        A newly registered subscription. Identical to WebhookSubscription except
        for `secret`, which carries a key the platform minted. A separate schema
        so the listing keeps its guarantee intact: WebhookSubscription carries no
        key, in any response, ever.
      properties:
        id:
          type: string
        url:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        status:
          type: string
        secret:
          type: string
          readOnly: true
          description: >
            The minted HMAC signing key — shown once and unrecoverable. Nothing
            else returns it: the platform holds only what the secret store holds,
            and listWebhooks does not read even the reference. Configure the
            receiver with it now; if it is lost, the way back is to delete this
            subscription and register another.
      required:
        - id
        - url
        - status
    SetAccessPoolHealthRequest:
      type: object
      properties:
        health:
          type: string
          enum: [healthy, degraded, banned]
          description: >
            `healthy` returns the entry to rotation. `degraded` and `banned` take
            it out — the platform sets those itself when a send fails with a
            permanent auth or ban error.
      required:
        - health

    DeadLetter:
      type: object
      description: >
        One webhook delivery the platform stopped retrying, with enough context to
        judge it: which cabinet and endpoint it was for, what it carried, and what
        the last attempt got back.
      properties:
        id:
          type: string
          description: The delivery id — pass it to the replay operation.
        cabinetId:
          type: string
        webhookId:
          type: string
        url:
          type: string
          description: The endpoint that would not accept it.
        eventId:
          type: string
        eventType:
          type: string
        attemptNo:
          type: integer
          description: How many attempts were made before giving up.
        responseCode:
          type: integer
          description: HTTP status of the last attempt; 0 when it never got a response.
        error:
          type: string
          description: Transport or status error recorded on the last attempt.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - cabinetId
        - webhookId
        - url
        - eventId
        - eventType
        - attemptNo
        - createdAt

    DeadLetterList:
      type: object
      description: Dead-lettered deliveries, newest first.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeadLetter'
      required:
        - items

    # =========================================================================
    # platform operators (ADR-0075)
    # =========================================================================
    PlatformOperator:
      type: object
      description: One grant of platform power to a person (platform_operators).
      properties:
        accountId:
          type: string
        email:
          type: string
        displayName:
          type: string
        grantedBy:
          type: string
          nullable: true
          description: >
            The account id of the operator who granted it; null when no person
            granted it — the bootstrap command on the server, or a
            platform:admin API key (the security log names which).
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the grant is active.
        active:
          type: boolean
        reason:
          type: string
      required:
        - accountId
        - email
        - displayName
        - grantedBy
        - grantedAt
        - revokedAt
        - active
        - reason

    PlatformOperatorList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformOperator'
      required:
        - items

    GrantPlatformOperatorRequest:
      type: object
      description: Exactly one of accountId and email.
      properties:
        accountId:
          type: string
        email:
          type: string
        reason:
          type: string
          maxLength: 500
          description: Why the grant is made; kept with the grant and in the security log.
    # =========================================================================
    # end of platform operators (ADR-0075)
    # =========================================================================

    AccessPoolEntry:
      type: object
      description: One auth-out credential in the pool (ADR-0029). credentialsRef is a pointer, never the secret.
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        status:
          type: string
        health:
          type: string
        weight:
          type: integer
        credentialsRef:
          type: string
          description: >
            Pointer into the secret store — never the secret itself. ABSENT
            unless the calling key carries the `secrets:read` scope, which the
            cabinet-wide `*` does not imply: a key issued to send messages has no
            need to learn where the provider credentials are kept. Each
            disclosure is recorded in the audit trail as accesspool.secrets.read.
      required:
        - id
        - kind
        - status
        - health
    AccessPoolList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessPoolEntry'
      required:
        - items
    AddAccessPoolEntryRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ChannelKind'
        credentialsRef:
          type: string
          description: Secret-store reference (secret://...); never the credential itself.
        status:
          type: string
          description: Initial status — "active" or "next" (default next).
        weight:
          type: integer
      required:
        - kind
        - credentialsRef
    RotateAccessPoolRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ChannelKind'
      required:
        - kind
    RotateAccessPoolResult:
      type: object
      properties:
        promoted:
          type: string
        retired:
          type: array
          items:
            type: string
      required:
        - promoted
    AuditEntry:
      type: object
      description: One append-only audit record (ADR-0028). detail carries only non-sensitive metadata.
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actorType:
          type: string
        actorId:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        result:
          type: string
        detail:
          type: object
          additionalProperties: true
          description: >
            Non-sensitive metadata recorded with the action — the counts an
            erasure touched, the scope a denied request asked for, the status a
            webhook was moved to. Never secrets, tokens or message bodies
            (ADR-0028 §3).

            It is the part that makes an entry answerable rather than merely
            present: "key.issue on cabinet X" says less than the scopes that key
            was given. Recorded from the start and never returned until now.
      required:
        - id
        - action
        - result
    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
      required:
        - items

    # =========================================================================
    # auth.yaml — human identity and sessions (ADR-0049)
    # =========================================================================
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
        totpCode:
          type: string
          description: The current TOTP code. Omit on the first post; send it after a 202.
          maxLength: 16
        recoveryCode:
          type: string
          description: >
            A single-use recovery code, INSTEAD of totpCode when the authenticator
            is lost. Ignored when totpCode is also present (no code is burned).
          maxLength: 64
      required:
        - email
        - password
    SecondFactorChallenge:
      type: object
      description: The password was right; post again with a second-factor code.
      properties:
        secondFactorRequired:
          type: boolean
        methods:
          type: array
          description: The codes the next post may carry.
          items:
            type: string
            enum:
              - totp
              - recovery_code
      required:
        - secondFactorRequired
        - methods
    AccountSummary:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        locale:
          type: string
          description: uk | en | ru
        secondFactorEnabled:
          type: boolean
      required:
        - id
        - email
        - displayName
        - locale
        - secondFactorEnabled
    CurrentSession:
      type: object
      properties:
        id:
          type: string
          description: sha256 hex of the cookie — the id listMySessions and revokeMySession use.
        expiresAt:
          type: string
          format: date-time
        secondFactorPassed:
          type: boolean
      required:
        - id
        - expiresAt
        - secondFactorPassed
    LoginResult:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountSummary'
        session:
          $ref: '#/components/schemas/CurrentSession'
      required:
        - account
        - session
    MembershipLevel:
      type: string
      description: Where a membership lives (ADR-0050 §1). `platform` is a property of the account, not a row.
      enum:
        - platform
        - organization
        - cabinet
    Role:
      type: string
      description: One of the seven ADR-0050 roles.
      enum:
        - platform_admin
        - org_owner
        - org_admin
        - cabinet_admin
        - supervisor
        - agent
        - viewer
    AccountMembership:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/MembershipLevel'
        organizationId:
          type: string
          description: Set for an organization-level membership.
        cabinetId:
          type: string
          description: Set for a cabinet-level membership.
        role:
          $ref: '#/components/schemas/Role'
      required:
        - level
        - role
    CabinetAccess:
      type: object
      description: >
        The effective rights in one cabinet — the same Principal the
        authorization middleware builds for a request to that cabinet.
      properties:
        cabinetId:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: The union of the roles' permissions (internal/authz), sorted.
          items:
            type: string
        allChannels:
          type: boolean
          description: >
            True when the rights reach every channel of the cabinet. False for an
            agent, who reaches exactly `channelIds` — which may be EMPTY (no
            assignment means no channel, never every channel).
        channelIds:
          type: array
          description: The assigned channels when allChannels is false; empty otherwise.
          items:
            type: string
      required:
        - cabinetId
        - roles
        - permissions
        - allChannels
        - channelIds
    Me:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountSummary'
        session:
          $ref: '#/components/schemas/CurrentSession'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/AccountMembership'
        currentCabinet:
          $ref: '#/components/schemas/CabinetAccess'
        platformOperator:
          type: boolean
          description: >
            True when the account holds an active platform-operator grant
            (ADR-0075). Platform power additionally requires the second factor
            in the session (session.secondFactorPassed); without it platform
            operations answer 403 auth.second_factor_required.
        cabinets:
          type: array
          description: >
            Every cabinet the caller can select with X-Linqelio-Cabinet through
            their memberships: cabinet-level memberships plus every cabinet of
            an organization where they hold an org-level role — exactly the
            cabinets in which the authorization middleware finds a role. A
            platform operator's reach to ALL cabinets is not listed here (use
            listCabinets).
          items:
            $ref: '#/components/schemas/ReachableCabinet'
      required:
        - account
        - session
        - memberships
        - platformOperator
        - cabinets
    ReachableCabinet:
      type: object
      description: A cabinet the caller reaches through a membership.
      properties:
        id:
          type: string
        name:
          type: string
        organizationId:
          type: string
        via:
          type: string
          enum:
            - cabinet
            - organization
          description: >
            `cabinet` when the caller holds a cabinet-level membership there
            (whether or not an org-level role also reaches it), otherwise
            `organization`.
      required:
        - id
        - name
        - organizationId
        - via
    AuthSessionSummary:
      type: object
      properties:
        id:
          type: string
        current:
          type: boolean
          description: True for the session this request was made with.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Refreshed at most once per 30 s cache window.
        expiresAt:
          type: string
          format: date-time
        ip:
          type: string
        userAgent:
          type: string
        secondFactorPassed:
          type: boolean
      required:
        - id
        - current
        - createdAt
        - lastSeenAt
        - expiresAt
        - userAgent
        - secondFactorPassed
    AuthSessionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthSessionSummary'
      required:
        - items
    TokenPasswordRequest:
      type: object
      description: A single-use invite or reset token from the email, and the password the person chose.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          description: At least 12 characters (NIST SP 800-63B favours length over composition rules).
          minLength: 1
          maxLength: 1024
      required:
        - token
        - password
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
      required:
        - email
    TotpEnrollment:
      type: object
      properties:
        enrollmentId:
          type: string
          description: Names this pending seed in enableTotp. Bound to the caller's account server-side.
        secret:
          type: string
          description: The base32 seed. Shown once; render the QR code from otpauthUri locally.
        otpauthUri:
          type: string
          description: otpauth://totp/... (SHA1, 6 digits, 30 s) for authenticator apps.
      required:
        - enrollmentId
        - secret
        - otpauthUri
    EnableTotpRequest:
      type: object
      properties:
        enrollmentId:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          minLength: 1
          maxLength: 16
      required:
        - enrollmentId
        - code
    SecondFactorCode:
      type: object
      properties:
        code:
          type: string
          description: The CURRENT TOTP code (a recovery code is not accepted).
          minLength: 1
          maxLength: 16
      required:
        - code
    RecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          description: Single-use codes, shown once. Store them offline.
          items:
            type: string
      required:
        - recoveryCodes

    # =========================================================================
    # team.yaml — team management (issue #31, ADR-0075 §5). BEGIN R4-T schemas.
    # =========================================================================
    MemberStatus:
      type: string
      description: >
        A person's standing in the cabinet: `active`; `invited` while they have
        not yet set a password; `blocked` when the account or every membership
        is blocked.
      enum:
        - active
        - invited
        - blocked
      # Explicit constant names: without them the generator resolves the clash
      # with other enums holding "active" by renaming THEIR constants too.
      x-enum-varnames:
        - MemberStatusActive
        - MemberStatusInvited
        - MemberStatusBlocked
    TeamMembership:
      type: object
      description: One membership row that reaches the cabinet.
      properties:
        level:
          $ref: '#/components/schemas/MembershipLevel'
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MemberStatus'
      required:
        - level
        - role
        - status
    TeamMember:
      type: object
      description: A person with a membership reaching the cabinet.
      properties:
        accountId:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/MembershipLevel'
        memberships:
          type: array
          description: >
            Every row behind `role` — a person may hold an organization-level
            and a cabinet-level role at once; `role` is the most privileged.
          items:
            $ref: '#/components/schemas/TeamMembership'
        status:
          $ref: '#/components/schemas/MemberStatus'
        channelIds:
          type: array
          description: >
            The channels assigned in THIS cabinet. They bound an agent; for a
            cabinet-wide role they are informational.
          items:
            type: string
        defaultChannelId:
          type: string
          description: The channel a reply leaves through when none is named; absent when none.
        joinedAt:
          type: string
          format: date-time
        version:
          type: string
          description: Opaque optimistic-concurrency token; send it back with updateMember.
      required:
        - accountId
        - email
        - displayName
        - role
        - level
        - memberships
        - status
        - channelIds
        - joinedAt
        - version
    TeamActor:
      type: object
      description: Who performed an action — a person, an API key, or the platform itself.
      properties:
        type:
          type: string
          description: "`account`, `api_key` or `system` (the audit actor types, ADR-0028)."
        id:
          type: string
          description: The account id or the key id; empty for `system`.
        email:
          type: string
          description: Present for an account that still exists.
      required:
        - type
        - id
    TeamInvite:
      type: object
      description: A pending invite into the cabinet. The link itself is never part of it.
      properties:
        id:
          type: string
        email:
          type: string
        # R5-C (ADR-0076): which of the two invite kinds this is.
        kind:
          $ref: '#/components/schemas/TeamInviteKind'
        role:
          $ref: '#/components/schemas/Role'
        channelIds:
          type: array
          items:
            type: string
        defaultChannelId:
          type: string
        invitedBy:
          $ref: '#/components/schemas/TeamActor'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - kind
        - role
        - channelIds
        - invitedBy
        - createdAt
        - expiresAt
    TeamMemberList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        invites:
          type: array
          description: Every pending invite; present on the first page only.
          items:
            $ref: '#/components/schemas/TeamInvite'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo
    InviteMemberRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
        role:
          $ref: '#/components/schemas/Role'
        displayName:
          type: string
          maxLength: 200
        locale:
          type: string
          description: The invitee's interface language; the account default when omitted.
          enum:
            - uk
            - en
            - ru
        channelIds:
          type: array
          description: Channels of this cabinet to assign on acceptance.
          maxItems: 200
          items:
            type: string
        defaultChannelId:
          type: string
          description: Must be one of `channelIds`.
      required:
        - email
        - role
    InviteMemberResult:
      type: object
      properties:
        invite:
          $ref: '#/components/schemas/TeamInvite'
        inviteUrl:
          type: string
          description: >
            The invite link — a secret for as long as it lives (single use,
            72 h). Returned here once and never again; the token travels in the
            URL fragment so it reaches no access log or Referer header.
        expiresAt:
          type: string
          format: date-time
      required:
        - invite
        - inviteUrl
        - expiresAt
    UpdateMemberRequest:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          description: The member's `version` as last read.
        role:
          $ref: '#/components/schemas/Role'
        channelIds:
          type: array
          description: Replaces the assignments in this cabinet; an empty list removes them all.
          maxItems: 200
          items:
            type: string
        defaultChannelId:
          type: string
          description: Must be among the assignments after the change.
      required:
        - version
    # END R4-T schemas

    # -------------------------------------------------------------------------
    # BEGIN R5-C schemas: membership-only invites (issue #118, ADR-0076)
    # -------------------------------------------------------------------------
    TeamInviteKind:
      type: string
      description: >
        `new_account` — the link sets the password of an account that has none
        yet, and binds the membership (acceptInvite). `existing_account` — a
        membership-only invite for an account that already has a password: the
        link sets nothing on the account and is accepted by that account's own
        session (acceptMembershipInvite).
      enum:
        - new_account
        - existing_account
    MembershipInviteTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: The token from the invite link's fragment.
      required:
        - token
    MembershipInvite:
      type: object
      description: >
        A membership-only invite as the invited person sees it. Never carries
        the link or its token.
      properties:
        inviteId:
          type: string
        cabinetId:
          type: string
        cabinetName:
          type: string
        email:
          type: string
          description: The invited account's email (the caller's own).
        role:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/MembershipLevel'
        channelCount:
          type: integer
          description: How many channels the invite assigns (their ids are the cabinet's business until the person joins).
        invitedBy:
          $ref: '#/components/schemas/TeamActor'
        expiresAt:
          type: string
          format: date-time
      required:
        - inviteId
        - cabinetId
        - cabinetName
        - email
        - role
        - level
        - channelCount
        - invitedBy
        - expiresAt
    # END R5-C schemas

    # =========================================================================
    # settings.yaml — cabinet settings (issue #89, ADR-0057). BEGIN R6-A schemas.
    # =========================================================================
    # One schema per section validates the `value` of putSettingsSection; the
    # control plane validates against THESE definitions (read from the embedded
    # contract), so the contract is the only place a section's shape is stated.
    # Conventions shared by every section:
    #   - closed (additionalProperties: false) and every key optional: a section
    #     is replaced whole, and a key left out is simply not configured;
    #   - a SECRET key is `writeOnly` (+ nullable): the client sends the value,
    #     the platform stores it in the secret store and keeps a reference; reads
    #     report it only in `secrets.<key>`. Omitted = keep, null = clear. The
    #     write-only keys of each schema are exactly the secret keys the store
    #     declares (internal/store/cabinetsettings.go) — a test holds them equal;
    #   - no string anywhere may be a `secret://…` reference.
    SettingsSection:
      type: string
      description: A section of cabinet settings (ADR-0057 §2). Closed vocabulary.
      enum:
        - ai
        - ai_guard
        - ai_profile
        - compliance
        - notifications
        - exports
        - calls
        - messaging_defaults
        - desk

    CabinetSettingsSection:
      type: object
      description: >
        One section as a client sees it: the non-secret values, a set / not-set
        flag per secret key, and the version to send back in If-Match.
      properties:
        section:
          $ref: '#/components/schemas/SettingsSection'
        value:
          type: object
          additionalProperties: true
          description: >
            The section's non-secret keys, shaped by the section's schema
            (AiSettings, NotificationsSettings, ...) minus its write-only keys.
            `{}` for a section never written.
        secrets:
          type: object
          additionalProperties:
            type: boolean
          description: >
            Every secret key of the section -> whether it is configured. The value
            and its secret-store reference are never returned.
        version:
          type: integer
          minimum: 0
          description: 0 for a section never written; +1 on every write. Also the ETag.
        updatedAt:
          type: string
          format: date-time
          description: When the section was last written. Absent at version 0.
        updatedBy:
          type: string
          description: >
            The account id of the person who last wrote the section. Absent at
            version 0 and for a write made with an API key (the audit trail names
            the key).
      required:
        - section
        - value
        - secrets
        - version

    PutSettingsSectionRequest:
      type: object
      description: The whole new value of one section.
      properties:
        value:
          type: object
          additionalProperties: true
          description: >
            Validated against the section's schema: ai -> AiSettings, ai_guard ->
            AiGuardSettings, ai_profile -> AiProfileSettings, compliance ->
            ComplianceSettings, notifications -> NotificationsSettings, exports ->
            ExportsSettings, calls -> CallsSettings, messaging_defaults ->
            MessagingDefaultsSettings, desk -> DeskSettings. A failure is 400
            validation.invalid_request with one errors[] entry per offending key.
      required:
        - value

    AiSettings:
      type: object
      additionalProperties: false
      description: The model provider binding.
      properties:
        provider:
          type: string
          enum: [openai, anthropic, azure_openai, google, openai_compatible]
        model:
          type: string
          minLength: 1
          maxLength: 200
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
          description: Only for a self-hosted or compatible endpoint.
        api_key:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
          description: Write-only. Omit to keep, null to clear.
        # --- R10-D (issue #57, ADR-0064 §4): consent, minimization, tasks ----
        enabled:
          type: boolean
          description: >
            The cabinet's consent to send customer conversation text to its AI
            provider. Off (the default) = no task that reads customer data runs;
            queued ones end `skipped`. The connection test sends no customer
            data and works either way.
        allow_phone_numbers:
          type: boolean
          description: >
            Let phone numbers reach the prompt. Off (the default): every phone
            number in a message is replaced by `[phone]` before sending.
        allow_emails:
          type: boolean
          description: Let e-mail addresses reach the prompt. Off (the default) = replaced by `[email]`.
        profile_extract:
          type: boolean
          description: >
            Fill the contact fields marked for AI (`aiExtract`) from conversations,
            as values with provenance `ai` that never overwrite what a person or
            the host wrote (ADR-0061). Needs `enabled`.

    AiGuardSettings:
      type: object
      additionalProperties: false
      description: What the assistant is not allowed to do, and when it hands over.
      properties:
        blocked_topics:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 200
        escalation_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence below which a conversation is handed to a person.
        moderation_provider:
          type: string
          minLength: 1
          maxLength: 100
        api_key:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
          description: The moderation provider's key. Write-only.
        # --- R11-C (issue #59, ADR-0068): the AI anti-ban guard ----------------
        enabled:
          type: boolean
          description: >
            Check every outbound message with the AI guard before it is sent
            (needs `ai.enabled`). Off (the default) = the guard never calls the
            provider.
        mode:
          $ref: '#/components/schemas/AiGuardMode'
        warn_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Risk score from which the guard warns (default 0.5); campaigns in enforce mode are refused from here.
        block_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Risk score from which enforce mode refuses an interactive send (default 0.8).

    AiProfileSettings:
      type: object
      additionalProperties: false
      description: Who the assistant is.
      properties:
        persona:
          type: string
          maxLength: 4000
        tone:
          type: string
          enum: [neutral, friendly, formal, concise]
        languages:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
          description: BCP 47 language tags, e.g. uk, en, pt-BR.
        # --- R11-C (issue #59, ADR-0068): the AI contact questionnaire ---------
        questionnaire:
          type: array
          maxItems: 50
          description: >
            The contact field keys the AI fills from conversations, in order.
            Empty or absent = every field marked `aiExtract`. A field the AI may
            not write (not `aiExtract`, not owned by `ai`) is skipped.
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,62}$'
        summary_field:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
          description: >
            A text contact field for the short AI summary of the contact
            (provenance `ai`; a person's edit is never overwritten). Absent = no
            summary.
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Suggestions the model is less sure of are dropped (default 0.6).
        min_messages:
          type: integer
          minimum: 1
          maximum: 1000
          description: >
            New customer messages since the last run before a conversation is
            read again (default 1). Counted in the database.

    ComplianceSettings:
      type: object
      additionalProperties: false
      description: Retention and consent wording.
      properties:
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: How long conversation history is kept.
        consent_text:
          type: string
          maxLength: 4000
        # R8-B (issue #44, ADR-0084).
        consent_enforcement:
          type: string
          enum: [enforce, observe]
          description: >
            How the send policy applies contact consent. observe (the default,
            also when unset): a send to a contact without consent on that channel
            goes out, and the missing consent is journaled and reported as a
            warning (policy.consent_missing). enforce: such a send is refused
            with policy.consent_missing — the cabinet's own switch, once it
            collects consent.
        # --- R11-D (issue #58, ADR-0067): the compliance scan's rules ---------
        rules_builtin:
          $ref: '#/components/schemas/ComplianceBuiltinRules'
        rules_custom:
          type: array
          maxItems: 30
          description: The cabinet's own rules, in natural language.
          items:
            $ref: '#/components/schemas/ComplianceCustomRule'
        prohibited_topics:
          type: array
          maxItems: 50
          description: Topics that must not be discussed (builtin.prohibited_topic).
          items:
            type: string
            minLength: 1
            maxLength: 200
        policy_notes:
          type: string
          maxLength: 4000
          description: >
            What agents may promise (refund terms, discounts, deadlines) — what
            builtin.off_policy_promise checks promises against.
        scan_schedule:
          type: string
          enum: [off, hourly, daily]
          description: >
            A periodic cabinet-wide scan of the last `scan_lookback_hours`
            (default off). Needs `ai.enabled`.
        scan_lookback_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: The period a scheduled scan covers, ending now (default 24).
        auto_actions:
          $ref: '#/components/schemas/ComplianceAutoActions'
        finding_retention_days:
          type: integer
          minimum: 30
          maximum: 1095
          description: How long a finding and its evidence are kept (default 365).

    NotificationsSettings:
      type: object
      additionalProperties: false
      description: Where operational notices go — mail, a webhook, a Telegram chat.
      properties:
        email_to:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 320
            pattern: '^[^@\s]+@[^@\s]+$'
        from_email:
          type: string
          maxLength: 320
          pattern: '^[^@\s]+@[^@\s]+$'
        smtp_host:
          type: string
          minLength: 1
          maxLength: 253
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
        smtp_username:
          type: string
          maxLength: 320
        smtp_password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        webhook_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
        webhook_secret:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        telegram_chat_id:
          type: string
          minLength: 1
          maxLength: 64
        telegram_bot_token:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096

    ExportsSettings:
      type: object
      additionalProperties: false
      description: The destination and format of data exports.
      properties:
        destination:
          type: string
          enum: [s3, sftp]
        format:
          type: string
          enum: [csv, jsonl]
        s3_endpoint:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
        s3_bucket:
          type: string
          minLength: 1
          maxLength: 255
        s3_region:
          type: string
          maxLength: 64
        s3_access_key_id:
          type: string
          maxLength: 256
        s3_secret_key:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        sftp_host:
          type: string
          minLength: 1
          maxLength: 253
        sftp_port:
          type: integer
          minimum: 1
          maximum: 65535
        sftp_username:
          type: string
          maxLength: 320
        sftp_password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        sftp_path:
          type: string
          maxLength: 1024

    CallsSettings:
      type: object
      additionalProperties: false
      description: Telephony — the provider binding and recording.
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 100
        sip_uri:
          type: string
          maxLength: 2048
          pattern: '^sips?:'
        sip_username:
          type: string
          maxLength: 320
        sip_password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        provider_token:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
        recording_enabled:
          type: boolean

    MessagingDefaultsSettings:
      type: object
      additionalProperties: false
      description: What a send inherits when it says nothing — signature, locale, quiet hours.
      properties:
        signature:
          type: string
          maxLength: 1000
        locale:
          type: string
          pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
        quiet_hours_start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM, local to `timezone`.
        quiet_hours_end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        timezone:
          type: string
          maxLength: 64
          description: >
            IANA time zone name, e.g. Europe/Kyiv. The send windows and quiet
            hours are counted in it; unset (or a name the server does not know)
            means UTC — never the server's own zone.
        # --- BEGIN R8-C send-policy limits (issue #40, ADR-0058 §9) -----------
        # Read by the send-rule checkers. Quiet hours above are the business
        # hours rule: a campaign send inside them is rescheduled to their end,
        # an interactive one is warned.
        daily_limit:
          type: integer
          minimum: 0
          maximum: 1000000
          description: >
            Messages per channel per calendar day (in `timezone`). 0 disables the
            daily window. Unset: the platform default for the channel kind
            (1000 for wa_web and tg_client, none for official APIs). Media counts
            like text. At the limit sends are deferred to the next day.
        hourly_limit:
          type: integer
          minimum: 0
          maximum: 100000
          description: >
            Messages per channel per clock hour (in `timezone`). 0 disables the
            hourly window. Unset: the platform default for the channel kind
            (200 for wa_web and tg_client, none for official APIs).
        contact_limit:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            Messages to ONE contact within `contact_limit_hours` (a sliding
            window). 0 or unset: no per-contact limit. At the limit a campaign
            send is deferred; an interactive one is sent with a warning.
        contact_limit_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: The per-contact period in hours. Unset means 24.
        duplicate_window_hours:
          type: integer
          minimum: 0
          maximum: 168
          description: >
            How long a sent text counts as recent for the duplicate rule. 0
            disables it; unset means 24. Texts are compared after normalization
            (case, whitespace, punctuation, URLs and numbers masked).
        # --- END R8-C send-policy limits ----------------------------------------

    DeskSettings:
      type: object
      additionalProperties: false
      description: The operator desk binding (ADR-0053).
      properties:
        provider:
          type: string
          # R11-F (#74, ADR-0094 §1): the cabinet's desk — chatwoot, the
          # Bitrix24 open lines, or none (API/embed only). Unset = the
          # deployment's default (Chatwoot when it runs).
          enum: [chatwoot, bitrix24, none]
          x-enum-varnames: [DeskProviderChatwoot, DeskProviderBitrix24, DeskProviderNone]
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
        account_id:
          type: integer
          minimum: 1
        api_token:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 4096
    # END R6-A schemas

    # =========================================================================
    # BEGIN R7-A organizations (schemas) — issue #34, ADR-0051 / ADR-0079
    # =========================================================================
    QuotaLimits:
      type: object
      description: >
        Metric -> limit (ADR-0051 §2): `cabinets`, `seats`, `messages.month`,
        `ai.tokens.month`, `retention.days`, `channels.<kind>`. A limit is a
        non-negative integer, or -1 for unlimited. Validated by the platform's
        quota rules: an unknown metric or a value below -1 is refused.
      additionalProperties:
        type: integer
        format: int64
        minimum: -1
      example:
        channels.wa_web: 5
        seats: -1

    Plan:
      type: object
      description: A tariff — a full declaration of limits (every metric stated).
      properties:
        id:
          type: string
        name:
          type: string
        limits:
          $ref: '#/components/schemas/QuotaLimits'
      required:
        - id
        - name
        - limits

    PlanList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
      required:
        - items

    Organization:
      type: object
      description: >
        A customer (ADR-0051 §1): requisites, plan, manual limit overrides,
        trial and status. `status` and `suspendedReason` are read-only here
        (suspension is issue #36).
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          readOnly: true
          description: Lifecycle status, e.g. `active` or `suspended`.
        suspendedReason:
          type: string
          readOnly: true
          description: Why the organization is suspended; empty when it is not.
        planId:
          type: string
        planName:
          type: string
        limitsOverride:
          $ref: '#/components/schemas/QuotaLimits'
        limitsOverrideError:
          type: string
          readOnly: true
          description: >
            Present only when the STORED override is not a valid limits document
            (written around this API). `limitsOverride` then reads as empty, every
            quota reservation of the organization fails closed, and
            updateOrganization with a new `limitsOverride` repairs it.
        legalName:
          type: string
        billingEmail:
          type: string
        taxId:
          type: string
        trialUntil:
          type: string
          format: date-time
          description: End of the trial; absent when the organization has none.
        cabinetCount:
          type: integer
          format: int64
          description: How many cabinets the organization owns.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - suspendedReason
        - planId
        - planName
        - limitsOverride
        - legalName
        - billingEmail
        - taxId
        - cabinetCount
        - createdAt
        - updatedAt

    OrganizationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The organization's display name; the slug derives from it.
        planId:
          type: string
          description: The plan (default `base`).
        limitsOverride:
          $ref: '#/components/schemas/QuotaLimits'
        legalName:
          type: string
          maxLength: 300
        billingEmail:
          type: string
          maxLength: 254
        taxId:
          type: string
          maxLength: 64
        trialUntil:
          type: string
          format: date-time
      required:
        - name

    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      description: Merge patch; omitted fields are unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        planId:
          type: string
        limitsOverride:
          $ref: '#/components/schemas/QuotaLimits'
        legalName:
          type: string
          maxLength: 300
        billingEmail:
          type: string
          maxLength: 254
        taxId:
          type: string
          maxLength: 64
        trialUntil:
          type: string
          format: date-time
        clearTrialUntil:
          type: boolean
          description: Remove the trial end. Not together with trialUntil.

    UpdateOrganizationRequisitesRequest:
      type: object
      additionalProperties: false
      description: Omitted fields are unchanged; an empty string clears a field.
      properties:
        legalName:
          type: string
          maxLength: 300
        billingEmail:
          type: string
          maxLength: 254
        taxId:
          type: string
          maxLength: 64

    UsageMetric:
      type: object
      description: >
        One metric of an organization: what it uses and what it may. `limit` is
        absent exactly when `unlimited` is true. `used` is absent for a
        `setting` (retention.days is a term, not a consumption).
      properties:
        metric:
          type: string
          example: channels.wa_web
        kind:
          type: string
          enum: [resource, monthly, setting]
          description: >
            `resource` is counted from the resources now; `monthly` is the
            current calendar month (UTC); `setting` has no consumption.
        used:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        unlimited:
          type: boolean
        overridden:
          type: boolean
          description: The limit comes from the organization's manual override, not the plan.
      required:
        - metric
        - kind
        - unlimited
        - overridden

    OrganizationUsage:
      type: object
      properties:
        organizationId:
          type: string
        planId:
          type: string
        period:
          type: string
          format: date
          description: The first day (UTC) of the month the monthly metrics count.
        asOf:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/UsageMetric'
      required:
        - organizationId
        - planId
        - period
        - asOf
        - metrics

    OrganizationAuditEntry:
      type: object
      description: One entry of an organization's append-only trail.
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actorType:
          type: string
          description: The author's kind, `api_key` or `account`.
        actorId:
          type: string
          description: The key id or the account id of the author.
        action:
          type: string
        detail:
          type: object
          additionalProperties: true
          description: >
            For a change, `changes.<field>.before` and `.after` for every field
            that changed. For a creation, `after` (the initial terms).
      required:
        - id
        - occurredAt
        - actorType
        - actorId
        - action
        - detail

    OrganizationAuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationAuditEntry'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo
    # END R7-A organizations (schemas)

    # =========================================================================
    # BEGIN R8-F schemas: typed contact field schema (issue #48, ADR-0061).
    # Mirrors internal/contacts/fields.go; the paths are the "BEGIN R8-F
    # contact fields (paths)" block.
    # =========================================================================
    ContactFieldType:
      type: string
      description: >
        The value type of a contact field — a CLOSED set (ADR-0061 §2). Values
        travel in one JSON shape per type: `text`/`enum`/`phone`/`email`/`url`
        a string, `date` a `YYYY-MM-DD` string, `number` a JSON number (a
        numeric-looking string is refused), `bool` a boolean, `multi_enum` an
        array of option values.
      enum:
        - text
        - number
        - date
        - bool
        - enum
        - multi_enum
        - phone
        - email
        - url
      # Explicit Go names: a bare `Text` would collide with MsgType's and make
      # the generator rename every MsgType constant under its callers.
      x-enum-varnames:
        - ContactFieldTypeText
        - ContactFieldTypeNumber
        - ContactFieldTypeDate
        - ContactFieldTypeBool
        - ContactFieldTypeEnum
        - ContactFieldTypeMultiEnum
        - ContactFieldTypePhone
        - ContactFieldTypeEmail
        - ContactFieldTypeUrl

    ContactFieldOwner:
      type: string
      description: >
        Who may write the field's value at all (ADR-0061 §3): a person may
        correct any field; the host (API key) writes `host` fields only; the AI
        writes `ai` fields and those flagged `aiExtract`.
      enum:
        - platform
        - host
        - ai

    ContactFieldValueSource:
      type: string
      description: >
        What kind of writer put a value there (ADR-0061 §4). Settles conflicts
        on the ladder `human > host > platform > ai`: a lower writer never
        overwrites a higher one's value.
      enum:
        - human
        - host
        - platform
        - ai

    ContactFieldLabel:
      type: object
      description: Localized label, locale -> text (`uk`, `en`, `ru`; ADR-0016).
      additionalProperties:
        type: string

    ContactFieldOption:
      type: object
      description: One choice of an `enum` / `multi_enum` field.
      properties:
        value:
          type: string
          minLength: 1
          description: The stable machine value — what is stored on the contact.
        label:
          $ref: '#/components/schemas/ContactFieldLabel'
      required:
        - value

    ContactFieldDef:
      type: object
      description: One typed field of the cabinet's contact schema (ADR-0061 §1).
      properties:
        key:
          type: string
          description: Machine key; stable for the field's life (a rename is a label change).
        label:
          $ref: '#/components/schemas/ContactFieldLabel'
        type:
          $ref: '#/components/schemas/ContactFieldType'
        options:
          type: array
          description: Choices of an `enum` / `multi_enum` field; empty for every other type.
          items:
            $ref: '#/components/schemas/ContactFieldOption'
        owner:
          $ref: '#/components/schemas/ContactFieldOwner'
        aiExtract:
          type: boolean
          description: The AI may fill this field from conversations.
        aiHint:
          type: string
          description: What the AI should look for, in the cabinet's own words.
        syncToDesk:
          type: boolean
          description: Project this field into the cabinet's desk (ADR-0053) — e.g. a Chatwoot contact attribute.
        position:
          type: integer
          minimum: 0
          description: Display order in the contact card and the schema editor.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - key
        - label
        - type
        - options
        - owner
        - aiExtract
        - aiHint
        - syncToDesk
        - position

    PutContactFieldRequest:
      type: object
      description: >
        The whole definition of one field (PUT replaces it). The key is the
        path; the `type` must equal the stored one when the field exists.
      properties:
        label:
          $ref: '#/components/schemas/ContactFieldLabel'
        type:
          $ref: '#/components/schemas/ContactFieldType'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldOption'
        owner:
          # Defaults to `host` when omitted (the store's default).
          $ref: '#/components/schemas/ContactFieldOwner'
        aiExtract:
          type: boolean
        aiHint:
          type: string
          maxLength: 1000
        syncToDesk:
          type: boolean
        position:
          type: integer
          minimum: 0
      required:
        - type

    ContactFieldList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldDef'
      required:
        - items

    ContactFieldValueOrigin:
      type: object
      description: >
        Read-only provenance of ONE stored value: what kind of writer set it,
        when, and which actor (an account id, an API key id, an AI job id).
      properties:
        source:
          $ref: '#/components/schemas/ContactFieldValueSource'
        at:
          type: string
          format: date-time
        by:
          type: string
      required:
        - source
        - at

    ContactFieldValues:
      type: object
      description: >
        A contact's typed values (key -> value, one JSON shape per type) and,
        per key, the value's provenance. Only fields the cabinet currently
        defines appear.
      properties:
        fields:
          type: object
          additionalProperties: true
        provenance:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContactFieldValueOrigin'
      required:
        - fields
        - provenance

    SetContactFieldsRequest:
      type: object
      description: >
        key -> new value; `null` clears the field. Provenance is not part of the
        body: it is the caller's (a session writes as `human`, an API key as
        `host`).
      properties:
        fields:
          type: object
          additionalProperties: true
      required:
        - fields

    ContactFieldKept:
      type: object
      description: >
        A field the write did NOT change and why — not an error. `lower_authority`:
        the stored value came from a more authoritative writer (ADR-0061 §4).
      properties:
        field:
          type: string
        reason:
          type: string
        held:
          $ref: '#/components/schemas/ContactFieldValueSource'
        offered:
          $ref: '#/components/schemas/ContactFieldValueSource'
      required:
        - field
        - reason
        - held
        - offered

    SetContactFieldsResult:
      type: object
      description: The contact's values after the write, and what the write did.
      properties:
        fields:
          type: object
          additionalProperties: true
        provenance:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContactFieldValueOrigin'
        applied:
          type: array
          items:
            type: string
        cleared:
          type: array
          items:
            type: string
        kept:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldKept'
      required:
        - fields
        - provenance
        - applied
        - cleared
        - kept
    # END R8-F schemas

    # =========================================================================
    # BEGIN R9-B schemas: contact merge (issue #50, ADR-0090). Mirrors
    # internal/store/contactmerge.go and internal/contacts/merge.go; the paths
    # are the "BEGIN R9-B contact merge (paths)" block. Every enum names its Go
    # constants explicitly (x-enum-varnames): bare values like `open` or
    # `merged` would collide with other enums and rename their constants.
    # =========================================================================
    ContactMergeActor:
      type: object
      description: Who merged, undid or dismissed — a person's account, an API key, or the platform.
      properties:
        type:
          type: string
          enum:
            - account
            - api_key
            - system
          x-enum-varnames:
            - ContactMergeActorAccount
            - ContactMergeActorApiKey
            - ContactMergeActorSystem
        id:
          type: string
          description: The account id or the key id (kid); absent for the platform.
      required:
        - type

    ContactMergeProposalStatus:
      type: string
      description: >
        `open` — waiting for a decision; `dismissed` — the two are different
        people, not proposed again; `merged` — resolved by a merge.
      enum:
        - open
        - dismissed
        - merged
      x-enum-varnames:
        - ContactMergeProposalOpen
        - ContactMergeProposalDismissed
        - ContactMergeProposalMerged

    ContactMergeProposalReason:
      type: string
      description: >
        Why the pair was proposed (deterministic only, ADR-0008 §2):
        `shared_phone` — identities of both carry the same phone;
        `lid_pair` — a WhatsApp LID contact and its phone contact, per a LID
        pair the platform recorded (ADR-0060 §5).
      enum:
        - shared_phone
        - lid_pair
      x-enum-varnames:
        - ContactMergeReasonSharedPhone
        - ContactMergeReasonLidPair

    ContactMergeParty:
      type: object
      description: One side of a proposal, compact — enough to show the pair in a list.
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          description: The contact's lifecycle status (`new`, `active`, `merged`).
        channelTypes:
          type: array
          description: The channel kinds of the contact's identities.
          items:
            $ref: '#/components/schemas/ChannelKind'
      required:
        - id
        - displayName
        - status
        - channelTypes

    ContactMergeProposal:
      type: object
      description: A pair of contacts that may be the same person.
      properties:
        id:
          type: string
          format: uuid
        contactA:
          $ref: '#/components/schemas/ContactMergeParty'
        contactB:
          $ref: '#/components/schemas/ContactMergeParty'
        reason:
          $ref: '#/components/schemas/ContactMergeProposalReason'
        sharedKey:
          type: string
          description: The exact value both share (the phone number, digits).
        status:
          $ref: '#/components/schemas/ContactMergeProposalStatus'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          $ref: '#/components/schemas/ContactMergeActor'
        mergeId:
          type: string
          format: uuid
          description: The merge that resolved it (status `merged`).
      required:
        - id
        - contactA
        - contactB
        - reason
        - sharedKey
        - status
        - createdAt

    ContactMergeProposalList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactMergeProposal'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo

    ContactMergeProposalChange:
      type: object
      description: The proposal after a dismissal; `changed` is false for an idempotent repeat.
      properties:
        changed:
          type: boolean
        proposal:
          $ref: '#/components/schemas/ContactMergeProposal'
      required:
        - changed
        - proposal

    ContactMergePick:
      type: string
      description: The side of a merge a conflicting field value is taken from.
      enum:
        - survivor
        - merged
      x-enum-varnames:
        - ContactMergePickSurvivor
        - ContactMergePickMerged

    ContactMergeRequest:
      type: object
      description: Merge `mergedId` into `survivorId`.
      properties:
        survivorId:
          type: string
          format: uuid
          description: The contact that stays.
        mergedId:
          type: string
          format: uuid
          description: The contact folded into the survivor (kept as a `merged` tombstone).
        proposalId:
          type: string
          format: uuid
          description: The open proposal this merge resolves (must name exactly this pair).
        fieldChoices:
          type: object
          description: >
            Typed field key -> the side whose value the survivor keeps, for keys
            where the two contacts hold DIFFERENT values. Keys not listed
            follow the authority ladder (ADR-0061 §4).
          additionalProperties:
            $ref: '#/components/schemas/ContactMergePick'
      required:
        - survivorId
        - mergedId

    ContactMergeFieldResolution:
      type: object
      description: How one typed field the merged contact held was settled — the key and the side, never the value.
      properties:
        field:
          type: string
        from:
          $ref: '#/components/schemas/ContactMergePick'
        rule:
          type: string
          description: >
            `only_merged` — only the merged contact had a value (moved with its
            provenance); `equal` — both had the same; `choice` — a conflict the
            caller settled; `authority` — a conflict the authority ladder settled.
          enum:
            - only_merged
            - equal
            - choice
            - authority
          x-enum-varnames:
            - ContactMergeRuleOnlyMerged
            - ContactMergeRuleEqual
            - ContactMergeRuleChoice
            - ContactMergeRuleAuthority
      required:
        - field
        - from
        - rule

    ContactMergeSummary:
      type: object
      description: What a merge moved and changed, by count and by key.
      properties:
        identities:
          type: integer
        hostRefs:
          type: integer
        consents:
          type: integer
        conversations:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ContactMergeFieldResolution'
        customKeys:
          type: array
          description: Host `custom` keys added to the survivor.
          items:
            type: string
        tags:
          type: integer
          description: How many tags the survivor gained.
        profile:
          type: array
          description: Empty profile slots of the survivor that were filled (displayName, avatarUrl, locale).
          items:
            type: string
        legacy:
          type: boolean
          description: Recorded before merges were exposed; only identities, host refs and consents are known.
      required:
        - identities
        - hostRefs
        - consents
        - conversations
        - fields
        - customKeys
        - tags
        - profile
        - legacy

    ContactMergeStatus:
      type: string
      description: '`active` — in force; `undone` — reversed.'
      enum:
        - active
        - undone
      x-enum-varnames:
        - ContactMergeStatusActive
        - ContactMergeStatusUndone

    ContactMerge:
      type: object
      description: One recorded merge.
      properties:
        id:
          type: string
          format: uuid
        survivorId:
          type: string
          format: uuid
        mergedId:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid
        reason:
          type: string
          description: The proposal's reason (`shared_phone`, `lid_pair`), `manual`, or what the store recorded.
        status:
          $ref: '#/components/schemas/ContactMergeStatus'
        mergedAt:
          type: string
          format: date-time
        mergedBy:
          $ref: '#/components/schemas/ContactMergeActor'
        undoUntil:
          type: string
          format: date-time
          description: The end of the undo window (30 days after the merge).
        undoneAt:
          type: string
          format: date-time
        undoneBy:
          $ref: '#/components/schemas/ContactMergeActor'
        summary:
          $ref: '#/components/schemas/ContactMergeSummary'
      required:
        - id
        - survivorId
        - mergedId
        - reason
        - status
        - mergedAt
        - mergedBy
        - undoUntil
        - summary

    ContactMergeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactMerge'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - pageInfo

    ContactMergeUndoResult:
      type: object
      description: The merge after an undo; `changed` is false when it was already undone.
      properties:
        changed:
          type: boolean
        merge:
          $ref: '#/components/schemas/ContactMerge'
      required:
        - changed
        - merge
    # END R9-B schemas

    # BEGIN R9-F schemas: realtime event stream (issue #56, ADR-0069).
    RealtimeEvent:
      type: object
      description: >
        The `data:` line of a bus event on streamEvents. `data` is the event's
        payload exactly as the outbound webhooks receive it — identifiers only
        (ADR-0031 §4), never message content or a pairing QR. Types:
        `message.inbound`, `message.status` (channels:read on the channel);
        `channel.status` (channels:read on the channel); `channel.qr`
        (channels:manage on the channel — `data.stage` says what changed; the
        QR itself is read with getChannelStatus); `settings.updated`
        (settings:manage). Reserved, not emitted yet: `campaign.progress`,
        `sync.progress`, `compliance.scan_progress`, `alert.raised`. A type the
        server does not know is delivered to nobody. R11-D (ADR-0067):
        `compliance.scan_progress` is emitted (compliance:read; a channel or
        conversation scan also needs its channel in scope —
        ComplianceScanProgressEvent), and `compliance.notice` (channels:read on
        the channel — ComplianceNoticeEvent) is a finding's `notify` action.
      properties:
        eventId:
          type: string
          description: The event's id — the same event a webhook delivery carries.
        type:
          type: string
          description: The event type (also the SSE `event:` name).
        cabinetId:
          type: string
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: The event payload (identifiers only).
      required:
        - eventId
        - type
        - cabinetId
        - occurredAt
        - data
    EmbedRealtimeEvent:
      type: object
      description: >
        The `data:` line of a bus event on streamEmbedEvents: which message of
        the widget's conversation changed. Read the message itself through
        getEmbedConversation.
      properties:
        type:
          type: string
          description: message.inbound or message.status.
        messageId:
          type: string
        conversationId:
          type: string
        status:
          type: string
          description: The new delivery status (message.status only).
      required:
        - type
        - messageId
    # END R9-F schemas

    # =========================================================================
    # BEGIN R9-A schemas: contact import / export (issue #49, ADR-0089)
    # =========================================================================
    JobActor:
      type: object
      description: Who created a job — a person (`account`) or an API key (`api_key`).
      properties:
        type:
          type: string
          description: '`account` or `api_key`.'
        id:
          type: string
      required:
        - type
        - id

    ContactImportStatus:
      type: string
      description: >
        uploaded (stored, not started) → queued → running → completed; or
        failed (the run could not go on; `error` says why) / cancelled.
        Rows applied before a failure or a cancel stay applied.
      enum:
        - uploaded
        - queued
        - running
        - completed
        - failed
        - cancelled
      # Explicit Go names: bare constants (Queued, Running, Completed…) would
      # collide with other enums and make the generator rename theirs.
      x-enum-varnames:
        - ImportUploaded
        - ImportQueued
        - ImportRunning
        - ImportCompleted
        - ImportFailed
        - ImportCancelled

    ContactImport:
      type: object
      description: One import job — the uploaded file and its run.
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContactImportStatus'
        filename:
          type: string
        sizeBytes:
          type: integer
        headers:
          type: array
          description: The file's column names, in order (a mapping refers to them by index).
          items:
            type: string
        totalRows:
          type: integer
          description: Data rows in the file (the header and blank lines not counted).
        sampleRows:
          type: array
          description: The first data rows, as uploaded — only in the upload's answer.
          items:
            type: array
            items:
              type: string
        mapping:
          $ref: '#/components/schemas/ContactImportMapping'
        processedRows:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        rejected:
          type: integer
          description: Rows not applied — each has at least one `error` line in the report.
        warnings:
          type: integer
          description: Rows applied with at least one `warning` line (a kept value, an opt-out).
        mergeProposals:
          type: integer
          description: Rows whose keys point at different existing contacts (identity_conflict).
        consentsRecorded:
          type: integer
          description: Consents newly recorded from consent columns (source `import`).
        createdBy:
          $ref: '#/components/schemas/JobActor'
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - filename
        - sizeBytes
        - headers
        - totalRows
        - processedRows
        - created
        - updated
        - rejected
        - warnings
        - mergeProposals
        - consentsRecorded
        - createdBy
        - createdAt

    ContactImportList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactImport'
      required:
        - items

    ContactImportCancel:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/ContactImport'
        changed:
          type: boolean
          description: false when the job already was cancelled.
      required:
        - job
        - changed

    ContactImportTarget:
      type: string
      description: >
        What a column becomes: `identity` (an address on `channelKind` — a
        phone for WhatsApp; a @handle, user id or +phone for Telegram; the
        provider id for Viber), `hostRef` (the host's record id in `system`),
        `name`, `field` (a typed contact field, `field` = its key), `tags`
        (several per cell, separated by `;`, `,` or `|`), `consent` (the
        explicit consent column for `channelId`: yes/true/1/так/да records
        consent, no/false/0/ні/нет or empty records none, anything else is a
        row error), or `ignore`.
      enum:
        - identity
        - hostRef
        - name
        - field
        - tags
        - consent
        - ignore
      x-enum-varnames:
        - ImportTargetIdentity
        - ImportTargetHostRef
        - ImportTargetName
        - ImportTargetField
        - ImportTargetTags
        - ImportTargetConsent
        - ImportTargetIgnore

    ContactImportColumn:
      type: object
      properties:
        column:
          type: integer
          minimum: 0
          description: The column's 0-based index in `headers`.
        target:
          $ref: '#/components/schemas/ContactImportTarget'
        channelKind:
          $ref: '#/components/schemas/ChannelKind'
        field:
          type: string
          description: The typed field's key (target `field`).
        channelId:
          type: string
          format: uuid
          description: The channel the consent is for (target `consent`).
        system:
          type: string
          description: The host system the record id belongs to (target `hostRef`), e.g. `crm`.
      required:
        - column
        - target

    ContactImportMapping:
      type: object
      description: >
        Which column goes where. Needs at least one `identity` or `hostRef`
        column and at least one `consent` column.
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ContactImportColumn'
      required:
        - columns

    ContactImportIssueSeverity:
      type: string
      enum:
        - error
        - warning
      x-enum-varnames:
        - ImportIssueError
        - ImportIssueWarning

    ContactImportIssue:
      type: object
      description: >
        One line of the per-row report. `code`: errors — no_identity,
        identity_invalid, host_ref_invalid, name_invalid, field_invalid
        (`detail` = the ADR-0061 reason, e.g. type_mismatch), tag_invalid,
        consent_invalid, cell_too_long, identity_conflict (a merge proposal,
        with `contactIds`), apply_failed; warnings — field_kept (a value of a
        more authoritative writer stays; `detail` = its source),
        consent_revoked (the person opted out; `detail` = the channel),
        extra_cells.
      properties:
        row:
          type: integer
          description: The row as a spreadsheet numbers it (the header is row 1).
        severity:
          $ref: '#/components/schemas/ContactImportIssueSeverity'
        code:
          type: string
        column:
          type: string
          description: The column's name in the file (or the field key).
        detail:
          type: string
        contactIds:
          type: array
          items:
            type: string
      required:
        - row
        - severity
        - code

    ContactImportPreview:
      type: object
      description: What the checked rows would do. Nothing was written.
      properties:
        rowsChecked:
          type: integer
        totalRows:
          type: integer
        valid:
          type: integer
          description: Rows that would be applied (created + updated).
        wouldCreate:
          type: integer
        wouldUpdate:
          type: integer
        rejected:
          type: integer
        mergeProposals:
          type: integer
        withConsent:
          type: integer
          description: Valid rows whose consent columns record at least one consent.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ContactImportIssue'
      required:
        - rowsChecked
        - totalRows
        - valid
        - wouldCreate
        - wouldUpdate
        - rejected
        - mergeProposals
        - withConsent
        - issues

    ContactExportRequest:
      type: object
      description: >
        Which contacts to export; every member narrows, and an empty request
        exports every contact the caller can see.
      properties:
        tags:
          type: array
          description: The contact carries every one of these tags.
          items:
            type: string
        channelIds:
          type: array
          description: The contact has a conversation on one of these channels (narrows the caller's scope).
          items:
            type: string
            format: uuid
        fields:
          type: object
          description: Typed field key -> value; the contact's value, as text, equals it.
          additionalProperties:
            type: string
        status:
          $ref: '#/components/schemas/ContactStatus'

    ContactExportStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - expired
      x-enum-varnames:
        - ExportQueued
        - ExportRunning
        - ExportCompleted
        - ExportFailed
        - ExportExpired

    ContactExport:
      type: object
      description: One export job.
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContactExportStatus'
        filter:
          $ref: '#/components/schemas/ContactExportRequest'
        scoped:
          type: boolean
          description: The export is limited to the channels its author works (an assigned agent).
        rowCount:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        createdBy:
          $ref: '#/components/schemas/JobActor'
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the file is deleted.
        downloadPath:
          type: string
          description: The API path the completed file is downloaded from (downloadContactExport), relative to the server URL.
      required:
        - id
        - status
        - filter
        - scoped
        - rowCount
        - sizeBytes
        - createdBy
        - createdAt

    ContactExportList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactExport'
      required:
        - items
    # END R9-A schemas
    # BEGIN R10-F schemas: Bitrix24 application skeleton (issue #73, ADR-0093)
    BitrixPortalStatus:
      type: string
      description: >
        `installed` — linked and holding working tokens; `reauth_required` —
        Bitrix no longer accepts our refresh token or client (pair again);
        `uninstalled` — the application was removed on the portal;
        `unlinked` — the link was ended here. The last two hold no tokens.
      enum:
        - installed
        - reauth_required
        - uninstalled
        - unlinked
    BitrixPortal:
      type: object
      description: >
        One installation of our Bitrix24 application (ADR-0052). Never carries a
        token or a secret.
      required: [id, cabinetId, memberId, domain, clientId, status, scopes, installedBy, installedAt, eventsVerified]
      properties:
        id:
          type: string
          format: uuid
        cabinetId:
          type: string
          format: uuid
        memberId:
          type: string
          description: The portal's stable identity (Bitrix `member_id`).
        domain:
          type: string
          description: The portal's current domain, as Bitrix's OAuth server last reported it.
        clientId:
          type: string
          description: The local application's OAuth client id.
        status:
          $ref: '#/components/schemas/BitrixPortalStatus'
        statusReason:
          type: string
          description: Why the installation left `installed` (empty while it is).
        scopes:
          type: array
          items:
            type: string
        installedBy:
          type: string
          description: The Bitrix user id whose tokens the installation holds (the installing administrator).
        installedAt:
          type: string
          format: date-time
        uninstalledAt:
          type: string
          format: date-time
        accessExpiresAt:
          type: string
          format: date-time
          description: When the held access token expires (it is refreshed before that).
        refreshedAt:
          type: string
          format: date-time
        eventsVerified:
          type: boolean
          description: >
            Whether the portal's application token is known — learned from the
            first verified lifecycle event; until then host events (the
            uninstall included) cannot be authenticated and are refused.
    BitrixPortalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BitrixPortal'
    BitrixPairingRequest:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          description: The local application's client id ("local.…"), from the portal's application form.
        clientSecret:
          type: string
          minLength: 1
          maxLength: 256
          description: The local application's client secret. Stored in the secret store only; never returned.
    BitrixPairing:
      type: object
      required: [code, expiresAt, clientId]
      properties:
        code:
          type: string
          description: The one-time pairing code (shown once; only its hash is kept).
        expiresAt:
          type: string
          format: date-time
        clientId:
          type: string
        appUrl:
          type: string
          description: >
            Our application page — register it as the local application's
            handler path; with `?install=1` as its installation path.
            Absent when the deployment has no PUBLIC_BASE_URL.
    BitrixPairingRedeemRequest:
      type: object
      required: [pairingCode, memberId, refreshToken]
      properties:
        pairingCode:
          type: string
          minLength: 1
          maxLength: 64
        memberId:
          type: string
          minLength: 1
          maxLength: 128
          description: The portal's member_id as the iframe reports it; must match what Bitrix's OAuth server says.
        domain:
          type: string
          maxLength: 255
          description: Informational; the stored domain is the OAuth server's.
        refreshToken:
          type: string
          minLength: 1
          maxLength: 512
          description: The refresh token from `BX24.getAuth()`; redeemed at Bitrix's OAuth server and never stored as sent.
    BitrixAppSessionRequest:
      type: object
      required: [memberId, accessToken]
      properties:
        memberId:
          type: string
          minLength: 1
          maxLength: 128
        domain:
          type: string
          maxLength: 255
          description: Informational; the portal is always reached at the installation's stored endpoint.
        accessToken:
          type: string
          minLength: 1
          maxLength: 512
          description: The user's AUTH_ID (`BX24.getAuth().access_token`). Verified with the portal, then dropped.
    BitrixAppSession:
      type: object
      description: >
        The operator token (ADR-0055) for the widget inside the portal, and who
        it was issued to. Hold it in memory only.
      required: [token, expiresAt, cabinetId, accountId, displayName, cap, channelScoped, portalId, domain]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        cabinetId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
        cap:
          type: array
          items:
            type: string
          description: The capabilities the token carries (computed from the person's rights).
        channelScoped:
          type: boolean
          description: Whether the token is limited to channelIds.
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        portalId:
          type: string
          format: uuid
        domain:
          type: string
    BitrixUserLinkPending:
      type: object
      description: >
        The matched account holds an administrative role: it must confirm the
        link from its own console session (confirmBitrixUserLink) with this code.
      required: [linkCode, expiresAt]
      properties:
        linkCode:
          type: string
        expiresAt:
          type: string
          format: date-time
    BitrixUserLinkConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
    BitrixUserLink:
      type: object
      required: [portalId, cabinetId, domain, hostUserId, accountId]
      properties:
        portalId:
          type: string
          format: uuid
        cabinetId:
          type: string
          format: uuid
        domain:
          type: string
        hostUserId:
          type: string
        accountId:
          type: string
          format: uuid
    # END R10-F schemas

    # BEGIN R10-C schemas: message templates (issue #69, ADR-0092). Mirrors the
    # "BEGIN R10-C message templates (paths)" block. Meta-owned values
    # (status, category, formats) are plain strings on purpose: Meta adds
    # values, and a client must show an unknown one rather than fail to parse.
    SendTemplate:
      type: object
      description: >
        The template of a `type: template` send (wa_cloud only, ADR-0092): the
        channel's template by `name` + `language` exactly as Meta names them
        (listChannelTemplates), and one value per placeholder in `params`, in
        the order of the template's `parameters` (header first, then body).
        Checked before Meta sees it: the template must be approved and
        sendable, and `params` must fill every placeholder — none empty, no
        line breaks, tabs or more than 4 spaces in a row, the header within 60
        and the body within 1024 characters once filled. Values are trimmed.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 512
          example: order_update
        language:
          type: string
          minLength: 1
          maxLength: 32
          example: uk
        params:
          type: array
          description: One value per placeholder, aligned with the template's `parameters`. Omit (or []) for a template without placeholders.
          items:
            type: string
          example: ['A-17', 'Olena']
      required:
        - name
        - language
      additionalProperties: false

    MessageTemplateParameter:
      type: object
      description: One placeholder a send fills.
      properties:
        component:
          type: string
          description: '`header` or `body`.'
          example: body
        index:
          type: integer
          description: 1-based position within the component (the number of a positional `{{2}}`; the order of first appearance of a named one).
          example: 1
        name:
          type: string
          description: The placeholder's name in a named template (`{{first_name}}`); absent when positional.
        example:
          type: string
          description: Meta's sample value from the template's review, when it has one.
      required:
        - component
        - index

    MessageTemplateButton:
      type: object
      description: A template button, for display (QUICK_REPLY, URL, PHONE_NUMBER, ...).
      properties:
        type:
          type: string
          example: QUICK_REPLY
        text:
          type: string
      required:
        - type
        - text

    MessageTemplate:
      type: object
      description: >
        One template of a wa_cloud channel as of the last sync (Meta's object;
        created and approved in Meta's tools, not here).
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        name:
          type: string
        language:
          type: string
          description: Meta's language code (`uk`, `en_US`, ...).
        category:
          type: string
          description: Meta's category (MARKETING, UTILITY, AUTHENTICATION, ...).
        status:
          type: string
          description: Meta's review status (APPROVED, PENDING, REJECTED, PAUSED, DISABLED, ...). Only APPROVED is sent.
        parameterFormat:
          type: string
          description: '`positional` ({{1}}) or `named` ({{first_name}}).'
        sendable:
          type: boolean
          description: Approved by Meta, and every part of it is one we can fill. Only sendable templates can be sent.
        unsupportedReason:
          type: string
          description: >
            Why we cannot fill it, when we cannot (independent of the status):
            header_media, button_url_parameter, button_copy_code, button_otp,
            button_type, component_type, parameter_format, placeholders,
            no_body, malformed.
        headerFormat:
          type: string
          description: TEXT, IMAGE, VIDEO, DOCUMENT or LOCATION; absent when the template has no header.
        header:
          type: string
          description: The header text with its placeholders (text headers only).
        body:
          type: string
          description: The body text with its placeholders.
        footer:
          type: string
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/MessageTemplateButton'
        parameters:
          type: array
          description: The placeholders a send fills, in the order of SendTemplate.params.
          items:
            $ref: '#/components/schemas/MessageTemplateParameter'
        syncedAt:
          type: string
          format: date-time
          description: When Meta last listed it.
        changedAt:
          type: string
          format: date-time
          description: When its content or status last changed.
      required:
        - id
        - channelId
        - name
        - language
        - category
        - status
        - parameterFormat
        - sendable
        - body
        - buttons
        - parameters
        - syncedAt
        - changedAt

    MessageTemplateSyncState:
      type: object
      description: When the channel's templates were last refreshed, and how the last attempt went.
      properties:
        lastAttemptAt:
          type: string
          format: date-time
        lastSyncedAt:
          type: string
          format: date-time
          description: The last SUCCESSFUL sync; absent = never synced.
        lastErrorCode:
          $ref: '#/components/schemas/ErrorCode'
        lastError:
          type: string
          description: Why the last attempt failed (absent after a success).
        templateCount:
          type: integer
      required:
        - templateCount

    MessageTemplateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageTemplate'
        sync:
          $ref: '#/components/schemas/MessageTemplateSyncState'
      required:
        - items
        - sync

    TemplateSyncResult:
      type: object
      description: What one sync changed in the channel's stored templates.
      properties:
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        unchanged:
          type: integer
        total:
          type: integer
          description: Templates the channel holds after the sync.
        syncedAt:
          type: string
          format: date-time
      required:
        - added
        - updated
        - removed
        - unchanged
        - total
        - syncedAt
    # END R10-C schemas

    # BEGIN R10-D schemas: AI subsystem foundation (issue #57, ADR-0064)
    AiTask:
      type: string
      description: >
        A typed AI task (ADR-0064 §6). provider.test and profile.extract run
        today; guard.check (#59) and compliance.scan (#58) are declared with
        their modes and appear in the journal once they ship.
      enum:
        - provider.test
        - profile.extract
        - guard.check
        - compliance.scan
      x-enum-varnames:
        - AiTaskProviderTest
        - AiTaskProfileExtract
        - AiTaskGuardCheck
        - AiTaskComplianceScan

    AiRunStatus:
      type: string
      description: >
        queued (waiting; also a background run deferred by the monthly quota or
        a transient provider failure — `errorCode` says why) → running →
        succeeded | failed (the call or its answer failed) | refused (not
        attempted: suspended, not configured, over quota) | skipped (nothing to
        do, AI turned off for the cabinet, or stale).
      enum:
        - queued
        - running
        - succeeded
        - failed
        - refused
        - skipped
      x-enum-varnames:
        - AiRunQueued
        - AiRunRunning
        - AiRunSucceeded
        - AiRunFailed
        - AiRunRefused
        - AiRunSkipped

    AiRunMode:
      type: string
      description: sync — inside a request with a strict timeout; async — the background runner.
      enum:
        - sync
        - async
      x-enum-varnames:
        - AiRunModeSync
        - AiRunModeAsync

    AiRun:
      type: object
      description: One AI task execution. Metadata only — never a prompt or an answer.
      properties:
        id:
          type: string
          format: uuid
        task:
          $ref: '#/components/schemas/AiTask'
        promptVersion:
          type: string
          description: The versioned prompt the run used, e.g. `profile.extract/v1`.
        mode:
          $ref: '#/components/schemas/AiRunMode'
        status:
          $ref: '#/components/schemas/AiRunStatus'
        subjectType:
          type: string
          description: What the run read, e.g. `conversation`; empty for provider.test.
        subjectId:
          type: string
        inputRef:
          type: string
          description: The newest input item the prompt covered (e.g. a message id).
        provider:
          type: string
          description: Empty when the run was refused before a provider was chosen.
        model:
          type: string
        keySource:
          type: string
          description: Whose key paid for the call — `cabinet`, `platform`, or empty (none / keyless endpoint).
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        totalTokens:
          type: integer
          format: int64
          description: What this run added to ai.tokens.month.
        calls:
          type: integer
          description: Provider calls made (a schema retry is another call).
        latencyMs:
          type: integer
          description: Time spent waiting on the provider, all calls together.
        costMicros:
          type: integer
          format: int64
          nullable: true
          description: >
            Estimated cost in millionths of `currency`, from the platform's
            price table at the time of the run; null when no price is known for
            that provider and model.
        currency:
          type: string
        redactions:
          type: object
          additionalProperties:
            type: integer
          description: >
            How many identifiers minimization replaced in the prompt, per class
            (phone, email, card, iban).
        result:
          type: object
          additionalProperties: true
          description: >
            What the task did, as keys and counts (profile.extract: field keys
            applied, kept because a person or the host wrote them, and the
            number rejected) — never values.
        errorCode:
          type: string
          description: >
            Why the run did not succeed (or why a queued run waits): a catalog
            code like `tenancy.quota_exceeded`, `tenancy.suspended`,
            `ai.not_configured`, `ai.disabled`, or `ai.<kind>` for a provider
            failure (`ai.auth`, `ai.timeout`, `ai.unavailable`,
            `ai.rate_limited`, `ai.invalid_output`, …). Empty on success.
        errorDetail:
          type: string
          description: Our short explanation; never the provider's message.
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
        - id
        - task
        - promptVersion
        - mode
        - status
        - provider
        - model
        - inputTokens
        - outputTokens
        - totalTokens
        - calls
        - latencyMs
        - redactions
        - result
        - errorCode
        - attempts
        - createdAt

    AiMonthUsage:
      type: object
      description: >
        This calendar month (UTC) from the journal, next to the plan allowance.
        `tokens` is exactly what this cabinet's runs added to ai.tokens.month.
      properties:
        period:
          type: string
          format: date
          description: The first day of the month.
        runs:
          type: integer
          format: int64
        tokens:
          type: integer
          format: int64
          description: Tokens of this cabinet's runs finished this month.
        organizationTokens:
          type: integer
          format: int64
          description: The organization's ai.tokens.month so far (all its cabinets).
        tokensLimit:
          type: integer
          format: int64
          description: The organization's effective monthly limit; -1 = unlimited.
        costMicros:
          type: integer
          format: int64
        currency:
          type: string
        uncostedRuns:
          type: integer
          format: int64
          description: Runs that consumed tokens but have no known price.
      required:
        - period
        - runs
        - tokens
        - organizationTokens
        - tokensLimit
        - costMicros
        - currency
        - uncostedRuns

    AiRunList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiRun'
        month:
          $ref: '#/components/schemas/AiMonthUsage'
      required:
        - items
        - month

    AiProviderTestResult:
      type: object
      description: The outcome of one connectivity test.
      properties:
        ok:
          type: boolean
        runId:
          type: string
          format: uuid
        provider:
          type: string
        model:
          type: string
        latencyMs:
          type: integer
        totalTokens:
          type: integer
          format: int64
        errorCode:
          type: string
          description: When not ok — `ai.auth`, `ai.timeout`, `ai.unavailable`, `ai.invalid_output`, …
      required:
        - ok
        - runId
        - provider
        - model
        - latencyMs
        - totalTokens
    # END R10-D schemas

    # =========================================================================
    # BEGIN R10-B schemas: campaigns and delayed single sends (issues #67/#70,
    # ADR-0063). Mirrors the "BEGIN R10-B campaigns ... (paths)" block. Every
    # enum names its Go constants (x-enum-varnames): bare names (Running,
    # Paused, Sent…) would collide with other enums of the contract.
    # =========================================================================
    CampaignStatus:
      type: string
      description: >
        draft (editable) → scheduled (launched, waiting for startAt) → running
        ⇄ paused → completed (every recipient final) | cancelled (by a person)
        | failed (nothing can send it any more — every channel was deleted).
      enum:
        - draft
        - scheduled
        - running
        - paused
        - completed
        - cancelled
        - failed
      x-enum-varnames:
        - CampaignStatusDraft
        - CampaignStatusScheduled
        - CampaignStatusRunning
        - CampaignStatusPaused
        - CampaignStatusCompleted
        - CampaignStatusCancelled
        - CampaignStatusFailed

    CampaignPauseReason:
      type: string
      description: >
        Who paused the campaign: a person (`manual`), or the platform because
        the organization was suspended (`suspended`). Either way only a person
        resumes it.
      enum:
        - manual
        - suspended
      x-enum-varnames:
        - CampaignPausedManually
        - CampaignPausedBySuspension

    CampaignTemplateRef:
      type: object
      description: >
        A reference to an approved WhatsApp Business template (content `type:
        template`, wa_cloud channels only — R11-B, issue #68). `params` fill
        its placeholders per recipient, in send order (header first, then
        body): a literal, the contact's name or one of its typed fields, with a
        default. launchCampaign checks the template against every channel's
        last template sync (approved, fillable, as many params as
        placeholders). `variables` is kept for compatibility and not used for
        sending.
      properties:
        name:
          type: string
          maxLength: 512
        language:
          type: string
          maxLength: 16
        variables:
          type: object
          additionalProperties:
            type: string
        params:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CampaignTemplateParam'
      required:
        - name

    CampaignContent:
      type: object
      description: >
        The one message every recipient gets: a send body as for
        sendContactMessage (`type` + `content`) — text, or media as
        {"media": {"url": …, "caption": …}}.
      properties:
        type:
          $ref: '#/components/schemas/MsgType'
        content:
          type: object
          additionalProperties: true
        template:
          $ref: '#/components/schemas/CampaignTemplateRef'
      required:
        - type

    CampaignAudience:
      type: object
      description: >
        Who a campaign is for — a DEFINITION, resolved into recipients once, at
        launch. Recipients = `contactIds` ∪ (contacts matching the filter, when
        the filter has a member): the filter matches contacts carrying every
        tag, whose typed fields equal the given values, of the given status —
        or every contact with `all: true` — that are reachable on one of the
        campaign's channels. Merged-away contacts and contacts outside the
        author's channel scope are never included.
      properties:
        contactIds:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uuid
        tags:
          type: array
          maxItems: 20
          items:
            type: string
        fields:
          type: object
          description: Typed field key → the value its text must equal.
          additionalProperties:
            type: string
        status:
          type: string
          description: '`new` or `active`; omitted = both.'
        all:
          type: boolean
          description: Every reachable contact (must be asked for explicitly).

    CampaignWindow:
      type: object
      description: >
        The local hours the campaign may send in (`HH:MM`, 24 h, in
        `timeZone`); an `end` before `start` spans midnight. Outside it,
        recipients wait for the next opening. Send policy's quiet hours apply
        on top.
      properties:
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      required:
        - start
        - end

    CampaignInput:
      type: object
      description: A campaign draft (create, or full replacement of a draft).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        channelIds:
          type: array
          description: >
            The channels the campaign sends through, in rotation order:
            consecutive recipients start on consecutive channels, and a
            recipient not reachable on one falls to the next.
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uuid
        content:
          $ref: '#/components/schemas/CampaignContent'
        audience:
          $ref: '#/components/schemas/CampaignAudience'
        startAt:
          type: string
          format: date-time
          description: When to start; omitted = at launch.
        timeZone:
          type: string
          description: IANA zone of `window`; omitted = the cabinet's time zone (messaging defaults), else UTC.
        window:
          $ref: '#/components/schemas/CampaignWindow'
        ratePerMinute:
          type: integer
          minimum: 1
          maximum: 600
          description: >
            The campaign's own pace PER CHANNEL (default 20), on top of the
            send policy's windows and rate limits.
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
          description: >
            How many times a recipient whose send failed for a transient
            reason is tried (default 3). A policy "not now" is not a failure
            and does not count.
      required:
        - name
        - channelIds
        - content

    CampaignChannelState:
      type: object
      description: One channel of a campaign and its pacing state.
      properties:
        channelId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChannelKind'
        position:
          type: integer
        live:
          type: boolean
          description: The channel is connected and not held by a suspension.
        nextSendAt:
          type: string
          format: date-time
          description: The earliest moment the campaign's next message may leave through it.
        holdCode:
          type: string
          description: >
            A send-policy hold of the whole channel (e.g. policy.daily_limit)
            until nextSendAt; empty when none.
      required:
        - channelId
        - kind
        - position
        - live

    CampaignProgress:
      type: object
      description: Recipients per state (the funnel). `total` is the snapshot size.
      properties:
        total:
          type: integer
        queued:
          type: integer
        deferred:
          type: integer
        sending:
          type: integer
        sent:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
      required:
        - total
        - queued
        - deferred
        - sending
        - sent
        - skipped
        - failed
        - cancelled

    Campaign:
      type: object
      description: One campaign.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        pauseReason:
          $ref: '#/components/schemas/CampaignPauseReason'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/CampaignChannelState'
        content:
          $ref: '#/components/schemas/CampaignContent'
        audience:
          $ref: '#/components/schemas/CampaignAudience'
        startAt:
          type: string
          format: date-time
        timeZone:
          type: string
        window:
          $ref: '#/components/schemas/CampaignWindow'
        ratePerMinute:
          type: integer
        maxAttempts:
          type: integer
        progress:
          $ref: '#/components/schemas/CampaignProgress'
        createdBy:
          $ref: '#/components/schemas/JobActor'
        error:
          type: string
          description: Why a failed campaign failed.
        dryRunAt:
          type: string
          format: date-time
          description: >
            When the draft was last dry-run (dryRunCampaign); launchCampaign
            requires one newer than updatedAt (R11-B).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        launchedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        pausedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - channels
        - content
        - audience
        - timeZone
        - ratePerMinute
        - maxAttempts
        - progress
        - createdBy
        - createdAt
        - updatedAt

    CampaignList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items

    CampaignLaunch:
      type: object
      description: A launched campaign and what its audience resolved to.
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
        recipients:
          type: integer
          description: The snapshot size.
        explicitRequested:
          type: integer
          description: Explicit contacts in the audience.
        explicitIncluded:
          type: integer
          description: >
            How many of them are recipients (the rest are not contacts of the
            cabinet, were merged away, or are outside the author's scope).
      required:
        - campaign
        - recipients
        - explicitRequested
        - explicitIncluded

    CampaignDeletion:
      type: object
      properties:
        deleted:
          type: boolean
      required:
        - deleted

    CampaignRecipientState:
      type: string
      description: >
        queued → sending → sent | skipped | failed; deferred = policy (or the
        campaign's window / pace) said "not now" — due again at
        nextAttemptAt; cancelled = the campaign was cancelled or failed first.
      enum:
        - queued
        - deferred
        - sending
        - sent
        - skipped
        - failed
        - cancelled
      x-enum-varnames:
        - RecipientQueued
        - RecipientDeferred
        - RecipientSending
        - RecipientSent
        - RecipientSkipped
        - RecipientFailed
        - RecipientCancelled

    CampaignRecipient:
      type: object
      properties:
        contactId:
          type: string
          format: uuid
        contactName:
          type: string
        seq:
          type: integer
          description: Position in the snapshot.
        state:
          $ref: '#/components/schemas/CampaignRecipientState'
        attempts:
          type: integer
          description: Transient failures so far.
        nextAttemptAt:
          type: string
          format: date-time
        code:
          type: string
          description: >
            Why the recipient is deferred, skipped or failed — a catalog code
            (a string, not ErrorCode: a newer checker may bring a code this
            copy of the contract does not know).
        detail:
          type: string
        channelId:
          type: string
          format: uuid
        messageId:
          type: string
          description: The message the recipient was sent (state sent).
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
      required:
        - contactId
        - seq
        - state
        - attempts
        - updatedAt

    CampaignRecipientList:
      type: object
      properties:
        items:
          type: array
