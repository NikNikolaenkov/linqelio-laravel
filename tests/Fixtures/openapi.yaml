  /conversations/{id}/participants:
    get:
      operationId: listConversationParticipants
      x-permission: 'channels:read'
      summary: List a group conversation's participants.
      description: >
        The group's member list as the channel last reported it (ADR-0062):
        current participants first (owner, admins, members), then those who
        left. A participant who is a contact carries `contactId` and the
        contact's name; one who never wrote is only an address — a group does
        not turn its members into contacts. A direct conversation has no
        participants list (an empty page). Channel-scoped like the feed: a
        conversation outside the caller's scope is conversation.not_found.
      tags:
