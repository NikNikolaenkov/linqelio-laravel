    # END R10-B schemas

    # =========================================================================
    # BEGIN R10-E schemas: channel health + business alerts (issues #60/#61,
    # ADR-0065). Mirrors internal/health, internal/alerts and
    # internal/store/{channelhealth,alerts}.go; the paths are the "BEGIN R10-E
    # (paths)" block. Every enum names its Go constants (x-enum-varnames):
    # `warning`, `critical`, `open`, `email` exist in other enums too.
    # =========================================================================
    HealthRating:
      type: string
      description: >
        `good` (score ≥ 80), `warning` (50–79), `critical` (< 50); `unknown` —
        the channel has never been connected, so it has no health yet.
      enum:
        - good
        - warning
        - critical
        - unknown
      x-enum-varnames:
        - HealthRatingGood
        - HealthRatingWarning
        - HealthRatingCritical
        - HealthRatingUnknown

    HealthComponent:
      type: object
      description: >
        One part of the score. `key`: connection, delivery, policy, spam,
        stability, read_trend, warmup. `reason`: ok, insufficient_data, or
        what went wrong (offline, never_connected, suspended, failures,
        refusals, findings, disconnects, read_drop, warming_up, warmed,
        pool_degraded, pool_banned, no_pool). `params` are the numbers behind
        it (rates as 0..1 fractions, counts as whole numbers).
      properties:
        key:
          type: string
          example: delivery
        weight:
          type: integer
          description: The component's share of 100 — the most points it can cost.
          example: 25
        score:
          type: integer
          description: The component's own score, 0–100.
          example: 50
        lost:
          type: number
          format: double
          description: The points this component costs the total.
          example: 12.5
        reason:
          type: string
          example: failures
        insufficientData:
          type: boolean
          description: Too little traffic to judge; the component scored 100.
        params:
          type: object
          additionalProperties:
            type: number
            format: double
      required:
        - key
        - weight
        - score
        - lost
        - reason
        - insufficientData
        - params

    ChannelHealth:
      type: object
      description: A channel's current health and why (ADR-0065).
      properties:
        channelId:
          type: string
          format: uuid
        kind:
          type: string
          description: The channel kind (ChannelKind).
        computed:
          type: boolean
          description: false — the aggregation has not scored the channel yet (the rest is then empty).
        score:
          type: integer
          description: 0–100.
          example: 72
        rating:
          $ref: '#/components/schemas/HealthRating'
        cap:
          type: string
          description: >
            Set when a fact capped the score regardless of the rest: `offline`
            (connected before, not now — at most 30) or `pool_banned` (a banned
            access-pool credential of the channel's kind — at most 40).
        connected:
          type: boolean
        offlineSince:
          type: string
          format: date-time
          description: Since when a channel that was connected is offline.
        components:
          type: array
          items:
            $ref: '#/components/schemas/HealthComponent'
        reasons:
          type: array
          description: The keys of the components that cost points, costliest first — the "why".
          items:
            type: string
        computedAt:
          type: string
          format: date-time
          description: When this score was first computed.
        checkedAt:
          type: string
          format: date-time
          description: When the aggregation last confirmed it.
      required:
        - channelId
        - kind
        - computed
        - score
        - rating
        - connected
        - components
        - reasons

    ChannelHealthList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChannelHealth'
      required:
        - items

    ChannelHealthPoint:
      type: object
      description: One snapshot of a channel's health.
      properties:
        at:
          type: string
          format: date-time
        score:
          type: integer
        rating:
          $ref: '#/components/schemas/HealthRating'
        connected:
          type: boolean
        reasons:
          type: array
          items:
            type: string
      required:
        - at
        - score
        - rating
        - connected
        - reasons

    ChannelHealthHistory:
      type: object
      properties:
        channelId:
          type: string
          format: uuid
        items:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/ChannelHealthPoint'
      required:
        - channelId
        - items

    AlertType:
      type: string
      description: >
        The rule that raised an alert: `channel.health_low` (health below the
        threshold), `channel.disconnected` (a connected channel offline for
        longer than the threshold, minutes), `channel.failure_spike` (failed
        sends in the window), `channel.daily_limit` (the daily send window was
        full), `quota.monthly_near` (a share of the plan's monthly messages
        used; cabinet-wide). R11-D (ADR-0067): `compliance.violation` — raised
        by a compliance finding's `raise_alert` action (or its automatic
        action), one per finding, about the conversation's channel; not a
        threshold rule (no /alert-rules entry), but subscriptions can filter
        on it. R11-F (ADR-0094): `bitrix.dispatch_failed` (calls to the
        Bitrix24 portal or its events dead-lettered in the window;
        cabinet-wide).
      enum:
        - channel.health_low
        - channel.disconnected
        - channel.failure_spike
        - channel.daily_limit
        - quota.monthly_near
        - compliance.violation
        - bitrix.dispatch_failed
      x-enum-varnames:
        - AlertTypeHealthLow
        - AlertTypeDisconnected
        - AlertTypeFailureSpike
        - AlertTypeDailyLimit
        - AlertTypeMonthlyQuota
        - AlertTypeComplianceViolation
        - AlertTypeBitrixDispatchFailed

    AlertSeverity:
      type: string
      enum:
        - info
        - warning
        - critical
      x-enum-varnames:
        - AlertSeverityInfo
        - AlertSeverityWarning
        - AlertSeverityCritical

    AlertStatus:
      type: string
      description: >
        `open` — raised; `acknowledged` — somebody saw it, still in force;
        `resolved` — the condition went away (`autoResolved`) or a person
        closed it.
      enum:
        - open
        - acknowledged
        - resolved
      x-enum-varnames:
        - AlertStatusOpen
        - AlertStatusAcknowledged
        - AlertStatusResolved

    Alert:
      type: object
      description: >
        One business alert. `params` are the numbers the message is rendered
        from (the console translates the type; e.g. channel.disconnected:
        `minutes`, `threshold`). One alert per subject is in force at a time:
        a condition that holds keeps the alert, a worse severity escalates it
        (`occurrence` + 1, notified again), and it resolves by itself when the
        condition goes away.
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AlertType'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        channelId:
          type: string
          format: uuid
          description: The channel the alert is about; absent for a cabinet-wide alert.
        value:
          type: number
          format: double
          description: The measured number compared with the threshold.
        params:
          type: object
          additionalProperties:
            type: number
            format: double
        occurrence:
          type: integer
          description: The notification round (1 on raise, +1 per escalation).
        raisedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: The last evaluation that found the condition still holding.
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgedBy:
          type: string
          description: '`account:<id>` or `api_key:<kid>`.'
        resolvedAt:
          type: string
          format: date-time
        resolvedBy:
          type: string
          description: Who closed it by hand (absent when it resolved by itself).
        autoResolved:
          type: boolean
      required:
        - id
        - type
        - severity
        - status
        - value
        - params
        - occurrence
        - raisedAt
        - lastSeenAt
        - autoResolved

    AlertList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page; absent on the last one.
      required:
        - items

    AlertChange:
      type: object
      properties:
        alert:
          $ref: '#/components/schemas/Alert'
        changed:
          type: boolean
          description: false — the alert already was in the requested state.
      required:
        - alert
        - changed

    AlertDeliveryChannel:
      type: string
      description: >
        `console` — a notice in the console (the realtime alert.raised event);
        `email` — a mail to the person's address; `webhook` — a delivery to one
        of the cabinet's outbound webhooks (ADR-0031).
      enum:
        - console
        - email
        - webhook
      x-enum-varnames:
        - AlertDeliveryConsole
        - AlertDeliveryEmail
        - AlertDeliveryWebhook

    AlertSubscription:
      type: object
      description: >
        Who is told about which alerts, and how. Exactly one target: the
        person (`accountId`), everyone holding a role in the cabinet (`role`),
        or an outbound webhook (`webhookId`).
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        role:
          type: string
          description: org_owner, org_admin, cabinet_admin, supervisor, agent or viewer.
        webhookId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/AlertDeliveryChannel'
        minSeverity:
          $ref: '#/components/schemas/AlertSeverity'
        ruleTypes:
          type: array
          description: Only these rules (empty = all).
          items:
            $ref: '#/components/schemas/AlertType'
        channelIds:
          type: array
          description: Only alerts about these channels (empty = all the subscriber may see).
          items:
            type: string
            format: uuid
        enabled:
          type: boolean
        own:
          type: boolean
          description: The caller's own subscription.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - channel
        - minSeverity
        - ruleTypes
        - channelIds
        - enabled
        - own
        - createdAt
        - updatedAt

    AlertSubscriptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertSubscription'
      required:
        - items

    CreateAlertSubscriptionRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/AlertDeliveryChannel'
        role:
          type: string
          description: Subscribe everyone holding this role (settings:manage).
        webhookId:
          type: string
          format: uuid
          description: Route to this outbound webhook (settings:manage; channel must be `webhook`).
        minSeverity:
          $ref: '#/components/schemas/AlertSeverity'
        ruleTypes:
          type: array
          items:
            $ref: '#/components/schemas/AlertType'
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        enabled:
          type: boolean
      required:
        - channel

    UpdateAlertSubscriptionRequest:
      type: object
      description: Only the fields present change.
      properties:
        minSeverity:
          $ref: '#/components/schemas/AlertSeverity'
        ruleTypes:
          type: array
          items:
            $ref: '#/components/schemas/AlertType'
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        enabled:
          type: boolean

    AlertRule:
      type: object
      description: A rule as it applies to the cabinet.
      properties:
        type:
          $ref: '#/components/schemas/AlertType'
        enabled:
          type: boolean
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        threshold:
          type: number
          format: double
          description: A score, minutes, a count or a percentage — by type (see putAlertRule).
        windowMinutes:
          type: integer
          description: The look-back of the counting rules (failure spike, daily limit); 0 for the others.
        cooldownMinutes:
          type: integer
          description: After an alert of this rule resolves, the same subject is not alerted again for this long.
        overridden:
          type: boolean
          description: The cabinet has its own values (else the platform default applies).
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - type
        - enabled
        - severity
        - threshold
        - windowMinutes
        - cooldownMinutes
        - overridden

    AlertRuleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertRule'
      required:
        - items

    PutAlertRuleRequest:
      type: object
      properties:
        enabled:
          type: boolean
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        threshold:
          type: number
          format: double
        windowMinutes:
          type: integer
          description: Only for channel.failure_spike and channel.daily_limit.
        cooldownMinutes:
          type: integer
      required:
        - enabled
        - severity
        - threshold
        - cooldownMinutes

    AlertRaisedEvent:
      type: object
      description: >
        The payload of the `alert.raised` and `alert.resolved` events — on the
        realtime stream (RealtimeEvent.data) and in outbound webhook
        deliveries. A receiver deduplicates a raise on (alertId, occurrence):
        webhook deliveries are at-least-once, a round is raised once.
      properties:
        alertId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AlertType'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        channelId:
          type: string
          format: uuid
        occurrence:
          type: integer
        value:
          type: number
          format: double
        params:
          type: object
          additionalProperties:
            type: number
            format: double
        raisedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        autoResolved:
          type: boolean
      required:
        - alertId
        - type
        - severity
        - status
        - occurrence
        - value
        - params
        - raisedAt
    # END R10-E schemas

    # =========================================================================
    # BEGIN R11-A schemas: groups while disabled (#129) and group management
    # (#66), ADR-0062 §4/§9 and ADR-0096. Mirrors the "BEGIN R11-A groups"
    # paths block. Enum constants are named explicitly (x-enum-varnames).
    # =========================================================================
    IgnoredGroup:
      type: object
      description: >
        A group the channel's number is in while its group chats are off —
        the group's own metadata only (issue #129): no message, author or
        participant is kept.
      properties:
        chatId:
          type: string
          description: The group's address on the channel (wa_web `<id>@g.us`).
        subject:
          type: string
          description: The group's name as the channel last reported it (absent when never reported).
        firstSeenAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
          description: When the latest message seen in the group was written.
        messages24h:
          type: integer
          minimum: 0
          description: Messages seen in the group during the last 24 hours (hourly granularity).
      required:
        - chatId
        - firstSeenAt
        - lastActivityAt
        - messages24h

    IgnoredGroupList:
      type: object
      properties:
        channelId:
          type: string
        groupsEnabled:
          type: boolean
          description: Whether the channel's group chats are on (then the list is empty).
        items:
          type: array
          description: Most recently active first; at most 500.
          items:
            $ref: '#/components/schemas/IgnoredGroup'
      required:
        - channelId
        - groupsEnabled
        - items

    CreateGroupRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 100
          description: The group's name (WhatsApp allows up to 100 characters).
        contactIds:
          type: array
          minItems: 1
          maxItems: 256
          description: The initial members — contacts of the cabinet.
          items:
            type: string
            format: uuid
      required:
        - subject
        - contactIds
      additionalProperties: false

    GroupMembersRequest:
      type: object
      properties:
        contactIds:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: string
            format: uuid
      required:
        - contactIds
      additionalProperties: false

    GroupRemoveRequest:
      type: object
      properties:
        providerIds:
          type: array
          minItems: 1
          maxItems: 256
          description: Participant addresses as listConversationParticipants shows them.
          items:
            type: string
            minLength: 1
            maxLength: 256
      required:
        - providerIds
      additionalProperties: false

    UpdateGroupRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - subject
      additionalProperties: false

    GroupMemberFailureReason:
      type: string
      description: >
        Why a requested member is not in the group: `contact_not_found` — no
        such contact in the cabinet (or outside the caller's channel scope);
        `no_address` — the contact has no phone the channel can address;
        `refused` — the platform did not add them (privacy settings, a number
        not on WhatsApp).
      enum:
        - contact_not_found
        - no_address
        - refused
      x-enum-varnames:
        - GroupMemberFailureContactNotFound
        - GroupMemberFailureNoAddress
        - GroupMemberFailureRefused

    GroupMemberOutcome:
      type: object
      properties:
        contactId:
          type: string
        providerId:
          type: string
          description: The member's address on the channel, when there is one.
        reason:
          $ref: '#/components/schemas/GroupMemberFailureReason'

    GroupChangeResult:
      type: object
      description: >
        What a group-management call did. `requested` are the addresses asked
        of the platform; `failed` the members that are not in the group and
        why. The member list itself is listConversationParticipants — re-read
        from the channel after every change when the channel can read groups.
      properties:
        conversationId:
          type: string
        chatId:
          type: string
        subject:
          type: string
        requested:
          type: array
          items:
            $ref: '#/components/schemas/GroupMemberOutcome'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/GroupMemberOutcome'
        membersRefreshed:
          type: boolean
          description: >
            Whether the member list was re-read from the channel after the
            change. false: the list shows what was asked, until the next
            message in the group brings the real one.
      required:
        - conversationId
        - chatId
        - requested
        - failed
        - membersRefreshed
    # =========================================================================
    # END R11-A schemas
    # =========================================================================

    # =========================================================================
    # BEGIN R11-C schemas: AI guard + contact questionnaire (issue #59,
    # ADR-0068). Mirrors the "BEGIN R11-C ... (paths)" block. Every enum names
    # its Go constants (x-enum-varnames): low/high/observe would collide.
    # =========================================================================
    AiGuardMode:
      type: string
      description: >
        observe (the default): a risky message is sent with a warning. enforce:
        above `block_threshold` an interactive send is refused, above
        `warn_threshold` it is warned about; a campaign send is refused already
        above `warn_threshold` (nobody reads a campaign's warnings).
      enum:
        - observe
        - enforce
      x-enum-varnames:
        - AiGuardObserve
        - AiGuardEnforce

    AiGuardRiskLevel:
      type: string
      description: The model's risk level (score < 0.4 low, up to 0.7 medium, above high).
      enum:
        - low
        - medium
        - high
      x-enum-varnames:
        - AiGuardRiskLow
        - AiGuardRiskMedium
        - AiGuardRiskHigh

    AiGuardCategory:
      type: string
      description: Why a message is risky — a closed vocabulary the console localizes.
      enum:
        - spam_bulk
        - aggressive_sales
        - scam_phishing
        - prohibited_goods
        - impersonation
        - harassment
        - suspicious_link
        - blocked_topic
        - other
      x-enum-varnames:
        - AiGuardSpamBulk
        - AiGuardAggressiveSales
        - AiGuardScamPhishing
        - AiGuardProhibitedGoods
        - AiGuardImpersonation
        - AiGuardHarassment
        - AiGuardSuspiciousLink
        - AiGuardBlockedTopic
        - AiGuardOther

    AiGuardTestRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: The sample outbound message.
        campaign:
          type: boolean
          description: Judge it as a campaign (bulk) message; default false.
      required:
        - text

    AiGuardTestResult:
      type: object
      description: >
        The guard's assessment of a sample text and the verdicts the current
        `ai_guard` settings would give it. With `ok: false` there is no
        assessment and `errorCode` says why (e.g. `ai.timeout`) — a real send
        would have failed open.
      properties:
        ok:
          type: boolean
        runId:
          type: string
          format: uuid
        errorCode:
          type: string
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        risk:
          $ref: '#/components/schemas/AiGuardRiskLevel'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AiGuardCategory'
        reasons:
          type: array
          description: The model's short reasons, for the operator.
          items:
            type: string
        rewrite:
          type: string
          description: A safer version of the text, when the model offers one.
        enabled:
          type: boolean
          description: Whether the guard is on (`ai.enabled` and `ai_guard.enabled`).
        mode:
          $ref: '#/components/schemas/AiGuardMode'
        interactiveVerdict:
          $ref: '#/components/schemas/PolicyVerdict'
        campaignVerdict:
          $ref: '#/components/schemas/PolicyVerdict'
        latencyMs:
          type: integer
        totalTokens:
          type: integer
          format: int64
      required:
        - ok
        - categories
        - reasons
        - enabled
        - mode
        - latencyMs
        - totalTokens

    ContactAiProfileField:
      type: object
      description: One questionnaire field and whether (and by whom) it is filled.
      properties:
        key:
          type: string
        filled:
          type: boolean
        source:
          $ref: '#/components/schemas/ContactFieldValueSource'
      required:
        - key
        - filled

    ContactAiProfileRun:
      type: object
      description: The contact's latest questionnaire run (metadata only).
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AiRunStatus'
        errorCode:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        applied:
          type: array
          description: Field keys the run wrote.
          items:
            type: string
        kept:
          type: array
          description: Field keys it left alone because a more authoritative writer filled them.
          items:
            type: string
      required:
        - id
        - status
        - createdAt
        - applied
        - kept

    ContactAiProfile:
      type: object
      description: >
        The contact's AI questionnaire (ADR-0068 §5): whether it runs for the
        cabinet, its fields, the short AI summary and the latest run.
      properties:
        enabled:
          type: boolean
          description: '`ai.enabled` and `ai.profile_extract` are both on.'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ContactAiProfileField'
        summaryField:
          type: string
          description: The field the summary is written to (`ai_profile.summary_field`), when configured.
        summary:
          type: string
          description: The summary's current value.
        summaryOrigin:
          $ref: '#/components/schemas/ContactFieldValueOrigin'
        lastRun:
          $ref: '#/components/schemas/ContactAiProfileRun'
      required:
        - enabled
        - fields

    AiProfileFillResult:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        created:
          type: boolean
          description: false = the same conversation up to the same message was already queued or read.
        conversationId:
          type: string
          format: uuid
      required:
        - runId
        - created
        - conversationId
    # END R11-C schemas

    # BEGIN R11-D schemas: compliance scans, findings, actions (issue #58,
    # epic #14, ADR-0067). The paths are the R11-D block before /contacts.
    ComplianceSeverity:
      type: string
      description: How serious a violation is (and a rule's default).
      enum:
        - low
        - medium
        - high
        - critical
      x-enum-varnames:
        - ComplianceSeverityLow
        - ComplianceSeverityMedium
        - ComplianceSeverityHigh
        - ComplianceSeverityCritical

    ComplianceAutoAction:
      type: string
      description: >
        An automatic action's step, in rank order: none (record only), notify
        (the `compliance.notice` event to the people on the channel), alert (a
        `compliance.violation` alert), freeze (freeze the conversation). The
        model recommends one; the cabinet's `auto_actions` caps it per
        severity (default: none — observe mode).
      enum:
        - none
        - notify
        - alert
        - freeze
      x-enum-varnames:
        - ComplianceAutoNone
        - ComplianceAutoNotify
        - ComplianceAutoAlert
        - ComplianceAutoFreeze

    ComplianceScanScope:
      type: string
      description: What a scan reads — one conversation, one channel, or the whole cabinet.
      enum:
        - conversation
        - channel
        - cabinet
      x-enum-varnames:
        - ComplianceScopeConversation
        - ComplianceScopeChannel
        - ComplianceScopeCabinet

    ComplianceScanStatus:
      type: string
      description: >
        queued (waiting for its turn, the AI quota or the provider —
        `waitCode` says which) → running → succeeded (everything in the scope
        and period was read) | failed (`errorCode`: a window could not be
        judged — e.g. `ai.disabled`, `ai.not_configured`, `ai.invalid_output`,
        `ai.auth` — the scan is NOT clean; what was found before stays) |
        cancelled.
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
      x-enum-varnames:
        - ComplianceScanQueued
        - ComplianceScanRunning
        - ComplianceScanSucceeded
        - ComplianceScanFailed
        - ComplianceScanCancelled

    ComplianceRuleRef:
      type: object
      description: A rule a scan checked (from the snapshot kept with the scan).
      properties:
        key:
          type: string
          description: '`builtin.<key>` or `custom.<key>`.'
        title:
          type: string
        severity:
          $ref: '#/components/schemas/ComplianceSeverity'
      required:
        - key
        - title
        - severity

    ComplianceScan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/ComplianceScanScope'
        channelId:
          type: string
          format: uuid
          description: The channel (channel and conversation scans).
        conversationId:
          type: string
          format: uuid
          description: The conversation (conversation scans).
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        rescan:
          type: boolean
          description: Messages already read by an earlier scan were read again.
        trigger:
          type: string
          enum: [manual, schedule]
          x-enum-varnames: [ComplianceTriggerManual, ComplianceTriggerSchedule]
        status:
          $ref: '#/components/schemas/ComplianceScanStatus'
        cancelRequested:
          type: boolean
        waitCode:
          type: string
          description: >
            Why a queued scan waits: `tenancy.quota_exceeded` (the monthly AI
            tokens), `ai.<kind>` (the provider failed transiently). Empty
            otherwise.
        errorCode:
          type: string
          description: Why the scan failed. Empty unless failed.
        errorDetail:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceRuleRef'
        conversationsTotal:
          type: integer
          description: Conversations with unread messages in the scope and period (counted at the first claim).
        conversationsDone:
          type: integer
        messagesScanned:
          type: integer
        windowsDone:
          type: integer
          description: AI runs committed (one per window of at most 40 messages).
        findingsCount:
          type: integer
          description: New findings (a rescan's duplicates of existing ones are not counted).
        tokens:
          type: integer
          format: int64
          description: AI tokens the scan's windows used (the journal has each run).
        requestedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
        - id
        - scope
        - from
        - to
        - rescan
        - trigger
        - status
        - cancelRequested
        - rules
        - conversationsTotal
        - conversationsDone
        - messagesScanned
        - windowsDone
        - findingsCount
        - tokens
        - createdAt

    ComplianceScanList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceScan'
      required:
        - items

    StartComplianceScanRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/ComplianceScanScope'
        channelId:
          type: string
          format: uuid
          description: Required for a channel scan.
        conversationId:
          type: string
          format: uuid
          description: Required for a conversation scan.
        from:
          type: string
          format: date-time
          description: Start of the period (inclusive); at most 90 days before `to`.
        to:
          type: string
          format: date-time
          description: End of the period (exclusive); defaults to now.
        rescan:
          type: boolean
          description: Read again what earlier scans already read (e.g. after the rules changed).
      required:
        - scope
        - from

    ComplianceFindingStatus:
      type: string
      description: open (to review) | reviewed (a real violation, handled) | false_positive.
      enum:
        - open
        - reviewed
        - false_positive
      x-enum-varnames:
        - ComplianceFindingOpen
        - ComplianceFindingReviewed
        - ComplianceFindingFalsePositive

    ComplianceEvidence:
      type: object
      description: >
        A message the finding points at: its id (the message itself is read
        through the conversation) and a SHORT excerpt (≤ 160 characters, phone
        numbers, e-mails, cards and IBANs always replaced). Empty after the
        person was erased.
      properties:
        messageId:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
          x-enum-varnames: [ComplianceEvidenceInbound, ComplianceEvidenceOutbound]
        at:
          type: string
          format: date-time
        excerpt:
          type: string
      required:
        - messageId
        - direction
        - at
        - excerpt

    ComplianceFindingActionType:
      type: string
      enum:
        - review
        - false_positive
        - reopen
        - assign
        - unassign
        - raise_alert
        - freeze_dialog
        - unfreeze_dialog
        - notify
      x-enum-varnames:
        - ComplianceActionReview
        - ComplianceActionFalsePositive
        - ComplianceActionReopen
        - ComplianceActionAssign
        - ComplianceActionUnassign
        - ComplianceActionRaiseAlert
        - ComplianceActionFreezeDialog
        - ComplianceActionUnfreezeDialog
        - ComplianceActionNotify

    ComplianceFindingActionEntry:
      type: object
      description: One entry of a finding's history.
      properties:
        action:
          $ref: '#/components/schemas/ComplianceFindingActionType'
        automatic:
          type: boolean
          description: Taken by the scan under the cabinet's `auto_actions` (actor `system:compliance`).
        actor:
          type: string
          description: '`account:<id>`, `api_key:<id>` or `system:compliance`.'
        note:
          type: string
        params:
          type: object
          additionalProperties: true
          description: Identifiers only (assigneeId, alertId, conversationId).
        at:
          type: string
          format: date-time
      required:
        - action
        - automatic
        - actor
        - note
        - params
        - at

    ComplianceFinding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scanId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        rule:
          type: string
          description: '`builtin.<key>` or `custom.<key>`.'
        ruleTitle:
          type: string
        severity:
          $ref: '#/components/schemas/ComplianceSeverity'
        confidence:
          type: number
          format: double
        explanation:
          type: string
          description: The model's short explanation (redacted; empty after an erasure).
        recommendedAction:
          $ref: '#/components/schemas/ComplianceAutoAction'
        autoAction:
          $ref: '#/components/schemas/ComplianceAutoAction'
        status:
          $ref: '#/components/schemas/ComplianceFindingStatus'
        assigneeId:
          type: string
          format: uuid
        alertId:
          type: string
          format: uuid
        conversationFrozen:
          type: boolean
          description: The conversation is frozen now (by this finding or otherwise).
        reviewedBy:
          type: string
        reviewedAt:
          type: string
          format: date-time
        erased:
          type: boolean
          description: A person in the conversation was erased; the texts are gone.
        promptVersion:
          type: string
        aiRunId:
          type: string
          format: uuid
          description: The journal row (/ai/runs) of the window that found it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        evidence:
          type: array
          description: Only in getComplianceFinding / the action's answer.
          items:
            $ref: '#/components/schemas/ComplianceEvidence'
        history:
          type: array
          description: Only in getComplianceFinding / the action's answer.
          items:
            $ref: '#/components/schemas/ComplianceFindingActionEntry'
      required:
        - id
        - conversationId
        - channelId
        - rule
        - ruleTitle
        - severity
        - confidence
        - explanation
        - recommendedAction
        - autoAction
        - status
        - conversationFrozen
        - erased
        - createdAt
        - updatedAt

    ComplianceFindingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceFinding'
      required:
        - items

    ComplianceFindingActionRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/ComplianceFindingActionType'
        assigneeId:
          type: string
          format: uuid
          description: Required for `assign`.
        note:
          type: string
          maxLength: 500
      required:
        - action

    ComplianceBuiltinRule:
      type: object
      additionalProperties: false
      description: A built-in rule's switch (absent = on, at its default severity).
      properties:
        enabled:
          type: boolean
        severity:
          $ref: '#/components/schemas/ComplianceSeverity'

    ComplianceBuiltinRules:
      type: object
      additionalProperties: false
      description: >
        The built-in rules: rudeness (medium), off_policy_promise — a promise
        outside `policy_notes` (high), personal_data — asking for or sharing
        personal data the conversation does not need (high),
        offplatform_payment — a payment request outside the official channels
        (high), prohibited_topic — one of `prohibited_topics` (high; on only
        with topics listed).
      properties:
        rudeness:
          $ref: '#/components/schemas/ComplianceBuiltinRule'
        off_policy_promise:
          $ref: '#/components/schemas/ComplianceBuiltinRule'
        personal_data:
          $ref: '#/components/schemas/ComplianceBuiltinRule'
        offplatform_payment:
          $ref: '#/components/schemas/ComplianceBuiltinRule'
        prohibited_topic:
          $ref: '#/components/schemas/ComplianceBuiltinRule'

    ComplianceCustomRule:
      type: object
      additionalProperties: false
      description: A cabinet's own rule, described in natural language.
      properties:
        key:
          type: string
          pattern: '^[a-z0-9_]{1,40}$'
          description: Stable key; findings name it as `custom.<key>`.
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: What counts as a violation, in plain words (any language).
        severity:
          $ref: '#/components/schemas/ComplianceSeverity'
        enabled:
          type: boolean
      required:
        - key
        - title
        - description
        - severity

    ComplianceAutoActions:
      type: object
      additionalProperties: false
      description: >
        Severity → the most that may run automatically for a finding of that
        severity (the model's recommendation, capped). Absent = none.
      properties:
        low:
          $ref: '#/components/schemas/ComplianceAutoAction'
        medium:
          $ref: '#/components/schemas/ComplianceAutoAction'
        high:
          $ref: '#/components/schemas/ComplianceAutoAction'
        critical:
          $ref: '#/components/schemas/ComplianceAutoAction'

    ComplianceScanProgressEvent:
      type: object
      description: >
        The payload of `compliance.scan_progress` (realtime stream only,
        compliance:read; a channel or conversation scan also needs that
        channel in scope). Counters only.
      properties:
        scanId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ComplianceScanStatus'
        conversationsTotal:
          type: integer
        conversationsDone:
          type: integer
        messagesScanned:
          type: integer
        findingsCount:
          type: integer
        waitCode:
          type: string
        errorCode:
          type: string
      required:
        - scanId
        - status
        - conversationsTotal
        - conversationsDone
        - messagesScanned
        - findingsCount

    ComplianceNoticeEvent:
      type: object
      description: >
        The payload of `compliance.notice` (realtime stream only; channels:read
        on the channel — the people working on it): a finding's `notify`
        action. Identifiers only.
      properties:
        findingId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        rule:
          type: string
        severity:
          $ref: '#/components/schemas/ComplianceSeverity'
      required:
        - findingId
        - conversationId
        - channelId
        - rule
        - severity
    # END R11-D schemas

    # BEGIN R11-E schemas: analytics — reports and exports (issues #62/#63,
    # ADR-0066). Mirrors internal/analytics and internal/store/analytics*.go;
    # the paths are the "BEGIN R11-E (paths)" block. Every enum names its Go
    # constants (x-enum-varnames): `day`, `completed`, `channel`, `csv` exist in
    # other enums or would collide.
    # =========================================================================
    AnalyticsMetric:
      type: string
      description: >
        A metric of the catalogue (ADR-0066 §1). Counts: messages_in,
        messages_out, messages_delivered, messages_read, messages_failed (of
        the period's outbound messages, by the status they reached),
        conversations_opened, responses (replies that answered a waiting
        contact), policy_refusals (deferred + denied send-policy decisions),
        policy_warnings, ai_runs, ai_tokens. Ratios 0..1: delivery_rate,
        read_rate, failure_rate (of outbound messages),
        responses_within_5m_rate (of responses). response_time_avg is seconds
        (from the first waiting message to the reply); health_avg the average
        channel health score (0–100); ai_cost micro-units of the provider's
        currency. ai_* are cabinet-wide: absent for a channel-scoped caller.
      enum:
        - messages_in
        - messages_out
        - messages_delivered
        - messages_read
        - messages_failed
        - delivery_rate
        - read_rate
        - failure_rate
        - conversations_opened
        - responses
        - response_time_avg
        - responses_within_5m_rate
        - policy_refusals
        - policy_warnings
        - health_avg
        - ai_runs
        - ai_tokens
        - ai_cost
      x-enum-varnames:
        - AnalyticsMetricMessagesIn
        - AnalyticsMetricMessagesOut
        - AnalyticsMetricMessagesDelivered
        - AnalyticsMetricMessagesRead
        - AnalyticsMetricMessagesFailed
        - AnalyticsMetricDeliveryRate
        - AnalyticsMetricReadRate
        - AnalyticsMetricFailureRate
        - AnalyticsMetricConversationsOpened
        - AnalyticsMetricResponses
        - AnalyticsMetricResponseTimeAvg
        - AnalyticsMetricResponsesWithin5mRate
        - AnalyticsMetricPolicyRefusals
        - AnalyticsMetricPolicyWarnings
        - AnalyticsMetricHealthAvg
        - AnalyticsMetricAiRuns
        - AnalyticsMetricAiTokens
        - AnalyticsMetricAiCost

    AnalyticsUnit:
      type: string
      description: How a metric's value reads — a count, a ratio 0..1, seconds, a 0–100 score, micro-units of a currency.
      enum:
        - count
        - ratio
        - seconds
        - score
        - micros
      x-enum-varnames:
        - AnalyticsUnitCount
        - AnalyticsUnitRatio
        - AnalyticsUnitSeconds
        - AnalyticsUnitScore
        - AnalyticsUnitMicros

    AnalyticsGranularity:
      type: string
      description: A time series' bucket — an hour, a local day, a local ISO week (Monday).
      enum:
        - hour
        - day
        - week
      x-enum-varnames:
        - AnalyticsGranularityHour
        - AnalyticsGranularityDay
        - AnalyticsGranularityWeek

    AnalyticsBreakdownBy:
      type: string
      description: A breakdown's dimension.
      enum:
        - channel
        - agent
        - origin
        - policy
      x-enum-varnames:
        - AnalyticsByChannel
        - AnalyticsByAgent
        - AnalyticsByOrigin
        - AnalyticsByPolicy

    AnalyticsPeriod:
      type: object
      description: >
        A report's period: local dates in the cabinet's time zone (both
        inclusive) and the instants they span.
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timeZone:
          type: string
          description: The IANA zone the dates are in (the cabinet's messaging default; UTC when unset).
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Exclusive.
      required:
        - from
        - to
        - timeZone
        - start
        - end

    AnalyticsBackfillStatus:
      type: string
      description: >
        The aggregation of the cabinet's history before live aggregation
        started: pending, running, done, failed; `none` before the first
        aggregation pass saw the cabinet.
      enum:
        - none
        - pending
        - running
        - done
        - failed
      x-enum-varnames:
        - AnalyticsBackfillNone
        - AnalyticsBackfillPending
        - AnalyticsBackfillRunning
        - AnalyticsBackfillDone
        - AnalyticsBackfillFailed

    AnalyticsFreshness:
      type: object
      description: How current the numbers are.
      properties:
        lastPassAt:
          type: string
          format: date-time
          description: When the aggregation last ran for the cabinet (absent before its first pass).
        watermark:
          type: string
          format: date-time
          description: Hours before this are final (a late status change still re-opens its hour).
        backfill:
          $ref: '#/components/schemas/AnalyticsBackfillStatus'
        backfillProgress:
          type: number
          format: double
          description: The backfill's share done, 0..1.
        historyFrom:
          type: string
          format: date-time
          description: The oldest hour the backfill found data for.
      required:
        - backfill
        - backfillProgress

    AnalyticsKpi:
      type: object
      description: >
        One metric of a period and of the period before it. A value is absent
        when it is undefined (a rate with nothing to divide); a delta when
        either side is absent, deltaPct also when the previous value is 0.
      properties:
        metric:
          $ref: '#/components/schemas/AnalyticsMetric'
        unit:
          $ref: '#/components/schemas/AnalyticsUnit'
        value:
          type: number
          format: double
        previous:
          type: number
          format: double
        delta:
          type: number
          format: double
        deltaPct:
          type: number
          format: double
          description: The relative change, as a fraction (0.25 = +25 %).
      required:
        - metric
        - unit

    AnalyticsOverview:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        previousPeriod:
          $ref: '#/components/schemas/AnalyticsPeriod'
        scoped:
          type: boolean
          description: The numbers are limited to the caller's channels (cabinet-wide metrics left out).
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsKpi'
        freshness:
          $ref: '#/components/schemas/AnalyticsFreshness'
      required:
        - period
        - previousPeriod
        - scoped
        - kpis
        - freshness

    AnalyticsPoint:
      type: object
      properties:
        start:
          type: string
          format: date-time
        label:
          type: string
          description: The bucket in the cabinet's time zone (YYYY-MM-DD for a day or a week's first day; date, time and zone for an hour).
        value:
          type: number
          format: double
          description: Absent when undefined in the bucket.
      required:
        - start
        - label

    AnalyticsTimeseries:
      type: object
      properties:
        metric:
          $ref: '#/components/schemas/AnalyticsMetric'
        unit:
          $ref: '#/components/schemas/AnalyticsUnit'
        granularity:
          $ref: '#/components/schemas/AnalyticsGranularity'
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        scoped:
          type: boolean
        points:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsPoint'
      required:
        - metric
        - unit
        - granularity
        - period
        - scoped
        - points

    AnalyticsBreakdownRow:
      type: object
      properties:
        key:
          type: string
          description: A channel id, an account id, an origin, or `<verdict>:<code>` of a policy reason.
        label:
          type: string
          description: The channel's or the person's name; empty for an origin or a policy reason.
        kind:
          type: string
          description: The channel kind (channel breakdown only).
        values:
          type: object
          description: The row's metrics (the breakdown's `metrics`); an undefined one is absent.
          additionalProperties:
            type: number
            format: double
      required:
        - key
        - label
        - values

    AnalyticsBreakdown:
      type: object
      properties:
        by:
          $ref: '#/components/schemas/AnalyticsBreakdownBy'
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        scoped:
          type: boolean
        metrics:
          type: array
          description: The columns, in order.
          items:
            $ref: '#/components/schemas/AnalyticsMetric'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBreakdownRow'
      required:
        - by
        - period
        - scoped
        - metrics
        - rows

    AnalyticsHeatmap:
      type: object
      properties:
        direction:
          type: string
          description: inbound or outbound.
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        scoped:
          type: boolean
        cells:
          type: array
          description: 7 rows (Monday first) of 24 counts (local hours 0–23).
          items:
            type: array
            items:
              type: integer
              format: int64
        max:
          type: integer
          format: int64
      required:
        - direction
        - period
        - scoped
        - cells
        - max

    AnalyticsCampaignFunnel:
      type: object
      description: >
        recipients → sent (handed to the channel) → delivered → read →
        replied (wrote back within 72 hours); beside the funnel the
        recipients still pending, skipped by policy, failed or cancelled and
        the messages that failed after sending.
      properties:
        recipients:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
        recipientsFailed:
          type: integer
          format: int64
        cancelled:
          type: integer
          format: int64
        delivered:
          type: integer
          format: int64
        read:
          type: integer
          format: int64
        messagesFailed:
          type: integer
          format: int64
        replied:
          type: integer
          format: int64
        replyWindowHours:
          type: integer
      required:
        - recipients
        - pending
        - sent
        - skipped
        - recipientsFailed
        - cancelled
        - delivered
        - read
        - messagesFailed
        - replied
        - replyWindowHours

    AnalyticsCampaignReport:
      type: object
      properties:
        campaignId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          description: The campaign's status (draft, scheduled, running, paused, completed, cancelled, failed).
        launchedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        funnel:
          $ref: '#/components/schemas/AnalyticsCampaignFunnel'
      required:
        - campaignId
        - name
        - status
        - funnel

    AnalyticsExportFormat:
      type: string
      enum:
        - csv
        - xlsx
      x-enum-varnames:
        - AnalyticsFormatCsv
        - AnalyticsFormatXlsx

    AnalyticsReportKind:
      type: string
      description: The report an export renders — the same as its read operation.
      enum:
        - overview
        - timeseries
        - breakdown
        - campaign
      x-enum-varnames:
        - AnalyticsReportOverview
        - AnalyticsReportTimeseries
        - AnalyticsReportBreakdown
        - AnalyticsReportCampaign

    AnalyticsExportRequest:
      type: object
      description: >
        The report and its parameters, as the read operation takes them:
        `metric` (+ `granularity`) for a time series, `by` for a breakdown,
        `campaignId` for a campaign report.
      properties:
        report:
          $ref: '#/components/schemas/AnalyticsReportKind'
        format:
          $ref: '#/components/schemas/AnalyticsExportFormat'
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        channelId:
          type: string
          format: uuid
        metric:
          $ref: '#/components/schemas/AnalyticsMetric'
        granularity:
          $ref: '#/components/schemas/AnalyticsGranularity'
        by:
          $ref: '#/components/schemas/AnalyticsBreakdownBy'
        campaignId:
          type: string
          format: uuid
      required:
        - report
        - format

    AnalyticsExportStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - expired
      x-enum-varnames:
        - AnalyticsExportStatusQueued
        - AnalyticsExportStatusRunning
        - AnalyticsExportStatusCompleted
        - AnalyticsExportStatusFailed
        - AnalyticsExportStatusExpired

    AnalyticsExport:
      type: object
      description: One report export job.
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AnalyticsExportStatus'
        request:
          $ref: '#/components/schemas/AnalyticsExportRequest'
        timeZone:
          type: string
        scoped:
          type: boolean
          description: The file is limited to the channels its author works.
        rowCount:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        createdBy:
          $ref: '#/components/schemas/JobActor'
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the file is deleted.
        downloadPath:
          type: string
          description: The API path the completed file is downloaded from (downloadAnalyticsExport), relative to the server URL.
      required:
        - id
        - status
        - request
        - timeZone
        - scoped
        - rowCount
        - sizeBytes
        - createdBy
        - createdAt

    AnalyticsExportList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsExport'
      required:
        - items
    # END R11-E schemas

    # =========================================================================
    # BEGIN R11-B schemas: campaign dry run, launch wizard, templates in
    # campaigns (issue #68, ADR-0063 addendum of 2026-09-24). Mirrors the
    # "BEGIN R11-B campaign dry run + launch wizard (paths)" block and
    # internal/campaigns/{template,estimate}.go. Reason / factor / warning keys
    # are strings, not enums: a newer server may add one, and the console
    # renders an unknown key as itself.
    # =========================================================================
    CampaignTemplateParamSource:
      type: string
      description: >
        Where one template parameter's value comes from: a fixed text
        (`literal`), the contact's display name (`contact_name`), or one of the
        contact's typed fields (`contact_field`).
      enum:
        - literal
        - contact_name
        - contact_field
      x-enum-varnames:
        - CampaignParamLiteral
        - CampaignParamContactName
        - CampaignParamContactField

    CampaignTemplateParam:
      type: object
      description: >
        The value of one template placeholder, per recipient. A contact whose
        name / field is empty gets `default`; with no default either, that
        recipient is skipped with template.params_invalid (the dry run counts
        them). A contact-derived value has its line breaks, tabs and runs of
        spaces collapsed to one space (Meta refuses them in a parameter).
      properties:
        source:
          $ref: '#/components/schemas/CampaignTemplateParamSource'
        value:
          type: string
          maxLength: 1024
          description: The text of a `literal` parameter.
        field:
          type: string
          maxLength: 64
          description: The typed field key of a `contact_field` parameter.
        default:
          type: string
          maxLength: 1024
          description: The value used when the contact's name / field is empty.
      required:
        - source

    CampaignAudienceCount:
      type: object
      description: What an audience definition resolves to now (nothing is stored).
      properties:
        matched:
          type: integer
          description: >
            Recipients the snapshot would hold (explicit contacts of the
            cabinet in scope, plus filter matches reachable on the channels,
            each person once), capped at `limit` + 1.
        explicitRequested:
          type: integer
        explicitIncluded:
          type: integer
        tooLarge:
          type: boolean
          description: More than `limit` recipients — launchCampaign would refuse it.
        limit:
          type: integer
          description: The largest snapshot a campaign may have (100 000).
      required:
        - matched
        - explicitRequested
        - explicitIncluded
        - tooLarge
        - limit

    CampaignAudienceChannelCount:
      type: object
      properties:
        channelId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChannelKind'
        addressable:
          type: integer
          description: How many of the matched recipients have an address on this channel.
      required:
        - channelId
        - kind
        - addressable

    CampaignAudiencePreviewRequest:
      type: object
      properties:
        channelIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uuid
        audience:
          $ref: '#/components/schemas/CampaignAudience'
      required:
        - channelIds
        - audience

    CampaignAudiencePreview:
      type: object
      properties:
        audience:
          $ref: '#/components/schemas/CampaignAudienceCount'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/CampaignAudienceChannelCount'
      required:
        - audience
        - channels

    CampaignDryRunBlocked:
      type: object
      description: >
        Recipients the snapshot would hold who would be skipped, for one
        reason. `reason` is one of no_address (no identity / conversation on
        any of the campaign's channels), template_params_missing (a template
        parameter from the contact's name / field is empty and has no
        default), no_consent, opted_out (consent revoked), service_window_closed
        (a free-form message to a wa_cloud contact outside WhatsApp's 24-hour
        window), dialog_frozen; `code` is the catalog code the recipient would
        be skipped with.
      properties:
        reason:
          type: string
        code:
          type: string
        count:
          type: integer
      required:
        - reason
        - code
        - count

    CampaignDryRunChannel:
      type: object
      description: One channel of the campaign in the dry run.
      properties:
        channelId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChannelKind'
        position:
          type: integer
        live:
          type: boolean
          description: Connected and not held — a channel that is not live sends nothing until it is.
        addressable:
          type: integer
          description: Recipients with an address on this channel.
        assigned:
          type: integer
          description: Recipients the rotation would send through this channel (not blocked).
        blocked:
          type: integer
          description: Recipients whose turn falls on this channel but who would be skipped.
        perMinute:
          type: number
          description: >
            The effective pace on this channel: the smallest of the campaign's
            ratePerMinute, the channel's send pacing (session channels pause
            1–3 s between messages) and the send-policy rate budget (with the
            channel's warmup stage).
        paceLimitedBy:
          type: string
          description: campaign_rate, channel_pacing or rate_budget.
        dailyLimit:
          type: integer
          description: The channel's daily window (messaging defaults); omitted = none.
        hourlyLimit:
          type: integer
          description: The channel's hourly window; omitted = none.
        finishesAt:
          type: string
          format: date-time
          description: When this channel's share would be sent (omitted when beyond the horizon).
      required:
        - channelId
        - kind
        - position
        - live
        - addressable
        - assigned
        - blocked
        - perMinute
        - paceLimitedBy

    CampaignDryRunFactor:
      type: object
      properties:
        factor:
          type: string
        seconds:
          type: integer
      required:
        - factor
        - seconds

    CampaignDryRunEstimate:
      type: object
      description: >
        How long the send would take from `startsAt`, simulated minute by
        minute over the channel that finishes last: its pace, its daily and
        hourly windows (minus what they already hold today), the campaign
        window, the cabinet's business hours and the organization's monthly
        messages cap (reset on the 1st, UTC). `limitingFactor` is the factor
        that accounts for most of that time — none, campaign_rate,
        channel_pacing, rate_budget, hourly_limit, daily_limit,
        campaign_window, business_hours or monthly_quota; `factors` is the
        whole breakdown, largest first. Other campaigns sharing the channels
        are not simulated.
      properties:
        startsAt:
          type: string
          format: date-time
        finishesAt:
          type: string
          format: date-time
          description: Omitted when the send would not finish within the horizon (400 days).
        durationSeconds:
          type: integer
        complete:
          type: boolean
          description: False when the horizon was reached before every recipient was sent.
        limitingFactor:
          type: string
        factors:
          type: array
          items:
            $ref: '#/components/schemas/CampaignDryRunFactor'
      required:
        - startsAt
        - durationSeconds
        - complete
        - limitingFactor
        - factors

    CampaignDryRunSample:
      type: object
      description: >
        What send policy says right now about one send of this campaign (in
        its campaign mode) through this channel to its first recipient there —
        the checkSendPolicy dry run: nothing is consumed.
      properties:
        channelId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        verdict:
          $ref: '#/components/schemas/PolicyVerdict'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
        meters:
          type: array
          items:
            $ref: '#/components/schemas/PolicyMeter'
      required:
        - channelId
        - contactId
        - verdict
        - findings
        - meters

    CampaignDryRunWarning:
      type: object
      description: >
        Something the operator should know before launching (`key`:
        channel_not_live, audience_too_large, nobody_reachable,
        monthly_quota_short, estimate_incomplete, …; `params` fill the message).
      properties:
        key:
          type: string
        params:
          type: object
          additionalProperties:
            type: string
      required:
        - key

    CampaignDryRun:
      type: object
      description: The dry run of a draft (dryRunCampaign).
      properties:
        campaignId:
          type: string
          format: uuid
        evaluatedAt:
          type: string
          format: date-time
        launchable:
          type: boolean
          description: launchCampaign would accept the draft now (no problem, someone reachable).
        problems:
          type: array
          description: The reasons launchCampaign would refuse the draft (its 422 errors[]).
          items:
            $ref: '#/components/schemas/ValidationError'
        audience:
          $ref: '#/components/schemas/CampaignAudienceCount'
        reachable:
          type: integer
          description: Recipients who would be sent to (matched minus blocked).
        blocked:
          type: array
          items:
            $ref: '#/components/schemas/CampaignDryRunBlocked'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/CampaignDryRunChannel'
        estimate:
          $ref: '#/components/schemas/CampaignDryRunEstimate'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/CampaignDryRunSample'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CampaignDryRunWarning'
      required:
        - campaignId
        - evaluatedAt
        - launchable
        - problems
        - audience
        - reachable
        - blocked
        - channels
        - estimate
        - samples
        - warnings
    # END R11-B schemas

    # BEGIN R11-F schemas: Bitrix24 open-lines connector (issues #74/#75,
    # ADR-0094). Mirrors the "BEGIN R11-F ... (paths)" block.
    BitrixLineBindingStatus:
      type: string
      description: >
        `pending` — the connector is being registered / activated on the line
        (queued; messages wait behind it); `active` — traffic flows;
        `line_deleted` — the portal deleted the open line; `connector_disabled`
        — the connector was switched off on the line, or the portal refused to
        activate it. The last two take no traffic until the channel is bound
        again.
      enum:
        - pending
        - active
        - line_deleted
        - connector_disabled
      x-enum-varnames:
        - BitrixLinePending
        - BitrixLineActive
        - BitrixLineDeleted
        - BitrixLineConnectorDisabled
    BitrixLineBinding:
      type: object
      description: One channel on one open line (ADR-0052 §4, ADR-0094 §3).
      required: [channelId, lineId, status, sharedLine, updatedAt]
      properties:
        channelId:
          type: string
          format: uuid
        lineId:
          type: string
          description: The open line's id on the portal.
        status:
          $ref: '#/components/schemas/BitrixLineBindingStatus'
        statusReason:
          type: string
        sharedLine:
          type: boolean
          description: >
            Another channel is on the same line: routing and statistics per
            number are lost there (the console warns).
        activatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BitrixLineBindingRequest:
      type: object
      additionalProperties: false
      required: [lineId]
      properties:
        lineId:
          type: string
          pattern: '^[0-9]{1,18}$'
    BitrixBlockedMethod:
      type: object
      description: A REST method the portal blocked for its operating-time limit.
      required: [method, until]
      properties:
        method:
          type: string
        until:
          type: string
          format: date-time
    BitrixQueueStatus:
      type: object
      description: >
        The portal's dispatcher (ADR-0094 §4): calls waiting, calls given up on
        (dead letters), the park after the portal's request limit, methods
        blocked by its operating-time limit, and the offline-event pull.
      required: [pending, due, dead, blockedMethods, inboxPending, inboxDead]
      properties:
        pending:
          type: integer
        due:
          type: integer
          description: Pending calls whose time has come (the rest wait out a retry backoff).
        dead:
          type: integer
        lastDeadError:
          type: string
        oldestPendingAt:
          type: string
          format: date-time
        parkedUntil:
          type: string
          format: date-time
        parkReason:
          type: string
        blockedMethods:
          type: array
          items:
            $ref: '#/components/schemas/BitrixBlockedMethod'
        lastPollAt:
          type: string
          format: date-time
        lastPollError:
          type: string
        inboxPending:
          type: integer
          description: Host events taken in and not processed yet.
        inboxDead:
          type: integer
    BitrixConnector:
      type: object
      description: The open-lines connector on a linked portal (ADR-0094).
      required: [portalId, connectorId, registered, eventsBound, eventDelivery, desk, deskActive, bindings, queue]
      properties:
        portalId:
          type: string
          format: uuid
        connectorId:
          type: string
        registered:
          type: boolean
          description: imconnector.register went through on the portal.
        registeredAt:
          type: string
          format: date-time
        eventsBound:
          type: boolean
          description: The connector's events are bound (as offline events).
        eventsBoundAt:
          type: string
          format: date-time
        eventDelivery:
          type: string
          enum: [offline]
          x-enum-varnames: [BitrixEventDeliveryOffline]
          description: >
            How the connector's events reach us: pulled offline events
            (event.offline.get), with the ONOFFLINEEVENT push only as a nudge.
        desk:
          type: string
          description: >
            The cabinet's desk as the `desk` settings section resolves it
            (`chatwoot`, `bitrix24`, `none`).
        deskActive:
          type: boolean
          description: Bitrix24 is the cabinet's desk — projection into the lines is on.
        defaultLineId:
          type: string
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/BitrixLineBinding'
        queue:
          $ref: '#/components/schemas/BitrixQueueStatus'
    BitrixConnectorUpdate:
      type: object
      additionalProperties: false
      required: [defaultLineId]
      properties:
        defaultLineId:
          type: string
          nullable: true
          pattern: '^[0-9]{1,18}$'
          description: The line new channels go onto; null = explicit bindings only.
    BitrixOpenLine:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
    BitrixOpenLineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BitrixOpenLine'
    BitrixQueueRetry:
      type: object
      required: [requeued]
      properties:
        requeued:
          type: integer
    # END R11-F schemas
