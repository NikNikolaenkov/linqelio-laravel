      summary: Patch host-owned custom fields of the embed-scoped contact.
      description: >
        Plane B (ADR-0009 §4): optimistic-concurrency write of host-owned custom
        fields (cap contact:write:custom). `baseVersion` guards the update
        (contact.version_conflict on drift); the idempotency key dedups a retried
        patch. Writing profile.*/identities.* is rejected — not host-owned
        (embed.field_ownership_denied, ADR-0007 §3).
      tags:
