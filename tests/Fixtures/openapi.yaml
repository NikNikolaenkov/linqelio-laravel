            $ref: '#/components/schemas/CampaignRecipient'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items

    ScheduledSendStatus:
      type: string
      description: >
        scheduled → sending → sent; failed (send policy or the channel refused
        it — `code` says why); cancelled (taken back before it went). A limit
        that only delays it keeps it `scheduled` with a later nextAttemptAt.
      enum:
        - scheduled
        - sending
        - sent
        - failed
        - cancelled
      x-enum-varnames:
        - ScheduledSendScheduled
        - ScheduledSendSending
        - ScheduledSendSent
        - ScheduledSendFailed
        - ScheduledSendCancelled

    ScheduledSendRequest:
      type: object
      description: A send (as sendContactMessage) to go at `sendAt`.
      properties:
        contactId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
          description: >
            The channel to send on; omitted = the contact's own conversation
            (as sendContactMessage). Resolved and scope-checked now.
        sendAt:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/MsgType'
        content:
          type: object
          additionalProperties: true
        replyTo:
          type: string
      required:
        - contactId
        - sendAt
        - type
        - content

    ScheduledSendPatch:
      type: object
      properties:
        sendAt:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/MsgType'
