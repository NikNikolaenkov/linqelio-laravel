# =============================================================================
# Linqelio Platform API — the single source of truth (ADR-0002).
# =============================================================================
# Contract-first: every platform action is declared here BEFORE code. The admin
# UI has no backend of its own — it consumes exactly this contract, so the admin
# and external integrators cannot diverge (full parity, ADR-0002).
#
# --- On the OpenAPI version ---------------------------------------------------
# ADR-0002 prefers OpenAPI 3.1, but this spec targets 3.0.3. oapi-codegen v2.7.2
# prints "OpenAPI 3.1.x ... is not yet supported" (upstream issue #373) and
# recommends 3.0.x; generated Go feeds the gen-drift CI gate, so a reliable
# toolchain wins. The spec avoids 3.1-only syntax, so a future bump is a
# one-line change once oapi-codegen ships 3.1 support.
#
# --- On the single-file layout ------------------------------------------------
# This is ONE self-contained document, organized by resource with the banners
# below (health / channels / contacts / messages / embed) and a components
# catalog that mirrors the intended module split (errors, contact, envelope,
# channel, embed, pagination, params). It is NOT split across paths/*.yaml and
# components/*.yaml because the pinned generator (oapi-codegen v2.7.2, invoked by
# the fixed Taskfile/CI command `oapi-codegen ... api/openapi/openapi.yaml`)
# cannot emit Go types for schemas defined in external $ref files: any external
# reference suppresses type emission, and import-mapping "-" yields `type X = X`
# self-cycles / undefined types. Physically splitting the files would require a
# bundle step in the Taskfile/CI `gen` target (out of this slice's scope). See
# the S0.2 report for details and remediation.
#
# --- On x-permission (ADR-0050 §4) ---------------------------------------------
# EVERY operation declares `x-permission`. The control plane reads it from the
# embedded copy of this document (api/permissions) and enforces it in a
# middleware BEFORE the handler runs; the api/parity gate fails CI when an
# operation has none or names an unknown value. There is no default: an
# operation nobody classified is not served. Allowed values:
#   - an internal/authz permission (`channels:read`, `channels:manage`,
#     `messages:send`, `contacts:write`, `settings:manage`, `audit:read`, ...):
#     checked against the caller's Principal (a client key or a human session —
#     one type for both);
#   - `platform:admin`: cross-tenant operator surface (tenants, their keys, the
#     dead-letter queue spanning every tenant). The `platform:admin` key scope,
#     which no cabinet permission — not even the "*" master key — implies;
#   - `none`, together with a non-empty `x-permission-reason`: the operation is
#     not authorized by a cabinet principal at all (the public health probe, the
#     embed-token Plane B). `none` may not be put on an operation that accepts
#     clientApiKey — it describes the credential, it is not a way around a check.
#   - `self`, together with `x-permission-reason`: the operation acts on the
#     CALLER'S OWN account (/auth/me, own sessions, own second factor). The
#     middleware requires a valid session cookie and consults no role; it must
#     accept sessionCookie and must not accept clientApiKey (a key has no person).
# A permission-checked operation must accept BOTH clientApiKey and sessionCookie
# (the middleware takes either), declare a 403 response and list
# auth.forbidden_scope in x-error-codes: that is the refusal the middleware sends.
#
# --- On x-suspension (R7-B, issue #36, ADR-0080) -------------------------------
# A suspended organization's cabinets are read-only. Which operations that
# refuses is DERIVED, not listed: every operation that acts in a cabinet (a
# cabinet x-permission, or the embed token) with a method other than
# GET/HEAD/OPTIONS is refused with 403 tenancy.suspended — so a new mutating
# operation is refused by default. The exceptions carry `x-suspension: allowed`
# with an `x-suspension-reason`. The api/parity gate holds the contract to it:
# an operation that can be refused lists tenancy.suspended in x-error-codes and
# declares 403; one that cannot does not list it; x-suspension on a read, a
# platform or a self operation is an error.
openapi: 3.0.3

info:
  title: Linqelio Platform API
  version: 0.1.0
  description: >
    Unified multi-channel messaging control plane. Errors are RFC 9457
    problem+json with a machine `code` from the ADR-0013 registry; lists are
    cursor-paginated; the version is pinned in the path (`/v1`).

    Idempotency is per-operation, not universal. An operation takes
    `Idempotency-Key` only where its own `parameters` say so: sends require it,
    channel provisioning accepts it, and the rest of the command surface does not
    read the header at all. Do not infer from "this is a command" that a retry is
    safe — check the operation.
  license:
    name: Proprietary

servers:
  - url: /v1
    description: Version 1 (path-versioned; breaking changes ship as /v2).

# Either credential authorizes a cabinet operation: an API key, or a person's
# session cookie (+ the X-Linqelio-Cabinet header; see sessionCookie). Both
# become the same Principal before the x-permission check (ADR-0050 §3).
security:
  - clientApiKey: []
  - sessionCookie: []

tags:
  - name: health
    description: Liveness/readiness.
  - name: channels
    description: Channel inventory and state.
  - name: contacts
    description: Contacts (persons with identities[], ADR-0008).
  - name: messages
    description: Outbound message commands.
  - name: embed
    description: Embeddable conversation widget sessions (ADR-0007/0009).
  - name: auth
    description: Human identity — login, sessions, invites, password reset, second factor (ADR-0049).
  - name: team
    description: People of a cabinet — members, roles, channel assignments, invites (issue #31).
  - name: realtime
    description: Live event streams (Server-Sent Events) scoped to the caller (ADR-0069).
  - name: ai
    description: The AI subsystem — run journal and provider connectivity (ADR-0064).
  - name: campaigns
    description: Campaigns — bulk sends through the send policy's campaign mode (ADR-0063).
  - name: analytics
    description: Reports on the hourly aggregates, and their CSV / XLSX exports (ADR-0066).
  # R11-D (issue #58, ADR-0067).
  - name: compliance
    description: Compliance — AI dialogue scans against the cabinet's rules, findings and the actions on them (ADR-0067).

paths:
  # ===========================================================================
  # health.yaml — liveness/readiness
  # ===========================================================================
  /healthz:
    get:
      operationId: healthCheck
      x-permission: none
      x-permission-reason: >
        Unauthenticated liveness/readiness probe: no credential, no cabinet, no data.
      summary: Liveness/readiness probe.
      description: Reports service health. Unauthenticated; safe to poll.
      tags:
        - health
      security: []
      responses:
        '200':
          description: Service is healthy (or degraded but serving).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                required:
                  - status
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ===========================================================================
  # channels.yaml — channel inventory
  # ===========================================================================
  /channels:
    get:
      operationId: listChannels
      x-permission: 'channels:read'
      summary: List channels configured in the cabinet.
      description: >
        Returns the channels visible in the caller's cabinet with their kind,
        state, and honest capabilities (ADR-0012). Read-only for M0.
      tags:
        - channels
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: The channels configured in the cabinet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createChannel
      x-permission: 'channels:manage'
      summary: Provision a new channel in the cabinet.
      description: >
        Create a channel of the given kind. It starts disconnected; call the
        connect command to begin pairing (a QR for wa_web, ADR-0013
        channel.pairing_required). Provisioning is authorized against the connect
        policy budget (ADR-0019 policy seam).

        Accepts `Idempotency-Key` (optional). With a key, replaying the same
        request returns the channel the first call created instead of provisioning
        a second one; the same key with a DIFFERENT kind or label is
        idempotency.key_reused (409). Without a key the call is not idempotent —
        so an integrator whose write is interrupted between our answer and their
        own commit is left with a channel they cannot adopt. deleteChannel is the
        way back out of that; the key is still the way to avoid needing it.


        Plan quota (ADR-0051 §3): channels are sold per kind, so a new channel
        takes one `channels.<kind>` of the ORGANIZATION that owns the cabinet
        (counted across all its cabinets). At the limit the create is refused
        with 403 tenancy.quota_exceeded, whose `quota` member names the metric,
        the limit and the current use. A replay of an Idempotency-Key is not a
        new channel and is answered even at the limit.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
        - idempotency.key_reused
        - policy.rule_blocked
        - policy.quota_exceeded
        # R6-C (#33, ADR-0051 §3): the organization's plan allows no more
        # channels of this kind (403; `quota` in the problem body).
        - tenancy.quota_exceeded
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: >
            The channel was provisioned (disconnected until paired). A replay of
            the same Idempotency-Key answers 201 with the ORIGINAL channel, so a
            retry and a first call are indistinguishable to the caller — which is
            the point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /channels/{id}:
    delete:
      operationId: deleteChannel
      x-permission: 'channels:manage'
      summary: Delete a channel and the correspondence that belongs to it.
      description: >
        Removes the channel with its conversations, its messages and their
        attachments, the queued outbound work that has not left yet, and the
        inbox this channel owns on the operator desk — the desk conversations and
        their message history go with it. This is the channel-level counterpart of
        deleteCabinet, and it is not reversible.


        It is deliberately NOT disconnect. Disconnect closes the live link and
        keeps the channel, so it can be reconnected; this keeps nothing. And it is
        deliberately not a plain row delete either: `messages.channel_id` is
        ON DELETE SET NULL, so dropping the row would leave every message the
        channel ever carried in place — bodies, chat ids and contact references
        intact — attached to nothing and reachable by nothing. Deleting a channel
        has to mean deleting what it carried, and this operation does.


        The live session is torn down FIRST and the operation fails closed with
        provider.unavailable (503) if it cannot be: after the row is gone there is
        no handle left to log that session out with, so a WhatsApp pairing or a
        Viber callback would stay live with nothing on our side able to reach it.
        The same applies to the operator desk — an inbox we cannot delete while we
        still know its id is an inbox whose history nobody can delete afterwards.
        A channel that is already disconnected has no live session to close, so it
        deletes whether or not the provider answers: disconnect first, then delete,
        is the way to retire a channel whose provider is gone for good.


        The audit trail is not touched. The cabinet outlives the channel, so
        unlike a tenant offboarding nothing needs archiving — the record of this
        deletion, with its counts, simply stays where every other entry is.


        Requires the cabinet's own key; a channel outside the caller's cabinet is
        invisible to it. IDEMPOTENT: an id that is already gone answers 200 with
        zero counts and `deleted: false`, because the requested state — this
        channel is not here — holds either way.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - provider.unavailable
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: What the deletion removed (all zeros if nothing was left).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDeletion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /channels/{id}/connect:
    post:
      operationId: connectChannel
      x-permission: 'channels:manage'
      summary: Start (or refresh) a channel's pairing session.
      description: >
        Begin connecting the channel. For QR channels (wa_web) this returns a
        pairing payload (QR string / pairing code) the operator scans; for
        API-token channels (bots) it transitions straight to connected. Poll
        getChannelStatus to observe progress.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - channel.not_found
        - channel.not_connected
        - channel.pairing_required
        - policy.rate_limited
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The current pairing/connection status (with QR if pairing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /channels/{id}/credentials:
    put:
      operationId: setChannelCredentials
      x-permission: 'channels:manage'
      summary: Set the channel's provider credential (write-only).
      description: >
        Store the channel's provider credential (e.g. a Telegram bot token or a
        Viber PA auth token) in the secret store and bind its reference to the
        channel. WRITE-ONLY by design (ADR-0011): the raw value is accepted here
        once, never persisted outside the secret store, and never returned by
        any API — reads only ever see the `secret://` reference. Intended for
        the first-connect flow of API-token channels (tg_bot, viber_bot,
        wa_cloud); QR channels (wa_web) pair via connectChannel instead.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - channel.not_found
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetChannelCredentialsRequest'
      responses:
        '204':
          description: The credential was stored and bound to the channel.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /channels/{id}/sync:
    post:
      operationId: syncChannel
      x-permission: 'channels:manage'
      summary: Import contacts (and request history) from the channel's source.
      description: >
        Backfill from the provider account itself: pulls the address book into
        platform contacts (deduplicated on the exact within-channel identity key
        — ADR-0008 §2 never fuzzy-matches) and, when `history=true`, asks the
        source to replay older messages. Replayed messages arrive asynchronously
        through the ordinary inbound pipeline (deduplicated by provider message
        id), so this returns as soon as the request is accepted. Only source-side
        channels support it: wa_web and tg_client. Bot channels (tg_bot,
        viber_bot) and wa_cloud have no history/address-book API upstream and
        yield channel.capability_unsupported.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncChannelRequest'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - channel.not_found
        - channel.not_connected
        - channel.capability_unsupported
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: Import result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /channels/{id}/settings:
    put:
      operationId: updateChannelSettings
      x-permission: 'channels:manage'
      summary: Replace a channel's non-secret provider configuration.
      description: >
        Store the channel's provider *identifiers* — the values that come from
        the provider's own dashboard and are not credentials. Unlike
        setChannelCredentials this is READABLE back (the settings appear on the
        channel in listChannels), because "which number does this channel send
        from?" has to be answerable without guessing.


        PUT REPLACES the whole object: a key omitted from the body is cleared,
        not kept. Settings are validated against the channel's kind, so a key
        that means nothing for that kind is rejected rather than silently stored
        where nothing will ever read it.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - channel.not_found
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelSettings'
      responses:
        '200':
          description: The settings now stored on the channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /channels/{id}/disconnect:
    post:
      operationId: disconnectChannel
      x-permission: 'channels:manage'
      summary: Disconnect a channel.
      description: >
        Tears the channel's live link down: wa_web logs the WhatsApp instance
        out, tg_client wipes the MTProto session, token channels unbind their
        stored credential reference. The channel row flips to disconnected;
        reconnect via connectChannel / setChannelCredentials.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - channel.not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The channel's state after disconnecting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /channels/{id}/status:
    get:
      operationId: getChannelStatus
      x-permission: 'channels:read'
      summary: Get a channel's live connection/pairing status.
      description: >
        Returns the channel's current connection state and, while pairing, the QR
        / pairing payload to render. Safe to poll from the admin connect screen.
      tags:
        - channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - channel.not_found
        - channel.not_connected
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: The channel's current connection/pairing status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # tenancy — platform administration (cabinets + client API keys). Requires a
  # key carrying the `platform:admin` scope; ordinary cabinet keys are rejected
  #
  # `secrets:read` is the other scope not implied by `*`. It gates disclosure of
  # secret-store references (access-pool `credentialsRef`): a key issued to send
  # messages has no need to learn where provider credentials are kept, and every
  # disclosure is written to the audit trail.
  # with auth.forbidden_scope. Client keys are cabinet-scoped and isolated by
  # Postgres RLS — a client's token only ever sees its own cabinet.
  # ===========================================================================
  /cabinets:
    get:
      operationId: listCabinets
      x-permission: 'platform:admin'
      summary: List all cabinets (platform admin).
      tags:
        - tenancy
      parameters:
        # R7-A (#34): the cabinets of one organization.
        - name: organizationId
          in: query
          required: false
          description: Only the cabinets of this organization.
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: All cabinets on the platform (or of one organization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CabinetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCabinet
      x-permission: 'platform:admin'
      summary: Provision a new client cabinet (platform admin).
      description: >
        Creates a cabinet in the organization named by `organizationId`,
        reserving one `cabinets` of its plan (403 tenancy.quota_exceeded past
        the limit). Without `organizationId` (deprecated, kept for existing
        callers) it creates an organization + cabinet pair for a new client,
        as before. The cabinet is the tenant boundary (RLS): keys issued for it
        can only ever see its own channels, contacts, and messages.
      tags:
        - tenancy
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # R6-C (#33, ADR-0051 §3): the organization's plan allows no more
        # cabinets (403; `quota` in the problem body).
        - tenancy.quota_exceeded
        # R7-A (#34): organizationId names no organization (404).
        - tenancy.organization_not_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCabinetRequest'
      responses:
        '201':
          description: The cabinet was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cabinet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cabinets/{id}:
    delete:
      operationId: deleteCabinet
      x-permission: 'platform:admin'
      summary: Offboard a tenant — delete the cabinet and everything in it.
      description: >
        Removes the cabinet with its channels, users, memberships, API keys,
        contacts, conversations and messages. This is the tenant-level
        counterpart of eraseContact, and it is not reversible.


        The audit trail is the one thing that survives: its entries are archived
        before the delete, so the record of who did what to this tenant — the
        deletion included — outlives the tenant. The archive is not readable
        through this API; it is a platform-operator record.


        Requires the platform:admin scope. Idempotent: an id that is already gone
        answers 204.
      tags:
        - tenancy
      parameters:
        - name: id
          in: path
          required: true
          description: The cabinet id.
          schema:
            type: string
            format: uuid # issue #119: a malformed id is a 400 before any store/driver call
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The cabinet is gone (whether or not it existed).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cabinets/{id}/keys:
    get:
      operationId: listCabinetKeys
      x-permission: 'platform:admin'
      summary: List a cabinet's API keys (platform admin; never the secrets).
      tags:
        - tenancy
      parameters:
        - $ref: '#/components/parameters/CabinetPathId'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '200':
          description: The cabinet's keys (hashes/secrets are never returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: issueCabinetKey
      x-permission: 'platform:admin'
      summary: Issue a new API key for a cabinet (platform admin).
      description: >
        Mints a client bearer token for the cabinet. The secret is returned in
        this response ONCE and stored only as an argon2id hash (ADR-0005) — it
        cannot be retrieved again; issue a new key instead.
      tags:
        - tenancy
      parameters:
        - $ref: '#/components/parameters/CabinetPathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueApiKeyRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
      responses:
        '201':
          description: The new key; `bearerToken` is shown only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cabinets/{id}/keys/{kid}/rotate:
    post:
      operationId: rotateCabinetKey
      x-permission: 'platform:admin'
      summary: Rotate a cabinet's API key with an overlap window (platform admin).
      description: >
        Mints a replacement and puts the outgoing key into a grace window instead
        of cutting it off. Both work until `graceUntil`, so the holder swaps at
        its own pace and the old key lapses on its own.

        The keyring has always had the states this needs — active, next, retiring
        with a grace window, all honoured by the verifier — and no way to reach
        them through the API. The only available "rotation" was issue-then-revoke,
        which breaks every holder in the instant between the two calls.

        The replacement's secret is shown ONCE, here. A revoked key cannot be
        rotated: it is already off, and reviving it into a grace window would hand
        back access somebody deliberately withdrew.
      tags:
        - tenancy
      parameters:
        - $ref: '#/components/parameters/CabinetPathId'
        - $ref: '#/components/parameters/KeyKid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateApiKeyRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
        - keyring.rotation_overlap_required
      responses:
        '201':
          description: The replacement key; `bearerToken` is shown only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cabinets/{id}/keys/{kid}:
    delete:
      operationId: revokeCabinetKey
      x-permission: 'platform:admin'
      summary: Revoke a cabinet's API key (platform admin).
      tags:
        - tenancy
      parameters:
        - $ref: '#/components/parameters/CabinetPathId'
        - $ref: '#/components/parameters/KeyKid'
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.cabinet_not_found
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The key was revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # webhooks + access pool — admin management via the contract (ADR-0002, M6 S4)
  # ===========================================================================
  /webhooks:
    get:
      operationId: listWebhooks
      x-permission: 'settings:manage'
      summary: List outbound webhook subscriptions in the cabinet.
      tags:
        - webhooks
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: The webhook subscriptions configured in the cabinet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: registerWebhook
      x-permission: 'settings:manage'
      summary: Register an outbound webhook subscription.
      description: >
        Subscribe an HTTPS endpoint to cabinet events (ADR-0031, ADR-0046).


        The subscription's HMAC signing key arrives one of three ways, and
        exactly one may be used: `secret` is the key itself, handed to the secret
        store so only its reference is persisted; `secretRef` points at a key
        already in that store, for a caller who manages the vault directly; and
        when neither is given the platform mints one and returns it in this
        response — the only place any signing key is ever returned.


        A subscription registered here therefore always has a key. Registering
        without one was the previous behaviour by omission, and it produced
        deliveries carrying no signature at all — which any receiver that
        verifies (the only kind worth having) rejects, one dead-letter at a time.
      tags:
        - webhooks
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # The signing key could not be generated or could not be written to the
        # secret store. Nothing is registered in that case: a subscription
        # holding a reference to a key that was never written would look
        # configured and deliver unsigned for the rest of its life.
        - provider.unavailable
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWebhookRequest'
      responses:
        '201':
          description: >
            The webhook subscription was registered. `secret` is present only
            when the platform minted the key, and this response is the one and
            only time it is shown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterWebhookResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The webhook subscription id.
        schema:
          type: string
          format: uuid # issue #119: a malformed id is a 400 before any store/driver call
    patch:
      operationId: updateWebhook
      x-permission: 'settings:manage'
      summary: Enable or disable a webhook subscription.
      description: >
        Suspend delivery without losing the subscription — its url, event types
        and signing secret survive, so re-enabling does not mean re-registering
        and re-sharing a key. Use this to stop a noisy or broken endpoint;
        use deleteWebhook to unsubscribe for good.

        An id that names no subscription of this cabinet — unknown or another
        cabinet's, indistinguishably — answers 404 `webhook.not_found` (before
        issue #119 that 404 carried `tenancy.cross_cabinet_denied`; the status
        is unchanged, so a client keyed on the status keeps working). A
        malformed (non-uuid) id answers 400 `validation.invalid_request`.
      tags:
        - webhooks
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # issue #119: an unknown or another cabinet's webhook id (it was
        # answered tenancy.cross_cabinet_denied).
        - webhook.not_found
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: The subscription after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWebhook
      x-permission: 'settings:manage'
      # R7-B (#36, ADR-0080): still served while the organization is suspended.
      x-suspension: allowed
      x-suspension-reason: >
        Reduces egress: removing a subscription stops the cabinet's data from being delivered to a URL the customer no longer trusts; nothing is created (ADR-0080 §3).
      summary: Unsubscribe an endpoint permanently.
      description: >
        Remove the subscription. Without this a tenant cannot stop receiving
        their own data — only an operator with database access could. Idempotent:
        deleting an id that is already gone answers 204, so a retry after a lost
        response is not an error.
      tags:
        - webhooks
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The subscription is gone (whether or not it existed).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-pool:
    get:
      operationId: listAccessPool
      x-permission: 'channels:read'
      summary: List access-pool credentials for a channel kind.
      tags:
        - access-pool
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ChannelKind'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The access-pool entries for the cabinet + kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPoolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addAccessPoolEntry
      x-permission: 'channels:manage'
      summary: Add a provider credential to the access pool.
      description: >
        Register an auth-out credential (ADR-0029). `credentialsRef` is a
        secret-store reference (secret://...) — never the credential itself.
      tags:
        - access-pool
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAccessPoolEntryRequest'
      responses:
        '201':
          description: The credential was added to the pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPoolEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-pool/{id}/health:
    put:
      operationId: setAccessPoolHealth
      x-permission: 'channels:manage'
      summary: Set a pool entry's health, returning it to rotation or pulling it out.
      description: >
        A credential that fails a send with a permanent auth or ban error is
        auto-degraded and drops out of rotation (ADR-0032 §2). Getting it BACK
        was possible only through the operator CLI — so an account that recovered
        stayed out until somebody with shell access noticed, and a tenant could
        not act on their own pool at all.

        Setting `healthy` returns the entry to rotation; `degraded` and `banned`
        take it out. Audited either way: this decides which of a cabinet's
        credentials its messages leave through.

        An id that names no pool entry of this cabinet — unknown or another
        cabinet's, indistinguishably — answers 404 `accesspool.not_found`
        (before issue #119 that 404 carried `tenancy.cross_cabinet_denied`; the
        status is unchanged). A malformed (non-uuid) id answers 400
        `validation.invalid_request`.
      tags:
        - access-pool
      parameters:
        - name: id
          in: path
          required: true
          description: The pool entry id.
          schema:
            type: string
            format: uuid # issue #119: a malformed id is a 400 before any store/driver call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccessPoolHealthRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # issue #119: an unknown or another cabinet's pool entry id (it was
        # answered tenancy.cross_cabinet_denied).
        - accesspool.not_found
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '204':
          description: The entry's health was updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /access-pool/rotate:
    post:
      operationId: rotateAccessPool
      x-permission: 'channels:manage'
      summary: Rotate the access pool for a channel kind (zero-downtime).
      description: >
        Promote the healthy `next` credential to active and retire the current
        active with a grace window (ADR-0029). Fails with 409 when there is no
        `next` to promote.
      tags:
        - access-pool
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateAccessPoolRequest'
      responses:
        '200':
          description: The pool was rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateAccessPoolResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /dead-letters:
    get:
      operationId: listDeadLetters
      x-permission: 'platform:admin'
      summary: List webhook deliveries the platform gave up on.
      description: >
        The dead-letter window (ADR-0031 §5). A delivery that exhausts its
        attempts — six, backing off to about fifteen minutes — is marked failed
        and stops being retried. Until this endpoint those rows existed and
        nothing could see them: a tenant's endpoint broke, the platform tried,
        gave up, and the event was gone with no way to list or resend it.

        Requires the `platform:admin` scope and spans every cabinet: the delivery
        queue is cross-cabinet infrastructure, and replaying one sends traffic to
        a tenant's endpoint. Filter with `cabinetId` to scope a listing.
      tags:
        - webhooks
      parameters:
        - name: cabinetId
          in: query
          required: false
          description: Restrict to one cabinet. Omitted, every cabinet is listed.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Only deliveries created at or after this instant.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 100 and is capped at 500.
          schema:
            type: integer
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: Dead-lettered deliveries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dead-letters/{id}/replay:
    post:
      operationId: replayDeadLetter
      x-permission: 'platform:admin'
      summary: Put a dead-lettered delivery back in the queue.
      description: >
        Requeues the delivery, due immediately, with its attempt counter reset so
        it gets a full retry schedule rather than dying again on the first
        failure. The payload and signature are regenerated by the deliverer, so
        the receiver sees an ordinary delivery.

        Requires `platform:admin`. Idempotent: only a failed delivery moves, so
        replaying twice is harmless and a replay cannot disturb one still being
        retried. Recorded in the audit trail — this sends traffic to somebody
        else's endpoint.

        An id that names no failed delivery — unknown, or a delivery still being
        retried or already delivered — answers 404 `deadletter.not_found`
        (before issue #119 that 404 carried `provider.unavailable`; the status is
        unchanged). A malformed (non-uuid) id answers 400
        `validation.invalid_request` (it used to reach the database).
      tags:
        - webhooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid # issue #119: a malformed id is a 400 before any store/driver call
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
        # issue #119: no failed delivery with that id (it was answered
        # provider.unavailable).
        - deadletter.not_found
      responses:
        '204':
          description: The delivery was requeued.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # platform operators — human platform administrators (ADR-0075, issue #107)
  # ===========================================================================
  # The people who hold platform power. The FIRST one is created by the
  # `controlplane bootstrap-operator` command on the server; every later grant
  # and revocation goes through these operations and is written to the
  # security log. A person's grant is checked on every request, so a revocation
  # takes effect on the next one. A human operator must have passed the second
  # factor in the session (ADR-0049 §4).
  /platform/operators:
    get:
      operationId: listPlatformOperators
      x-permission: 'platform:admin'
      summary: List platform operators (platform admin).
      description: >
        The active operators, and — with `includeRevoked=true` — the revoked
        grants too, which are kept as history rather than deleted.
      tags:
        - platform
      parameters:
        - name: includeRevoked
          in: query
          required: false
          description: Also return revoked grants.
          schema:
            type: boolean
            default: false
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The operators, active first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOperatorList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: grantPlatformOperator
      x-permission: 'platform:admin'
      summary: Make an existing account a platform operator (platform admin).
      description: >
        Names the account by `accountId` or by `email` — exactly one of them.
        The account must already exist (invite the person first); this
        operation never creates one. Granting to an account that is already an
        active operator changes nothing and answers 200 with the existing grant;
        a new grant (or the re-activation of a revoked one) answers 201.
        Recorded in the security log.
      tags:
        - platform
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - platform.account_not_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPlatformOperatorRequest'
      responses:
        '200':
          description: The account already was an active operator; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOperator'
        '201':
          description: The account is now an active operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOperator'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/operators/{accountId}:
    delete:
      operationId: revokePlatformOperator
      x-permission: 'platform:admin'
      summary: Revoke a platform operator (platform admin).
      description: >
        Ends the account's grant. The grant is kept as history (revokedAt), not
        deleted. The last active operator cannot be revoked (409
        platform.last_operator): the platform would be left with no human
        administrator, recoverable only from the server with
        `bootstrap-operator --additional`. An operator may revoke themselves as
        long as another one remains. Recorded in the security log.
      tags:
        - platform
      parameters:
        - name: accountId
          in: path
          required: true
          description: The operator's account id.
          schema:
            type: string
            format: uuid # issue #119: a malformed id is a 400 before any store/driver call
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - platform.operator_not_found
        - platform.last_operator
        # issue #119: a malformed (non-uuid) path id.
        - validation.invalid_request
      responses:
        '204':
          description: The grant was revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ===========================================================================
  # end of platform operators (ADR-0075)
  # ===========================================================================

  # ===========================================================================
  # R7-B — organization suspension (issue #36, ADR-0051 §5, ADR-0080)
  # ===========================================================================
  # OWNED BY R7-B: only these two operations. Reading and listing organizations
  # is the organizations API (#34, ADR-0079, /platform/organizations below);
  # its Organization carries `status` and `suspendedReason`, and these two
  # operations write the organization's trail (organization_audit) like it does.
  #
  # A suspended organization is READ-ONLY in every one of its cabinets: every
  # cabinet mutation — the operations that list tenancy.suspended in
  # x-error-codes, whatever the credential — is refused with 403
  # tenancy.suspended; reads keep working; the operations marked
  # `x-suspension: allowed` keep working too (erasure, cutting access, the embed
  # read session). A worker holds the organization's channels: their live
  # provider links are closed, their credentials kept, so resuming brings them
  # back without re-pairing where the provider allows it.
  /platform/organizations/{organizationId}/suspend:
    parameters:
      - name: organizationId
        in: path
        required: true
        description: The organization id.
        schema:
          type: string
          format: uuid
    post:
      operationId: suspendOrganization
      x-permission: 'platform:admin'
      summary: Suspend an organization — all its cabinets become read-only (platform admin).
      description: >
        Makes every cabinet of the organization read-only (ADR-0080): each
        cabinet mutation is refused with 403 tenancy.suspended — sends included,
        from the API, the embed widget and an operator desk alike — while reads
        keep working, so the customer still sees their data. Messages accepted
        before the suspension that have not left yet are failed with reason
        `tenancy.suspended` instead of being sent. The organization's channels
        are then held by a background worker: the live provider link is closed
        and the credentials are kept.


        Idempotent: suspending an organization that is already suspended changes
        nothing — the original reason, time and author stand — and answers 200
        with `changed: false`. Recorded in the audit trail of every cabinet of
        the organization.
      tags:
        - platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendOrganizationRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.organization_not_found
      responses:
        '200':
          description: The organization is suspended (now, or already was — see `changed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSuspension'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/organizations/{organizationId}/resume:
    parameters:
      - name: organizationId
        in: path
        required: true
        description: The organization id.
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeOrganization
      x-permission: 'platform:admin'
      summary: Lift an organization's suspension (platform admin).
      description: >
        Makes the organization's cabinets writable again at once — the very next
        mutation is served — and has the worker bring its held channels back:
        reconnected where the provider keeps the session (wa_web, tg_client,
        tg_bot), with nothing to do for the webhook kinds (viber_bot, wa_cloud).
        A wa_web channel whose session the provider no longer has is left
        disconnected, to be paired again, and says so in the cabinet's audit
        trail.


        Idempotent: resuming an active organization changes nothing and answers
        200 with `changed: false`. Recorded in the audit trail of every cabinet
        of the organization.
      tags:
        - platform
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.organization_not_found
      responses:
        '200':
          description: The organization is active (now, or already was — see `changed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSuspension'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ===========================================================================
  # end of R7-B organization suspension
  # ===========================================================================

  /audit:
    get:
      operationId: listAudit
      x-permission: 'audit:read'
      summary: List the cabinet's audit log (append-only, newest first).
      description: >
        Query the cabinet's audit trail (ADR-0028). Optional `action` filters by
        event type; `limit` caps the page (default 100).
      tags:
        - audit
      parameters:
        - name: action
          in: query
          required: false
          description: Exact action match, e.g. `contact.erase`.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: >
            Only entries at or after this instant. Without it the only way to
            reach an incident's window was to raise `limit` until it came into
            view — which on a busy cabinet means paging past everything that
            happened after.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 100 and is capped at 500.
          schema:
            type: integer
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: The cabinet's audit entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # BEGIN R10-F Bitrix24 application skeleton (paths) — issue #73, epic #20,
  # ADR-0052, ADR-0055, ADR-0093
  # ===========================================================================
  # OWNED BY R10-F: the /bitrix/* family below; its schemas are in the
  # "BEGIN R10-F schemas" block at the end of components.schemas and its error
  # codes in the "R10-F" block at the end of ErrorCode.
  #
  # Three audiences:
  #   - the console (cabinet, settings:manage): the linked portals, a one-time
  #     pairing code, unlinking;
  #   - the application page inside the Bitrix24 iframe (x-permission none, no
  #     credential of ours): redeeming the pairing code during installation, and
  #     the operator's auto-login — both authenticated by BITRIX's tokens, which
  #     the server verifies with Bitrix itself (the OAuth server for the pairing,
  #     the portal's REST API for the login), never by trusting the parameters;
  #   - the person (self): confirming, from a console session, the link of an
  #     administrative account to a Bitrix user.
  # The host's own entry points — the HTML page Bitrix frames (/bitrix/app) and
  # the event handler it POSTs lifecycle events to (/bitrix/events) — are NOT in
  # this contract, like the Chatwoot and Viber webhooks: their shapes are
  # Bitrix's (a form post, an HTML document), no client of ours calls them, and
  # they are mounted on the root mux next to the other host webhooks.
  /bitrix/portals:
    get:
      operationId: listBitrixPortals
      x-permission: 'settings:manage'
      summary: List the Bitrix24 portals linked to the cabinet.
      description: >
        The installations of our Bitrix24 application linked to this cabinet
        (ADR-0052): at most one live (`installed` or `reauth_required`), plus the
        ones that were uninstalled on the portal or unlinked here, which are kept
        as history and so that a reinstall revives their mappings. No token or
        secret is ever returned — only whether the installation holds them and
        when the access token expires.
      tags:
        - bitrix
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - tenancy.cabinet_not_found
      responses:
        '200':
          description: The cabinet's portals, live first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixPortalList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bitrix/portals/{portalId}:
    parameters:
      - $ref: '#/components/parameters/BitrixPortalId'
    delete:
      operationId: unlinkBitrixPortal
      x-permission: 'settings:manage'
      # R7-B (#36, ADR-0080): unlinking is cutting access, which a suspended
      # organization must still be able to do.
      x-suspension: allowed
      x-suspension-reason: >
        Unlinking a portal cuts a host system's access to the cabinet and drops the tokens we hold for it; a suspended organization must still be able to take access away (ADR-0080 §3).
      summary: Unlink a Bitrix24 portal from the cabinet.
      description: >
        Ends the link on our side: the OAuth pair, the client secret and the
        application token we hold for the portal are dropped from the secret
        store, the installation is marked `unlinked`, and the operator
        auto-login stops working. The application stays installed on the portal
        (Bitrix24 offers no call to uninstall it remotely) — remove it there too.
        Our message history is not touched. The portal can be paired again with
        a new code; into this cabinet the installation is revived with its
        mappings, into another one it starts from scratch.


        Idempotent: unlinking an installation that is already unlinked or
        uninstalled answers 204. Recorded in the audit trail.
      tags:
        - bitrix
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - bitrix.portal_not_found
        - validation.invalid_request
      responses:
        '204':
          description: The portal is unlinked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bitrix/pairings:
    post:
      operationId: createBitrixPairing
      x-permission: 'settings:manage'
      summary: Issue a one-time code that links a Bitrix24 portal to the cabinet.
      description: >
        Linking a portal is a deliberate act of the cabinet's administrator, not
        a side effect of installing the application (ADR-0093 §2). The
        administrator registers our LOCAL application on the portal (one per
        portal, BITRIX_APP_REQUIREMENTS §8.2), enters its OAuth `clientId` and
        `clientSecret` here, and gets a code valid for 30 minutes. Opening the
        application on the portal asks for the code; redeeming it proves, with
        Bitrix's OAuth server, that the portal's tokens were issued to exactly
        this client — only then is the portal linked to this cabinet.


        The code is shown ONCE: only its sha256 is stored. The client secret goes
        straight to the secret store. Issuing a new code revokes the cabinet's
        previous unredeemed one. `appUrl` is the address to register as the
        application's handler and installation path (when the deployment knows
        its public URL). Recorded in the audit trail — without the secret.
      tags:
        - bitrix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BitrixPairingRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - auth.origin_rejected
        - tenancy.suspended
      responses:
        '201':
          description: The pairing code (shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixPairing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bitrix/app/pairing:
    post:
      operationId: redeemBitrixPairing
      x-permission: none
      x-permission-reason: >
        Called by our application page inside the Bitrix24 iframe during installation, before any Linqelio credential exists there. It is authenticated by the pairing code (issued by a cabinet administrator) AND by the portal's OAuth refresh token, which the server redeems at Bitrix's OAuth server with the pairing's client credentials — a code without a token of that very client links nothing.
      summary: Link the portal to the cabinet that issued the pairing code.
      description: >
        Sent by the application page (from `BX24.getAuth()`) with the code the
        administrator typed. The server looks the code up, redeems the refresh
        token at Bitrix's OAuth server with the pairing's client credentials, and
        takes the portal's identity (`member_id`, REST endpoint, installing user)
        from THAT answer — the `memberId` and `domain` in the body must agree
        with it and are otherwise ignored. The new token pair goes to the secret
        store; the installation is created, or revived with its mappings when
        the portal was linked to this cabinet before (ADR-0052 §6).


        A portal already live in another cabinet is refused (409
        bitrix.portal_linked_elsewhere); a cabinet that already has another live
        portal too (409 bitrix.cabinet_has_portal). An unknown, expired, used or
        revoked code is 400 bitrix.pairing_invalid; tokens Bitrix does not
        accept for that client are 401 bitrix.auth_invalid. Nothing has been
        verified against a real Bitrix24 portal yet.
      tags:
        - bitrix
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BitrixPairingRedeemRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.origin_rejected
        - bitrix.pairing_invalid
        - bitrix.auth_invalid
        - bitrix.portal_linked_elsewhere
        - bitrix.cabinet_has_portal
        - provider.unavailable
      responses:
        '200':
          description: The portal is linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixPortal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /bitrix/app/session:
    post:
      operationId: createBitrixAppSession
      x-permission: none
      x-permission-reason: >
        The Bitrix24 operator's auto-login (ADR-0049 §5, ADR-0055 §2): there is no Linqelio credential inside the host's iframe. The caller is authenticated by the portal's own access token, which the server verifies against the installation's STORED REST endpoint (user.current + app.info); rights come from the linked account's Principal, not from the host.
      summary: Auto-login of a Bitrix24 user — mint the operator token for the widget.
      description: >
        Sent by the application page with the user's `AUTH_ID` from
        `BX24.getAuth()`. The server asks the portal — at the endpoint stored for
        the installation of `memberId`, never one taken from the request — who
        holds that token and which application it was issued to. The Bitrix user
        is then mapped to a Linqelio account: an existing link
        (host_user_links), else an account with the same e-mail that is a member
        of the portal's cabinet. Nobody is ever created: an unknown user gets 403
        bitrix.user_not_linked ("ask your administrator to invite you").


        An account with an administrative role (org_owner, org_admin,
        cabinet_admin) is never linked by e-mail alone — the portal's
        administrator controls Bitrix e-mails. For it the answer is 202 with a
        one-time `linkCode`, which that person confirms from their own console
        session (confirmBitrixUserLink); the next call then logs them in.


        The result is an operator token (ADR-0055: `sub: agent`, bounded by the
        person's channels and capabilities) with a short TTL. It is meant to be
        held in the widget's memory only — never a cookie, never localStorage —
        and renewed the same way. It is not a console session and authenticates
        nothing of the console (ADR-0074 is unchanged). Recorded in the security
        log (`auth.federated`).
      tags:
        - bitrix
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BitrixAppSessionRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.origin_rejected
        - bitrix.auth_invalid
        - bitrix.portal_not_linked
        - bitrix.user_not_linked
        - provider.unavailable
      responses:
        '200':
          description: The operator token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixAppSession'
        '202':
          description: The account must confirm the link from the console first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixUserLinkPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /bitrix/user-links/confirm:
    post:
      operationId: confirmBitrixUserLink
      x-permission: self
      x-permission-reason: >
        Links the CALLER'S OWN account to a Bitrix24 user. Both sides must prove themselves: Bitrix vouched for the user when the code was issued in the iframe, and the person proves the account by being logged into it here. No cabinet role is consulted — the code names the account it may be confirmed by.
      summary: Confirm the link of your account to a Bitrix24 user.
      description: >
        Takes the one-time code the application page showed after an
        administrative account was matched by e-mail (createBitrixAppSession
        answered 202). The code is valid for 10 minutes and only for the
        account it was issued to; any other session, an expired or a used code
        is 400 bitrix.link_code_invalid. On success the Bitrix user is linked
        to the caller's account for that portal.
      tags:
        - bitrix
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BitrixUserLinkConfirmRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.session_invalid
        - auth.origin_rejected
        - bitrix.link_code_invalid
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixUserLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ===========================================================================
  # END R10-F Bitrix24 application skeleton (paths)
  # ===========================================================================

  # ===========================================================================
  # BEGIN R10-D AI subsystem foundation (issue #57, epic #14, ADR-0064)
  # ===========================================================================
  # OWNED BY R10-D: /ai/runs and /ai/provider-test. The provider binding itself
  # (provider, model, base URL, write-only key, consent and redaction switches)
  # is the `ai` settings section — /settings/ai, ADR-0057 — not repeated here.
  /ai/runs:
    get:
      operationId: listAiRuns
      x-permission: 'settings:manage'
      summary: Read the cabinet's AI run journal (admins).
      description: >
        The journal of AI task executions (ADR-0064 §5), newest first: task,
        prompt version, provider and model, tokens, latency, cost estimate,
        status and — for a run that did not succeed — a machine error code.
        METADATA ONLY: no prompt, no answer and no hash of either is ever
        stored, so none is returned; `subjectId`/`inputRef` name what a run
        read and `result` holds keys and counts of what it did. Also answers
        this month's totals from the same rows (`month`), next to the
        organization's ai.tokens.month allowance. Gated like the settings: the
        journal maps where the cabinet's AI key is used and what it costs.
      tags:
        - ai
      parameters:
        - name: task
          in: query
          required: false
          description: Only runs of this task.
          schema:
            $ref: '#/components/schemas/AiTask'
        - name: status
          in: query
          required: false
          description: Only runs in this state.
          schema:
            $ref: '#/components/schemas/AiRunStatus'
        - name: before
          in: query
          required: false
          description: >
            Only runs created strictly before this instant — pass the
            `createdAt` of the last item to read the next page.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 50 and is capped at 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The cabinet's AI runs, newest first, and the month's totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRunList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ai/provider-test:
    post:
      operationId: testAiProvider
      x-permission: 'settings:manage'
      summary: Test the connection to the cabinet's configured AI provider.
      description: >
        Sends one fixed, tiny prompt — no customer data — to the provider the
        `ai` settings name, through the same path a real task takes (key from
        the secret store, structured output, schema check, journal, token
        accounting), and answers whether it worked. A provider failure is the
        ANSWER, not an error: 200 with `ok: false` and the failure's
        `errorCode` (e.g. `ai.auth` for a rejected key, `ai.timeout`,
        `ai.unavailable`) — never the provider's own message, which could echo
