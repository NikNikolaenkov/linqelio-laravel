  # ===========================================================================
  # END R7-A organizations (paths)
  # ===========================================================================

  # ===========================================================================
  # contact-fields.yaml — typed contact field schema (issue #48, ADR-0061)
  # ===========================================================================
  # BEGIN R8-F contact fields (paths). Kept as one block so parallel contract
  # work does not interleave with it; the schemas live in the matching
  # "BEGIN R8-F schemas" block at the end of components.schemas, the path
  # parameter under "R8-F" in components.parameters.
  #
  # The SCHEMA (field definitions) is cabinet configuration: reading it is open
  # to everyone who reads contacts (the contact card renders from it), writing
  # it needs `settings:manage`. VALUES live on the contact: read like the
  # contact (`channels:read`), written with `contacts:write`. Value provenance
  # is derived from the CALLER, never from the body: a person's session writes
  # as `human`, an API key as `host` (ADR-0061 §4).
  /contact-fields:
    get:
      operationId: listContactFields
      x-permission: 'channels:read'
      summary: List the cabinet's typed contact field definitions.
      description: >
        Every field definition of the cabinet, in display order (`position`,
        then `key`). The schema belongs to the cabinet (ADR-0061 §1): there are
        no platform-wide or industry fields — a "car dealer" set is a sample a
        cabinet creates, not something the platform ships.
      tags:
        - contacts
      x-error-codes:
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: The cabinet's field definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactFieldList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contact-fields/{key}:
    parameters:
      - $ref: '#/components/parameters/ContactFieldKey'
    put:
      operationId: putContactField
      x-permission: 'settings:manage'
      summary: Create or update one contact field definition.
      description: >
        Creates the field, or updates it in place. Everything is editable EXCEPT
        the `type` (ADR-0061 §8): values stored under the key were validated
        against it, so a different type is a new field. A type change writes
        nothing and answers 422 contact.field_invalid with the entry
        `{field: <key>, reason: "type_immutable"}`; an invalid definition (an
        enum without options, options on a non-enum, ...) answers the same code
        with its own reason.


        Removing an enum option does not touch contacts that already hold it;
        new writes of that value are refused. Every successful write is audited
        (`contact.field.put`).
      tags:
        - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutContactFieldRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.field_invalid
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The definition as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactFieldDef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The definition is invalid, or would change the field's type (contact.field_invalid).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteContactField
      x-permission: 'settings:manage'
      summary: Delete one contact field definition (values are kept).
      description: >
        Removes the DEFINITION only (ADR-0061 §8). Values stored under the key
        stay on the contacts as orphans: they are no longer shown, projected
        into the desk or offered to the AI, and re-creating the key with the
        same type brings them back. Erasing a person's data is
        `POST /contacts/{id}/erase`, not this.


        Idempotent: deleting a key the cabinet does not have answers 204 too.
        Audited (`contact.field.delete`, with whether a definition was found).
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '204':
          description: The definition is gone (or never existed).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{id}/fields:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      operationId: getContactFields
      x-permission: 'channels:read'
      summary: Read a contact's typed field values with their provenance.
      description: >
        The values of the fields the cabinet currently DEFINES, each with its
        read-only provenance — what kind of writer set it (`human`, `host`,
        `platform`, `ai`), when, and which actor. Values under a deleted
        definition are not returned (ADR-0061 §8).
      tags:
        - contacts
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.not_found
      responses:
        '200':
          description: The contact's typed values and their provenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactFieldValues'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: setContactFields
      x-permission: 'contacts:write'
      summary: Set (or clear) typed field values on a contact.
      description: >
        Writes values under the cabinet's schema (ADR-0061). `null` clears a
        field. The write is ALL-OR-NOTHING on validity: every value is checked
        first, and if any fails nothing is written and the answer is 422
        contact.field_invalid with one `errors[]` entry per offending field
        (`reason`: `type_mismatch` — e.g. text sent to a `number` field —,
        `not_in_enum`, `bad_date`, `bad_phone`, `bad_email`, `bad_url`,
        `too_long`, `unknown_field`). A write into a field the caller may not
        write at all is 403 embed.field_ownership_denied.


        Provenance comes from the caller: a person's session writes as `human`,
        an API key as `host`. A value set by a more authoritative writer
        (`human > host > platform > ai`) is NOT overwritten and NOT an error: it
        is reported in `kept[]` with reason `lower_authority` (ADR-0061 §4).
        Fields flagged `syncToDesk` are projected into the cabinet's desk after
        the write (best effort, ADR-0053). Audited (`contact.fields.set`, keys
        only — never values).
      tags:
        - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetContactFieldsRequest'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - auth.origin_rejected
        - tenancy.cross_cabinet_denied
        - contact.not_found
        - contact.field_invalid
        - embed.field_ownership_denied
        # R7-B (#36, ADR-0080): the organization is suspended — its cabinets are read-only.
        - tenancy.suspended
      responses:
        '200':
          description: The values after the write, with what was applied, cleared and kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetContactFieldsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: One or more values failed validation (contact.field_invalid); nothing was written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  # ===========================================================================
  # END R8-F contact fields (paths)
  # ===========================================================================

  # ===========================================================================
  # BEGIN R9-B contact merge (paths) — issue #50, ADR-0090. One self-contained
  # block so parallel contract work does not interleave with it; the schemas are
  # in the matching "BEGIN R9-B schemas" block at the end of components.schemas,
  # the error codes in the "R9-B" block at the end of ErrorCode.
  #
  # Reading proposals and merges is reading contacts (`channels:read`, channel
  # scope applied: an agent sees a pair only when both people are on their
  # channels); merging, undoing and dismissing change contacts
  # (`contacts:write`). Every change is audited with its author.
  # ===========================================================================
  /contact-merge-proposals:
    get:
      operationId: listContactMergeProposals
      x-permission: 'channels:read'
      summary: List possible duplicate contacts (merge proposals).
      description: >
        The cabinet's "possible duplicates", oldest first, cursor-paginated.
        Detection is deterministic, never fuzzy (ADR-0008 §2): two live
        contacts are proposed when identities of both carry the same phone
        (`shared_phone`), or when one is a WhatsApp LID contact and the other
        its phone contact according to a LID pair the platform recorded
        (`lid_pair`, ADR-0060 §5). Listing runs the detection first, so a new
        duplicate appears here on the next read.


        A proposal is a hint for a person or the host to confirm (mergeContacts)
        or dismiss (dismissContactMergeProposal) — a dismissed pair is not
        proposed again. An OPEN proposal whose contact has since been merged
        away is not listed. A channel-scoped caller sees a proposal only when
        both contacts talk on its channels.
      tags:
        - contacts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          description: Which proposals to list (default `open`).
          schema:
            $ref: '#/components/schemas/ContactMergeProposalStatus'
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
      responses:
        '200':
          description: A cursor page of proposals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMergeProposalList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contact-merge-proposals/{proposalId}:
    get:
      operationId: getContactMergeProposal
      x-permission: 'channels:read'
      summary: Fetch one merge proposal.
      tags:
        - contacts
      parameters:
        - name: proposalId
          in: path
          required: true
          description: Merge proposal identifier (uuid).
          schema:
            type: string
            format: uuid
      x-error-codes:
        - validation.invalid_request
        - auth.invalid_key
        - auth.key_expired
        - auth.forbidden_scope
        - auth.session_invalid
        - auth.second_factor_required
        - tenancy.cross_cabinet_denied
        - contact.merge_proposal_not_found
      responses:
        '200':
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMergeProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contact-merge-proposals/{proposalId}/dismiss:
    post:
      operationId: dismissContactMergeProposal
      x-permission: 'contacts:write'
      summary: Dismiss a merge proposal — the two are different people.
      description: >
        Mark the proposal dismissed: the pair is not proposed again. Audited
        with its author (`contact.merge_proposal.dismiss`). Idempotent:
        dismissing a dismissed proposal changes nothing (`changed: false`). A
        proposal that was merged cannot be dismissed (409
        contact.merge_conflict) — undo the merge instead.
      tags:
        - contacts
      parameters:
        - name: proposalId
          in: path
          required: true
          description: Merge proposal identifier (uuid).
          schema:
            type: string
            format: uuid
      x-error-codes:
