name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Laravel 12 only. The 11.x line is past its security-support window, so
        # every release in it carries unpatched advisories and Composer's default
        # policy refuses to install them — supporting it would mean asking users
        # to turn that check off.
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*']
        dependencies: [highest]
        include:
          # Prove the declared minimums are real, not aspirational.
          - php: '8.2'
            laravel: '12.*'
            dependencies: lowest

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Pin Laravel
        run: composer require "illuminate/contracts:${{ matrix.laravel }}" --no-update --no-interaction

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/pest --no-coverage
